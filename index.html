03e and takes Viegas from his maternal grandfather.\u003c/li\u003e\n      \u003cli\u003eAnything readable about \u003cstrong\u003eHenrique Viegas\u003c/strong\u003e himself — a trade, an age, a residence.\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cp class=\"verdict\"\u003e\u003cstrong\u003eMy reading:\u003c/strong\u003e the word is \u003cem\u003eBarbara\u003c/em\u003e — that much is not really in doubt. What is open is what it \u003cem\u003emeans\u003c/em\u003e. It could be a second marriage of the same Francisco, a scribe reaching for the wrong given name, or a different man entirely. \u003cstrong\u003eThis stays live.\u003c/strong\u003e Every remaining candidate for Domingos’s marriage is now a low-probability one, and this is no less likely than the others; it should not be discounted harder just because a single word is against it. If the C8 and C11 sweeps come up empty, this rises rather than falls — and at that point the way to judge it is other evidence about Henrique Viegas, not another look at this word.\u003c/p\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\n    \u003cdl\u003e\n      \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003eArquivo Nacional da Torre do Tombo — \u003ccode\u003ePT/TT/PRQ/PTVR06/002/C8\u003c/code\u003e, Santiago de Tavira marriages 1798–1822\u003c/dd\u003e\n      \u003cdt\u003eImage\u003c/dt\u003e\u003cdd\u003espread 63, folio 62, right-hand page, first entry\u003c/dd\u003e\n      \u003cdt\u003eFiles\u003c/dt\u003e\n      \u003cdt\u003eFound\u003c/dt\u003e\u003cdd\u003ewhile sweeping C8 backwards for the marriage of Domingos Viegas and Maria das Dores, which the 1808 baptism proved must predate April 1808\u003c/dd\u003e\n    \u003c/dl\u003e\n  \u003c/div\u003e"},"footerHTML":"\u003cp\u003eBuilt from the Tavira parish and civil registers.\u003c/p\u003e","images":{"joao_1808/01_entry.jpg":"img/rec-joao-1808-01-entry.jpg","joao_1808/02_primeiro_matrimonio.jpg":"img/rec-joao-1808-02-primeiro-matrimonio.jpg","joao_1808/ <script>(function(){// Shared place-name matcher. Gazetteer and attestation files spell the same place
// differently: abbreviations (R., Lgo, Trav.), 19th-c orthography (bella, catharina,
// val), feature-word prefixes (sitio de, horta do, praia de) and trailing
// parentheticals (Sao Pedro (sitio)).
//
// Deliberately conservative: a bare name may match a prefixed attestation
// ("Sao Marcos" <- "Sitio de Sao Marcos"), but two DIFFERENT feature words never
// match each other, so "Rua da Fonte" cannot absorb "Travessa da Fonte"'s evidence.
// Mis-attributing evidence is worse than showing none.

const FEATURE = '(sitio|sitios|horta|hortas|praia|povo|serra|matto|mato|rua|largo|lgo|travessa|trav|ladeira|poco|monte|quinta|caminho|terreiro|alto|cruz|beco|calcada|malhada|fonte|igreja|hospital)';
const FEAT_RE = new RegExp('^' + FEATURE + '\\s+(?:de|do|da|dos|das|d)?\\s*', 'i');
const CONNECT = /\b(de|do|da|dos|das|d)\b/g;

// A parenthetical is dropped when it is only a feature word or a geocoding note
// ("Sao Pedro (sitio)"), but unwrapped when it carries the name
// ("Santa Catharina (Fonte do Bispo)").
const PAREN_NOISE = new RegExp('^\\s*(?:' + FEATURE + '|exact|hamlet|approx|centroid|poi|osm)\\s*$', 'i');
function normBase(t){
  return String(t||'')
    .replace(/\(([^)]*)\)/g, (m, inner) => PAREN_NOISE.test(inner) ? ' ' : ' ' + inner + ' ')
    .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\btrav\.?\s*/g,'travessa ')
    .replace(/\blgo\.?\s*/g,'largo ')
    .replace(/\br\.\s*/g,'rua ')
    .replace(/\bsta\.?\b/g,'santa')
    .replace(/\bs\.\s*/g,'sao ')
    .replace(/th/g,'t').replace(/ll/g,'l')
    .replace(/\bval\b/g,'vale')
    .replace(/\bdezembargador\b/g,'desembargador')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
// the feature word, or '' when the name is bare
function featureOf(t){
  const m = normBase(t).match(FEAT_RE);
  return m ? m[1].toLowerCase() : '';
}
// name with the leading feature word removed and connectives dropped
function normCore(t){
  const b = normBase(t).replace(FEAT_RE,'');
  return (b || normBase(t)).replace(CONNECT,' ').replace(/\s+/g,' ').trim();
}
// a gazetteer label may offer alternatives: "R./Lgo da Atalaia"
function placeVariants(t){
  const raw = String(t||'');
  let alts = [raw];
  if (raw.indexOf('/') >= 0){
    const m = raw.match(/^([^\/]+)\/([^\s]+)\s+(.*)$/);
    alts = m ? [m[1] + ' ' + m[3], m[2] + ' ' + m[3]] : raw.split('/');
  }
  return alts.map(a => a.trim()).filter(Boolean);
}
// Key is "<feature>|<core>", so connective drift (de / do / d') never breaks a
// match, while two different feature words still never collide.
function keyOf(t){ return featureOf(t) + '|' + normCore(t); }

function buildIndex(attestations){
  const keyed = new Map(), core = new Map();
  for (const a of attestations || []){
    const k = keyOf(a.place);
    if (!keyed.has(k)) keyed.set(k, []);
    keyed.get(k).push(a);
    if (featureOf(a.place)){                       // only prefixed names go in core
      const c = normCore(a.place);
      if (!core.has(c)) core.set(c, []);
      core.get(c).push(a);
    }
  }
  return { keyed, core };
}
function attestFor(idx, place){
  const seen = new Set(), out = [];
  const push = list => { for (const a of list || []){
    const k = a.place + '|' + a.date + '|' + a.ref;
    if (!seen.has(k)) { seen.add(k); out.push(a); }
  }};
  for (const v of placeVariants(place)){
    push(idx.keyed.get(keyOf(v)));
    if (!featureOf(v)) push(idx.core.get(normCore(v)));  // bare name -> prefixed attestation
  }
  return out;
}

window.PM={buildIndex:buildIndex,attestFor:attestFor,normBase:normBase,normCore:normCore,keyOf:keyOf,featureOf:featureOf};})();</script>
<script>(function(){
'use strict';
var D = window.__DATA__;
var people = D.people, records = D.records, site = D.site;
var P = {}, R = {};
people.forEach(function(p){ P[p.id] = p; });
records.forEach(function(r){ R[r.id] = r; });

// ---- derivations. A person is "documented" iff some record names them a principal.
var asPrincipal = {}, asMention = {};
records.forEach(function(r){
  (r.principals||[]).forEach(function(id){ (asPrincipal[id] = asPrincipal[id] || []).push(r); });
  (r.mentions||[]).forEach(function(id){ (asMention[id] = asMention[id] || []).push(r); });
});
function documented(id){ return (asPrincipal[id]||[]).length > 0; }
function childrenOf(id){
  return people.filter(function(p){ return p.fatherId === id || p.motherId === id; });
}
function siblingsOf(p){
  if (!p.fatherId && !p.motherId) return [];
  return people.filter(function(q){
    if (q.id === p.id) return false;
    return (p.fatherId && q.fatherId === p.fatherId) || (p.motherId && q.motherId === p.motherId);
  });
}
function ancestorIds(rootId){
  var seen = {}, stack = [rootId];
  while (stack.length){
    var id = stack.pop(); if (!id || seen[id]) continue; seen[id] = 1;
    var p = P[id]; if (!p) continue;
    if (p.fatherId) stack.push(p.fatherId);
    if (p.motherId) stack.push(p.motherId);
  }
  return seen;
}
function spouseOf(p){
  return (p.marriages||[]).map(function(m){ return m.spouseId ? P[m.spouseId] : null; }).filter(Boolean);
}
var FACTS = ['birth','baptism','death','burial'];
function sourcedFactCount(p){
  var n = 0;
  FACTS.concat(['origin']).forEach(function(k){ if (p[k] && (p[k].sources||[]).length) n++; });
  (p.marriages||[]).forEach(function(m){ if ((m.sources||[]).length) n++; });
  (p.occupations||[]).forEach(function(o){ if ((o.sources||[]).length) n++; });
  return n;
}

// ---- helpers
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function el(h){ var d = document.createElement('div'); d.innerHTML = h; return d; }
function h(tag, attrs, inner){
  var a = '';
  for (var k in attrs) if (attrs[k] != null && attrs[k] !== false) a += ' ' + k + '="' + String(attrs[k]).replace(/"/g,'&quot;') + '"';
  return '<' + tag + a + '>' + (inner==null?'':inner) + '</' + tag + '>';
}
function pLink(id, label){
  var p = P[id]; if (!p) return esc(label||id);
  return h('a', { href:'#/person/' + id }, esc(label || p.name));
}
function rLabel(r){ return r.year + ' · ' + r.kind + (r.kindDetail ? ' · ' + r.kindDetail : ''); }
function rLink(id){
  var r = R[id]; if (!r) return '';
  return h('a', { href:'#/record/' + id, title: r.title }, esc(rLabel(r)));
}
function srcRow(sources){
  if (!sources || !sources.length) return '';
  return h('div', { 'class':'srcs' }, sources.map(function(s){ return rLink(s); }).join(''));
}
function factHTML(fact, label){
  if (!fact) return '';
  var txt = [fact.dateText, fact.place].filter(Boolean);
  if (!txt.length) return '';

var LSK = 'viegas.tree.v1';
var state = { collapsed:{}, siblings:false, regQ:'', regOurs:false, splitW:620, textHidden:false };
// layoutV lets the default column width change without discarding which nodes
// somebody had expanded. Anyone carrying a width from before v2 gets the new default.
var LAYOUT_V = 2;
var DEFAULTS_V = 1;
function collapseAllButRoot(){
  var c = {};
  people.forEach(function(p){ if (p.fatherId || p.motherId || childrenOf(p.id).length) c[p.id] = true; });
  delete c[site.rootPersonId];
  return c;
}
var haveSavedTree = false;
try {
  var s = JSON.parse(localStorage.getItem(LSK) || '{}');
  if (s.collapsed && s.defaultsV === DEFAULTS_V){ state.collapsed = s.collapsed; haveSavedTree = true; }
  if (typeof s.siblings === 'boolean') state.siblings = s.siblings;
  if (typeof s.textHidden === 'boolean') state.textHidden = s.textHidden;
  if (typeof s.splitW === 'number' && s.layoutV === LAYOUT_V) state.splitW = s.splitW;
} catch(e){}
if (!haveSavedTree) state.collapsed = collapseAllButRoot();
state.layoutV = LAYOUT_V;
state.defaultsV = DEFAULTS_V;
function saveState(){ try { localStorage.setItem(LSK, JSON.stringify(state)); } catch(e){} }
var SPLIT_MIN = 300, SPLIT_MAX_FRAC = 0.72;
function clampSplit(px, container){
  var max = Math.max(SPLIT_MIN, Math.round((container || 1100) * SPLIT_MAX_FRAC));
  return Math.min(max, Math.max(SPLIT_MIN, Math.round(px)));
}

function personCard(p, rel, collateral){
  var doc = documented(p.id);
  var cls = 'person' + (doc ? '' : ' open') + (collateral ? ' collateral' : '');
  var alt = (p.altNames||[]).length ? h('span',{'class':'alt'},' — also ' + esc(p.altNames.join(', '))) : '';
  var pill = collateral ? h('span',{'class':'pill coll'},'collateral')
           : doc ? h('span',{'class':'pill doc'},'documented') : h('span',{'class':'pill open'},'named only');
  var bits = [];
  function add(f, pre){ if (f && (f.dateText || f.place)) {
    var t = pre + (f.dateText ? '<b>' + esc(f.dateText) + '</b>' : '') + (f.place ? (f.dateText?', ':'') + esc(f.place) : '');
    bits.push((f.sources||[]).length ? t : '<span style="opacity:.7">' + t + '</span>');
  }}
  add(p.birth, 'b. '); add(p.death, 'd. ');
  (p.marriages||[]).forEach(function(m){
    var sp = m.spouseId && P[m.spouseId] ? P[m.spouseId].name : '';
    if (m.dateText || sp) bits.push('m. ' + (sp?esc(sp)+', ':'') + (m.dateText?'<b>'+esc(m.dateText)+'</b>':''));
  });
  if (!bits.length && p.origin && p.origin.text) bits.push(esc(p.origin.text));
  var nrec = (asPrincipal[p.id]||[]).length;
  var tail = nrec ? h('span',{style:'opacity:.75'}, ' · ' + nrec + ' record' + (nrec>1?'s':'')) : '';
  return h('div', { 'class':cls },
    (rel ? h('span',{'class':'rel'}, esc(rel)) : '') +
    h('div', { 'class':'pname' }, pLink(p.id) + alt + pill) +
    h('div', { 'class':'pmeta' }, bits.join(' · ') + tail));
}

function treeNode(p, rel, depth, anc){
  var kids = [];
  if (p.fatherId && P[p.fatherId]) kids.push(treeNode(P[p.fatherId], depth===0?'Father':'His father', depth+1, anc));
  if (p.motherId && P[p.motherId]) kids.push(treeNode(P[p.motherId], depth===0?'Mother':'His mother', depth+1, anc));
  // siblings shown as an explicitly-labelled collateral group, never as descent
  var sibs = state.siblings ? siblingsOf(p) : [];
  if (sibs.length){
    kids.push(h('li', { 'class':'sibgroup' },
      h('div', { style:'font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px' },
        'Brothers &amp; sisters of ' + esc(p.name)) +
      h('ul', { style:'border-left-style:dotted' },
        sibs.map(function(s){ return h('li', null, personCard(s, '', true)); }).join(''))));
  }
  var hasKids = kids.length > 0;
  var isCollapsed = !!state.collapsed[p.id];
  return h('li', { 'class': isCollapsed ? 'collapsed' : '', 'data-pid': p.id },
    (hasKids ? h('button', { 'class':'tog', 'data-tog':p.id, 'aria-expanded': String(!isCollapsed),
                             title: isCollapsed ? 'Expand' : 'Collapse' }, isCollapsed ? '+' : '−') : '') +
    personCard(p, rel, false) +
    (hasKids ? h('ul', null, kids.join('')) : ''));
}

function chipClass(parish){
  var t = String(parish||'').toLowerCase();
  if (t.indexOf('both') >= 0) return 'c-both';
  if (t.indexOf('santiago') >= 0) return 'c-santiago';
  if (t.indexOf('santa maria') >= 0) return 'c-santa';
  if (t.indexOf('anchor') >= 0) return 'c-anchor';
  return 'c-other';
}
function confClass(c){
  var t = String(c||'').toLowerCase();
  return t.indexOf('high') >= 0 ? 'c-high' : t.indexOf('med') >= 0 ? 'c-med' : 'c-low';
}

    return h('figure', { 'class':'mapfig' },
      h('div', { 'class':'mapwrap' }, m.svg)
      + h('figcaption', null, h('div',{'class':'t'}, esc(m.title)) + h('div',{'class':'d'}, m.caption)));
  }).join('');

  var analysis = (pm.analysis||[]).map(function(a){
    return h('section', { 'class':'sec' }, h('span',{'class':'kind'},'What it shows')
      + h('h2', null, esc(a.title)) + h('div',{'class':'prose'}, a.body));
  }).join('');

  var gazRows = (pm.gazetteer||[]).map(function(g){
    var at = attestFor(g.place);
    var detail = '';
    if (at.length){
      var trs = at.map(function(a){
        return h('tr', null,
          h('td', null, esc(a.date || '—'))
          + h('td', null, esc(a.type || ''))
          + h('td', null, esc(a.context || ''))
          + h('td', null, esc(a.ref || '') + (a.image ? ' · ' + esc(a.image) : '')));
      }).join('');
      var tbl = h('div',{'class':'tablewrap'}, h('table', null,
        h('thead', null, h('tr', null, '<th>Date</th><th>Attestation</th><th>Who or what</th><th>Source</th>'))
        + h('tbody', null, trs)));
      detail = h('details', { 'class':'attest' },
        h('summary', null, at.length + ' attestation' + (at.length>1?'s':'')) + tbl);
    }
    return h('tr', null,
      h('td', null, esc(g.place) + detail)
      + h('td', null, h('span',{'class':'chip ' + chipClass(g.parish)}, esc(g.parish)))
      + h('td', { 'class':'num' }, g.lat.toFixed(5) + ', ' + g.lon.toFixed(5))
      + h('td', null, esc(g.method))
      + h('td', null, h('span',{'class':'conf ' + confClass(g.confidence)}, esc(g.confidence))));
  }).join('');
  var gazTable = h('div',{'class':'tablewrap'}, h('table', null,
    h('thead', null, h('tr', null,
      '<th>Place</th><th>Parish evidence</th><th>Latitude, longitude</th><th>How the coordinate was got</th><th>Conf.</th>'))
    + h('tbody', null, gazRows)));

  var unRows = (pm.unlocated||[]).map(function(u){
    return h('tr', null,
      h('td', null, esc(u.place))
      + h('td', null, h('span',{'class':'chip ' + chipClass(u.parish)}, esc(u.parish)))
      + h('td', null, u.why));
  }).join('');
  var unTable = h('div',{'class':'tablewrap'}, h('table', null,
    h('thead', null, h('tr', null, '<th>Place</th><th>Parish evidence</th><th>Why it matters</th>'))
    + h('tbody', null, unRows)));

  var parishTiles = pl.parishes.map(function(x){
    return h('div',{'class':'tile'}, h('h4',null, esc(x.name)) + h('p',null, esc(x.role))
      + h('span',{'class':'where'}, 'Reference code ' + h('code',null, esc(x.code))));
  }).join('');
  var archTiles = pl.archives.map(function(x){
    var link = h('a',{href:x.url,target:'_blank',rel:'noopener'}, esc(x.url.replace(/^https?:\/\//,'')));
    return h('div',{'class':'tile'}, h('h4',null, esc(x.name)) + h('p',null, x.holds)
      + h('span',{'class':'where'}, h('code',null, esc(x.prefix)) + ' · ' + link));
  }).join('');
  var noteTiles = pl.notes.map(function(n){
    return h('div',{'class':'tile'}, h('h4',null, esc(n.title)) + h('p',null, n.body));
  }).join('');

  var groups = [], seenG = {};
  pl.books.forEach(function(b){ if (!seenG[b.group]) { seenG[b.group]=1; groups.push(b.group); } });
  var bookRows = groups.map(function(g){
    var head = h('tr', null, h('th',{colspan:'4','class':'grp'}, esc(g)));
    var body = pl.books.filter(function(b){ return b.group === g; }).map(function(b){
      return h('tr', null, h('td',null, esc(b.volume)) + h('td',null, b.covers)
        + h('td',null, h('span',{'class':'rs '+b.readState}, b.readState)) + h('td',null, b.detail));
    }).join('');
    return head + body;
  }).join('');
  var bookTable = h('div',{'class':'tablewrap'}, h('table', null,
    h('thead', null, h('tr', null, '<th>Book</th><th>Covers</th><th>State</th><th>How much has been read</th>'))
    + h('tbody', null, bookRows)));

  var allRows = (pm.gazetteer||[]);
  var anchors = allRows.filter(function(g){ return isAnchor(g.parish); }).length;
  var linked = allRows.filter(function(g){ return attestFor(g.place).length; }).length;
  var linkNote = linked + ' of the ' + allRows.length + ' places here are linked to the register '
    + 'entries that attest them. The other ' + (allRows.length - linked) + ' are either map '
    + 'reference points (' + anchors + ' churches, the castle, the bridge) or are spelled '
    + 'differently enough in the registers — a Ladeira where the map says Rua — that they are '
    + 'left unlinked rather than matched on a guess.';
  var nLoc = (pm.gazetteer||[]).length, nUn = (pm.unlocated||[]).length,
      nAt = (pm.attestations||[]).length;
  var head = h('p',{'class':'eyebrow'},'Where the paper is, and where the family stood')
    + h('h1',null, esc(pm.heading || 'Parish & register map'))
    + h('p',{'class':'standfirst'}, nLoc + ' places fixed on the ground and ' + nUn
        + ' still unfound, from ' + nAt + ' separate attestations in the registers.');

  return shell('#/places',
    h('header',{'class':'masthead'}, head)
    + (pm.lede ? h('section',{'class':'sec prose',style:'border-top:none;padding-top:22px;margin-top:0'}, pm.lede) : '')
    + h('section',{'class':'sec'}, h('span',{'class':'kind'},'The ground itself') + mapFigs)
    + analysis
    + h('section',{'class':'sec'}, h('span',{'class':'kind'},'Gazetteer')
        + h('h2',null,'Every located place')
        + h('p',{'class':'lede'},'Teal is Santiago, amber is Santa Maria. Expand a place to see exactly which register entries put it in that parish.')
        + h('p',{'class':'count'}, linkNote)
        + gazTable)
    + h('section',{'class':'sec'}, h('span',{'class':'kind'},'Still unfound')
        + h('h2',null,'Named in the registers, not yet on the map')
        + h('p',{'class':'lede'},'These are the work remaining, not omissions.')
        + unTable)
    + h('section',{'class':'sec'}, h('span',{'class':'kind'},'The parishes')
        + h('div',{'class':'grid',style:'margin-top:14px'}, parishTiles))
    + h('section',{'class':'sec'}, h('span',{'class':'kind'},'The archives')
        + h('div',{'class':'grid',style:'margin-top:14px'}, archTiles))
    + h('section',{'class':'sec'}, h('span',{'class':'kind'},'Coverage')
        + h('h2',null,'Every book consulted') + bookTable)
    + h('section',{'class':'sec'}, h('span',{'class':'kind'},'Things that will trip you up')
        + h('div',{'class':'grid',style:'margin-top:14px'}, noteTiles)));
}

function viewRegister(){
  var all = (D.register.entries||[]);
  var q = (state.regQ||'').toLowerCase();
  var oursOnly = !!state.regOurs;
  var rows = all.filter(function(e){
    if (oursOnly && !e.ours) return false;
    if (!q) return true;
    return (e.given+' '+e.surname+' '+e.parish+' '+e.place+' '+e.related+' '+e.notes+' '+e.year)
      .toLowerCase().indexOf(q) >= 0;
  }).sort(function(a,b){ return (a.year||0) - (b.year||0); });

  var trs = rows.map(function(e){
    return h('tr', { 'class': e.ours ? 'ours' : '' },
      h('td', { 'class':'num' }, esc(e.date || e.year || ''))
      + h('td', null, esc(e.given) + ' <b>' + esc(e.surname) + '</b>')
      + h('td', null, esc(e.role))
      + h('td', null, h('span',{'class':'chip ' + chipClass(e.parish)}, esc(e.parish)))
      + h('td', null, esc(e.place || '') + (e.placeType ? h('span',{style:'color:var(--muted)'},' · ' + esc(e.placeType)) : ''))
      + h('td', null, esc(e.related || ''))
      + h('td', { 'class':'num' }, esc(e.book || '') + (e.image ? ' ' + esc(e.image) : ''))
      + h('td', null, h('span',{'class':'conf ' + confClass(e.confidence)}, esc(e.confidence))));
  }).join('');
  var table = h('div',{'class':'tablewrap'}, h('table', null,
    h('thead', null, h('tr', null,
      '<th>Date</th><th>Name as written</th><th>Role</th><th>Parish</th><th>Place</th>'
      + '<th>Named with</th><th>Book</th><th>Conf.</th>'))
    + h('tbody', null, trs)));

  var years = all.filter(function(e){ return e.year; }).map(function(e){ return e.year; });
  var surnames = {};
  all.forEach(function(e){ surnames[e.surname] = (surnames[e.surname]||0)+1; });
  var nSur = Object.keys(surnames).length;

  var head = h('p',{'class':'eyebrow'},'A name index, not a family tree')
    + h('h1',null,'Every Viegas in the registers')
    + h('p',{'class':'standfirst'}, all.length + ' appearances between ' + Math.min.apply(null,years)
        + ' and ' + Math.max.apply(null,years) + ', written under ' + nSur
        + ' different forms of the surname. The eight marked ★ are our own line — which is the point of the list: it shows how many Viegas there were to be confused with.');

  var bar = h('div',{'class':'filterbar'},
    '<input id="regq" placeholder="Filter by name, place, parish…" value="' + esc(state.regQ||'') + '">'
    + h('button',{'data-act':'regours','aria-pressed':String(oursOnly)}, (oursOnly?'✓ ':'') + 'Only our line'));

  return shell('#/register',
    h('header',{'class':'masthead'}, head)
    + h('section',{'class':'sec'}
        , bar + h('p',{'class':'count'}, 'Showing ' + rows.length + ' of ' + all.length) + table));
}

// ---- router
function render(keepScroll){
  var hash = location.hash || '#/';
  var m, html;
  if ((m = hash.match(/^#\/person\/(.+)$/))) html = viewPerson(decodeURIComponent(m[1]));
  else if ((m = hash.match(/^#\/record\/(.+)$/))) html = viewRecord(decodeURIComponent(m[1]));
  else if (hash === '#/records') html = viewRecords();
  else if (hash === '#/narrative') html = viewNarrative();
  else if (hash === '#/todo') html = viewTodo();
  else if (hash === '#/queue') html = viewQueue();
  else if (hash === '#/places') html = viewPlaces();
  else if (hash === '#/register') html = viewRegister();
  else html = viewHome();
  var root = document.getElementById('app');
  // the home page is a two-column workspace and needs the room; reading pages stay narrow
  var wide = (hash === '#/' || hash === '' || hash === '#');
  root.innerHTML = '<div class="wrap' + (wide ? ' wide' : '') + '">' + html + '</div>';
  if (!keepScroll) window.scrollTo(0, 0);
}
function refocus(sel){
  var n = document.querySelector(sel);
  if (!n) return;
  try { n.focus({ preventScroll:true }); } catch(_) { n.focus(); }
}
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-tog],[data-act]') : null;
  if (!t) return;
  if (t.hasAttribute('data-tog')){
    var id = t.getAttribute('data-tog');
    var hadFocus = document.activeElement === t;
    state.collapsed[id] = !state.collapsed[id]; saveState(); render(true);
    if (hadFocus) refocus('[data-tog="' + id.replace(/"/g,'\\"') + '"]');
    return;
  }
  var act = t.getAttribute('data-act');
  var keepFocus = document.activeElement === t ? '[data-act="' + act + '"]' : '';
  if (act === 'sibs'){ state.siblings = !state.siblings; saveState(); render(true); }
  else if (act === 'expand'){ state.collapsed = {}; saveState(); render(true); }
  else if (act === 'toggletext'){ state.textHidden = !state.textHidden; saveState(); render(true); }
  else if (act === 'regours'){ state.regOurs = !state.regOurs; render(true); }
  else if (act === 'collapse'){ state.collapsed = collapseAllButRoot(); saveState(); render(true); }
  else keepFocus = '';
  if (keepFocus) refocus(keepFocus);
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'regq'){
    state.regQ = e.target.value;
    var box = document.getElementById('app');
    var pos = e.target.selectionStart;
    render(true);
    var again = document.getElementById('regq');
    if (again){ again.focus(); try { again.setSelectionRange(pos,pos); } catch(_){} }
  }
});
// splitter: drag, keyboard, double-click. Never re-renders mid-drag - it just sets
// the CSS custom property, because re-rendering the tree on every mousemove is far
// too slow and would lose scroll position.
(function(){
  var dragging = false, el = null, startX = 0, startW = 0;
  function containerWidth(){ var n = document.getElementById('split'); return n ? n.getBoundingClientRect().width : 1100; }
  function begin(clientX, target){
    el = document.getElementById('split');
    if (!el || state.textHidden) return;
    dragging = true; startX = clientX; startW = state.splitW;
    target.setAttribute('data-dragging','true');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  }
  function move(clientX){
    if (!dragging || !el) return;
    var w = clampSplit(startW + (clientX - startX), containerWidth());
    el.style.setProperty('--split', w + 'px');
    state.splitW = w;
    var sp = el.querySelector('.splitter');
    if (sp) sp.setAttribute('aria-valuenow', String(w));
  }
  function end(){
    if (!dragging) return;
    dragging = false;
    var sp = el && el.querySelector('.splitter');
    if (sp) sp.removeAttribute('data-dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    saveState();
  }
  document.addEventListener('mousedown', function(e){
    var sp = e.target.closest && e.target.closest('[data-splitter]');
    if (!sp || (e.target.closest && e.target.closest('.paneToggle'))) return;
    e.preventDefault(); begin(e.clientX, sp);
  });
  document.addEventListener('mousemove', function(e){ move(e.clientX); });
  document.addEventListener('mouseup', end);
  document.addEventListener('touchstart', function(e){
    var sp = e.target.closest && e.target.closest('[data-splitter]');
    if (!sp || (e.target.closest && e.target.closest('.paneToggle'))) return;
    begin(e.touches[0].clientX, sp);
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if (dragging){ e.preventDefault(); move(e.touches[0].clientX); }
  }, { passive:false });
  document.addEventListener('touchend', end);
  document.addEventListener('dblclick', function(e){
    if (e.target.closest && e.target.closest('[data-splitter]')){
      state.textHidden = !state.textHidden; saveState(); render(true);
    }
  });
  document.addEventListener('keydown', function(e){
    var sp = document.activeElement;
    if (!sp || !sp.hasAttribute || !sp.hasAttribute('data-splitter')) return;
    var node = document.getElementById('split');
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      e.preventDefault();
      if (state.textHidden) return;
      state.splitW = clampSplit(state.splitW + (e.key === 'ArrowRight' ? 24 : -24), containerWidth());
      if (node) node.style.setProperty('--split', state.splitW + 'px');
      sp.setAttribute('aria-valuenow', String(state.splitW));
      saveState();
    } else if (e.key === 'Home'){
      e.preventDefault(); state.splitW = SPLIT_MIN;
      if (node) node.style.setProperty('--split', SPLIT_MIN + 'px'); saveState();
    } else if (e.key === 'End'){
      e.preventDefault(); state.splitW = clampSplit(1e4, containerWidth());
      if (node) node.style.setProperty('--split', state.splitW + 'px'); saveState();
    } else if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault(); state.textHidden = !state.textHidden; saveState(); render(true);
    }
  });
})();

window.addEventListener('hashchange', function(){ render(); });
render();
})();
