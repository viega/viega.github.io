arida Gaga, and whose children's baptisms in 1752, 1756 and 1771 all name \u003cstrong\u003eAntónio Viegas Leiria and Maria Gonçalves of Santa Catarina\u003c/strong\u003e as their grandparents. The ages fit — 26 in 1752, 45 in 1771. \u003cstrong\u003eThat identification is an inference\u003c/strong\u003e: no document links the 1726 infant to the later father except name, parish and plausible age.","scope":"caution"},{"label":"Where the family was — and an unresolved conflict","body":"Manoel is born \u003cem\u003e“limite desta freguezia”\u003c/em\u003e — within Santa Catarina. Where his brother \u003cstrong\u003eFrancisco\u003c/strong\u003e was born is \u003cstrong\u003edisputed by the records themselves\u003c/strong\u003e: the 1773 baptism of Francisco's twins calls him \u003cem\u003enatural desta freguezia de Santa Catharina\u003c/em\u003e, while the 1807 marriage of his son Domingos calls the family \u003cem\u003etodos naturais desta Cidade\u003c/em\u003e. The earlier, first-hand 1773 entry is preferred here, but the conflict is real and unresolved.","scope":"caution"},{"label":"Where António's parents will be found","body":"In \u003cstrong\u003ehis first marriage, to \u003cem\u003eApolónia Gonçalves\u003c/em\u003e\u003c/strong\u003e — marriages do state filiation. He was already \u003cem\u003e“homem casado”\u003c/em\u003e in Luz in August 1712, so it predates that. The live search is Luz and Santa Catarina before 1712, complicated by a genuine \u003cstrong\u003ecatalogue gap for Luz between 1699 and 1711\u003c/strong\u003e.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR04/001/B6 — Santa Catarina da Fonte do Bispo, baptisms 1726–1741 — spread 6, right page, lower entry. Margin tag \u003cem\u003eManoel\u003c/em\u003e."},"online":{"docId":"1dd1c2991a6e48c1b40c76b6f41de68a","image":"6","url":"https://digitarq.arquivos.pt/fileViewer/1dd1c2991a6e48c1b40c76b6f41de68a","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/1dd1c2991a6e48c1b40c76b6f41de68a\u003c/code\u003e — image 6"},"localOnly":false,"embeddedImages":[]},{"id":"1734-burial-antonio-viegas","year":"1734","kind":"Burial","kindDetail":"May","title":"Antonio Viegas, husband of Maria Gonsalves","whenWhere":"16 May 1734 · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003ehis death — and the record that fixes which Antonio Viegas he was\u003c/strong\u003e","principals":["antonio-viegas-leiria"],"mentions":["maria-gonsalves"],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003edezaseis dias do mes de Mayo de mil sete Centos e trinta, e quatro annos\u003c/strong\u003e, faleceu nesta freg.\u003csup\u003ea\u003c/sup\u003e \u003cem class=\"name\"\u003eAntonio Viegas\u003c/em\u003e, \u003cstrong\u003emarido de \u003cem class=\"name\"\u003eMaria G[onsalve]s\u003c/em\u003e\u003c/strong\u003e, \u003cstrong\u003eda freg.\u003csup\u003ea\u003c/sup\u003e de \u003cem class=\"name\"\u003eNossa S.\u003csup\u003era\u003c/sup\u003e da Luz\u003c/em\u003e\u003c/strong\u003e; recebeo os Sacram.\u003csup\u003etos\u003c/sup\u003e da Penitencia, Sagrado Viatico, e Extrema&ndash;Unsam, e foi Sepultado nesta Ig.\u003csup\u003ea\u003c/sup\u003e de S.\u003csup\u003eta\u003c/sup\u003e Cath.\u003csup\u003ea\u003c/sup\u003e…\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eMargin: \u003cem\u003eAn.\u003csup\u003eto\u003c/sup\u003e Viegas — cazado\u003c/em\u003e · \u003cem\u003eJazigo 300\u003c/em\u003e\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003esixteenth day of the month of May of one thousand seven hundred and thirty-four years\u003c/strong\u003e, there died in this parish \u003cem class=\"name\"\u003eAntonio Viegas\u003c/em\u003e, \u003cstrong\u003ehusband of \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e\u003c/strong\u003e, \u003cstrong\u003eof the parish of \u003cem class=\"name\"\u003eNossa Senhora da Luz\u003c/em\u003e\u003c/strong\u003e. He received the Sacraments of Penance, the Holy Viaticum and Extreme Unction, and was buried in this Church of Santa Catarina…\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eMargin: \u003cem\u003eAntonio Viegas — married\u003c/em\u003e · \u003cem\u003eVault fee 300\u003c/em\u003e\u003c/span\u003e","details":[{"label":"Why this is certainly him","scope":"hunt","body":"The 1724 marriage gives Antonio exactly two identifiers: his new wife \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e, and his parish, \u003cstrong\u003eNossa Senhora da Luz\u003c/strong\u003e. This burial repeats \u003cstrong\u003eboth\u003c/strong\u003e — same parish, ten years later, in a different hand. Twenty-seven men named Antonio Viegas appear in the Tavira registers of this era; not one of the others carries that pair. The year is anchored by the line-break rather than a single spelled-out word: line one ends \u003cem\u003e“sete Centos e”\u003c/em\u003e, line two opens \u003cem\u003e“trinta e quatro annos”\u003c/em\u003e."},{"label":"He was still reckoned a man of Luz","scope":"hunt","body":"This is the substance of the record. By 1734 Antonio had been living in his wife’s parish for a decade — long enough to bury one marriage and raise sons there — and the scribe \u003cem\u003estill\u003c/em\u003e books him to \u003cstrong\u003eLuz\u003c/strong\u003e. Said once in 1724 it is a detail; said again in 1734 by another hand it is an origin. \u003cstrong\u003eAntonio’s baptism is to be looked for in Luz, not in Santa Catarina\u003c/strong\u003e, and the long unproductive sweep of the Santa Catarina baptism book is explained rather than merely unexplained."},{"label":"It closes the window on Francisco","scope":"family","body":"Manoel is baptised in \u003cstrong\u003eAugust 1726\u003c/strong\u003e; the father is dead in \u003cstrong\u003eMay 1734\u003c/strong\u003e. \u003cstrong\u003eFrancisco — Domingos’s father, and our line — and his brother José must both be born inside those seven and a half years.\u003c/strong\u003e Before this record the window was open at the far end; now it is a span that can be searched."},{"label":"Maria Gonsalves outlived him","scope":"hunt","body":"The margin reads \u003cem\u003ecazado\u003c/em\u003e, not \u003cem\u003eviuvo\u003c/em\u003e, and the body says \u003cem\u003emarido de\u003c/em\u003e. Her own burial should therefore lie later in this same book, and this register’s margins name the surviving spouse, so it can be found by reading margins alone. If it says \u003cem\u003e“viuva de Antonio Viegas”\u003c/em\u003e the pair is sealed from both ends, and it may give her age."},{"label":"What it does not give","scope":"hunt","body":"\u003cstrong\u003eHis parents, and his age.\u003c/strong\u003e Adult burials in this register give marital status, spouse, place, the sacraments received, any will and its executor, and the vault fee — and stop. Parentage appears only when the deceased is a child. Nor does the entry say \u003cem\u003enatural de\u003c/em\u003e anywhere: Luz is stated as the parish he belongs to, which is strong evidence of birth but not a statement of it."},{"label":"A neighbouring death, and a warning","scope":"hunt","body":"Nine days later the same book buries \u003cstrong\u003eDomingos Viegas, husband of Maria Nobre, of the sítio das Casas Juntas\u003c/strong\u003e — a long-standing Viegas place. And on 6 February 1735 it buries \u003cstrong\u003eJoão Viegas, a widower\u003c/strong\u003e, whose will is to be accounted for by his son \u003cstrong\u003eFrancisco Viegas\u003c/strong\u003e. An executor is of age; our Francisco is at most eight in February 1735. \u003cstrong\u003eTwo different men.\u003c/strong\u003e In this parish the surname is not an identifier and never has been."},{"label":"A note on legibility","scope":"hunt","body":"The page is stamped \u003cem\u003e“paginas manchadas”\u003c/em\u003e — stained pages — by the archive. At 5× the wife’s parish reads plausibly as a surname, \u003cem\u003e“da Graça”\u003c/em\u003e; at 15× the word is the scribe’s \u003cem\u003efreg.\u003csup\u003ea\u003c/sup\u003e\u003c/em\u003e ligature, identical to the one two lines above, and the following line opens \u003cstrong\u003eda Luz\u003c/strong\u003e. The lower reading was recorded and then withdrawn before it reached this page."}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR04/003/O4 — Santa Catarina da Fonte do Bispo, burials 1730–1764 — image 30, left page, lower entry. Margin tag \u003cem\u003eAn.\u003csup\u003eto\u003c/sup\u003e Viegas cazado\u003c/em\u003e."},"online":{"docId":"","image":"30","url":"","note":"Santa Catarina óbitos O4, image 30"},"localOnly":false,"embeddedImages":[]},{"id":"1780-baptism-domingos","year":"1780","kind":"Baptism","kindDetail":"February","title":"Domingos, son of Francisco Viegas Leiria","whenWhere":"Born 5 February 1780, baptised the 14th &middot; Igreja Matriz de Santiago, Tavira &middot; \u003cstrong\u003ehis parents are named on the page &mdash; a long-standing claim to the contrary was wrong\u003c/strong\u003e","principals":["domingos-viegas-leiria-1780"],"mentions":["antonio-viegas-leiria","maria-gonsalves","antonio-correa","elena-maria"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eDomingos\u003c/em\u003e filho legitimo de \u003cstrong\u003e\u003cem class=\"name\"\u003eFrancisco Viegas Leiria\u003c/em\u003e\u003c/strong\u003e e de \u003cstrong\u003e\u003cem class=\"name\"\u003e[Francis]ca de Jesus\u003c/em\u003e\u003c/strong\u003e, moradores no s&iacute;tio de \u003cstrong\u003eBernardi[nheiro]\u003c/strong\u003e [&hellip;] desta Cidade e freguezia; neto pela parte paterna de \u003cstrong\u003e\u003cem class=\"name\"\u003eA[nto]nio Viegas Ledria\u003c/em\u003e e de \u003cem class=\"name\"\u003eMaria Gon&ccedil;alves\u003c/em\u003e, naturaes do lugar de Santa Catarina da Fonte do Bispo\u003c/strong\u003e; e pela materna de \u003cem class=\"name\"\u003eAntonio Correa\u003c/em\u003e, &ccedil;apateiro, e \u003cem class=\"name\"\u003eHelena Maria\u003c/em\u003e, naturaes desta Cidade. Nasceo aos \u003cstrong\u003esinco\u003c/strong\u003e dias de \u003cstrong\u003eFevereiro\u003c/strong\u003e de mil sete centos e oitenta annos; foi baptizado e postos os santos oleos por mim nesta Igreja, assignado, em os \u003cstrong\u003equatorze\u003c/strong\u003e dias do dito mez; e for&atilde;o seus padrinhos \u003cem class=\"name\"\u003eDomingos Dias\u003c/em\u003e [&hellip;] desta freguezia e sua molher \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e; de que fis este assento, dia, mes e era ut supra.\u003c/p\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eDomingos\u003c/em\u003e, lawful son of \u003cstrong\u003e\u003cem class=\"name\"\u003eFrancisco Viegas Leiria\u003c/em\u003e\u003c/strong\u003e and of \u003cstrong\u003e\u003cem class=\"name\"\u003e[Francisca] de Jesus\u003c/em\u003e\u003c/strong\u003e, residents at the \u003cstrong\u003es&iacute;tio de Bernardinheiro\u003c/strong\u003e [&hellip;] of this City and parish; paternal grandson of \u003cstrong\u003e\u003cem class=\"name\"\u003eA[nt&oacute;]nio Viegas Ledria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gon&ccedil;alves\u003c/em\u003e, natives of Santa Catarina da Fonte do Bispo\u003c/strong\u003e; and maternal grandson of \u003cem class=\"name\"\u003eAntonio Correa\u003c/em\u003e, shoemaker, and \u003cem class=\"name\"\u003eHelena Maria\u003c/em\u003e, natives of this City. He was born on the \u003cstrong\u003efifth day of February 1780\u003c/strong\u003e; he was baptised, and the holy oils administered, by me in this Church, undersigned, on the \u003cstrong\u003efourteenth\u003c/strong\u003e of the said month. His godparents were \u003cem class=\"name\"\u003eDomingos Dias\u003c/em\u003e [&hellip;] of this parish and his wife \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e.\u003c/p\u003e","details":[{"label":"A correction: the parents are not lost","body":"This entry was recorded here, and in the research notes, as physically damaged &mdash; &ldquo;a wash has lifted the ink from the two lines that name the parents.&rdquo; \u003cstrong\u003eRead again at 10&times;, that is simply not true.\u003c/strong\u003e The page is stamped \u003cem\u003e&ldquo;tinta transpassada&rdquo;\u003c/em\u003e &mdash; ink showing through from the reverse &mdash; which makes it \u003cem\u003elook\u003c/em\u003e ruined, but this entry&rsquo;s own ink is intact. Line one reads \u003cem\u003e&ldquo;Domingos filho legitimo de Fran[cis]co Viegas&rdquo;\u003c/em\u003e and line two continues \u003cem\u003e&ldquo;Leiria e de [Francis]ca de Jesus.&rdquo;\u003c/em\u003e The mother&rsquo;s given name is the one word the show-through does obscure; the father&rsquo;s is not in doubt. \u003cstrong\u003eSo this is Domingos by his own parents&rsquo; names, not by our inference from matching grandparents\u003c/strong\u003e &mdash; which removes a circularity that had quietly propped up the whole descent.","scope":"family"},{"label":"How we know","body":"It no longer rests on the grandparents alone. The entry names \u003cstrong\u003eFrancisco Viegas Leiria and [Francisca] de Jesus as the parents outright\u003c/strong\u003e, and independently gives both grandparent pairs, which match the 1807 marriage exactly. Two generations, stated on one page, twenty-seven years before that marriage.","scope":"hunt"},{"label":"It solves something the 1807 record could not","body":"The maternal grandfather's surname is \u003cstrong\u003estruck through and unreadable\u003c/strong\u003e in the marriage entry — see the note on the 1807 record below. Here it is written plainly: \u003cstrong\u003eAntonio Correa\u003c/strong\u003e, and the register gives his trade as well: \u003cstrong\u003e\u003cem\u003eçapateiro\u003c/em\u003e, a shoemaker\u003c/strong\u003e. A new surname in the direct line, and an occupation for a great-great-great-grandparent.","scope":"family"},{"label":"What found it","body":"\u003cstrong\u003e\u003cem\u003eHelena Maria\u003c/em\u003e.\u003c/strong\u003e Devotional names like Maria, Ana and Francisca repeat endlessly in these books and identify nobody. \u003cem\u003eElena\u003c/em\u003e is rare. It was the one name in the whole search key sharp enough to recognise on sight, and it is what stopped the page.","scope":"hunt"},{"label":"The dates fit without strain","body":"Born February 1780, he would be \u003cstrong\u003etwenty-seven\u003c/strong\u003e at his marriage on 20 March 1807 — where he is recorded as \u003cem\u003esolteiro\u003c/em\u003e and a serving soldier, which is exactly the profile. It also fits everything downstream: signing with a cross in 1809 at twenty-nine, first child in 1808 at twenty-eight, last known child in 1820 at forty, and still alive in April 1855 at seventy-five.","scope":"family"},{"label":"An awkward detail, recorded rather than tidied away","body":"The family is living at the \u003cstrong\u003esítio de Bernardinheiro\u003c/strong\u003e, and the godfather is a \u003cem\u003eDomingos of Bernardinheiro\u003c/em\u003e. Bernardinheiro is the home of a \u003cem\u003edifferent\u003c/em\u003e Viegas household — landowners, \u003cem\u003eproprietários\u003c/em\u003e — whose own Domingos was born there around 1790 and who have been treated throughout this project as the decoy to be told apart from ours. \u003cstrong\u003eIf our family was at Bernardinheiro in 1780, the two households may be kin.\u003c/strong\u003e It does not merge the two men — their parents differ and both are now documented at birth — but it removes the place from the list of things that tell them apart.","scope":"family"},{"label":"And a corrected date","scope":"hunt","body":"The birth is the \u003cstrong\u003efifth\u003c/strong\u003e of February, not the twentieth. The words \u003cem\u003esinco\u003c/em\u003e and \u003cem\u003evinte\u003c/em\u003e are near-identical in this hand, but the baptism is recorded on the \u003cstrong\u003efourteenth\u003c/strong\u003e &mdash; so a birth on the twentieth is impossible. The internal logic settles it."},{"scope":"hunt","label":"What the grandparents' line does and does not say","body":"Read again at 8–20×. The given name \u003cem\u003eAntónio\u003c/em\u003e is \u003cstrong\u003enot legible on this page\u003c/strong\u003e. The line ends \u003cem\u003e“neto pela parte paterna de A‑nto‑”\u003c/em\u003e and those last letters sit under a heavy ink blot compounded by show‑through from the reverse; the following line opens \u003cem\u003e“nio Viegas Ledria e de Maria Gonçalves, naturaes do lugar de Santa Catarina da Fonte do Bispo”\u003c/em\u003e. So “António” here is reconstructed from the surviving \u003cem\u003e-nio\u003c/em\u003e together with the 1807 marriage.\n\nWhat survives intact identifies him better than the given name would: the byname \u003cstrong\u003eLedria\u003c/strong\u003e — the Leiria element, written as the scribe heard it — the wife \u003cstrong\u003eMaria Gonçalves\u003c/strong\u003e, and the parish \u003cstrong\u003eSanta Catarina da Fonte do Bispo\u003c/strong\u003e. Three matching points, and the 1807 marriage gives the same three independently."}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B13 — Santiago, Tavira, baptisms 1779–1785 — image 22, right page, second entry. Margin tag \u003cem\u003eDomingos\u003c/em\u003e."},"online":{"docId":"021a8b4d6dbf48e18dd368727e7c9bb0","image":"22","url":"https://digitarq.arquivos.pt/fileViewer/021a8b4d6dbf48e18dd368727e7c9bb0","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/021a8b4d6dbf48e18dd368727e7c9bb0\u003c/code\u003e — image 22"},"localOnly":false,"embeddedImages":[]},{"id":"1782-marriage-rodrigo-jose-pereira","year":"1782","kind":"Marriage","kindDetail":"","title":"Rodrigo José Pereira and Ignes de Jesus","whenWhere":"30 November 1782 · Igreja Matriz de Santiago, Tavira · \u003cstrong\u003ethe oldest record we hold, and a direct ancestral marriage\u003c/strong\u003e","principals":["rodrigo-jose-pereira","ignes-de-jesus"],"mentions":["jose-dos-santos","anna-cabrita","jose-domingues","margarida-da-conceicao"],"transcriptPt":"\u003cp\u003eAos trinta dias do Mes de Novembro de mil sete Centos e oitenta e dous annos, nesta Igreja, em minha prezença, e das testemunhas no fim deste assinadas, contrahirão o Sacramento do Matrimonio por palavras de prezente na forma que manda a Santa Madre Igreja o Concilio Tridentino e Constituições deste Bispado, \u003cem class=\"name\"\u003eRodrigo Joseph Pereira\u003c/em\u003e, Solteiro, filho legitimo de \u003cem class=\"name\"\u003eJoseph dos Santos\u003c/em\u003e, e de \u003cem class=\"name\"\u003eAnna Cabritta\u003c/em\u003e, todos desta Freguezia; e \u003cem class=\"name\"\u003eIgnes de JESUS\u003c/em\u003e, Solteira, filha de \u003cem class=\"name\"\u003eJoseph Domingues\u003c/em\u003e, e de \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, tambem desta Freguezia. E logo lhe dei as bençãos nunciais. De que fiz este termo, dia, mez, e Era, ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eTheodozio Pascoal Pessinga, Prior · João Rodrigues \u003cstrong\u003e✝\u003c/strong\u003e · Joseph \u003cstrong\u003e✝\u003c/strong\u003e Pereira\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the thirtieth day of the month of November of one thousand seven hundred and eighty-two, in this Church, in my presence and that of the witnesses undersigned at the foot of this, was contracted the Sacrament of Matrimony by words of the present, in the form commanded by Holy Mother Church, the Council of Trent and the Constitutions of this Bishopric — \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, bachelor, lawful son of \u003cem class=\"name\"\u003eJosé dos Santos\u003c/em\u003e and of \u003cem class=\"name\"\u003eAna Cabrita\u003c/em\u003e, \u003cstrong\u003eall of this parish\u003c/strong\u003e; and \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, spinster, daughter of \u003cem class=\"name\"\u003eJosé Domingues\u003c/em\u003e and of \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, \u003cstrong\u003ealso of this parish\u003c/strong\u003e. And straightway I gave them the nuptial blessings. Whereof I made this entry, on the day, month and year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eTheodózio Pascoal Pessinga, Prior · João Rodrigues \u003cstrong\u003e✝\u003c/strong\u003e · José \u003cstrong\u003e✝\u003c/strong\u003e Pereira — \u003cem\u003eboth witnesses signed with a cross\u003c/em\u003e\u003c/span\u003e","details":[{"label":"Who they are","body":"The parents of \u003cstrong\u003eMaria das Dores\u003c/strong\u003e — João's great-great-grandmother. This is the marriage that begins the maternal half of the line, and at 1782 it is the earliest document in this collection.","scope":"family"},{"label":"It closes the parish question","body":"\u003cstrong\u003e\"todos desta Freguezia\"\u003c/strong\u003e and \u003cstrong\u003e\"tambem desta Freguezia\"\u003c/strong\u003e — said twice, of both families. These are \u003cstrong\u003eSantiago\u003c/strong\u003e people, not Santa Maria. Every earlier record only ever said \u003cem\u003edesta Cidade\u003c/em\u003e, which covers both city parishes and settles nothing. This one settles it.","scope":"family"},{"label":"It confirms the 1811 record independently","body":"The 1811 marriage of their son Francisco José named his paternal grandparents as \u003cem\u003eJosé dos Santos and Ana Cabrita\u003c/em\u003e. This entry, written \u003cstrong\u003etwenty-nine years earlier by a different priest\u003c/strong\u003e, names Rodrigo's parents as exactly that pair. Two independent documents, one answer — which is as good as this kind of evidence gets.","scope":"family"},{"label":"It dates the family","body":"Married November 1782, so their children begin in 1783. \u003cstrong\u003eMaria das Dores was born 1783 or later\u003c/strong\u003e — consistent with every other estimate, and it tells us which baptism registers to search.","scope":"family"},{"label":"One honest discrepancy","body":"Ignes's father is \u003cstrong\u003eJosé Domingues\u003c/strong\u003e here, but \u003cstrong\u003eJosé Rodrigues\u003c/strong\u003e in her son's 1811 marriage. Her mother is \u003cem\u003eMargarida da Conceição\u003c/em\u003e in both, and the paternal side matches exactly, so the identification is not in doubt — but the two records genuinely disagree on this one name. A sibling's baptism would name him a third time and break the tie. Until then, search both.","scope":"hunt"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/002/C6 — Santiago, Tavira, marriages 1765–1789 — spread 103, left page, lower entry. Margin tag \u003cem\u003eRodrigo Jozeph Pereira / Ignez de JESUS\u003c/em\u003e."},"online":{"docId":"0dedbd6a37694843b274406235d36b54","image":"103","url":"https://digitarq.arquivos.pt/fileViewer/0dedbd6a37694843b274406235d36b54","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/0dedbd6a37694843b274406235d36b54\u003c/code\u003e — image 103"},"localOnly":false,"embeddedImages":[]},{"id":"1807-marriage-domingos-viegas-maria","year":"1807","kind":"Marriage","kindDetail":"","title":"Domingos Viegas and Maria das Dores","whenWhere":"20 March 1807 · Ermida de Nossa Senhora da Consolação, then serving as the matriz of Santiago, Tavira · \u003cstrong\u003ethe marriage the whole search was built around\u003c/strong\u003e","principals":["domingos-viegas-leiria-1780","maria-das-dores"],"mentions":["francisco-viegas-leiria","francisca-de-jesus","antonio-viegas-leiria","maria-gonsalves","antonio-correa","elena-maria","rodrigo-jose-pereira","ignes-de-jesus","jose-dos-santos","anna-cabrita","jose-domingues","margarida-da-conceicao"],"transcriptPt":"\u003cp\u003eNesta Ermida de Nossa Senhora da Consolação, que de prezente serve de Matriz da Freguezia de Santiago de Tavira, aos \u003cstrong\u003evinte dias do mez de Março de mil oito centos, e sete annos\u003c/strong\u003e, em minha prezença, e de Antonio Baptista e de João do Carmo, testemunhas prezentes commigo abaixo assignadas, selebrarão o Sacramento do Matrimonio por palavras de prezente segundo ordena o Sagrado Concilio Tridentino, e Constetuição deste Bispado \u003cstrong\u003eDomingos Viegas\u003c/strong\u003e, Soldado do Regimento desta Praça, Solteiro, filho de \u003cstrong\u003eFrancisco Viegas Leiria\u003c/strong\u003e, e de \u003cstrong\u003eFrancisca de Jesus\u003c/strong\u003e, todos naturais desta Cidade, neto paterno de \u003cstrong\u003eAntonio Viegas Leiria\u003c/strong\u003e, e de \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e, naturais de \u003cstrong\u003eSanta Catharina da Fonte do Bispo\u003c/strong\u003e, neto materno de \u003cstrong\u003eAntonio\u003c/strong\u003e […] e de \u003cstrong\u003eElena Maria\u003c/strong\u003e, naturais desta Cidade, com \u003cstrong\u003eMaria das Dores\u003c/strong\u003e, Solteira, filha de \u003cstrong\u003eRodrigo José Pereira\u003c/strong\u003e e de \u003cstrong\u003eIgnes de Jesus\u003c/strong\u003e, neta paterna de \u003cstrong\u003eJoão dos Santos\u003c/strong\u003e e de \u003cstrong\u003eAnna Cabrita\u003c/strong\u003e, neta materna de \u003cstrong\u003eJosé Domingues\u003c/strong\u003e, todos naturais desta Cidade, e de \u003cstrong\u003eMargarida da Conceição\u003c/strong\u003e, natural de Santa Catharina; o que tudo fiz em observancia de dois Mandados, que me forão apprezentados da Camara Ecleziastica deste Bispado, registados a folha cento e sete, hum para os receber em tempo de dispensa do tempo quaresmal…\u003c/p\u003e","transcriptEn":"\u003cp\u003eIn this Chapel of Our Lady of Consolation, which at present serves as the mother church of the parish of Santiago of Tavira, on the \u003cstrong\u003etwentieth day of March 1807\u003c/strong\u003e, in my presence and that of Antonio Baptista and João do Carmo, witnesses undersigned with me, was celebrated the Sacrament of Matrimony — \u003cstrong\u003eDomingos Viegas\u003c/strong\u003e, soldier of the Regiment of this Garrison, bachelor, son of \u003cstrong\u003eFrancisco Viegas Leiria\u003c/strong\u003e and \u003cstrong\u003eFrancisca de Jesus\u003c/strong\u003e, all natives of this city; paternal grandson of \u003cstrong\u003eAntonio Viegas Leiria\u003c/strong\u003e and \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e, \u003cstrong\u003enatives of Santa Catarina da Fonte do Bispo\u003c/strong\u003e; maternal grandson of \u003cstrong\u003eAntonio\u003c/strong\u003e […] and \u003cstrong\u003eElena Maria\u003c/strong\u003e, natives of this city — with \u003cstrong\u003eMaria das Dores\u003c/strong\u003e, spinster, daughter of \u003cstrong\u003eRodrigo José Pereira\u003c/strong\u003e and \u003cstrong\u003eIgnes de Jesus\u003c/strong\u003e; paternal granddaughter of \u003cstrong\u003eJoão dos Santos\u003c/strong\u003e and \u003cstrong\u003eAnna Cabrita\u003c/strong\u003e; maternal granddaughter of \u003cstrong\u003eJosé Domingues\u003c/strong\u003e, all natives of this city, and of \u003cstrong\u003eMargarida da Conceição\u003c/strong\u003e, a native of Santa Catarina. All of which I did in observance of two mandates presented to me from the Ecclesiastical Chamber of this Bishopric, registered at folio one hundred and seven — one of them to receive them \u003cem\u003eunder dispensation during the season of Lent\u003c/em\u003e…\u003c/p\u003e","details":[{"label":"Why it matters","body":"The direct ancestral marriage, hunted across several sessions and repeatedly mis-dated. It names \u003cstrong\u003eboth sets of grandparents on both sides\u003c/strong\u003e, which is how the paternal line gained a generation.","scope":"family"},{"label":"It extends the line","body":"\u003cstrong\u003eAntonio Viegas Leiria and Maria Gonsalves, natives of Santa Catarina da Fonte do Bispo.\u003c/strong\u003e The couple was already known from two collateral records (1778 and 1786) as the grandparents of \u003cem\u003eother\u003c/em\u003e Viegas; this is what attaches them to this family.","scope":"family"},{"label":"Three brothers","body":"Set beside those two records, Antonio and Maria Gonsalves had at least three sons who came down from the serra into the city: \u003cstrong\u003eManuel\u003c/strong\u003e (1778), \u003cstrong\u003eJosé\u003c/strong\u003e (1786) and \u003cstrong\u003eFrancisco\u003c/strong\u003e (this record). Manuel also named a son Francisco — so there are \u003cstrong\u003etwo Francisco Viegas in adjacent generations\u003c/strong\u003e, and matching on the name alone will merge them.","scope":"family"},{"label":"The byname is older than we could show","body":"\u003cem\u003eLeiria\u003c/em\u003e is written out here on \u003cstrong\u003eboth\u003c/strong\u003e Domingos's father and his grandfather. It was not attached later; the family carried it before Domingos was born.","scope":"family"},{"label":"It dates the household","body":"Married 20 March 1807; first child \u003cstrong\u003eJoão born 3 April 1808\u003c/strong\u003e, twelve and a half months later. That baptism's phrase \u003cem\u003e“do primeiro Matrimonio de ambos”\u003c/em\u003e is what forced the search back into this window in the first place, and the two records confirm each other.","scope":"family"},{"label":"A third vote on a discrepancy","body":"Ignes de Jesus's father is \u003cstrong\u003eJosé Domingues\u003c/strong\u003e here — agreeing with the 1782 marriage above, against the \u003cem\u003eJosé Rodrigues\u003c/em\u003e of the 1811 entry. Two to one for Domingues.","scope":"hunt"},{"label":"Two things left rough","body":"He is a \u003cstrong\u003esoldier\u003c/strong\u003e here in March 1807 but a \u003cstrong\u003etrabalhador\u003c/strong\u003e at João's baptism thirteen months later, and a soldier again in 1813 and 1816 — militia service would explain it, but it is not resolved. And the surname of his maternal grandfather \u003cstrong\u003eAntonio\u003c/strong\u003e sits under a strike-through from the line above and cannot be read \u003cem\u003ehere\u003c/em\u003e — but it is \u003cstrong\u003enow known from elsewhere\u003c/strong\u003e. The 1780 baptism at the head of this page names him plainly: \u003cstrong\u003eAntonio Correa\u003c/strong\u003e, a \u003cstrong\u003e\u003cem\u003eçapateiro\u003c/em\u003e\u003c/strong\u003e, shoemaker.","scope":"family"},{"label":"Married in Lent","body":"Two mandates from the Ecclesiastical Chamber, folio 107, one expressly to marry \u003cem\u003e“em tempo de dispensa do tempo quaresmal”\u003c/em\u003e. Marrying in the closed season needed a bishop's licence and normally signals haste.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — spread 79, folio 78, left page, first entry. Margin tag \u003cem\u003eDomingos Viegas / M.ª das Dores\u003c/em\u003e."},"online":{"docId":"2a92610370b649bcb03a8cbcea67a137","image":"79","url":"https://digitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 79"},"localOnly":false,"embeddedImages":[]},{"id":"1808-baptism-joao-domingos-viegas","year":"1808","kind":"Baptism","kindDetail":"3 April","title":"João, son of Domingos Viegas and Maria das Dores","whenWhere":"Born 3 April 1808 · Santiago, Tavira · the eldest known child of the marriage","principals":["joao-viegas-1808"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","francisco-viegas-leiria","francisca-de-jesus","rodrigo-jose-pereira","ignes-de-jesus"],"transcriptPt":"\u003cp\u003e“João filho de \u003cstrong\u003eDomingos Viegas Trabalhador\u003c/strong\u003e, e de sua legitima mulher \u003cstrong\u003eMaria das Dores\u003c/strong\u003e, primeiro filho deste nome, e do \u003cstrong\u003eprimeiro Matrimonio de ambos\u003c/strong\u003e, neto paterno de \u003cstrong\u003eFrancisco Viegas\u003c/strong\u003e, e de \u003cstrong\u003eFrancisca de Jesus\u003c/strong\u003e, neto materno de \u003cstrong\u003eRodrigo José Pereira\u003c/strong\u003e e de \u003cstrong\u003eIgnes de Jesus\u003c/strong\u003e, todos naturais desta Cidade, nasceo aos \u003cstrong\u003etrez dias do mez de Abril de mil oito centos, e oito annos\u003c/strong\u003e…”\u003c/p\u003e","transcriptEn":"\u003cp\u003e“João, son of \u003cstrong\u003eDomingos Viegas, labourer\u003c/strong\u003e, and of his lawful wife \u003cstrong\u003eMaria das Dores\u003c/strong\u003e — first child of this name, and of the \u003cstrong\u003efirst marriage of both\u003c/strong\u003e; paternal grandson of \u003cstrong\u003eFrancisco Viegas\u003c/strong\u003e and \u003cstrong\u003eFrancisca de Jesus\u003c/strong\u003e, maternal grandson of \u003cstrong\u003eRodrigo José Pereira\u003c/strong\u003e and \u003cstrong\u003eIgnes de Jesus\u003c/strong\u003e, all natives of this city. He was born on the \u003cstrong\u003ethird day of the month of April of one thousand eight hundred and eight\u003c/strong\u003e…”\u003c/p\u003e","details":[{"label":"He is the eldest known child","scope":"family","body":"Five years ahead of Giraldo, who had always stood first. The line of children now runs \u003cstrong\u003eJoão (1808) · Giraldo (1813) · Rodrigo (1816) · Maria (1818) · José (1820)\u003c/strong\u003e."},{"label":"It dates the marriage","scope":"family","body":"\u003cem\u003e“Do primeiro Matrimonio de ambos”\u003c/em\u003e — the first marriage of both — means Domingos and Maria das Dores were already married before April 1808."},{"label":"How we know it is our family","scope":"hunt","body":"Both sets of grandparents match Rodrigo’s 1816 entry word for word. That is what proves this child belongs to \u003cem\u003eour\u003c/em\u003e Domingos and not to one of the five or six other Domingos Viegas then living in Tavira."},{"label":"It vindicates the family tree","scope":"hunt","body":"FamilySearch had long listed a João Viegas Leiria as a brother of Giraldo, and our own notes had written that off as a muddle with José’s son João of 1861. The tree was right and the caution was wrong — there are simply two Joãos."}],"notes":"Found in a stretch of Santiago B17 (1806–1810) that had been flagged as untested and never opened. Four sessions of searching had put the parents’ marriage in 1811–12 and pinned it on an illegible Santa Maria entry; this baptism is what proved that wrong by four years.","archive":{"text":"Santiago, Tavira — baptisms B17, spread 140 (folio 137), left page, second entry. Margin tag \u003cem\u003eIoaõ\u003c/em\u003e. The scan is very dark; the images here have been contrast-corrected to make the hand legible."},"online":{"docId":"aebbba4f29d14e2ea818d552363617a5","image":"140","url":"https://digitarq.arquivos.pt/fileViewer/aebbba4f29d14e2ea818d552363617a5","note":"DigitArq — Santiago baptisms B17, image 140"},"localOnly":false,"embeddedImages":["joao_1808/01_entry.jpg","joao_1808/02_primeiro_matrimonio.jpg","joao_1808/03_full_spread.jpg"],"imageCaptions":["The entry in full, with its margin tag “Ioaõ”","The line that redated the marriage: “primeiro filho deste nome, e do primeiro Matrimonio de ambos”","The whole opening — folio 137, with João’s entry second on the left page"]},{"id":"1811-marriage-francisco-jose-pereira","year":"1811","kind":"Marriage","kindDetail":"","title":"Francisco José Pereira and Maria de Santa Ana","whenWhere":"3 June 1811 · Igreja Matriz e Colegiada de Santiago, Tavira","principals":["francisco-jose-pereira","maria-de-santa-ana"],"mentions":["rodrigo-jose-pereira","ignes-de-jesus","jose-dos-santos","anna-cabrita","jose-domingues","margarida-da-conceicao"],"transcriptPt":"\u003cp\u003eAos tres dias, do mes de Junho de mil oito centos e onze annos, nesta Igreja Matriz e Colegiada de Santiago de Tavira, em minha prezença e do Manjor Reformado \u003cem class=\"name\"\u003eAntonio Paullas Soarez\u003c/em\u003e, e do Manjor Reformado \u003cem class=\"name\"\u003eJoaquim Jose de Mattos\u003c/em\u003e, testemunhas prezentes, com mais abaixo assignados, se celebrarão o Sacramento do Matrimonio por palavras do prezente, segundo Ordena o Sagrado Concillio Tredentino e Constituições deste Bispado = \u003cem class=\"name\"\u003eFrancisco Jose Pereira\u003c/em\u003e, Solteiro, filho de \u003cem class=\"name\"\u003eRodrigo Jose Pereira\u003c/em\u003e, Serrador, e de \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, naturais desta Freguezia; neto paterno de \u003cem class=\"name\"\u003eJose dos Santos\u003c/em\u003e e de \u003cem class=\"name\"\u003eAnna Cabrita\u003c/em\u003e; neto Materno de \u003cem class=\"name\"\u003eJose Rodrigues\u003c/em\u003e, e de \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, todos naturais desta Cidade = com \u003cem class=\"name\"\u003eMaria de Santa Anna\u003c/em\u003e, Viuva de \u003cem class=\"name\"\u003eAntonio da Costa Pereira\u003c/em\u003e, naturais desta Cidade. De que tudo fis em virtude de hum mandado que me foi aprezentado da Camara Ecleziastica deste Bispado, registado a folhas sesenta e nove, do que fis este assento, que assignei com as sobreditas testemunhas, dia, mes e Era, ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Beneficiado Encomendado P.\u003csup\u003ee\u003c/sup\u003e Francisco dos Reis · Antonio Paulla Soares · Joaquim José de Mattos\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the third day of the month of June of one thousand eight hundred and eleven, in this Matriz and Collegiate Church of Santiago de Tavira, in my presence and that of the Retired Major \u003cem class=\"name\"\u003eAntónio Paulas Soares\u003c/em\u003e and of the Retired Major \u003cem class=\"name\"\u003eJoaquim José de Matos\u003c/em\u003e, witnesses present, together with those undersigned below, was celebrated the Sacrament of Matrimony by words of the present, according as the Sacred Council of Trent and the Constitutions of this Bishopric ordain = \u003cem class=\"name\"\u003eFrancisco José Pereira\u003c/em\u003e, bachelor, son of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, \u003cstrong\u003esawyer\u003c/strong\u003e, and of \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, \u003cstrong\u003enatives of this parish\u003c/strong\u003e; paternal grandson of \u003cem class=\"name\"\u003eJosé dos Santos\u003c/em\u003e and of \u003cem class=\"name\"\u003eAna Cabrita\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eJosé Rodrigues\u003c/em\u003e and of \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, all natives of this City = with \u003cem class=\"name\"\u003eMaria de Santa Ana\u003c/em\u003e, widow of \u003cem class=\"name\"\u003eAntónio da Costa Pereira\u003c/em\u003e, natives of this City. All of which was done by virtue of a warrant presented to me from the Ecclesiastical Chamber of this Bishopric, registered at folio sixty-nine. Whereof I made this entry, which I signed with the aforesaid witnesses, on the day, month and year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Beneficed Priest-in-charge, Fr. Francisco dos Reis · António Paula Soares · Joaquim José de Matos\u003c/span\u003e","details":[{"label":"Why it matters","body":"\u003cstrong\u003eThe groom is Maria das Dores's brother\u003c/strong\u003e, and this is the oldest record we hold. It gives a generation we did not have: Maria das Dores's grandparents on both sides — \u003cstrong\u003eJosé dos Santos and Ana Cabrita\u003c/strong\u003e, and \u003cstrong\u003eJosé Rodrigues and Margarida da Conceição\u003c/strong\u003e. It also gives Rodrigo José Pereira a trade, \u003cem\u003eserrador\u003c/em\u003e, a sawyer.","scope":"family"},{"label":"And a parish","body":"Rodrigo José Pereira and Ignes de Jesus are called \u003cstrong\u003e“naturais desta Freguezia”\u003c/strong\u003e — natives \u003cem\u003eof this parish\u003c/em\u003e, Santiago. Every other record we have says only \u003cem\u003edesta Cidade\u003c/em\u003e, of this city, which covers both urban parishes and settles nothing. This one settles it: the Pereira family were Santiago people, and Maria das Dores was almost certainly baptized there.","scope":"family"},{"label":"The soft joint","body":"Francisco José Pereira is taken as her brother because his parents are named as \u003cem\u003eRodrigo José Pereira and Ignes de Jesus\u003c/em\u003e — exactly hers, as given in four separate baptism entries for her children. That pair is rare in these registers. But it remains a name match, not a document that says \u003cem\u003ebrother\u003c/em\u003e. A baptism naming both children would close it.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — \u003cstrong\u003efolio 116\u003c/strong\u003e, right page, middle entry. Margin tag \u003cem\u003eFran.\u003csup\u003eco\u003c/sup\u003e José P.\u003csup\u003era\u003c/sup\u003e / M.\u003csup\u003ea\u003c/sup\u003e de S.\u003csup\u003eta\u003c/sup\u003e Anna\u003c/em\u003e."},"online":{"docId":"2a92610370b649bcb03a8cbcea67a137","image":"118","url":"https://digitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 118"},"localOnly":false,"embeddedImages":[]},{"id":"1813-baptism-giraldo-domingos-viegas","year":"1813","kind":"Baptism","kindDetail":"","title":"Giraldo, son of Domingos Viegas and Maria das Dores","whenWhere":"Born 25 August 1813 · baptized 1 September 1813 · Igreja Matriz e Colegiada de Santiago, Tavira","principals":["giraldo-viegas-1813"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","francisco-viegas-leiria","francisca-de-jesus","rodrigo-jose-pereira","ignes-de-jesus"],"transcriptPt":"\u003cp\u003eGiraldo filho de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e Soldado do Regimento numero quatro, e de sua legitima mulher \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, primeiro filho deste nome, e do primeiro Matrimonio de ambos, neto paterno de \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eFrancisca Maria\u003c/em\u003e, neto materno de \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, e de \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, todos naturais desta Cidade, nasceo em os vinte e cinco dias do mez de Agosto de mil, e oito centos, e treze annos, e foi baptizado nesta Igreja Matriz, e Collegiada de Santiago de Tavira pelo Reverendo Padre Francisco dos Reis, Beneficiado Encomendado no Benificio Curado da mesma Igreja, e lhe poz os Santos Oleos em o primeiro dia do mez de Setembro do dito anno; foraõ seos Padrinhos \u003cem class=\"name\"\u003eAntonio José Giraldo de Oliveira\u003c/em\u003e, e \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e; de que fiz este assento, que o dito Padre assignou dia, mez, e era, ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Beneficiado Encomendado P.\u003csup\u003ee\u003c/sup\u003e Francisco dos Reis\u003c/span\u003e","transcriptEn":"\u003cp\u003eGiraldo, son of \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e, soldier of Regiment number four, and of his lawful wife \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e; first child of this name, and of the first marriage of them both; paternal grandson of \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eFrancisca Maria\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e and of \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, all natives of this City. He was born on the twenty-fifth day of the month of August of one thousand eight hundred and thirteen, and was baptized in this Matriz and Collegiate Church of Santiago de Tavira by the Reverend Father Francisco dos Reis, Beneficed Priest-in-charge of the Curacy of the same Church, who administered the holy oils to him on the first day of the month of September of the said year. His godparents were \u003cem class=\"name\"\u003eAntónio José Giraldo de Oliveira\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e. Whereof I made this entry, which the said Father signed, on the day, month and year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Beneficed Priest-in-charge, Fr. Francisco dos Reis\u003c/span\u003e","details":[],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B18 — Santiago, Tavira, baptisms 1811–1815 — \u003cstrong\u003efolio 63 verso\u003c/strong\u003e, first entry"},"online":{"docId":"9b6daefd25554a719b3533e4ae9d2a06","image":"63","url":"https://digitarq.arquivos.pt/fileViewer/9b6daefd25554a719b3533e4ae9d2a06","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/9b6daefd25554a719b3533e4ae9d2a06\u003c/code\u003e — image 63"},"localOnly":false,"embeddedImages":[]},{"id":"1816-baptism-rodrigo-domingos-viegas","year":"1816","kind":"Baptism","kindDetail":"","title":"Rodrigo, son of Domingos Viegas and Maria das Dores","whenWhere":"Born 14 March 1816 · baptized 20 March 1816 · Igreja Matriz e Colegiada de Santiago, Tavira","principals":["rodrigo-viegas-1816"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","francisco-viegas-leiria","francisca-de-jesus","rodrigo-jose-pereira","ignes-de-jesus"],"transcriptPt":"\u003cp\u003eRodrigo filho de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e Soldado do Regimento desta Praça, e de sua legitima mulher \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, primeiro filho deste nome, e do primeiro Matrimonio de ambos, neto paterno de \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eFrancisca de Jesus\u003c/em\u003e; neto materno de \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, e de \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, todos naturais desta Cidade; nasceo em os quatorze dias do mez de Março de mil, e oito centos, e dezaseis annos; e foi baptizado nesta Igreja Matriz, e Collegiada de Santiago de Tavira de minha licença pelo Reverendo Padre Frei Domingos da Mãi de Deos, Religioso Paulista, commigo abaixo assignado, e lhe poz os Santos Oleos em os vinte dias do dito mez, e era; foraõ Padrinhos \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, e \u003cem class=\"name\"\u003eIzabel da Conceição\u003c/em\u003e; de que fiz este assento dia, mez, era, ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eFr. Domingos da Mãi de Deos · o P.\u003csup\u003eor\u003c/sup\u003e José Ro\u003csup\u003eiz\u003c/sup\u003e Penella\u003c/span\u003e","transcriptEn":"\u003cp\u003eRodrigo, son of \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e, soldier of the Regiment of this Garrison, and of his lawful wife \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e; first child of this name, and of the first marriage of them both; paternal grandson of \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eFrancisca de Jesus\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e and of \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, all natives of this City. He was born on the fourteenth day of the month of March of one thousand eight hundred and sixteen, and was baptized in this Matriz and Collegiate Church of Santiago de Tavira, by my licence, by the Reverend Father Frei Domingos da Mãe de Deus, Paulist Religious, undersigned with me, who administered the holy oils to him on the twentieth day of the said month and year. His godparents were \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e and \u003cem class=\"name\"\u003eIzabel da Conceição\u003c/em\u003e. Whereof I made this entry, on the day, month and year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eFr. Domingos da Mãe de Deus · the Prior José Rodrigues Penella\u003c/span\u003e","details":[{"label":"Note","body":"The godfather is \u003cstrong\u003eRodrigo José Pereira\u003c/strong\u003e — the child's own maternal grandfather, whom he was named after.","scope":"hunt"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B19 — Santiago, Tavira, baptisms 1815–1820 — \u003cstrong\u003efolio 31\u003c/strong\u003e. Entry begins at the foot of the left page and ends at the top of the right."},"online":{"docId":"b4a4d378df4a41efbb87487e8995717a","image":"32","url":"https://digitarq.arquivos.pt/fileViewer/b4a4d378df4a41efbb87487e8995717a","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/b4a4d378df4a41efbb87487e8995717a\u003c/code\u003e — image 32"},"localOnly":false,"embeddedImages":[]},{"id":"1832-baptism-catarina-manoel-santa","year":"1832","kind":"Baptism","kindDetail":"","title":"Catarina, daughter of Manoel de Santa Ana and Ana Maria","whenWhere":"Born 5 June 1832 · baptized 11 June 1832 · Igreja Matriz de Santa Maria, Tavira","principals":["catarina-do-rosario-1832"],"mentions":["manoel-de-santa-ana","anna-maria","jose-correia-minhos","joanna-rita","jose-rodrigues-matheos","catarina-das-chagas"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eA 11 de Junho 1832 — Catharina f.\u003csup\u003ea\u003c/sup\u003e de M.\u003csup\u003eel\u003c/sup\u003e d[e] S.\u003csup\u003eta\u003c/sup\u003e Anna e de Anna Maria\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eAos onze dias do mez de Junho de mil oito centos e trinta e dous nesta sagrada Igreja de Santa Maria Matriz desta Cidade de Tavira baptizei, e pus os santos Oleos a \u003cem class=\"name\"\u003eCatharina\u003c/em\u003e primeira do nome, e do primeiro Matrimonio de ambos que nasceo a sinco do dito mez e era, filha legitima de \u003cem class=\"name\"\u003eManoel de Santa Anna\u003c/em\u003e, e de \u003cem class=\"name\"\u003eAnna Maria\u003c/em\u003e, neta paterna de \u003cem class=\"name\"\u003eJosé Correia Minhós\u003c/em\u003e e de \u003cem class=\"name\"\u003eJoanna Ritta\u003c/em\u003e, neta materna de \u003cem class=\"name\"\u003eJosé Ro[drigue]s Matheos\u003c/em\u003e, e de \u003cem class=\"name\"\u003eCatharina das Chagas\u003c/em\u003e todos baptizados nesta Igreja Matriz, padrinho \u003cem class=\"name\"\u003eJoaquim Bernardo Duartte\u003c/em\u003e casado com \u003cem class=\"name\"\u003eDona Maria do Carmo\u003c/em\u003e, e tocou com a coroa que adorna a Senhora do Rosario d'ella desta Matriz, \u003cem class=\"name\"\u003eJoão Pedro\u003c/em\u003e solteiro, filho do Sapateiro \u003cem class=\"name\"\u003eAntonio Vicente\u003c/em\u003e; em fé do que fis este termo que assignei dia mez e era ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Beneficiado Curado e Encomend[ad]o Antonio Ro[drigue]s das Dores\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eOn 11 June 1832 — Catarina, daughter of Manoel de Santa Ana and of Ana Maria\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eOn the eleventh day of the month of June of one thousand eight hundred and thirty-two, in this sacred Church of Santa Maria, the Matriz of this City of Tavira, I baptized and applied the holy oils to \u003cem class=\"name\"\u003eCatarina\u003c/em\u003e, the first of this name and of the first marriage of them both, \u003cstrong\u003ewho was born on the fifth of the said month and year\u003c/strong\u003e, legitimate daughter of \u003cem class=\"name\"\u003eManoel de Santa Ana\u003c/em\u003e and of \u003cem class=\"name\"\u003eAna Maria\u003c/em\u003e; paternal granddaughter of \u003cem class=\"name\"\u003eJosé Correia Minhós\u003c/em\u003e and of \u003cem class=\"name\"\u003eJoana Rita\u003c/em\u003e; maternal granddaughter of \u003cem class=\"name\"\u003eJosé Rodrigues Mateus\u003c/em\u003e and of \u003cem class=\"name\"\u003eCatarina das Chagas\u003c/em\u003e, all baptized in this Matriz Church. Godfather, \u003cem class=\"name\"\u003eJoaquim Bernardo Duarte\u003c/em\u003e, married to \u003cem class=\"name\"\u003eDona Maria do Carmo\u003c/em\u003e. And \u003cem class=\"name\"\u003eJoão Pedro\u003c/em\u003e, a bachelor, son of the shoemaker \u003cem class=\"name\"\u003eAntónio Vicente\u003c/em\u003e, touched her with the crown that adorns Our Lady of the Rosary of this Matriz. In witness whereof I made this entry, which I signed on the day, month and year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Beneficed Curate and Priest-in-charge, António Rodrigues das Dores\u003c/span\u003e","details":[{"label":"Note","body":"\"First of this name\" means the first child in the family to bear the name, not the firstborn. Her parents and both sets of grandparents are repeated exactly in her 1850 marriage entry below, which confirms the identification.","scope":"hunt"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR05/001/B31 — Santa Maria, Tavira, baptisms 1832–1840 — \u003cstrong\u003efolio 17 verso\u003c/strong\u003e, first complete entry on the left page"},"online":{"docId":"33a523599a4d4df4bf642a9f0915c39b","image":"19","url":"https://digitarq.arquivos.pt/fileViewer/33a523599a4d4df4bf642a9f0915c39b","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/33a523599a4d4df4bf642a9f0915c39b\u003c/code\u003e — image 19"},"localOnly":false,"embeddedImages":[]},{"id":"1818-baptism-maria-domingos-viegas","year":"1818","kind":"Baptism","kindDetail":"","title":"Maria, daughter of Domingos Viegas Leiria and Maria das Dores","whenWhere":"Born 20 February 1818 · baptized 28 February 1818 · Igreja Matriz e Colegiada de Santiago, Tavira","principals":["maria-viegas-1818"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","francisco-viegas-leiria","francisca-de-jesus","rodrigo-jose-pereira","ignes-de-jesus"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eMaria\u003c/em\u003e filha de \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e, e de \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, primeira filha deste nome, e do primeiro Matrimonio de ambos, neta paterna de \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eFrancisca de Jesus\u003c/em\u003e, e materna de \u003cem class=\"name\"\u003eRodrigo José [Pereira]\u003c/em\u003e e de \u003cem class=\"name\"\u003eIgnez de Jesus\u003c/em\u003e, todos naturaes desta Cidade, nasceo aos vinte dias do mez de Fevereiro de mil oito centos e dezoito, e foi baptizada solemnemente, e lhe puz os Santos Oleos de licença do Reverendo Prior desta Matriz, e Colegiada de Santiago de Tavira, aos vinte e oito dias do mesmo mez…\u003c/p\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eMaria\u003c/em\u003e, daughter of \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e and of \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e; first daughter of this name, and of the first marriage of them both; paternal granddaughter of \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eFrancisca de Jesus\u003c/em\u003e, and maternal granddaughter of \u003cem class=\"name\"\u003eRodrigo José [Pereira]\u003c/em\u003e and of \u003cem class=\"name\"\u003eIgnez de Jesus\u003c/em\u003e, all natives of this City. She was born on the twentieth day of the month of February of one thousand eight hundred and eighteen, and was solemnly baptized, and I applied the holy oils to her by licence of the Reverend Prior of this Matriz and Collegiate Church of Santiago de Tavira, on the twenty-eighth day of the same month…\u003c/p\u003e","details":[{"label":"Note","body":"Found by reading Santiago B19 page by page. All four grandparents match Giraldo's and Rodrigo's entries exactly, so there is no doubt about the family. On the very next folio, \u003cstrong\u003eDomingos and Maria das Dores appear again as godparents\u003c/strong\u003e at a March 1818 baptism.","scope":"hunt"},{"label":"Why she matters","body":"She fixes the rhythm of the family: Giraldo 1813, Rodrigo 1816, Maria 1818 — gaps of 31 then 23 months, and tightening. That puts the \u003cstrong\u003enext child around 1820\u003c/strong\u003e, which is very likely José, who married as a bachelor in January 1845 and would then have been about twenty-four.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B19 — Santiago, Tavira, baptisms 1815–1820 — \u003cstrong\u003efolio 90\u003c/strong\u003e, left-hand page, fourth entry"},"online":{"docId":"b4a4d378df4a41efbb87487e8995717a","image":"92","url":"https://digitarq.arquivos.pt/fileViewer/b4a4d378df4a41efbb87487e8995717a","note":"DigitArq — Santiago baptisms B19, image 92"},"localOnly":false,"embeddedImages":["maria_1818/01_parents.jpg","maria_1818/02_grandparents_and_date.jpg"],"imageCaptions":["The parents","Grandparents and the birth date"]},{"id":"1820-baptism-jose-domingos-viegas","year":"1820","kind":"Baptism","kindDetail":"","title":"José, son of Domingos Viegas and Maria das Dores","whenWhere":"Born 2 June 1820 · baptized 18 June 1820 · Igreja Matriz e Colegiada de Santiago, Tavira","principals":["jose-viegas-leiria-1820"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","francisco-viegas-leiria","francisca-de-jesus","rodrigo-jose-pereira","ignes-de-jesus"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eJosé\u003c/em\u003e filho de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e, trabalhador, e de sua legitima mulher \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, primeiro filho deste nome, e do primeiro Matrimonio de ambos; neto paterno de \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eFrancisca da Conceição\u003c/em\u003e; neto materno de \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, e de \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, todos naturaes desta Cidade; nasceo em os dois dias do mez de Junho de mil, e oito Centos, e vinte annos, e foi baptizado nesta Igreja Matriz, e Collegiada de Santiago de Tavira de minha licensa pelo Reverendo Padre \u003cem class=\"name\"\u003eJosé Francisco dos Santos\u003c/em\u003e com migo abaixo assignado, e lhe poz os Santos Oleos em os dezoito dias do dito mez, e anno; foi seo Padrinho \u003cem class=\"name\"\u003eJosé Maria Gago\u003c/em\u003e, e tocou com a Coroa de Nossa Senhora do Rosario \u003cem class=\"name\"\u003eJosé da Cruz\u003c/em\u003e, de que fiz este assento dia, mez, era, ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO P.\u003csup\u003eor\u003c/sup\u003e José Ro\u003csup\u003eiz\u003c/sup\u003e Penella · O P.\u003csup\u003ee\u003c/sup\u003e José Fran.\u003csup\u003eco\u003c/sup\u003e dos Santos\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eJosé\u003c/em\u003e, son of \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e, labourer, and of his lawful wife \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e; first child of this name, and of the first marriage of them both; paternal grandson of \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eFrancisca da Conceição\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e and of \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, all natives of this City. \u003cstrong\u003eHe was born on the second day of the month of June of one thousand eight hundred and twenty\u003c/strong\u003e, and was baptized in this Matriz and Collegiate Church of Santiago de Tavira, by my licence, by the Reverend Father \u003cem class=\"name\"\u003eJosé Francisco dos Santos\u003c/em\u003e, undersigned with me, who applied the holy oils to him on the \u003cstrong\u003eeighteenth\u003c/strong\u003e day of the said month and year. His godfather was \u003cem class=\"name\"\u003eJosé Maria Gago\u003c/em\u003e, and \u003cem class=\"name\"\u003eJosé da Cruz\u003c/em\u003e touched him with the Crown of Our Lady of the Rosary.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior José Rodrigues Penella · Fr. José Francisco dos Santos\u003c/span\u003e","details":[{"label":"The record the search was for","body":"This was the last missing link and the hardest to find. It was located by reading Santiago B19 page by page, guided by the spacing of his brothers and sister — 1813, 1816, 1818, gaps of 31 then 23 months — which pointed at 1820. All four grandparents match the other children exactly.","scope":"family"},{"label":"It corrects his age","body":"\u003cstrong\u003eHis 1895 death entry says he was 82. He was 75.\u003c/strong\u003e Born June 1820, he died in July 1895 seven weeks after his seventy-fifth birthday. That one wrong number is what made him so hard to find: it sent the search into 1812–13, where an entire register was read for a man who had not yet been born. The death record was right about the parish and wrong about the age.","scope":"family"},{"label":"Everything else now fits","body":"He married for the first time in January 1845 at \u003cstrong\u003etwenty-four\u003c/strong\u003e — an ordinary age for a bachelor. And Domingos is a \u003cem\u003etrabalhador\u003c/em\u003e here rather than a soldier: the Peninsular War ended in 1814, so he had left the regiment by 1820.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B19 — Santiago, Tavira, baptisms 1815–1820 — \u003cstrong\u003efolio 145\u003c/strong\u003e, left-hand page, second entry"},"online":{"docId":"b4a4d378df4a41efbb87487e8995717a","image":"148","url":"https://digitarq.arquivos.pt/fileViewer/b4a4d378df4a41efbb87487e8995717a","note":"DigitArq — Santiago baptisms B19, image 148"},"localOnly":false,"embeddedImages":["jose_1820/01_parents_and_paternal_gps.jpg","jose_1820/02_maternal_gps_and_birthdate.jpg","jose_1820/03_baptism_and_godparents.jpg"],"imageCaptions":["Parents and paternal grandparents","Maternal grandparents and the birth date","The baptism and the godparents"]},{"id":"1842-marriage-giraldo-viegas-maria","year":"1842","kind":"Marriage","kindDetail":"","title":"Giraldo Viegas and Maria do Carmo","whenWhere":"31 January 1842 · Igreja Matriz de Santa Maria, Tavira","principals":["giraldo-viegas-1813","maria-do-carmo"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores"],"transcriptPt":"\u003cp\u003eAos trinta e hum de Janeiro de mil Oito centos e quarenta e dous annos neste Sagrado Matriz de Santa Maria, presente mim e as testemunhas \u003cem class=\"name\"\u003eJoão Baptista Taleiro\u003c/em\u003e e \u003cem class=\"name\"\u003eManoel Pinto Conceição\u003c/em\u003e, casados, este da freguezia de Sant Iago e aquelle desta freguezia, se receberão por palavras de prezente na forma do Direito \u003cem class=\"name\"\u003eGiraldo Viegas\u003c/em\u003e, solteiro, filho de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, neto paterno de \u003cspan class=\"struck\"\u003eRodrigo José Pereira\u003c/span\u003e digo, de \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e e \u003cem class=\"name\"\u003eFrancisca Maria\u003c/em\u003e, e materno de \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e e \u003cem class=\"name\"\u003eIgnes\u003c/em\u003e [de Jesus], todos baptizados na Matriz de Sant Iago; e \u003cem class=\"name\"\u003eMaria do Carmo\u003c/em\u003e, solteira, filha de \u003cem class=\"name\"\u003eSebastião Rodrigues\u003c/em\u003e\u003cspan class=\"gap\"\u003e[?]\u003c/span\u003e e \u003cem class=\"name\"\u003eIgnacia da Conceição\u003c/em\u003e \u003cspan class=\"gap\"\u003e…\u003c/span\u003e\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the thirty-first of January of one thousand eight hundred and forty-two, in this sacred Matriz of Santa Maria, in my presence and that of the witnesses \u003cem class=\"name\"\u003eJoão Baptista Taleiro\u003c/em\u003e and \u003cem class=\"name\"\u003eManoel Pinto Conceição\u003c/em\u003e, married men — the latter of the parish of Santiago, the former of this parish — were joined by words of the present, in the form of law, \u003cem class=\"name\"\u003eGiraldo Viegas\u003c/em\u003e, bachelor, son of \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, paternal grandson of \u003cspan class=\"struck\"\u003eRodrigo José Pereira\u003c/span\u003e — I mean, of \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eFrancisca Maria\u003c/em\u003e — and maternal grandson of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e and \u003cem class=\"name\"\u003eIgnes\u003c/em\u003e [de Jesus], all baptized in the Matriz of Santiago; and \u003cem class=\"name\"\u003eMaria do Carmo\u003c/em\u003e, spinster, daughter of \u003cem class=\"name\"\u003eSebastião Rodrigues\u003c/em\u003e\u003cspan class=\"gap\"\u003e[?]\u003c/span\u003e and \u003cem class=\"name\"\u003eIgnácia da Conceição\u003c/em\u003e \u003cspan class=\"gap\"\u003e…\u003c/span\u003e\u003c/p\u003e","details":[{"label":"Note","body":"Key clauses only; the closing formula is not transcribed. The scribe began the paternal grandparents with the wrong name, caught himself, wrote \u003cem\u003edigo\u003c/em\u003e (\"I mean\") and corrected — which shows both grandfathers' names were in front of him. All four grandparents match Giraldo's 1813 baptism.","scope":"hunt"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR05/002/C15 — Santa Maria, Tavira, marriages 1838–1849 — \u003cstrong\u003efolio 42\u003c/strong\u003e, right-hand page, middle entry"},"online":{"docId":"b3d5e7448e5a4183b32c9185d90bf7be","image":"44","url":"https://digitarq.arquivos.pt/fileViewer/b3d5e7448e5a4183b32c9185d90bf7be","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/b3d5e7448e5a4183b32c9185d90bf7be\u003c/code\u003e — image 44"},"localOnly":false,"embeddedImages":[]},{"id":"1845-marriage-jose-viegas-leiria","year":"1845","kind":"Marriage","kindDetail":"13 January","title":"José Viegas Leiria and Maria José","whenWhere":"13 January 1845 · Igreja Matriz e Colegiada de Santiago, Tavira · José's first marriage","principals":["jose-viegas-leiria-1820","maria-jose"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores"],"transcriptPt":"\u003cp\u003eAos treze dias do mez de Janeiro de mil oito centos quarenta e sinco annos, nesta Igreja Matriz Collegiada de Sant Iago da Cidade de Tavira, na minha presença e das testemunhas abaixo assignadas \u003cem class=\"name\"\u003eManoel José Guimarães\u003c/em\u003e e \u003cem class=\"name\"\u003eManoel José da Conceição\u003c/em\u003e, ambos desta Cidade, se receberão por palavras de prezente na forma do rito Canonico e Constituições deste Bispado do Algarve = \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, solteiro, \u003cstrong\u003ebaptizado nesta Igreja Matriz\u003c/strong\u003e, filho legitimo de \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, moradores nas Ortas d'Atalaia, neto paterno de \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e e \u003cem class=\"name\"\u003eFrancisca da Conceição\u003c/em\u003e, e materno de \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e e \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, todos naturaes desta Cidade. = E \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e, solteira, baptizada na Matriz de Santa Maria desta Cidade, filha legitima de \u003cem class=\"name\"\u003eAntonio Dias Pires\u003c/em\u003e e \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, moradores na Rua de São Sebastião, neta paterna de \u003cem class=\"name\"\u003eJosé Dias Pires\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria Gertrudes\u003c/em\u003e, e materna de \u003cem class=\"name\"\u003e[João] Dias Pires\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria da Conceição\u003c/em\u003e, todos naturaes desta Cidade…\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the thirteenth day of January of one thousand eight hundred and forty-five, in this Matriz and Collegiate Church of Santiago of the City of Tavira, in my presence and that of the undersigned witnesses \u003cem class=\"name\"\u003eManoel José Guimarães\u003c/em\u003e and \u003cem class=\"name\"\u003eManoel José da Conceição\u003c/em\u003e, both of this City, were joined by words of the present in the form of the canonical rite and the constitutions of this Bishopric of the Algarve — \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, bachelor, \u003cstrong\u003ebaptized in this Matriz Church\u003c/strong\u003e, legitimate son of \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, living at the Hortas d'Atalaia, paternal grandson of \u003cem class=\"name\"\u003eFrancisco Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eFrancisca da Conceição\u003c/em\u003e, and maternal grandson of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e and \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, all natives of this City; and \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e, spinster, baptized in the Matriz of Santa Maria of this City, legitimate daughter of \u003cem class=\"name\"\u003eAntonio Dias Pires\u003c/em\u003e and \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, living on the Rua de São Sebastião, paternal granddaughter of \u003cem class=\"name\"\u003eJosé Dias Pires\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gertrudes\u003c/em\u003e, and maternal granddaughter of \u003cem class=\"name\"\u003e[João] Dias Pires\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria da Conceição\u003c/em\u003e, all natives of this City…\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Francisco Xavier Lopes Torres\u003c/span\u003e","details":[{"label":"Why this one matters","body":"\u003cstrong\u003e\"Baptized in this Matriz Church\"\u003c/strong\u003e — José says, in 1845, in his own parish, that he was baptized at Santiago. That settles the parish independently of the 1895 death record, and leaves only its \u003cem\u003eage\u003c/em\u003e in doubt. Marrying as a bachelor in January 1845 puts his birth around \u003cstrong\u003e1815–1823\u003c/strong\u003e, not the 1812–13 the death entry implies.","scope":"family"},{"label":"A new family","body":"Maria José is identified here for the first time — daughter of \u003cstrong\u003eAntonio Dias Pires and Margarida da Conceição\u003c/strong\u003e of the Rua de São Sebastião, the same street where Catarina was living five years later. An entirely fresh branch to follow.","scope":"family"},{"label":"Names","body":"\u003cstrong\u003e\"Leiria\" is in use by January 1845\u003c/strong\u003e, for both José and Domingos — and still absent from every 1810s record. Note too that the paternal grandmother appears here as \u003cem\u003eFrancisca da Conceição\u003c/em\u003e, having been \u003cem\u003eFrancisca Maria\u003c/em\u003e in 1813 and 1842 and \u003cem\u003eFrancisca de Jesus\u003c/em\u003e in 1816. One woman, three devotional names.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/002/C9 — Santiago, Tavira, marriages 1822–1849 — spread 160, right-hand page, middle entry"},"online":{"docId":"e141df4584f344eb9c0cdaaece6adb21","image":"160","url":"https://digitarq.arquivos.pt/fileViewer/e141df4584f344eb9c0cdaaece6adb21","note":"DigitArq — Santiago marriages C9, image 160"},"localOnly":false,"embeddedImages":["jose_mariajose_1845/fm2.jpg","jose_mariajose_1845/fm3.jpg","jose_mariajose_1845/fm4.jpg"],"imageCaptions":["The entry begins","Both sets of parents","Witnesses and the close"]},{"id":"1850-death-maria-jose-jose","year":"1850","kind":"Death","kindDetail":"25 May","title":"Maria José, first wife of José Viegas Leiria","whenWhere":"Died 25 May 1850 · Horta do Desembargador, freguesia de Santiago, Tavira","principals":["maria-jose"],"mentions":["jose-viegas-leiria-1820"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eMaria Jose, caz.\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eAos vinte e cinco dias do mez de Maio de mil oito centos e cincoenta annos, falleceu \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e, cazada que foi com \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, moradores na Orta do Desembargador, recebeo os Sacramentos do costume, não fez testamento; no dia seguinte foi encommendada segundo o rito, e sepultada no cimiterio dos Terceiros de São Francisco desta Cidade. Em fé do que fiz este termo, que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eMaria José, married\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eOn the twenty-fifth day of the month of May of one thousand eight hundred and fifty, there died \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e, who was married to \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, residents at the Horta do Desembargador. She received the customary Sacraments; she made no will. On the following day she was commended according to the rite, and buried in the cemetery of the Third Order of Saint Francis of this City. In witness whereof I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Francisco Xavier Lopes Torres\u003c/span\u003e","details":[{"label":"Note","body":"Terse, as this priest's death entries are — no age, no parents, no birthplace, so Maria José herself remains unidentified beyond her marriage. \"Received the customary Sacraments\" means she had last rites, so her death was not sudden. \u003cstrong\u003eHorta do Desembargador\u003c/strong\u003e — \"the Judge's orchard\" — is where the family lived.","scope":"hunt"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/003/O10 — Santiago, Tavira, deaths 1826–1853 — \u003cstrong\u003efolio 127\u003c/strong\u003e, right-hand page, top entry"},"online":{"docId":"8442bc8ef6b54dac985c1af92216f368","image":"130","url":"https://digitarq.arquivos.pt/fileViewer/8442bc8ef6b54dac985c1af92216f368","note":"DigitArq — Santiago óbitos O10, image 130"},"localOnly":false,"embeddedImages":["maria_jose_1850/01_maria_jose_death.jpg"],"imageCaptions":["Maria José’s death entry"]},{"id":"1850-death-joao-jose-viegas","year":"1850","kind":"Death","kindDetail":"27 June","title":"João, child of José Viegas Leiria and Maria José","whenWhere":"Died 27 June 1850 · Horta do Desembargador, freguesia de Santiago, Tavira","principals":["joao-viegas-1850"],"mentions":["jose-viegas-leiria-1820","maria-jose"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eJoão, menor\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eAos vinte e sete dias do mez de Junho de mil oito centos e cincoenta annos, falleceu \u003cem class=\"name\"\u003eJoão\u003c/em\u003e, menor, filho de \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e, moradores na Orta do Desembargador; e no dia seguinte foi encommendado segundo o rito, e sepultado no cimiterio dos Terceiros de São Francisco desta Cidade. Em fé do que fiz este termo, que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eJoão, a minor\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eOn the twenty-seventh day of the month of June of one thousand eight hundred and fifty, there died \u003cem class=\"name\"\u003eJoão\u003c/em\u003e, a minor, son of \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e, residents at the Horta do Desembargador; and on the following day he was commended according to the rite, and buried in the cemetery of the Third Order of Saint Francis of this City. In witness whereof I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Francisco Xavier Lopes Torres\u003c/span\u003e","details":[{"label":"Note","body":"\u003cstrong\u003eThis is not the João the family descends from.\u003c/strong\u003e This boy was Maria José's son and died in childhood. The family's João is Catarina's son and was born after July 1850 — a half-brother of this child. See the note at the foot of the page.","scope":"hunt"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/003/O10 — Santiago, Tavira, deaths 1826–1853 — \u003cstrong\u003efolio 127\u003c/strong\u003e, right-hand page"},"online":{"docId":"8442bc8ef6b54dac985c1af92216f368","image":"130","url":"https://digitarq.arquivos.pt/fileViewer/8442bc8ef6b54dac985c1af92216f368","note":"DigitArq — Santiago óbitos O10, image 130"},"localOnly":false,"embeddedImages":["maria_jose_1850/02_joao_child_death.jpg"],"imageCaptions":["The child João’s death entry"]},{"id":"1850-marriage-jose-viegas-leiria","year":"1850","kind":"Marriage","kindDetail":"10 July","title":"José Viegas Leiria and Catarina do Rosário","whenWhere":"10 July 1850 · Igreja Paroquial Matriz e Colegiada de Santiago, Tavira","principals":["jose-viegas-leiria-1820","catarina-do-rosario-1832"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","manoel-de-santa-ana","anna-maria","jose-correia-minhos","joanna-rita"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eJosé Viegas Leiria, V.\u003csup\u003eo\u003c/sup\u003e — Catharina do Rosario, Solteira\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eAos dez dias do mez de Julho de mil oito centos e cincoenta annos, nesta Igreja Parochial Matriz Collegiada de Sant Iago da Cidade de Tavira, na minha presença e das testemunhas abaixo assignadas \u003cem class=\"name\"\u003eFrancisco Rodrigues Milhomens\u003c/em\u003e e \u003cem class=\"name\"\u003eGiraldo Viegas Leiria\u003c/em\u003e desta mesma Cidade, se receberão por palavras de presente na forma do rito canonico e constituições deste Bispado do Algarve = \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, \u003cstrong\u003eviuvo que ficou de \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e\u003c/strong\u003e, sepultada no cemiterio dos Terceiros de São Francisco desta Cidade, e consta do respectivo termo. = E \u003cem class=\"name\"\u003eCatharina do Rosario\u003c/em\u003e, solteira, baptizada na Matriz de Santa Maria desta mesma Cidade, filha legitima de \u003cem class=\"name\"\u003eManoel de Sant'Anna\u003c/em\u003e e \u003cem class=\"name\"\u003eAnna Maria\u003c/em\u003e, moradora na Rua de São Sebastião; neta paterna de \u003cem class=\"name\"\u003eJosé Correia Minhós\u003c/em\u003e e \u003cem class=\"name\"\u003eJoanna Rita\u003c/em\u003e; e materna de \u003cem class=\"name\"\u003eJosé Rodrigues Matheos\u003c/em\u003e e \u003cem class=\"name\"\u003eCatharina das Chagas\u003c/em\u003e, todos naturaes desta Cidade. Porquanto corridos os banhos onde competia, e feitas as mais diligencias do estilo não lhes resultou impedimento Canonico que lhes obstasse o matrimonio que contrahirão, observadas as Leis do Reino, regulamentos, e Pastoraes em vigor. Em fé do que fiz este termo, que assignei, e as testemunhas dia, mez, e Era supra.\u003c/p\u003e\n        \u003csp
