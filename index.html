s a gap of \u003cstrong\u003e119 years\u003c/strong\u003e, and it changes what kind of thing the byname is.","scope":"family"},{"label":"It settles that the byname was inherited, not invented","body":"In 1688 \u003cem\u003eViegas Leria\u003c/em\u003e is already \u003cstrong\u003efused and carried by an ordinary parishioner\u003c/strong\u003e — no land, no title, nothing to distinguish him from his neighbours. A compound surname in that state is not newly coined; it has been handed down. So whatever Viegas–Leiria marriage produced it lies \u003cstrong\u003ewell before the surviving registers\u003c/strong\u003e, which fits the family tradition that the connection reaches back to a Leiria household holding land in the parish generations earlier.","scope":"family"},{"label":"And it rules out the priest","body":"One standing theory was that the family took the name from \u003cstrong\u003ePadre Custódio Martins Leyria\u003c/strong\u003e, prior of this parish. He is not active until 1716. The name is on this page \u003cstrong\u003etwenty-eight years before he appears\u003c/strong\u003e. That theory is dead.","scope":"family"},{"label":"Same book, same year as António","body":"António Viegas was baptised in this very volume on \u003cstrong\u003e19 April 1688\u003c/strong\u003e, ten leaves earlier. This entry is \u003cstrong\u003e28 November 1688\u003c/strong\u003e. Two Viegas households in one small parish in one year — one of them already carrying \u003cem\u003eLeria\u003c/em\u003e.","scope":"family"},{"label":"What is not established","body":"\u003cstrong\u003eNo relationship between Joze Viegas Leria and António's parents.\u003c/strong\u003e Kinship is likely and entirely unproven. Joze's own marriage and baptism, and his other children, are the obvious next targets — they should reach whatever ancestor the two households share. The wife's middle name reads \u003cem\u003eDianna\u003c/em\u003e or \u003cem\u003eJoanna\u003c/em\u003e and is not settled.","scope":"caution"}],"notes":"","archive":"Arquivo Nacional da Torre do Tombo — PT/TT/PRQ/PTVR04/001/B2, Santa Catarina da Fonte do Bispo baptisms 1688–1696","online":"","localOnly":true,"embeddedImages":[]},{"id":"1680-baptism-domingas-viegas","year":"1680","kind":"Baptism","kindDetail":"December","title":"Domingas, daughter of a Manoel Viegas of the Bengado","whenWhere":"Born 8 December 1680, baptised the 15th · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003eone of several Viegas households at one sítio\u003c/strong\u003e","principals":["domingas-viegas-1680"],"mentions":[],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eDomingas\u003c/em\u003e filha de \u003cstrong\u003e\u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e e de \u003cem class=\"name\"\u003eSebastianna Luis\u003c/em\u003e\u003c/strong\u003e, moradores no \u003cstrong\u003esitio de Bengado\u003c/strong\u003e desta freguezia de Santa Catherina da Fonte do Bispo. Nasceo em \u003cstrong\u003eouto de dezembro\u003c/strong\u003e de mil e seis Centos e oitenta annos. Foi baptizada nesta igreja parrochial de seus pais aos \u003cstrong\u003equinze\u003c/strong\u003e dias do mes de dezembro da dita era, por mim o P.e \u003cem class=\"name\"\u003eJoão Luis Nobre\u003c/em\u003e, Cura da meyma igreja. Foraõ padrinhos \u003cem class=\"name\"\u003eRodrigo Eanes\u003c/em\u003e e sua molher \u003cem class=\"name\"\u003eDomingas Dias\u003c/em\u003e, moradores no sitio da \u003cstrong\u003ePalhagueira\u003c/strong\u003e. E por verdade fis este termo em que me assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Cura João Luis Nobre\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eDomingas\u003c/em\u003e, daughter of \u003cstrong\u003e\u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eSebastianna Luis\u003c/em\u003e\u003c/strong\u003e, dwelling at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e in this parish of Santa Catarina da Fonte do Bispo. She was born on the \u003cstrong\u003eeighth of December 1680\u003c/strong\u003e. She was baptised in this parish church of her parents on the \u003cstrong\u003efifteenth\u003c/strong\u003e day of December of the said year, by me, Padre \u003cem class=\"name\"\u003eJoão Luis Nobre\u003c/em\u003e, priest-in-charge of the same church. The godparents were \u003cem class=\"name\"\u003eRodrigo Eanes\u003c/em\u003e and his wife \u003cem class=\"name\"\u003eDomingas Dias\u003c/em\u003e, dwelling at the sítio da \u003cstrong\u003ePalhagueira\u003c/strong\u003e. And in truth I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJoão Luis Nobre, priest-in-charge\u003c/span\u003e","details":[{"label":"Why this is not António's half-sister","body":"It looked like one. Manoel Viegas is here at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e, the same place where a Manoel Viegas and \u003cstrong\u003eMaria das Neves\u003c/strong\u003e baptise António in April 1688 — a remarriage would have made Domingas his half-sister. But a \u003cem\u003ethird\u003c/em\u003e Manoel Viegas appears at that same sítio in \u003cstrong\u003eApril 1690, with a wife Izabel Pires\u003c/strong\u003e. Three wives in ten years, each with a child, is not one man's life. \u003cstrong\u003eThe Bengado held several Manoel Viegas households\u003c/strong\u003e, and the name alone cannot join them.","scope":"caution"},{"label":"How it could be settled, and why it can't be yet","body":"A burial for Sebastianna Luis between December 1680 and April 1688 would prove the remarriage outright. The Santa Catarina burial registers to hand \u003cstrong\u003eopen around 1687\u003c/strong\u003e — after the window — and no earlier volume survives among the digitised books. Failing that, a child of Manoel and Sebastianna dated \u003cem\u003eafter\u003c/em\u003e 1688 would prove the opposite: two men.","scope":"caution"},{"label":"What this reading was worth checking for","body":"The wife's name in this entry had sat in the register at \u003cstrong\u003elow confidence, never enlarged\u003c/strong\u003e. It was re-read from the full page for this work and is confirmed as Sebastianna Luis — which is what creates the difficulty rather than removing it. It also rules out a tempting shortcut: a Manoel Viegas married to a \u003cem\u003eMaria das Neves\u003c/em\u003e appears in the neighbouring parish of Luz as \u003cstrong\u003eManoel de Leyria\u003c/strong\u003e, dead by 1692, with a daughter old enough to marry that year. That would have explained the family's byname and its Luz connection in one stroke — but a daughter marrying in 1692 cannot belong to a marriage that only began after 1682.","scope":"caution"},{"label":"What it does do for the family","body":"It removes an argument that had been quietly load-bearing. António's baptism was partly trusted because it showed “a Viegas household at a Viegas sítio” — which is far less telling once the sítio holds three of them. What still stands, and is what the identification really rests on, is that his entry is the \u003cstrong\u003eonly “António, son of a Viegas”\u003c/strong\u003e in either surviving Santa Catarina baptism book.","scope":"family"}],"notes":"","archive":"Arquivo Nacional da Torre do Tombo — PT/TT/PRQ/PTVR04/001/B1, Santa Catarina da Fonte do Bispo baptisms","online":"","localOnly":true,"embeddedImages":[]},{"id":"1694-burial-manoel-viegas","year":"1694","kind":"Burial","kindDetail":"September","title":"Manoel, child of António Viegas and Apolónia Gonsalves","whenWhere":"15 September 1694 · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003ethe record that moved António back a generation\u003c/strong\u003e","principals":["manoel-viegas-1694","antonio-viegas-leiria"],"mentions":["apolonia-gonsalves"],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003equinze dias do mes de 7\u003csup\u003ebro\u003c/sup\u003e\u003c/strong\u003e de seis Centos e \u003cstrong\u003enoventa e quatro\u003c/strong\u003e faleceo \u003cem class=\"name\"\u003eM.el\u003c/em\u003e, \u003cstrong\u003emenor\u003c/strong\u003e, \u003cstrong\u003ef.º de \u003cem class=\"name\"\u003eAnt.º Viegas\u003c/em\u003e e de sua molher \u003cem class=\"name\"\u003eAppollonia G.z\u003c/em\u003e\u003c/strong\u003e, do \u003cstrong\u003esitio das Cazas Altas\u003c/strong\u003e, e sepultou-se nesta Igr.ª de S.ta C.ᵃ da Fonte do B.\u003csup\u003epo\u003c/sup\u003e.\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003efifteenth day of September 1694\u003c/strong\u003e died \u003cem class=\"name\"\u003eManoel\u003c/em\u003e, \u003cstrong\u003ea minor\u003c/strong\u003e, \u003cstrong\u003eson of \u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e and of his wife \u003cem class=\"name\"\u003eApolónia Gonçalves\u003c/em\u003e\u003c/strong\u003e, of the \u003cstrong\u003esítio das Casas Altas\u003c/strong\u003e, and he was buried in this church of Santa Catarina da Fonte do Bispo.\u003c/p\u003e","details":[{"label":"Why this one record matters so much","body":"António's first marriage was known from exactly two documents, and \u003cstrong\u003eboth were written after it had ended\u003c/strong\u003e — his 1724 remarriage calling him Apolónia's \u003cem\u003ewidower\u003c/em\u003e, and their daughter Catharina's burial the same year. \u003cstrong\u003eThis is the marriage while it was still a household\u003c/strong\u003e, thirty years earlier, with a child of its own.","scope":"family"},{"label":"It moves António back a generation","body":"A baptism of April 1688 had been taken for António's own — the only “António, son of a Viegas” in either surviving Santa Catarina baptism book. \u003cstrong\u003eIt cannot be his.\u003c/strong\u003e A man burying a son in September 1694 was not baptised six years earlier. António was born around \u003cstrong\u003e1660–75\u003c/strong\u003e, which makes him roughly fifty when he remarried in 1724 and in his sixties or seventies when he died in 1734 — ordinary for a remarrying widower, where the 1688 reading made him improbably young.","scope":"family"},{"label":"And it settles a nagging inconsistency","body":"Catharina, the daughter of this marriage, is called \u003cem\u003ede maior idade\u003c/em\u003e — of full age — at her death in May 1724. Against a father born in 1688 that was barely possible and needed special pleading. With the marriage running from about 1690, she can be born in the 1690s and be a straightforward adult. \u003cstrong\u003eThe strain disappears.\u003c/strong\u003e","scope":"family"},{"label":"Where they were living","body":"The \u003cstrong\u003esítio das Casas Altas\u003c/strong\u003e in 1694, and the \u003cstrong\u003esítio da Luz\u003c/strong\u003e by 1724 — which is why both his marriage and his burial call him a parishioner of Nossa Senhora da Luz despite his life being recorded at Santa Catarina. The Casas Altas was itself a Viegas neighbourhood, with five separate Viegas households traceable there.","scope":"family"},{"label":"What is now open again","body":"\u003cstrong\u003eAntónio's parents are unknown.\u003c/strong\u003e His baptism should be looked for in the 1660s and 70s — and Santa Catarina's earliest surviving baptism register only opens in 1671, so it may predate the books altogether.","scope":"caution"}],"notes":"The only record of António's first marriage taken while it was still a household. It is also the record that moved him back a generation: a man burying a son in September 1694 cannot be the António baptised at the Bengado in April 1688.","archive":"Arquivo Nacional da Torre do Tombo — PT/TT/PRQ/PTVR04/003/O2, Santa Catarina da Fonte do Bispo burials","online":"","localOnly":true,"embeddedImages":[]},{"id":"1660-baptism-twins-maria-izabel","year":1660,"kind":"Baptism","kindDetail":"","title":"Maria and Izabel, twin daughters of Gaspar Fernandes and Maria das Neves","whenWhere":"19 August 1660 · Igreja de Nossa Senhora da Luz · \u003cstrong\u003eprobably António's mother, and the oldest record in this line\u003c/strong\u003e","archive":{"text":"Arquivo Distrital de Faro — PT/ADFAR/PRQ/TVR03/001/0002, Nossa Senhora da Luz, baptismos 1651–1689 — image 25, right page, first entry."},"online":{"docId":"b455e483f4f64188a66db055c7b0f65b","image":"25","url":"https://digitarq.arquivos.pt/fileViewer/b455e483f4f64188a66db055c7b0f65b","note":"Arquivo Distrital de Faro — Luz, baptisms 1651–1689."},"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003e19\u003c/strong\u003e dias do mes de \u003cstrong\u003eAgosto\u003c/strong\u003e de \u003cstrong\u003e1660\u003c/strong\u003e, eu o P.\u003csup\u003ee\u003c/sup\u003e Cura nesta igreja de Nossa Senhora da \u003cstrong\u003eLuz\u003c/strong\u003e, termo da cidade de Tavira, baptizei e pus os sanctos oleos a \u003cem class=\"name\"\u003eMaria\u003c/em\u003e e a \u003cem class=\"name\"\u003eIzabel\u003c/em\u003e, \u003cstrong\u003efilhas legitimas de \u003cem class=\"name\"\u003eGaspar F.\u003csup\u003ez\u003c/sup\u003e\u003c/em\u003e e de \u003cem class=\"name\"\u003eMaria dos Neves\u003c/em\u003e\u003c/strong\u003e. Foraõ compadres \u003cem class=\"name\"\u003eM.\u003csup\u003eel\u003c/sup\u003e Fr.\u003csup\u003eco\u003c/sup\u003e de Mello\u003c/em\u003e …\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003e19th\u003c/strong\u003e day of the month of \u003cstrong\u003eAugust\u003c/strong\u003e of \u003cstrong\u003e1660\u003c/strong\u003e, I the priest-in-charge in this church of Our Lady of the \u003cstrong\u003eLuz\u003c/strong\u003e, in the district of the city of Tavira, baptised and applied the holy oils to \u003cem class=\"name\"\u003eMaria\u003c/em\u003e and to \u003cem class=\"name\"\u003eIzabel\u003c/em\u003e, \u003cstrong\u003elegitimate daughters of \u003cem class=\"name\"\u003eGaspar Fernandes\u003c/em\u003e and of \u003cem class=\"name\"\u003eMaria das Neves\u003c/em\u003e\u003c/strong\u003e. The godparents were \u003cem class=\"name\"\u003eManoel Francisco de Mello\u003c/em\u003e …\u003c/p\u003e","notes":"\u003cp\u003eThe year is written as an arabic numeral, so it does not rest on reading a spelled-out word — the commonest source of error in these books.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThis entry was predicted before it was found.\u003c/strong\u003e Four Luz marriage entries (1674, 1674, 1684, 1691) show a \u003cem\u003eMaria das Neves\u003c/em\u003e marrying off children; a fifth, of 1661, calls her \u003cem\u003emolher de Gaspar Fernandes\u003c/em\u003e. That put her childbearing in the 1650s and 60s — inside this register, which opens in 1651 and names both parents every time. Bertolameu (1656) and Catherina (1658) turned up first; then the twins.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eIt is a candidate, not a proof.\u003c/strong\u003e Nothing yet links this Maria to a marriage with Manoel Viegas, to the Bengado, or to António — and her twin Izabel fits the same description.\u003c/p\u003e","principals":["maria-das-neves","izabel-das-neves-1660","gaspar-fernandes-luz","maria-das-neves-elder"],"mentions":[],"details":[],"embeddedImages":[],"localOnly":false},{"id":"1656-baptism-bertolameu-gaspar","year":1656,"kind":"Baptism","kindDetail":"","title":"Bertolameu, son of Gaspar Fernandes and Maria das Neves","whenWhere":"23 October 1656 · Igreja de Nossa Senhora da Luz · \u003cstrong\u003ethe entry that confirmed the family was there\u003c/strong\u003e","archive":{"text":"Arquivo Distrital de Faro — PT/ADFAR/PRQ/TVR03/001/0002, Nossa Senhora da Luz, baptismos 1651–1689 — image 15, right page, first entry."},"online":{"docId":"b455e483f4f64188a66db055c7b0f65b","image":"15","url":"https://digitarq.arquivos.pt/fileViewer/b455e483f4f64188a66db055c7b0f65b","note":"Arquivo Distrital de Faro — Luz, baptisms 1651–1689."},"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003evinte e tres\u003c/strong\u003e dias do mes de \u003cstrong\u003eOutubro\u003c/strong\u003e de seis Centos e \u003cstrong\u003esincoenta e seis\u003c/strong\u003e annos, baptizei e pus os santos oleos a \u003cem class=\"name\"\u003eBer[tolame]u\u003c/em\u003e, \u003cstrong\u003efilho legitimo de \u003cem class=\"name\"\u003eGaspar F.\u003csup\u003ez\u003c/sup\u003e\u003c/em\u003e e de sua molher \u003cem class=\"name\"\u003eMaria dos Neves\u003c/em\u003e\u003c/strong\u003e. Foi padrinho \u003cem class=\"name\"\u003eJo[ão] Alves\u003c/em\u003e …\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003etwenty-third\u003c/strong\u003e day of the month of \u003cstrong\u003eOctober\u003c/strong\u003e of six hundred and \u003cstrong\u003efifty-six\u003c/strong\u003e, I baptised and applied the holy oils to \u003cem class=\"name\"\u003eBertolameu\u003c/em\u003e, \u003cstrong\u003elegitimate son of \u003cem class=\"name\"\u003eGaspar Fernandes\u003c/em\u003e and of his wife \u003cem class=\"name\"\u003eMaria das Neves\u003c/em\u003e\u003c/strong\u003e. The godfather was \u003cem class=\"name\"\u003eJoão Alves\u003c/em\u003e …\u003c/p\u003e","notes":"\u003cp\u003eThe first child of this couple found in the register, and the entry that turned a reconstruction built from marriage records into a documented household.\u003c/p\u003e","principals":["bertolameu-fernandes-1656","gaspar-fernandes-luz","maria-das-neves-elder"],"mentions":[],"details":[],"embeddedImages":[],"localOnly":false},{"id":"1658-baptism-catherina-gaspar","year":1658,"kind":"Baptism","kindDetail":"","title":"Catherina, daughter of Gaspar Fernandes and Maria das Neves","whenWhere":"30 June 1658 · Igreja de Nossa Senhora da Luz","archive":{"text":"Arquivo Distrital de Faro — PT/ADFAR/PRQ/TVR03/001/0002, Nossa Senhora da Luz, baptismos 1651–1689 — image 19, left page, last entry."},"online":{"docId":"b455e483f4f64188a66db055c7b0f65b","image":"19","url":"https://digitarq.arquivos.pt/fileViewer/b455e483f4f64188a66db055c7b0f65b","note":"Arquivo Distrital de Faro — Luz, baptisms 1651–1689."},"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003etrinta\u003c/strong\u003e dias do mes de \u003cstrong\u003eJunho\u003c/strong\u003e de seis Centos e \u003cstrong\u003esincoenta e outo\u003c/strong\u003e, eu o P.\u003csup\u003ee\u003c/sup\u003e Cura desta igreja de Nossa Senhora da \u003cstrong\u003eLuz\u003c/strong\u003e, baptizei e pus os sanctos oleos a \u003cem class=\"name\"\u003eCatherina\u003c/em\u003e, \u003cstrong\u003efilha legitima de \u003cem class=\"name\"\u003eGaspar F.\u003csup\u003ez\u003c/sup\u003e\u003c/em\u003e e de sua molher \u003cem class=\"name\"\u003eMaria dos Neves\u003c/em\u003e\u003c/strong\u003e. Foraõ padrinhos \u003cem class=\"name\"\u003eMart[im] Affonso\u003c/em\u003e …\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003ethirtieth\u003c/strong\u003e day of the month of \u003cstrong\u003eJune\u003c/strong\u003e of six hundred and \u003cstrong\u003efifty-eight\u003c/strong\u003e, I the priest-in-charge of this church of Our Lady of the \u003cstrong\u003eLuz\u003c/strong\u003e baptised and applied the holy oils to \u003cem class=\"name\"\u003eCatherina\u003c/em\u003e, \u003cstrong\u003elegitimate daughter of \u003cem class=\"name\"\u003eGaspar Fernandes\u003c/em\u003e and of his wife \u003cem class=\"name\"\u003eMaria das Neves\u003c/em\u003e\u003c/strong\u003e. The godparents were \u003cem class=\"name\"\u003eMartim Affonso\u003c/em\u003e …\u003c/p\u003e","notes":"\u003cp\u003eThe first daughter of the household to be found. She may be the daughter who married at Luz in 1684.\u003c/p\u003e","principals":["catherina-fernandes-1658","gaspar-fernandes-luz","maria-das-neves-elder"],"mentions":[],"details":[],"embeddedImages":[],"localOnly":false},{"id":"1665-godparent-maria-das-neves","year":1665,"kind":"Baptism","kindDetail":"godparent mention","title":"“Maria das Neves, wife of Manoel Viegas” — the couple named together","whenWhere":"7 April 1665 · Igreja de Nossa Senhora da Luz · \u003cstrong\u003ethe only record of António's parents outside his own baptism\u003c/strong\u003e","archive":{"text":"Arquivo Distrital de Faro — PT/ADFAR/PRQ/TVR03/001/0002, Nossa Senhora da Luz, baptismos 1651–1689 — image 43, right page, last entry."},"online":{"docId":"b455e483f4f64188a66db055c7b0f65b","image":"43","url":"https://digitarq.arquivos.pt/fileViewer/b455e483f4f64188a66db055c7b0f65b","note":"Arquivo Distrital de Faro — Luz, baptisms 1651–1689."},"transcriptPt":"\u003cp\u003eEu o P.\u003csup\u003ee\u003c/sup\u003e \u003cem class=\"name\"\u003eMarcos da Cruz Velho\u003c/em\u003e, cura desta igreja de N.\u003csup\u003ea\u003c/sup\u003e S.\u003csup\u003era\u003c/sup\u003e da \u003cstrong\u003eLuz\u003c/strong\u003e, baptizei e pus os sanctos oleos a \u003cem class=\"name\"\u003eB[ertolame]u\u003c/em\u003e, filho legitimo de \u003cem class=\"name\"\u003eM.\u003csup\u003eel\u003c/sup\u003e F.\u003csup\u003ez\u003c/sup\u003e\u003c/em\u003e e de sua m.\u003csup\u003eer\u003c/sup\u003e \u003cem class=\"name\"\u003eIzabel Feijoa\u003c/em\u003e. Padrinhos \u003cem class=\"name\"\u003eM.\u003csup\u003eel\u003c/sup\u003e Machado\u003c/em\u003e e \u003cstrong\u003e\u003cem class=\"name\"\u003eM.\u003csup\u003ea\u003c/sup\u003e das Neves\u003c/em\u003e, m.\u003csup\u003eer\u003c/sup\u003e de \u003cem class=\"name\"\u003eM.\u003csup\u003eel\u003c/sup\u003e Vi&#8209;egas\u003c/em\u003e\u003c/strong\u003e.\u003c/p\u003e","transcriptEn":"\u003cp\u003eI, Padre \u003cem class=\"name\"\u003eMarcos da Cruz Velho\u003c/em\u003e, priest-in-charge of this church of Our Lady of the \u003cstrong\u003eLuz\u003c/strong\u003e, baptised and applied the holy oils to \u003cem class=\"name\"\u003eBertolameu\u003c/em\u003e, legitimate son of \u003cem class=\"name\"\u003eManoel Fernandes\u003c/em\u003e and of his wife \u003cem class=\"name\"\u003eIsabel Feijoa\u003c/em\u003e. The godparents were \u003cem class=\"name\"\u003eManoel Machado\u003c/em\u003e and \u003cstrong\u003e\u003cem class=\"name\"\u003eMaria das Neves\u003c/em\u003e, \u003cem\u003ewife of\u003c/em\u003e \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e\u003c/strong\u003e.\u003c/p\u003e","notes":"\u003cp\u003e\u003cem\u003eM.\u003csup\u003eer\u003c/sup\u003e\u003c/em\u003e — \u003cem\u003emolher\u003c/em\u003e, modern \u003cem\u003emulher\u003c/em\u003e — means \u003cstrong\u003ewife\u003c/strong\u003e, and these registers use it strictly, against \u003cem\u003eviuva\u003c/em\u003e for a widow and \u003cem\u003efilha\u003c/em\u003e for a daughter. So the marriage was live in April 1665, twenty-three years before their son António was baptised at the Bengado.\u003c/p\u003e\u003cp\u003eThe surname settles itself: the scribe ran out of room and \u003cstrong\u003esplit it across the line break — \u003cem\u003eVi-\u003c/em\u003e at the end of one line, \u003cem\u003eegas\u003c/em\u003e at the start of the next\u003c/strong\u003e. A word spelled out in two pieces cannot be a misread flourish, which matters in a district where \u003cem\u003eViegas\u003c/em\u003e, \u003cem\u003eVargas\u003c/em\u003e, \u003cem\u003eVargens\u003c/em\u003e and \u003cem\u003eGago\u003c/em\u003e are easy to confuse.\u003c/p\u003e\u003cp\u003eIt is the only place the couple appear together outside their son's baptism, and it is what forced an earlier candidate baptism for Maria to be set aside: the Maria baptised at Luz in August 1660 was four years old on this day.\u003c/p\u003e","principals":["maria-das-neves","manoel-viegas-bengado"],"mentions":[],"details":[],"embeddedImages":[],"localOnly":false}],"places":{"parishes":[{"code":"PTVR05","name":"Santa Maria do Castelo, Tavira","role":"urban parish"},{"code":"PTVR06","name":"Santiago, Tavira","role":"urban parish — and mother church of Santa Catarina and Santo Estêvão"},{"code":"PTVR07","name":"Santo Estêvão","role":"filial of Santiago"},{"code":"PTVR04","name":"Santa Catarina da Fonte do Bispo","role":"filial of Santiago — the family’s origin, 15 km inland"},{"code":"PTVR03","name":"Nossa Senhora da Luz","role":"neighbouring parish; holds a whole Viegas clan"},{"code":"PTVR02","name":"Conceição de Tavira","role":"no marriage series indexed"},{"code":"PTVR01","name":"Cachopo","role":"serra parish"}],"archives":[{"name":"Torre do Tombo","prefix":"PT/TT/PRQ/PTVR…","holds":"The older volumes.","url":"https://digitarq.arquivos.pt"},{"name":"Arquivo Distrital de Faro","prefix":"PT/ADFAR/PRQ/TVR…","holds":"The later volumes, including everything after 1849. Luz’s registers are here too — marriages from 1591, baptisms from 1599.","url":"https://digitarq.arquivos.pt"},{"name":"Registro Civil de Nerva","prefix":"—","holds":"Spanish civil registration from 1870. Certified copies via the Ministerio de Justicia.","url":"https://sede.mjusticia.gob.es"}],"books":[{"group":"Santiago — baptisms","volume":"B17","covers":"1802–1811","readState":"unread","detail":"Only six spreads (Sep–Dec 1810). \u003cstrong\u003e~194 unread.\u003c/strong\u003e"},{"group":"Santiago — baptisms","volume":"B18","covers":"1811–1815","readState":"read","detail":"\u003cstrong\u003eComplete.\u003c/strong\u003e Every spread, with image processing on the damaged stretches. No José."},{"group":"Santiago — baptisms","volume":"B19","covers":"1815–1820","readState":"unread","detail":"\u003cstrong\u003eRead continuously Jan 1817 – Jun 1820, plus spreads 1–32. This book yielded both Maria (fl. 90) and José (fl. 145).\u003c/strong\u003e Only spreads 150–154 (late 1820) remain unread."},{"group":"Santiago — baptisms","volume":"B20","covers":"1820–1825","readState":"unread","detail":"102 spreads, downloaded and unread. No longer needed for José; would hold any younger siblings."},{"group":"Santiago — baptisms","volume":"B21","covers":"1825–1835","readState":"partial","detail":"Downloaded; only the June 1832 window read. Would hold any youngest siblings."},{"group":"Santiago — baptisms","volume":"B22","covers":"1835–1845","readState":"partial","detail":"Downloaded; margins sampled only."},{"group":"Santiago — marriages & deaths","volume":"C8","covers":"1798–1822","readState":"read","detail":"Cleared May 1808 – Jan 1814. \u003cstrong\u003eFolio 116 yielded the 1811 Pereira marriage.\u003c/strong\u003e Spreads 71, 97 also read (both excluded). Spreads 1–70 and 72–96 started but \u003cem\u003enot\u003c/em\u003e cleared — the margin tags in this early section sit in the inner margins, near the gutter, which is not where the rest of the book puts them."},{"group":"Santiago — marriages & deaths","volume":"C9","covers":"1822–1849","readState":"read","detail":"Margins swept spreads 99–178 (≈1834–1847). \u003cstrong\u003eYielded the 1845 marriage.\u003c/strong\u003e Spreads 3–98 and 179–204 unread."},{"group":"Santiago — marriages & deaths","volume":"O10 (deaths)","covers":"1826–1853","readState":"read","detail":"Margins swept spreads 98–153 (1844–1853). \u003cstrong\u003eNo Domingos anywhere in it\u003c/strong\u003e — which is how we know he died later. Spreads 1–97 (1826–1844) unread, and that is where the grandparents' deaths would fall."},{"group":"Santiago — marriages & deaths","volume":"ADFAR vol. 17","covers":"1849–1859 marriages","readState":"read","detail":"\u003cstrong\u003eMargins swept end to end.\u003c/strong\u003e Yielded the 1850 marriage."},{"group":"Santiago — marriages & deaths","volume":"ADFAR vol. 18","covers":"1853–1859 deaths","readState":"read","detail":"\u003cstrong\u003eSwept.\u003c/strong\u003e Yielded Maria das Dores, 2 Apr 1855. No Domingos — so he died 1860 or later."},{"group":"Santiago — marriages & deaths","volume":"ADFAR vols. 19–39","covers":"1860–1880 deaths\u003cbr\u003e\u003cspan class=\"gap\"\u003eone volume per year\u003c/span\u003e","readState":"read","detail":"\u003cstrong\u003eSwept end to end — all 21 volumes, ~2,100 entries.\u003c/strong\u003e Yielded \u003cstrong\u003eGiraldo's death (1878)\u003c/strong\u003e and \u003cstrong\u003ethe child Francisco (1863)\u003c/strong\u003e. \u003cstrong\u003eNo Domingos.\u003c/strong\u003e Every adult margin \"Domingos\" was opened and read out. Combined with O10 and vol. 18, he is absent from Santiago's deaths for the whole of \u003cstrong\u003e1826–1880\u003c/strong\u003e, with no gap in the register to hide in."},{"group":"Santiago — marriages & deaths","volume":"ADFAR vol. 31","covers":"1846–1859 baptisms","readState":"unread","detail":"\u003cstrong\u003eJust downloaded, 300 images, unread.\u003c/strong\u003e Covers the gap between José and Catarina's 1850 marriage and João's 1861 birth."},{"group":"Santa Maria","volume":"B25","covers":"1808–1814 baptisms","readState":"partial","detail":"Births Jul 1812 – Jul 1813 only."},{"group":"Santa Maria","volume":"B30 / B31","covers":"1827–1840 baptisms","readState":"partial","detail":"Downloaded; June 1832 read — that's Catarina."},{"group":"Santa Maria","volume":"C12","covers":"1809–1819 marriages","readState":"read","detail":"\u003cstrong\u003eCleared 1809 – Jul 1812, page by page.\u003c/strong\u003e One entry survives unread: the blotted Viegas marriage of about Jan 1812 at spread 38. Note this book \u003cem\u003emixes baptisms into the marriage register\u003c/em\u003e — spread 4 is a baptism."},{"group":"Santa Maria","volume":"C15","covers":"1838–1849 marriages","readState":"partial","detail":"Sampled; yielded Giraldo's 1842 marriage. Early pages need image work."},{"group":"Santa Maria","volume":"ADFAR vols. 14–15","covers":"1847–1859 deaths","readState":"read","detail":"\u003cstrong\u003eSwept from April 1855 to the end of 1859.\u003c/strong\u003e No Domingos. The 1847–54 part is deliberately unread — he was alive in April 1855, so it cannot hold him. Note the \u003cstrong\u003e1855 cholera epidemic\u003c/strong\u003e: nearly every entry from about image 76 to 98 is annotated \u003cem\u003e\"Chol.\"\u003c/em\u003e"},{"group":"Santa Maria","volume":"ADFAR vols. 16–40","covers":"1860–1884 deaths\u003cbr\u003e\u003cspan class=\"gap\"\u003eone volume per year\u003c/span\u003e","readState":"read","detail":"\u003cstrong\u003eSwept end to end — 24 volumes, ~3,200 entries. No Domingos.\u003c/strong\u003e A large and entirely separate set of Viegas households lives here (a Manoel/José cluster, and a genteel \"Travassos Viegas\" line); none connects to Francisco Viegas and Francisca. \u003cstrong\u003e1879 and 1885 are missing from the catalogue altogether\u003c/strong\u003e — the only unread years left in either city parish."},{"group":"Neighbouring parishes","volume":"Luz B1 / B2","covers":"1802–1831 baptisms","readState":"partial","detail":"B1 read for 1808–Sep 1812. No Domingos Viegas as a father."},{"group":"Neighbouring parishes","volume":"Sta Catarina B12 / C6","covers":"1801–1820","readState":"unread","detail":"Downloaded, unread."},{"group":"Neighbouring parishes","volume":"Santo Estêvão","covers":"from 1614","readState":"unread","detail":"\u003cstrong\u003eExists\u003c/strong\u003e under the Faro district archive — not searched at all. Adjacent to Luz; its people appear constantly in the Tavira books."}],"notes":[{"title":"Santiago is a mother church, so a negative is weaker than it looks","body":"The registers themselves call both Santa Catarina da Fonte do Bispo and Santo Estêvão \u003cem\u003e“filial desta Matris”\u003c/em\u003e — a daughter church of Santiago. Events from either outlying parish can therefore be written into Santiago’s books. But the distinction still holds where it matters: the same entries write \u003cem\u003e“naturais desta Cidade”\u003c/em\u003e for city people and \u003cem\u003e“natural de [the filial]”\u003c/em\u003e for the others, sometimes in one sentence. \u003cstrong\u003eA filial is not “desta Cidade.”\u003c/strong\u003e"},{"title":"Match on parents, never on names","body":"There are at least \u003cstrong\u003eeleven different men named Domingos Viegas\u003c/strong\u003e in the two city parishes, several with wives of the same names as ours. The only safe test is the parents’ names. The most distinctive marker in this family is \u003cstrong\u003eRodrigo\u003c/strong\u003e — a rare given name."},{"title":"And “Leiria” does not save you","body":"The 1864 Santa Maria deaths record a daughter of \u003cstrong\u003ea different José Viegas Leiria\u003c/strong\u003e, living in the same parish at the same time as ours. The full three-word surname is not unique to this family. Two entries also show the surname descending from a non-Viegas father outright."},{"title":"Searching DigitArq","body":"Query the API with the \u003cem\u003ereference-code prefix\u003c/em\u003e — e.g. \u003ccode\u003ePT/ADFAR/PRQ/TVR06\u003c/code\u003e — and it returns the whole parish fonds with dates and document ids. Paged results contain duplicates and can silently omit volumes, so dedupe and then check the volume numbering for gaps."}]},"queue":[{"id":"q-01-the-blotted-marriage","num":"01","stakes":"Highest stakes · I cannot read it","level":"high","title":"The blotted marriage","whenWhere":"January 1812 (day illegible) · Igreja Matriz de Santa Maria do Castelo, Tavira · marriage register C12, spread 38","body":"\u003cp class=\"why\" style=\"border-left:3px solid var(--hot);background:var(--hot-bg);padding:14px 18px;border-radius:3px\"\u003e\u003cstrong\u003eSuperseded — read this first.\u003c/strong\u003e A baptism found since this page was written (\u003cstrong\u003eJoão, son of Domingos Viegas and Maria das Dores, 3 April 1808\u003c/strong\u003e) calls him a child \u003cem\u003e“do primeiro Matrimonio de ambos”\u003c/em\u003e. Their marriage therefore \u003cstrong\u003epredates April 1808\u003c/strong\u003e, and this January 1812 entry cannot be it. The item is kept because the page below is still unread and still a Viegas marriage — but it is \u003cstrong\u003eno longer the couple we are looking for\u003c/strong\u003e. The live search has moved to Santiago C8 before mid-1807 and to Santa Maria C11 (1799–1809).\u003c/p\u003e\n\n  \u003cp class=\"why\"\u003eThis was the last place in either Tavira city parish where the marriage of \u003cstrong\u003eDomingos Viegas and Maria das Dores\u003c/strong\u003e was thought to be hiding. Santiago's marriage book is cleared from May 1808 to January 1814. Santa Maria's is cleared from 1809 to July 1812. Every entry in that span has been read except this one — and this one is a Viegas marriage, in the right month, in the right parish, with an ink blot sitting exactly where the bride's parents should be.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-01.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe full spread. The entry in question is the lower one on the right-hand page. The left page is worse — it is not a separate problem, it is the same ink coming through from the other side of the leaf.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-02.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe entry, de-bleached and enlarged. This is the best the digitised copy gives at any setting I have tried — background subtraction, autocontrast, and several gain levels in between.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese — fragments only\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAos \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e dias do mez de Janeiro de mil oito centos e doze annos, nesta Igreja Matriz \u003cspan class=\"gap\"\u003e[e Colegiada de Santa Maria do Castello]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e em minha prezença e de \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e Lourenço \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, e de \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, testemunhas \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e abaixo assignados, se celebrarão \u003cspan class=\"gap\"\u003e[o Santo Sacramento do]\u003c/span\u003e Matrimonio por palavras do prezente \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003eViegas\u003c/em\u003e, \u003cspan class=\"gap\"\u003e[filho de]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e naturaes desta Cidade \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e de Jesus \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish — fragments only\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e day of the month of January of one thousand eight hundred and twelve, in this Matriz Church \u003cspan class=\"gap\"\u003e[and Collegiate of Santa Maria do Castelo]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e in my presence and that of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e Lourenço \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, and of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, witnesses \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e undersigned, was celebrated \u003cspan class=\"gap\"\u003e[the Holy Sacrament of]\u003c/span\u003e Matrimony by words of the present \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003eViegas\u003c/em\u003e, \u003cspan class=\"gap\"\u003e[son of]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e natives of this City \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e de Jesus \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003eThe groom's surname is \u003cstrong\u003eViegas\u003c/strong\u003e — I am confident of that much. \u003cstrong\u003eIs his given name recoverable?\u003c/strong\u003e If it is \u003cem\u003eDomingos\u003c/em\u003e, everything else follows.\u003c/li\u003e\n      \u003cli\u003eDoes the groom's father read \u003cstrong\u003eFrancisco Viegas\u003c/strong\u003e? I think I see something like \u003cem\u003eJosé Fran.\u003csup\u003eco\u003c/sup\u003e\u003c/em\u003e on that line, which would rule him out — but I do not trust my own reading here.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eIs the word \u003cem\u003eRodrigo\u003c/em\u003e anywhere on this entry?\u003c/strong\u003e It is the rarest name in our family and the single fastest test. If it appears, this is our marriage.\u003c/li\u003e\n      \u003cli\u003eThe trailing \u003cem\u003ede Jesus\u003c/em\u003e — is it attached to a bride, or to a witness?\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cp class=\"verdict\"\u003e\u003cstrong\u003eMy honest position:\u003c/strong\u003e I cannot read this and I do not think more image processing will change that. The blot is physical damage to the paper, not a scanning problem. If it matters enough, the way to settle it is the original volume at the Arquivo Distrital de Faro.\u003c/p\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR05/002/C12 — Santa Maria, Tavira, marriages 1809–1819 — spread 38, right page, lower entry\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/e58d14e8c013436ba03e5354445221ff\u003c/code\u003e — image 38\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","images":[{"file":"queue/img-01.jpeg","alt":"Full page spread of the Santa Maria marriage register, spread 38, with dense overwritten script and heavy ink bleed"},{"file":"queue/img-02.jpeg","alt":"Close crop of the blotted marriage entry, with a large ink blot obscuring several words"}],"superseded":true,"done":false},{"id":"q-02-the-1811-pereira-marriage","num":"02","stakes":"High stakes · confident, but please check","level":"high","title":"The 1811 Pereira marriage","whenWhere":"3 June 1811 · Igreja Matriz e Colegiada de Santiago, Tavira · marriage register C8, spread 118, folio 116","body":"\u003cp class=\"why\"\u003eThis is the marriage of \u003cstrong\u003eFrancisco José Pereira\u003c/strong\u003e — Maria das Dores's brother. It had been sitting in our notes for three sessions as nothing but a date. Reading it gives us a whole generation we did not have, and it answers the question of which parish this family belonged to. Because so much now rests on four names in one line of cursive, I would like them read cold by someone else.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-03.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe full spread. Our entry is the middle one on the right-hand page, tagged in the margin \u003cem\u003eFran.\u003csup\u003eco\u003c/sup\u003e José P.\u003csup\u003era\u003c/sup\u003e / M.\u003csup\u003ea\u003c/sup\u003e de S.\u003csup\u003eta\u003c/sup\u003e Anna\u003c/em\u003e.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-04.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eOpening: the date, the church, and the two witnesses — both retired majors.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-05.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003e\u003cstrong\u003eThe important lines.\u003c/strong\u003e Groom, parents, then both sets of grandparents. Read this one before you read my column.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAos tres dias, do mes de Junho de mil oito centos e onze annos, nesta Igreja Matriz e Colegiada de Santiago de Tavira, em minha prezença e do Manjor Reformado \u003cem class=\"name\"\u003eAntonio Paullas Soarez\u003c/em\u003e, e do Manjor Reformado \u003cem class=\"name\"\u003eJoaquim Jose de Mattos\u003c/em\u003e, testemunhas prezentes, com mais abaixo assignados, se celebrarão o Sacramento do Matrimonio por palavras do prezente, segundo Ordena o Sagrado Concillio Tredentino e Constituições deste Bispado = \u003cem class=\"name\"\u003eFrancisco Jose Pereira\u003c/em\u003e, Solteiro, filho de \u003cem class=\"name\"\u003eRodrigo Jose Pereira\u003c/em\u003e, Serrador, e de \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, naturais desta Freguezia; neto paterno de \u003cem class=\"name\"\u003eJose dos Santos\u003c/em\u003e e de \u003cem class=\"name\"\u003eAnna Cabrita\u003c/em\u003e; neto Materno de \u003cem class=\"name\"\u003eJose Rodrigues\u003c/em\u003e, e de \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, todos naturais desta Cidade = com \u003cem class=\"name\"\u003eMaria de Santa Anna\u003c/em\u003e, viuva de \u003cem class=\"name\"\u003eAntonio da Costa Pereira\u003c/em\u003e, naturais desta Cidade. De que tudo fis em virtude de hum mandado que me foi aprezentado da Camara Ecleziastica deste Bispado, registado a folhas sesenta e nove, do que fis este assento, que assignei com as sobreditas testemunhas, dia, mes e Era, ut supra.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the third day of the month of June of one thousand eight hundred and eleven, in this Matriz and Collegiate Church of Santiago de Tavira, in my presence and that of the Retired Major \u003cem class=\"name\"\u003eAntónio Paulas Soares\u003c/em\u003e and the Retired Major \u003cem class=\"name\"\u003eJoaquim José de Matos\u003c/em\u003e, witnesses present, together with those undersigned below, was celebrated the Sacrament of Matrimony by words of the present, according as the Sacred Council of Trent and the Constitutions of this Bishopric ordain = \u003cem class=\"name\"\u003eFrancisco José Pereira\u003c/em\u003e, bachelor, son of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, \u003cstrong\u003esawyer\u003c/strong\u003e, and of \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, natives \u003cstrong\u003eof this parish\u003c/strong\u003e; paternal grandson of \u003cem class=\"name\"\u003eJosé dos Santos\u003c/em\u003e and of \u003cem class=\"name\"\u003eAna Cabrita\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eJosé Rodrigues\u003c/em\u003e and of \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, all natives of this City = with \u003cem class=\"name\"\u003eMaria de Santa Ana\u003c/em\u003e, widow of \u003cem class=\"name\"\u003eAntónio da Costa Pereira\u003c/em\u003e, natives of this City. All of which was done by virtue of a warrant presented to me from the Ecclesiastical Chamber of this Bishopric, registered at folio sixty-nine. Whereof I made this entry, which I signed with the aforesaid witnesses, on the day, month and year as above.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eThe four grandparent names.\u003c/strong\u003e I read \u003cem\u003eJosé dos Santos\u003c/em\u003e, \u003cem\u003eAnna Cabrita\u003c/em\u003e, \u003cem\u003eJosé Rodrigues\u003c/em\u003e, \u003cem\u003eMargarida da Conceição\u003c/em\u003e. These are new great-great-great-grandparents, so they are worth a slow second look.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003e“naturais desta Freguezia.”\u003c/strong\u003e This is the load-bearing phrase — \u003cem\u003eof this parish\u003c/em\u003e, meaning Santiago, not merely \u003cem\u003eof this City\u003c/em\u003e. It is the first positive evidence that Maria das Dores's family were Santiago people rather than Santa Maria people, and it redirects the whole search. Does it say what I think it says?\u003c/li\u003e\n      \u003cli\u003eRodrigo's trade: I read \u003cstrong\u003eSerrador\u003c/strong\u003e, a sawyer. Could it be \u003cem\u003eLavrador\u003c/em\u003e?\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cp class=\"verdict\"\u003e\u003cstrong\u003eThe one soft joint:\u003c/strong\u003e Francisco José Pereira is Maria das Dores's brother because his parents are named as \u003cem\u003eRodrigo José Pereira and Ignes de Jesus\u003c/em\u003e — exactly hers, from four separate baptism entries. That pair is rare. But it is still a name match, not a document that says “brother.” A baptism naming both children would close it, and finding it is the same search as finding hers.\u003c/p\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — \u003cstrong\u003efolio 116\u003c/strong\u003e, right page, middle entry\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 118\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","images":[{"file":"queue/img-03.jpeg","alt":"Full spread of the Santiago marriage register at folio 116, four entries visible"},{"file":"queue/img-04.jpeg","alt":"Close crop of the opening lines of the 3 June 1811 marriage entry"},{"file":"queue/img-05.jpeg","alt":"Close crop of the lines naming the groom, his parents and his four grandparents"}],"superseded":false,"done":false},{"id":"q-03-another-domingos-viegas-this-one-from-sa","num":"03","stakes":"Medium · a decoy to nail shut","level":"","title":"Another Domingos Viegas, this one from Santa Bárbara","whenWhere":"About 1805 · Igreja Matriz e Colegiada de Santiago, Tavira · marriage register C8, spread 71","body":"\u003cp class=\"why\"\u003eEleven distinct men named Domingos Viegas have turned up in these registers so far, and each one costs time until it is excluded. Here is a twelfth, from a Viegas family at \u003cstrong\u003eSanta Bárbara de Nexe\u003c/strong\u003e, outside Faro — the same village that produced the \u003cem\u003eAntonio Viegas\u003c/em\u003e and \u003cem\u003eManoel Viegas\u003c/em\u003e we logged earlier in this book. I read him as excluded. I would rather have that confirmed than assumed.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-06.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe entry, de-bleached. Legible throughout, which is what makes it a good exclusion test.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003e\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e se celebrarão o Sacramento do Matrimonio por palavras de prezente, segundo ordena o Sagrado Concilio Tridentino, e Constituição deste Bispado; \u003cem class=\"name\"\u003eJosé de Jesus\u003c/em\u003e, Viuvo de \u003cem class=\"name\"\u003eCatharina Maria\u003c/em\u003e, natural desta Freguezia, com \u003cem class=\"name\"\u003eAnna de Jesus\u003c/em\u003e, Solteira, natural da Freguezia de Santa Barbara, termo de Faro, filha de \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eBarbara Joaquina\u003c/em\u003e, neta paterna de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eBarbara Martins\u003c/em\u003e, neta materna de \u003cem class=\"name\"\u003eAntonio Fernandes\u003c/em\u003e, todos naturais da sobredita Freguezia de Santa Barbara; aos quais dei as bençãos nupciais, tudo em virtude de hum Mandado que me foi aprezentado da Camara Ecclesiastica deste Bispado, registado a folhas setenta, e duas; de que fis este assento, que com as sobreditas testemunhas assignei, dia \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003e\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e was celebrated the Sacrament of Matrimony by words of the present, according as the Sacred Council of Trent and the Constitution of this Bishopric ordain; \u003cem class=\"name\"\u003eJosé de Jesus\u003c/em\u003e, widower of \u003cem class=\"name\"\u003eCatarina Maria\u003c/em\u003e, native of this parish, with \u003cem class=\"name\"\u003eAna de Jesus\u003c/em\u003e, spinster, native of the parish of \u003cstrong\u003eSanta Bárbara, in the district of Faro\u003c/strong\u003e, daughter of \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eBárbara Joaquina\u003c/em\u003e; paternal granddaughter of \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eBárbara Martins\u003c/em\u003e; maternal granddaughter of \u003cem class=\"name\"\u003eAntónio Fernandes\u003c/em\u003e; \u003cstrong\u003eall natives of the aforesaid parish of Santa Bárbara\u003c/strong\u003e. To whom I gave the nuptial blessings, all by virtue of a Warrant presented to me from the Ecclesiastical Chamber of this Bishopric, registered at folio seventy-two. Whereof I made this entry, which I signed with the aforesaid witnesses, on the day \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003eConfirm the exclusion. Our Domingos's family is always written \u003cem\u003enaturais desta Cidade\u003c/em\u003e. This one is \u003cem\u003etodos naturais da sobredita Freguezia de Santa Barbara\u003c/em\u003e — a different place, thirty kilometres west. \u003cstrong\u003eDoes that phrase really cover the grandparents, or only the bride?\u003c/strong\u003e That is the whole exclusion.\u003c/li\u003e\n      \u003cli\u003eA thought worth someone else's judgement: this Domingos Viegas has a son \u003cem\u003eManoel Viegas\u003c/em\u003e, and we logged a \u003cem\u003eManoel Viegas of Santa Bárbara\u003c/em\u003e as a grandparent elsewhere in this same book. They are probably the same man. If so, Santa Bárbara has its own Viegas dynasty and every Viegas from there can be set aside in one go.\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — spread 71, left page\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 71\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","images":[{"file":"queue/img-06.jpeg","alt":"Close crop of a marriage entry naming Manoel Viegas and Domingos Viegas of Santa Bárbara"}],"superseded":false,"done":false},{"id":"q-04-matheos-pereira-s-marriage","num":"04","stakes":"Medium · a Pereira, but probably not ours","level":"","title":"Matheos Pereira's marriage","whenWhere":"1 May 1808 · Igreja Matriz e Colegiada de Santiago, Tavira · marriage register C8, spread 97","body":"\u003cp class=\"why\"\u003ePereira is the surname on Maria das Dores's side, and this marriage sits three years before her brother's in the same book. It is close enough to be worth a look and far enough from our known names that I read it as a different family — but the Pereira line is the one we know least about, so a second opinion is cheap here.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-07.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eOpening: 1 May 1808, Santiago, with the witnesses.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-08.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe parties, their parents and their grandparents.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAo primeiro dia do mez de Maio de mil oito centos e oito annos, nesta Igreja Matriz e Colegiada de Santiago de Tavira, em minha prezença e de \u003cem class=\"name\"\u003eLourenço Martins Ramos\u003c/em\u003e, e de \u003cem class=\"name\"\u003eManoel José Ga\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/em\u003e, testemunhas, no fim deste, commigo abaixo assignadas, se celebrarão o Santo Sacramento do Matrimonio por palavras do prezente, segundo ordena o Sagrado Concillio Tridentino, e Constituições deste Bispado. \u003cem class=\"name\"\u003eMatheos Pereira\u003c/em\u003e, Solteiro, filho de \u003cem class=\"name\"\u003eJosé Pereira\u003c/em\u003e, e de \u003cem class=\"name\"\u003eAndreza da Conceição\u003c/em\u003e, neto Paterno de \u003cem class=\"name\"\u003eDomingos Pereira Brabo\u003c/em\u003e, e de \u003cem class=\"name\"\u003eDomingas Martins\u003c/em\u003e, neto Materno de \u003cem class=\"name\"\u003eClemente Correia\u003c/em\u003e e de \u003cem class=\"name\"\u003eAnna da Graça\u003c/em\u003e, naturais de Santo Estevam; com \u003cem class=\"name\"\u003eRitta do Carmo\u003c/em\u003e, Solteira, natural desta Freguezia, filha de \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e, natural de Moncarapacho, e de \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e da Freguezia da Luz; neta Paterna de \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e e \u003cem class=\"name\"\u003eFelicia da \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e\u003c/em\u003e, naturais de Moncarapacho; neta Materna de \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003ede Almeida\u003c/em\u003e e de \u003cem class=\"name\"\u003eMargarida José\u003c/em\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the first day of the month of May of one thousand eight hundred and eight, in this Matriz and Collegiate Church of Santiago de Tavira, in my presence and that of \u003cem class=\"name\"\u003eLourenço Martins Ramos\u003c/em\u003e and of \u003cem class=\"name\"\u003eManoel José Ga\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/em\u003e, witnesses, undersigned with me at the foot of this, was celebrated the Holy Sacrament of Matrimony by words of the present, according as the Sacred Council of Trent and the Constitutions of this Bishopric ordain. \u003cem class=\"name\"\u003eMateus Pereira\u003c/em\u003e, bachelor, son of \u003cem class=\"name\"\u003eJosé Pereira\u003c/em\u003e and of \u003cem class=\"name\"\u003eAndreza da Conceição\u003c/em\u003e; paternal grandson of \u003cem class=\"name\"\u003eDomingos Pereira Brabo\u003c/em\u003e and of \u003cem class=\"name\"\u003eDomingas Martins\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eClemente Correia\u003c/em\u003e and of \u003cem class=\"name\"\u003eAna da Graça\u003c/em\u003e, natives of \u003cstrong\u003eSanto Estêvão\u003c/strong\u003e; with \u003cem class=\"name\"\u003eRita do Carmo\u003c/em\u003e, spinster, native of this parish, daughter of \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e, native of Moncarapacho, and of \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e of the parish of Luz; paternal granddaughter of \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e and \u003cem class=\"name\"\u003eFelícia da \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e\u003c/em\u003e, natives of Moncarapacho; maternal granddaughter of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003ede Almeida\u003c/em\u003e and of \u003cem class=\"name\"\u003eMargarida José\u003c/em\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eDomingas or Domingos Martins?\u003c/strong\u003e The scribe writes what looks like \u003cem\u003eDomingos Martins\u003c/em\u003e in a slot that must hold a woman — the paternal grandmother. I have read it as \u003cem\u003eDomingas\u003c/em\u003e, the feminine form. If it really is \u003cem\u003eDomingos\u003c/em\u003e, the scribe made an error and this entry is less reliable than it looks.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eCould this José Pereira be Rodrigo José Pereira's brother?\u003c/strong\u003e That is the only way this family touches ours. Rodrigo's parents were José dos Santos and Anna Cabrita (item 2); this Matheos's grandparents are Domingos Pereira Brabo and Domingas Martins, of Santo Estêvão. Different names, different parish — so my answer is no. Sanity-check me.\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — spread 97, right page\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 97\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","images":[{"file":"queue/img-07.jpeg","alt":"Close crop of the opening lines of the 1 May 1808 marriage entry"},{"file":"queue/img-08.jpeg","alt":"Close crop of the lines naming the bride and groom and their parents and grandparents"}],"superseded":false,"done":false},{"id":"q-05-a-jose-viegas-dies-in-1847","num":"05","stakes":"Lower stakes · two words short of an answer","level":"","title":"A José Viegas dies in 1847","whenWhere":"Died 11 November 1847 · buried in the public cemetery of Tavira · Santiago death register O10, folio 114","body":"\u003cp class=\"why\"\u003eOur José Viegas Leiria was alive in 1847 — he married Catarina do Rosário in 1850 — so this is not him. But a married José Viegas dying in Santiago in the same decade is plausibly a relative, and the entry names his wife and where they lived. Those are the two things I cannot read. If the wife's name is one we already know, this man joins the tree.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-09.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe entry, enlarged. The margin tag \u003cem\u003eJosé Viegas / Caz.\u003c/em\u003e is clear; the wife's name on the second line is not.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-10.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe whole page, for context — November 1847, all in the hand of Prior Francisco Xavier Lopes Torres, who signed most of our family's records including Maria das Dores's death.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAos onze dias do mez de Novembro de mil oito centos quarenta e sete annos, faleceo \u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e, cazado que foi com \u003cem class=\"name\"\u003e\u003cspan class=\"gap\"\u003e[?? Duarte ??]\u003c/span\u003e\u003c/em\u003e, sendo moradores no sitio do \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e; recebeo os Sacramentos do Costume, mas não fez testamento; e no dia seguinte foi encomendado segundo o rito, e sepultado no cemiterio publico desta Cidade. Em fé do que fis este termo, que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the eleventh day of the month of November of one thousand eight hundred and forty-seven died \u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e, who was married to \u003cem class=\"name\"\u003e\u003cspan class=\"gap\"\u003e[?? Duarte ??]\u003c/span\u003e\u003c/em\u003e, they being residents at the place of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e. He received the customary Sacraments but made no will; and on the following day he was commended according to the rite and buried in the public cemetery of this City. In witness whereof I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Francisco Xavier Lopes Torres\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eThe wife's name.\u003c/strong\u003e Two words on the second line. I think the second is \u003cem\u003eDuarte\u003c/em\u003e and I cannot get the first at all.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eThe place.\u003c/strong\u003e \u003cem\u003e“moradores no sitio do …”\u003c/em\u003e — our family lived at \u003cem\u003eOrtas d'Atalaia\u003c/em\u003e and later \u003cem\u003eRua de São Sebastião\u003c/em\u003e. If this reads as either, he is close kin.\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/003/O10 — Santiago, Tavira, deaths 1826–1853 — \u003cstrong\u003efolio 114\u003c/strong\u003e, right page, third entry\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/8442bc8ef6b54dac985c1af92216f368\u003c/code\u003e — image 114\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","images":[{"file":"queue/img-09.jpeg","alt":"Close crop of a death entry with the margin tag José Viegas, cazado"},{"file":"queue/img-10.jpeg","alt":"Full right-hand page of the death register showing six entries from November 1847"}],"superseded":false,"done":false},{"id":"q-06-francisco-viegas-s-em-other-em-wife","num":"06","stakes":"High stakes · live candidate","level":"high","title":"Francisco Viegas’s \u003cem\u003eother\u003c/em\u003e wife","whenWhere":"24 August 1805 · Ermida de Nossa Senhora da Consolação, then serving as the Matriz of Santiago · marriage register C8, folio 62","body":"\u003cp class=\"why\"\u003eDomingos’s parents are fixed beyond argument as \u003cstrong\u003eFrancisco Viegas and Francisca de Jesus\u003c/strong\u003e — both of João’s 1808 baptism and Rodrigo’s 1816 one name them, word for word. This 1805 marriage names the bride’s paternal grandparents as \u003cstrong\u003eFrancisco Viegas and \u003cem\u003eBarbara\u003c/em\u003e de Jesus\u003c/strong\u003e, all “desta Cidade”. If that is the same Francisco, then \u003cstrong\u003eHenrique Viegas is a brother or half-brother of Domingos\u003c/strong\u003e and we have gained a whole sibling line in the generation above. If it is a different Francisco, it is a decoy that will fool the next person who searches on the name.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e[[IMG:queue/img-11.jpeg]]\u003c/div\u003e\n    \u003cfigcaption\u003eThe filiation clause, enlarged. The line that matters is the second from the bottom: \u003cem\u003e“Neta Paterna de Francisco Viegas e Barbara de Jesus”\u003c/em\u003e.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eWhat I read on the page\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003e…\u003cspan class=\"name\"\u003eJozé Antonio\u003c/span\u003e Solteiro filho de \u003cspan class=\"name\"\u003eJozé da Palma\u003c/span\u003e e \u003cspan class=\"name\"\u003eMaria do Espirito Santo\u003c/span\u003e, neto Paterno de \u003cspan class=\"name\"\u003eJacinto da Palma\u003c/span\u003e e \u003cspan class=\"name\"\u003eAntonia Maria\u003c/span\u003e, este dalidade e aquela da Luz; neto Materno de \u003cspan class=\"name\"\u003eAntonio Rodrigues Cavaleiro\u003c/span\u003e e \u003cspan class=\"name\"\u003eIzabel da Conceição\u003c/span\u003e da Luz; com \u003cspan class=\"name\"\u003eMaria da Graça\u003c/span\u003e Solteira filha de \u003cspan class=\"name\"\u003eHenrique Viegas\u003c/span\u003e e \u003cspan class=\"name\"\u003eSebastiana da Graça\u003c/span\u003e. \u003cstrong\u003eNeta Paterna de \u003cspan class=\"name\"\u003eFrancisco Viegas\u003c/span\u003e e \u003cspan class=\"name\"\u003eBarbara de Jesus\u003c/span\u003e\u003c/strong\u003e, neta Materna de \u003cspan class=\"name\"\u003eJozé Rodrigues\u003c/span\u003e e \u003cspan class=\"name\"\u003eFrancisca Gomes\u003c/span\u003e, todos desta Cidade…\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eIn English\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003e…\u003cspan class=\"name\"\u003eJosé Antonio\u003c/span\u003e, bachelor, son of \u003cspan class=\"name\"\u003eJosé da Palma\u003c/span\u003e and \u003cspan class=\"name\"\u003eMaria do Espírito Santo\u003c/span\u003e — paternal grandson of \u003cspan class=\"name\"\u003eJacinto da Palma\u003c/span\u003e and \u003cspan class=\"name\"\u003eAntonia Maria\u003c/span\u003e, he of this city and she of Luz; maternal grandson of \u003cspan class=\"name\"\u003eAntonio Rodrigues Cavaleiro\u003c/span\u003e and \u003cspan class=\"name\"\u003eIzabel da Conceição\u003c/span\u003e of Luz — with \u003cspan class=\"name\"\u003eMaria da Graça\u003c/span\u003e, spinster, daughter of \u003cspan class=\"name\"\u003eHenrique Viegas\u003c/span\u003e and \u003cspan class=\"name\"\u003eSebastiana da Graça\u003c/span\u003e. \u003cstrong\u003ePaternal granddaughter of \u003cspan class=\"name\"\u003eFrancisco Viegas\u003c/span\u003e and \u003cspan class=\"name\"\u003eBarbara de Jesus\u003c/span\u003e\u003c/strong\u003e; maternal granddaughter of \u003cspan class=\"name\"\u003eJosé Rodrigues\u003c/span\u003e and \u003cspan class=\"name\"\u003eFrancisca Gomes\u003c/span\u003e — all natives of this city.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need answered\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eIs it \u003cem\u003eBarbara\u003c/em\u003e?\u003c/strong\u003e That is the whole question. Read the word cold before you read my column. Our Francisco’s wife is written \u003cem\u003eFrancisca de Jesus\u003c/em\u003e, \u003cem\u003eFrancisca Maria\u003c/em\u003e and \u003cem\u003eFrancisca da Conceição\u003c/em\u003e across five records — the \u003cem\u003esecond\u003c/em\u003e element varies, the first never has. “Barbara” would be a change of the first element, which is a different kind of variation and argues for a different woman.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eDoes it say \u003cem\u003eViegas\u003c/em\u003e or something else?\u003c/strong\u003e The surname travels sideways in this family: elsewhere in this same book a man recorded as “José Viegas” has a father surnamed \u003cem\u003eFernandes\u003c/em\u003e and takes Viegas from his maternal grandfather.\u003c/li\u003e\n      \u003cli\u003eAnything readable about \u003cstrong\u003eHenrique Viegas\u003c/strong\u003e himself — a trade, an age, a residence.\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cp class=\"verdict\"\u003e\u003cstrong\u003eMy reading:\u003c/strong\u003e the word is \u003cem\u003eBarbara\u003c/em\u003e — that much is not really in doubt. What is open is what it \u003cem\u003emeans\u003c/em\u003e. It could be a second marriage of the same Francisco, a scribe reaching for the wrong given name, or a different man entirely. \u003cstrong\u003eThis stays live.\u003c/strong\u003e Every remaining candidate for Domingos’s marriage is now a low-probability one, and this is no less likely than the others; it should not be discounted harder just because a single word is against it. If the C8 and C11 sweeps come up empty, this rises rather than falls — and at that point the way to judge it is other evidence about Henrique Viegas, not another look at this word.\u003c/p\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\n    \u003cdl\u003e\n      \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003eArquivo Nacional da Torre do Tombo — \u003ccode\u003ePT/TT/PRQ/PTVR06/002/C8\u003c/code\u003e, Santiago de Tavira marriages 1798–1822\u003c/dd\u003e\n      \u003cdt\u003eImage\u003c/dt\u003e\u003cdd\u003espread 63, folio 62, right-hand page, first entry\u003c/dd\u003e\n      \u003cdt\u003eFiles\u003c/dt\u003e\n      \u003cdt\u003eFound\u003c/dt\u003e\u003cdd\u003ewhile sweeping C8 backwards for the marriage of Domingos Viegas and Maria das Dores, which the 1808 baptism proved must predate April 1808\u003c/dd\u003e\n    \u003c/dl\u003e\n  \u003c/div\u003e","images":[{"file":"queue/img-11.jpeg","alt":"Santiago marriage register C8, folio 62, the entry of 24 August 1805, enlarged"}],"superseded":false,"done":false}],"todos":[{"id":"t-star-domingos-s-army-service-record-the-one-docum","rank":"★","title":"Domingos's army service record — the one document that could answer four questions at once","status":"open","source":"tavira","body":"\u003cp\u003eTwo of his children's baptisms name his unit: \u003cb\u003e\"Soldado do Regimento número quatro\"\u003c/b\u003e (Aug 1813) and \u003cb\u003e\"Soldado do Regimento desta Praça\"\u003c/b\u003e (Mar 1816). \u003cb\u003eRegimento de Infantaria nº 4 was the Algarve's own line regiment, seated at Faro.\u003c/b\u003e\u003c/p\u003e\n    \u003cp\u003eA Portuguese \u003cem\u003eassentamento de praça\u003c/em\u003e records \u003cb\u003eboth parents' names, the parish of birth, the age, the trade before enlistment, and where and when the man enlisted\u003c/b\u003e. That single entry would give us Francisca's \u003cem\u003efull\u003c/em\u003e name, settle Santiago versus Santa Maria outright, pin Domingos's birth to a year instead of a decade, and show whether \u003cem\u003eLeiria\u003c/em\u003e was already attached to him in the 1810s. Nothing in the parish registers does all four.\u003c/p\u003e\n    \u003cp\u003e\u003cb\u003eThe volumes exist and are digitised\u003c/b\u003e, in the \u003cem\u003eLivros Mestres\u003c/em\u003e of the Arquivo Histórico Militar, catalogued by the GERMIL project — 3,822 books, 1763 to 1907. For Regimento de Infantaria nº 4 the relevant ones are \u003cb\u003eLivro 10 (1813 – 20 Jan 1815)\u003c/b\u003e, catalogue \u003ccode\u003eid=278825\u003c/code\u003e, which matches Giraldo's baptism, and \u003cb\u003eLivro 11 (1815 – 30 Sep 1821)\u003c/b\u003e, \u003ccode\u003eid=278962\u003c/code\u003e, which matches Rodrigo's. Livros 7–9 cover 1808–1812 (\u003ccode\u003e276648\u003c/code\u003e, \u003ccode\u003e277127\u003c/code\u003e, \u003ccode\u003e279233\u003c/code\u003e); Livro 30 is a company roll for 1808–13 (\u003ccode\u003e307127\u003c/code\u003e); Livros 5 and 6 reach back to 1789–97 (\u003ccode\u003e272254\u003c/code\u003e, \u003ccode\u003e272330\u003c/code\u003e) if he enlisted young.\u003c/p\u003e\n    \u003cp\u003eA second register is worth pulling too: under \u003cem\u003eGoverno das Armas do Reino do Algarve\u003c/em\u003e, \u003cem\u003e\"Livro nº 1 — soldados de \u003cb\u003epé de castelo\u003c/b\u003e que guarnecem as \u003cb\u003epraças e fortalezas\u003c/b\u003e deste Reino… no ano de 1790\"\u003c/em\u003e (\u003ccode\u003eid=2638\u003c/code\u003e). That is the garrison roll for the Algarve's fortified towns, which is exactly what \u003cem\u003e\"Regimento desta Praça\"\u003c/em\u003e describes, and Tavira is one of them. \u003cb\u003eIts entry 0070 is a Domingos Viegas\u003c/b\u003e (\u003ccode\u003eid=2735\u003c/code\u003e). The 1790 is when the book was \u003cem\u003eestablished\u003c/em\u003e, not the date of each entry — an enrolment a decade later would fall right in our window.\u003c/p\u003e\n    \u003cp\u003e\u003cb\u003eDirect links, for when the site is reachable\u003c/b\u003e (it is behind a bot-filter and currently unresponsive):\u003c/p\u003e\n    \u003cp style=\"word-break:break-all\"\u003e\u003ccode\u003ehttps://ahmgermil-exercito.defesa.gov.pt/details?id=278825\u003c/code\u003e\u003cbr\u003e\n    \u003ccode\u003ehttps://ahmgermil-exercito.defesa.gov.pt/viewer?id=278825&recordType=Description\u003c/code\u003e\u003cbr\u003e\n    \u003ccode\u003ehttps://ahmgermil-exercito.defesa.gov.pt/results?p0=%2A&o0=1&v0=domingos+viegas&m0=False&s=Rank&sd=False&p=0&searchType=Description\u003c/code\u003e\u003c/p\u003e\n    \u003cp\u003eSubstitute any \u003ccode\u003eid=\u003c/code\u003e above. \u003cb\u003eSearch by name; do not browse the tree\u003c/b\u003e — the folder view reports itself empty even when it is not, which is a known quirk of this software and not a sign the records are missing. Soldier records are titled \u003cem\u003eName — Rank — Unit\u003c/em\u003e.\u003c/p\u003e","where":["\u003cb\u003eHow to request it from Portugal.\u003c/b\u003e Arquivo Histórico Militar, \u003cb\u003eahm@exercito.pt\u003c/b\u003e, Largo dos Caminhos de Ferro, 1100‑105 Lisboa; +351 218 170 552 (800 910 211 free within Portugal). Give them the catalogue path rather than a general question — \u003cem\u003eLivros Mestres → Arma de Infantaria → Regimento de Infantaria nº 4 → Livros 10 e 11\u003c/em\u003e, and separately \u003cem\u003eGoverno das Armas do Reino do Algarve → Livro nº 1\u003c/em\u003e — name \u003cb\u003eDomingos Viegas, soldado, natural de Tavira, serving Aug 1813 and Mar 1816\u003c/b\u003e, say you want the \u003cem\u003eassentamento\u003c/em\u003e for the \u003cb\u003efiliação e naturalidade\u003c/b\u003e, and ask for a digital reproduction. In Portuguese if possible. A short exact letter naming volumes is the one that gets answered."],"done":false},{"id":"t-1-domingos-s-death-not-in-either-city-parish","rank":"1","title":"Domingos's death — not in either city parish","status":"open","source":"tavira","body":"\u003cp\u003eMaria das Dores's is found — 2 April 1855, and it calls her \u003cem\u003emarried\u003c/em\u003e, so he outlived her. His own entry is \u003cb\u003enot in Tavira\u003c/b\u003e. Both urban parishes have now been swept end to end: \u003cb\u003eSantiago 1826–1880\u003c/b\u003e (O10, then one volume per year) and \u003cb\u003eSanta Maria 1855–1884\u003c/b\u003e — about 5,300 entries, with every adult margin \"Domingos\" opened and checked. He would have been ~67 in 1855 and ~96 by 1884.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eSo the household moved, and this page's old assumption that he stayed on the Rua de São Sebastião until he died is wrong.\u003c/b\u003e One hole is the archive's, not ours: \u003cb\u003eSanta Maria 1879 and 1885 are missing from the catalogue entirely\u003c/b\u003e — the only unread years inside the two parishes.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eHow firm is \"swept\"?\u003c/b\u003e Firmer for some years than others, and the difference matters. Nearly all of it was done by \u003cem\u003emargin\u003c/em\u003e sweep — cropping the left edge of each page and reading the name column. It works, and it caught the 1877 \"Domingos Viegas\" unprompted. But it fails in two ways that leave no trace: \u003cb\u003ea crop a little too narrow truncates names while still looking like names\u003c/b\u003e (this was happening in the Santiago baptism books, clipping \u003cem\u003eCustodi\u003c/em\u003e, \u003cem\u003eRodrig\u003c/em\u003e, \u003cem\u003eAntoni\u003c/em\u003e), and \u003cb\u003esome volumes do not put the name in the margin at all\u003c/b\u003e — in 1862 the first twenty-five entries carry only a number and a date. \u003cb\u003e1860–1869 has since had a second, entry-by-entry pass\u003c/b\u003e and is solid. Treat the rest as strong evidence rather than proof, and re-test any negative before building on it.\u003c/p\u003e","where":["Next is not more óbitos. It is \u003cb\u003eRodrigo's and Maria's marriages\u003c/b\u003e (target 8): a marriage entry states whether the father was \u003cem\u003ejá falecido\u003c/em\u003e and usually names the parish the family had moved to. Giraldo stayed in Santiago to 1878 and José to 1895, so if Domingos left, he went to Rodrigo or Maria. Note also that baptism entries are \u003cb\u003euseless\u003c/b\u003e for this — see the box below."],"done":false},{"id":"t-2-domingos-s-own-baptism-closed","rank":"2","title":"Domingos’s own baptism — closed","status":"closed","source":"tavira","body":"\u003cp\u003e\u003cb\u003eFound: February 1780, Santiago B13, image 22R\u003c/b\u003e, at the sítio de Bernardinheiro. See his entry in the
