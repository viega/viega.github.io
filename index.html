 as her sister for the woman who left Luz and married Manoel Viegas.\u003c/p\u003e","sebastiao-fernandes-luz":"\u003cp\u003eHe married at Luz in 1691, his father long dead and his mother still living — the last sighting of the household.\u003c/p\u003e","gaspar-fernandes-luz":"\u003cp\u003eA Luz parishioner, husband of \u003cstrong\u003eMaria das Neves\u003c/strong\u003e. He was alive in November 1661, when the register calls her \u003cem\u003emolher de Gaspar Fernandes\u003c/em\u003e, and dead by May 1674, when she marries off their son Lourenço as his widow.\u003c/p\u003e","maria-das-neves-elder":"\u003cp\u003eThe head of a large \u003cem\u003edas Neves\u003c/em\u003e family at Luz, and — if the identification holds — António's grandmother. She is documented across \u003cstrong\u003ethirty years\u003c/strong\u003e: a godmother in 1661 with her husband Gaspar Fernandes alive; twice widowed by 1674, when she marries off a son and a daughter within two months; another daughter married in 1684; and a second son, Sebastião, in 1691, when she is still living.\u003c/p\u003e"},"personNotes":{"arturo-viegas-ramirez-1890":"\u003cp\u003eHe is the point where the surname loses its final s — he appears later as Arturo \u003cstrong\u003eViega\u003c/strong\u003e.\u003c/p\u003e","joao-viegas-1861":"\u003cp\u003eHis 1890 declaration at Nerva states \u003cem\u003enatural de Tavira (Portugal)\u003c/em\u003e and gives his age as 28 — the record that ties the Portuguese and Spanish halves together. He could not sign it: \u003cem\u003e\"por manifestar no saber.\"\u003c/em\u003e \u003cstrong\u003eHis death record has not yet been found.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eOne caution: the 1890 acta calls him a \u003cem\u003ejornalero\u003c/em\u003e, which is a day labourer and nothing more — it names no sector and no employer. Nerva was a mining town, but the document does not explicitly say he worked the mines.\u003c/p\u003e\n\u003cp\u003eIt may be possible to get Rio Tinto records... in person. But only if he was a direct employee, and even then it might depend on when he started.\u003c/p\u003e","agustina-ramirez-rivera":"\u003cp\u003eHer age is given as 28 in January 1890. \u003cstrong\u003eHer death record has not been found.\u003c/strong\u003e\u003c/p\u003e","isidra-rivera-gutierrez":"\u003cp\u003eReading not fully resolved: \u003cem\u003eIsidra\u003c/em\u003e or \u003cem\u003eIsidora\u003c/em\u003e.\u003c/p\u003e","jose-viegas-leiria-1820":"\u003cp\u003eIn 19th century Priest Chicken Scratch, it's often easy to mistake José and Joaō!\u003c/p\u003e","catarina-do-rosario-1832":"\u003cp\u003eThe Nerva spelling is independent corroboration of this identification: \u003cem\u003eChagas\u003c/em\u003e is her own maternal grandmother’s name (Catarina das Chagas), which she appears to have carried. \u003cstrong\u003eHer death has not yet been found.\u003c/strong\u003e\u003c/p\u003e","maria-das-dores":"\u003cp\u003eHer baptism and her own marriage entry aside, no record of her birth has been found; the c.1790–95 window is inferred, not stated.\u003c/p\u003e","francisco-viegas-leiria":"\u003cp\u003eCareful: his nephew was also called Francisco Viegas, so there are two men of the name in adjacent generations.\u003c/p\u003e","antonio-viegas-leiria":"\u003cp\u003e\u003cstrong\u003eHis birth is calculated, not documented.\u003c/strong\u003e The 1694 burial of his son Manoel puts him at the head of a household with children by then, so he was born around \u003cstrong\u003e1660–75\u003c/strong\u003e — roughly fifty at his 1724 remarriage and in his sixties at his death in 1734.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA retired hypothesis, kept because the reasoning matters.\u003c/strong\u003e A baptism of 19 April 1688 at the sítio do Bengado — \u003cem\u003eAntónio, filho de Manoel Viegas e Maria das Neves\u003c/em\u003e — was for a long time taken to be his, on the grounds that it was the only “António, son of a Viegas” in either surviving Santa Catarina baptism book. \u003cstrong\u003eIt is not his\u003c/strong\u003e, and Manoel Viegas and Maria das Neves are no longer shown as his parents: a man burying a son in September 1694 was not baptised in April 1688. The argument for the 1688 entry was an argument from absence, and the absence had a simpler explanation — he was born before these registers begin.\u003c/p\u003e\n\u003cp\u003eThe counter-argument was that the 1694 couple were a second António Viegas married to a second Apolónia Gonsalves. That is possible in a parish this thick with Viegases, but Apolónia is not one of the interchangeable devotional names, and the 1688 reading also left his daughter Catharina “de maior idade” in 1724 and his styling as a man of Luz both needing special pleading. The later birth removes all three strains at once.\u003c/p\u003e","jose-dos-santos":"\u003cp\u003eHis surname does not descend: his son is a \u003cem\u003ePereira\u003c/em\u003e. Ordinary in these registers; \u003cem\u003eViegas\u003c/em\u003e descends the same way on the other side.\u003c/p\u003e","anna-cabrita":"\u003cp\u003e\u003cstrong\u003eCabrita is a distinctive Algarve surname\u003c/strong\u003e and the best thing to search on in this branch.\u003c/p\u003e","jose-domingues":"\u003cp\u003eThe 1807 marriage gives a third vote — \u003cem\u003eDomingues\u003c/em\u003e — so it stands two to one. A sibling’s baptism would name him again and settle it. Until then, \u003cstrong\u003esearch both\u003c/strong\u003e.\u003c/p\u003e","margarida-da-conceicao":"\u003cp\u003e\u003cstrong\u003eNot\u003c/strong\u003e the Margarida da Conceição who was mother of Maria José, José Viegas’s first wife; that one is a Dias Pires on an unrelated branch. \u003cem\u003eda Conceição\u003c/em\u003e is a devotional name, not a surname.\u003c/p\u003e","jose-correia-minhos":"\u003cp\u003e\u003cstrong\u003eCorrected reading\u003c/strong\u003e — earlier transcribed as \u003cem\u003eJosé Ferreira Minhoto\u003c/em\u003e; both originals in fact read \u003cem\u003eCorreia Minhós\u003c/em\u003e. The accent on \u003cem\u003eMinhós\u003c/em\u003e is uncertain; \u003cem\u003eCorreia\u003c/em\u003e is not.\u003c/p\u003e","jose-rodrigues-matheos":"\u003cp\u003eWritten \u003cem\u003eJosé Ro.ˢ Matheos\u003c/em\u003e — the abbreviation \u003cem\u003eRoiz / Ro.ˢ\u003c/em\u003e is standard for \u003cstrong\u003eRodrigues\u003c/strong\u003e.\u003c/p\u003e","joao-viegas-1808":"\u003cp\u003eNot to be confused with his great-nephew João, born 1861. There are two Joãos fifty-three years apart.\u003c/p\u003e","manoel-viegas-1726":"\u003cp\u003eHe named a son Francisco Viegas too, which is the source of the two-Franciscos trap.\u003c/p\u003e","apolonia-gonsalves":"\u003cp\u003eTwo lost books stand between us and her. Luz marriage registers run 1684–1699 and then 1711–1784, so a wedding in about 1706–12 is gone; Luz burial registers run 1625–1640 and then 1718–1761, and a full margin scan of the surviving book from 1718 to May 1724 does not contain her — so she died before 1718 and that record is gone too. \u003cstrong\u003eAntónio was therefore a widower for at least six years before he remarried\u003c/strong\u003e, not seven months: the seven-month figure measures from his daughter's death, not his wife's.\u003c/p\u003e","catharina-viegas-1724":"\u003cp\u003eCalled “de maior idade” at death, which places her in the adult fee tier (jazigo 350) rather than the child tier (275) — but the age that divide represents is not known, and in books of this kind it is often about seven rather than legal majority. Her birth should therefore be treated as undated.\u003c/p\u003e","manoel-viegas-bengado":"\u003cp\u003e\u003cstrong\u003eFormerly shown as António Viegas Leiria's father; that link has been removed.\u003c/strong\u003e Their son António, baptised in 1688, was taken for our António until the burial of September 1694 showed our man already had a household of his own. The two are different people.\u003c/p\u003e\n\u003cp\u003eThey are kept here because they are a genuine, documented couple, and because the Bengado is a Viegas neighbourhood that may still matter: it held at least five separate Viegas parties in 1688–90. If they are ever to be traced further, the search key is \u003cem\u003eMaria das Neves\u003c/em\u003e, not \u003cem\u003eManoel Viegas\u003c/em\u003e — Santa Catarina carried at least five distinct Manoel Viegases in this generation, separated only by a wife's name or a byname (Viegas Souza, Viegas Cavaco, Viegas do Seixe).\u003c/p\u003e","maria-das-neves":"\u003cp\u003e\u003cstrong\u003eFormerly shown as António Viegas Leiria's mother; that link has been removed\u003c/strong\u003e — see the note on her husband.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA candidate baptism was proposed and then undermined.\u003c/strong\u003e The Luz registers yielded a \u003cem\u003eMaria das Neves\u003c/em\u003e heading a large family, with twin girls Maria and Izabel baptised on 19 August 1660. That Maria cannot be this one: the 1665 godparent entry shows Maria das Neves already \u003cem\u003emarried\u003c/em\u003e, and the girl baptised in 1660 was four years old. The twin is kept in the collection as a tested and discarded candidate because the reasoning is worth preserving.\u003c/p\u003e","joze-viegas-leria-1688":"\u003cp\u003eKinship with Manoel Viegas and Maria das Neves is likely but unproven: two Viegas households in one small parish in the same year. His own marriage and baptism, and his other children, are the obvious route to whatever ancestor the two share.\u003c/p\u003e","domingas-viegas-1680":"\u003cp\u003eA third Manoel Viegas appears at the same sítio in April 1690 with yet another wife, Izabel Pires. Three wives in ten years is not one man's life, so the name cannot be used to link households here. Her parents are left unattached in this tree deliberately.\u003c/p\u003e","manoel-viegas-1694":"\u003cp\u003e\u003cstrong\u003eNow attached to this family.\u003c/strong\u003e He was for a time set aside as the child of a second António Viegas married to a second Apolónia Gonsalves, because our António was believed to have been baptised in April 1688 and so could not have been burying a son in 1694. That baptism is no longer thought to be our António's, and this burial is the reason: it is the only sight we have of his first marriage while it was still a living household, thirty years before the documents that record it as ended.\u003c/p\u003e","lourenco-fernandes-luz":"\u003cp\u003eA child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.\u003c/p\u003e","bertolameu-fernandes-1656":"\u003cp\u003eA child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.\u003c/p\u003e","catherina-fernandes-1658":"\u003cp\u003eA child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.\u003c/p\u003e","izabel-das-neves-1660":"\u003cp\u003eA child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.\u003c/p\u003e","sebastiao-fernandes-luz":"\u003cp\u003eA child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.\u003c/p\u003e","gaspar-fernandes-luz":"\u003cp\u003eKnown only through his children and his wife — no baptism, marriage or burial of his own has been found. The Luz burial register for his lifetime does not survive: there is no óbito book between 1640 and 1718. \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eThe link to António is no longer claimed.\u003c/strong\u003e Their daughter Maria, baptised in 1660, was too young to be the \u003cem\u003eMaria das Neves, molher de Manoel Viegas\u003c/em\u003e who stands godmother at Luz in 1665. This family is kept as a fully documented Luz household of the right surname, not as ancestors.\u003c/p\u003e","maria-das-neves-elder":"\u003cp\u003eBorn about 1625–30. She is far too old to be António's own mother — a woman marrying off children in 1674 would have been about sixty in 1688 — which is precisely why the search moved to her \u003cem\u003edaughters\u003c/em\u003e. \u003cbr\u003e\u003cbr\u003eHer family also shows the naming habit that runs through this whole district: her daughter \u003cstrong\u003eBarbora\u003c/strong\u003e is styled \u003cem\u003edas Neves\u003c/em\u003e in her 1674 marriage although her father was a Barocadas. The surname descended through the women. \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eThe link to António is no longer claimed.\u003c/strong\u003e Their daughter Maria, baptised in 1660, was too young to be the \u003cem\u003eMaria das Neves, molher de Manoel Viegas\u003c/em\u003e who stands godmother at Luz in 1665. This family is kept as a fully documented Luz household of the right surname, not as ancestors.\u003c/p\u003e"},"recordNotes":{"1808-baptism-joao-domingos-viegas":"\u003cp\u003eFound in a stretch of Santiago B17 (1806–1810) that had been flagged as untested and never opened. Four sessions of searching had put the parents’ marriage in 1811–12 and pinned it on an illegible Santa Maria entry; this baptism is what proved that wrong by four years.\u003c/p\u003e","1890-birth-arturo-viegas-ramirez":"\u003cp\u003eRequested from the Nerva civil registry in Spain and obtained as a certified electronic copy — validation code RG:NMa7-SanX-b4fY-XjxE, issued 10 August 2026. \u003cstrong\u003eThere is no online image of this record\u003c/strong\u003e; the certified copy is the primary source and it exists only locally, so the page images are embedded here rather than linked.\u003c/p\u003e","1771-baptism-joanna-jose-viegas":"\u003cp\u003eDay and month not recovered from the entry.\u003c/p\u003e","1688-baptism-antonio-viegas":"\u003cp\u003eThe only “António, son of a Viegas” in either surviving Santa Catarina baptism book, after both were swept end to end. The surname wraps across the line break as “M.el Vi-/egas”, which rules out the usual confusions with Vieyra and Vargas, and the year is written out in full: “mil e seis Centos e OITENTA E OITO annos”.\u003c/p\u003e","1694-burial-manoel-viegas":"\u003cp\u003eThe only record of António's first marriage taken while it was still a household. It is also the record that moved him back a generation: a man burying a son in September 1694 cannot be the António baptised at the Bengado in April 1688.\u003c/p\u003e","1660-baptism-twins-maria-izabel":"\u003cp\u003e\u003cp\u003eThe year is written as an arabic numeral, so it does not rest on reading a spelled-out word — the commonest source of error in these books.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThis entry was predicted before it was found.\u003c/strong\u003e Four Luz marriage entries (1674, 1674, 1684, 1691) show a \u003cem\u003eMaria das Neves\u003c/em\u003e marrying off children; a fifth, of 1661, calls her \u003cem\u003emolher de Gaspar Fernandes\u003c/em\u003e. That put her childbearing in the 1650s and 60s — inside this register, which opens in 1651 and names both parents every time. Bertolameu (1656) and Catherina (1658) turned up first; then the twins.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eIt is a candidate, not a proof.\u003c/strong\u003e Nothing yet links this Maria to a marriage with Manoel Viegas, to the Bengado, or to António — and her twin Izabel fits the same description.\u003c/p\u003e\u003c/p\u003e","1656-baptism-bertolameu-gaspar":"\u003cp\u003e\u003cp\u003eThe first child of this couple found in the register, and the entry that turned a reconstruction built from marriage records into a documented household.\u003c/p\u003e\u003c/p\u003e","1658-baptism-catherina-gaspar":"\u003cp\u003e\u003cp\u003eThe first daughter of the household to be found. She may be the daughter who married at Luz in 1684.\u003c/p\u003e\u003c/p\u003e","1665-godparent-maria-das-neves":"\u003cp\u003e\u003cp\u003e\u003cem\u003eM.\u003csup\u003eer\u003c/sup\u003e\u003c/em\u003e — \u003cem\u003emolher\u003c/em\u003e, modern \u003cem\u003emulher\u003c/em\u003e — means \u003cstrong\u003ewife\u003c/strong\u003e, and these registers use it strictly, against \u003cem\u003eviuva\u003c/em\u003e for a widow and \u003cem\u003efilha\u003c/em\u003e for a daughter. So the marriage was live in April 1665, twenty-three years before their son António was baptised at the Bengado.\u003c/p\u003e\u003cp\u003eThe surname settles itself: the scribe ran out of room and \u003cstrong\u003esplit it across the line break — \u003cem\u003eVi-\u003c/em\u003e at the end of one line, \u003cem\u003eegas\u003c/em\u003e at the start of the next\u003c/strong\u003e. A word spelled out in two pieces cannot be a misread flourish, which matters in a district where \u003cem\u003eViegas\u003c/em\u003e, \u003cem\u003eVargas\u003c/em\u003e, \u003cem\u003eVargens\u003c/em\u003e and \u003cem\u003eGago\u003c/em\u003e are easy to confuse.\u003c/p\u003e\u003cp\u003eIt is the only place the couple appear together outside their son's baptism, and it is what forced an earlier candidate baptism for Maria to be set aside: the Maria baptised at Luz in August 1660 was four years old on this day.\u003c/p\u003e\u003c/p\u003e"},"todoBody":{"t-star-domingos-s-army-service-record-the-one-docum":"\u003cp\u003eTwo of his children's baptisms name his unit: \u003cb\u003e\"Soldado do Regimento número quatro\"\u003c/b\u003e (Aug 1813) and \u003cb\u003e\"Soldado do Regimento desta Praça\"\u003c/b\u003e (Mar 1816). \u003cb\u003eRegimento de Infantaria nº 4 was the Algarve's own line regiment, seated at Faro.\u003c/b\u003e\u003c/p\u003e\n    \u003cp\u003eA Portuguese \u003cem\u003eassentamento de praça\u003c/em\u003e records \u003cb\u003eboth parents' names, the parish of birth, the age, the trade before enlistment, and where and when the man enlisted\u003c/b\u003e. That single entry would give us Francisca's \u003cem\u003efull\u003c/em\u003e name, settle Santiago versus Santa Maria outright, pin Domingos's birth to a year instead of a decade, and show whether \u003cem\u003eLeiria\u003c/em\u003e was already attached to him in the 1810s. Nothing in the parish registers does all four.\u003c/p\u003e\n    \u003cp\u003e\u003cb\u003eThe volumes exist and are digitised\u003c/b\u003e, in the \u003cem\u003eLivros Mestres\u003c/em\u003e of the Arquivo Histórico Militar, catalogued by the GERMIL project — 3,822 books, 1763 to 1907. For Regimento de Infantaria nº 4 the relevant ones are \u003cb\u003eLivro 10 (1813 – 20 Jan 1815)\u003c/b\u003e, catalogue \u003ccode\u003eid=278825\u003c/code\u003e, which matches Giraldo's baptism, and \u003cb\u003eLivro 11 (1815 – 30 Sep 1821)\u003c/b\u003e, \u003ccode\u003eid=278962\u003c/code\u003e, which matches Rodrigo's. Livros 7–9 cover 1808–1812 (\u003ccode\u003e276648\u003c/code\u003e, \u003ccode\u003e277127\u003c/code\u003e, \u003ccode\u003e279233\u003c/code\u003e); Livro 30 is a company roll for 1808–13 (\u003ccode\u003e307127\u003c/code\u003e); Livros 5 and 6 reach back to 1789–97 (\u003ccode\u003e272254\u003c/code\u003e, \u003ccode\u003e272330\u003c/code\u003e) if he enlisted young.\u003c/p\u003e\n    \u003cp\u003eA second register is worth pulling too: under \u003cem\u003eGoverno das Armas do Reino do Algarve\u003c/em\u003e, \u003cem\u003e\"Livro nº 1 — soldados de \u003cb\u003epé de castelo\u003c/b\u003e que guarnecem as \u003cb\u003epraças e fortalezas\u003c/b\u003e deste Reino… no ano de 1790\"\u003c/em\u003e (\u003ccode\u003eid=2638\u003c/code\u003e). That is the garrison roll for the Algarve's fortified towns, which is exactly what \u003cem\u003e\"Regimento desta Praça\"\u003c/em\u003e describes, and Tavira is one of them. \u003cb\u003eIts entry 0070 is a Domingos Viegas\u003c/b\u003e (\u003ccode\u003eid=2735\u003c/code\u003e). The 1790 is when the book was \u003cem\u003eestablished\u003c/em\u003e, not the date of each entry — an enrolment a decade later would fall right in our window.\u003c/p\u003e\n    \u003cp\u003e\u003cb\u003eDirect links, for when the site is reachable\u003c/b\u003e (it is behind a bot-filter and currently unresponsive):\u003c/p\u003e\n    \u003cp style=\"word-break:break-all\"\u003e\u003ccode\u003ehttps://ahmgermil-exercito.defesa.gov.pt/details?id=278825\u003c/code\u003e\u003cbr\u003e\n    \u003ccode\u003ehttps://ahmgermil-exercito.defesa.gov.pt/viewer?id=278825&recordType=Description\u003c/code\u003e\u003cbr\u003e\n    \u003ccode\u003ehttps://ahmgermil-exercito.defesa.gov.pt/results?p0=%2A&o0=1&v0=domingos+viegas&m0=False&s=Rank&sd=False&p=0&searchType=Description\u003c/code\u003e\u003c/p\u003e\n    \u003cp\u003eSubstitute any \u003ccode\u003eid=\u003c/code\u003e above. \u003cb\u003eSearch by name; do not browse the tree\u003c/b\u003e — the folder view reports itself empty even when it is not, which is a known quirk of this software and not a sign the records are missing. Soldier records are titled \u003cem\u003eName — Rank — Unit\u003c/em\u003e.\u003c/p\u003e","t-1-domingos-s-death-not-in-either-city-parish":"\u003cp\u003eMaria das Dores's is found — 2 April 1855, and it calls her \u003cem\u003emarried\u003c/em\u003e, so he outlived her. His own entry is \u003cb\u003enot in Tavira\u003c/b\u003e. Both urban parishes have now been swept end to end: \u003cb\u003eSantiago 1826–1880\u003c/b\u003e (O10, then one volume per year) and \u003cb\u003eSanta Maria 1855–1884\u003c/b\u003e — about 5,300 entries, with every adult margin \"Domingos\" opened and checked. He would have been ~67 in 1855 and ~96 by 1884.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eSo the household moved, and this page's old assumption that he stayed on the Rua de São Sebastião until he died is wrong.\u003c/b\u003e One hole is the archive's, not ours: \u003cb\u003eSanta Maria 1879 and 1885 are missing from the catalogue entirely\u003c/b\u003e — the only unread years inside the two parishes.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eHow firm is \"swept\"?\u003c/b\u003e Firmer for some years than others, and the difference matters. Nearly all of it was done by \u003cem\u003emargin\u003c/em\u003e sweep — cropping the left edge of each page and reading the name column. It works, and it caught the 1877 \"Domingos Viegas\" unprompted. But it fails in two ways that leave no trace: \u003cb\u003ea crop a little too narrow truncates names while still looking like names\u003c/b\u003e (this was happening in the Santiago baptism books, clipping \u003cem\u003eCustodi\u003c/em\u003e, \u003cem\u003eRodrig\u003c/em\u003e, \u003cem\u003eAntoni\u003c/em\u003e), and \u003cb\u003esome volumes do not put the name in the margin at all\u003c/b\u003e — in 1862 the first twenty-five entries carry only a number and a date. \u003cb\u003e1860–1869 has since had a second, entry-by-entry pass\u003c/b\u003e and is solid. Treat the rest as strong evidence rather than proof, and re-test any negative before building on it.\u003c/p\u003e","t-2-domingos-s-own-baptism-closed":"\u003cp\u003e\u003cb\u003eFound: February 1780, Santiago B13, image 22R\u003c/b\u003e, at the sítio de Bernardinheiro. See his entry in the tree above, and the record in full on the companion \u003cem\u003eRecords\u003c/em\u003e page. The parents’ names are washed off the leaf, so the identification rests on the two grandparent pairs, which match his 1807 marriage exactly.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eWhat it took to close it, and what that rules out.\u003c/b\u003e Two full baptism registers and one burial register were read page by page: \u003cb\u003eSantiago B13 (1779–85, 199 images)\u003c/b\u003e, \u003cb\u003eB14 (1785–91, 196 images)\u003c/b\u003e — the latter re-checked end to end for the abbreviated margin form \u003cem\u003eD.\u003csup\u003eos\u003c/sup\u003e\u003c/em\u003e after it turned out to be in live use — and \u003cb\u003eSantiago óbitos O7\u003c/b\u003e from October 1779 to the book’s close in 1789. Ten children named Domingos were baptised in those two books and five were buried in that span; \u003cb\u003eevery single one was excluded on parentage, never on surname\u003c/b\u003e. That was deliberate: the byname is unstable and \u003cem\u003eViegas\u003c/em\u003e can descend through the mother, so the match key was the four grandparents, and the sharpest name in it turned out to be \u003cb\u003eElena Maria\u003c/b\u003e — rare, where Maria and Francisca identify nobody.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eHis parents’ marriage is still missing\u003c/b\u003e, and remains a live target. Eleven marriage volumes have been read end to end — about 1,650 openings, six parishes, two concelhos, 1741–1802. Nineteen men called Francisco Viegas married in that span; every bride was recorded; none was a Francisca. Conceição-Tavira has no marriage series indexed at all. \u003cb\u003eLuz was wrongly written off:\u003c/b\u003e it was recorded here as having no register before 1829, but that was a search of the wrong archive — Luz’s registers are at the \u003cb\u003eArquivo Distrital de Faro\u003c/b\u003e (\u003ccode\u003ePT/ADFAR/PRQ/TVR03\u003c/code\u003e), where its \u003cb\u003emarriages run from 1591\u003c/b\u003e and baptisms from 1599. \u003cb\u003eThe search should now move to LUZ.\u003c/b\u003e Antonio’s own 1724 marriage calls him \u003cem\u003eda freguezia de Nossa Senhora da Luz\u003c/em\u003e, and Luz turns out to hold a whole Viegas clan — in 1712 alone the parish had \u003cb\u003etwo Viegas priests\u003c/b\u003e (Manoel Viegas, its Cura; João Leal Viegas, beneficed at Santa Maria de Tavira), an \u003cb\u003eAlferes Antonio Viegas Leal\u003c/b\u003e, and several illiterate Viegas signing with crosses, under the bynames \u003cem\u003eLeal, Souza, Gois, Correa\u003c/em\u003e and \u003cem\u003eGama\u003c/em\u003e. \u003cb\u003eA candidate for Antonio’s baptism is in hand:\u003c/b\u003e an \u003cem\u003eAntonio, son of Manoel Viegas and Maria de Oliveira, born 8 October 1696 in Luz\u003c/em\u003e — Viegas father, and an age that fits every later date. \u003cb\u003eBut it is not proven, and Santa Catarina cannot be dropped:\u003c/b\u003e if \u003cem\u003enatural de Santa Catarina\u003c/em\u003e is right, his baptism is there and this Luz child is somebody else.\u003c/p\u003e","t-3-maria-das-dores-s-own-baptism":"\u003cp\u003eNewly worth doing. Until now we only knew her family was \"of this City\", which meant either urban parish. The 1811 marriage says her parents were \u003cb\u003e\"naturais desta Freguezia\"\u003c/b\u003e — Santiago. That halves the search, and the same pass would find her brother Francisco José and settle whether he really is her brother.\u003c/p\u003e","t-4-rodrigo-jose-pereira-and-ignes-de-jesus-foun":"\u003cp\u003e\u003cb\u003eMarried 30 November 1782 at Santiago\u003c/b\u003e, both of them \u003cem\u003esolteiros\u003c/em\u003e. The entry names all four of their parents and says twice that both families were \u003cb\u003eof this parish\u003c/b\u003e — which is what finally closed the Santiago-or-Santa-Maria question. It also corroborates the 1811 record from the other end.\u003c/p\u003e","t-5-their-marriage-found":"\u003cp\u003e\u003cb\u003e20 March 1807\u003c/b\u003e, in the \u003cem\u003eErmida de Nossa Senhora da Consolação\u003c/em\u003e, then serving as the matriz of Santiago. Santiago marriages \u003cb\u003eC8, folio 78\u003c/b\u003e. It names \u003cb\u003eboth sets of grandparents on both sides\u003c/b\u003e — which is how the line gained a generation. See the section at the top of this page.\u003c/p\u003e","t-6-catarina-s-parents":"\u003cp\u003eManoel de Santa Ana and Anna Maria married at some point before 1832 and both were Tavira natives. Their marriage would name all four of the grandparents above and confirm whether she was Anna Maria or Maria Catarina.\u003c/p\u003e","t-7-jose-and-catarina-s-other-children-done-for-":"\u003cp\u003e\u003cb\u003eFive found.\u003c/b\u003e The eleven-year gap between their 1850 marriage and João's birth is filled: \u003cb\u003eManoel\u003c/b\u003e (b. 3 Nov 1851), \u003cb\u003eJosé\u003c/b\u003e (b. 29 Jul 1853), \u003cb\u003eRita\u003c/b\u003e (b. 9 Mar 1855) and \u003cb\u003eFrancisco\u003c/b\u003e (b. 19 Oct 1858) — plus a \u003cb\u003esecond Francisco\u003c/b\u003e, born about June 1863, who died at five months that November. The 1858 boy is called \"first of this name\", so he must have died before mid-1863; that death has not been found.\u003c/p\u003e","t-8-rodrigo-and-maria":"\u003cp\u003eJosé's brother (b. 1816) and sister (b. 1818) are known only from their baptisms. Marriages, children, deaths — all untouched. Two whole branches nobody has followed.\u003c/p\u003e","t-9-the-dias-pires-family":"\u003cp\u003eJosé's first wife Maria José was the daughter of \u003cb\u003eAntonio Dias Pires and Margarida da Conceição\u003c/b\u003e of the Rua de São Sebastião, with grandparents José Dias Pires + Maria Gertrudes and [João] Dias Pires + Maria da Conceição. An entirely fresh family, discovered in the 1845 marriage.\u003c/p\u003e","t-10-giraldo-s-descendants":"\u003cp\u003e\u003cb\u003eHis death is now found\u003c/b\u003e — 4 December 1878, aged sixty-six, at the Largo d'Atalaia, still a labourer, still married to Maria do Carmo, and the entry says he \u003cem\u003eleft children\u003c/em\u003e. Of the five children reported between 1844 and 1862, \u003cb\u003ethree more have surfaced\u003c/b\u003e in the Santiago baptisms — a Maria, a José and a Francisco — alongside the christening of 29 January 1844 already known.\u003c/p\u003e","t-11-the-early-viegas-probate-inventories-was-any":"\u003cp\u003eThe Tavira court's \u003cem\u003eAutos de Inventário Obrigatório\u003c/em\u003e are \u003cb\u003eindexed by the name of the deceased\u003c/b\u003e, and a probate inventory lists property with its \u003cem\u003econfrontações\u003c/em\u003e — the named neighbours on every side. Of 5,099 items enumerated there is \u003cb\u003eno inventory for any Viegas Leiria\u003c/b\u003e, which fits a family with nothing to divide. But there are \u003cb\u003enine Viegas inventories before 1870\u003c/b\u003e, and three fall in Francisco Viegas's own generation: \u003cb\u003eJoaquim Viegas (opened 1806)\u003c/b\u003e, \u003cb\u003eMaria Viegas (1809)\u003c/b\u003e and \u003cb\u003eJoão Viegas (1832)\u003c/b\u003e. Each names heirs.\u003c/p\u003e\n      \u003cp\u003eStart with \u003cb\u003eFrancisca Viegas Morgado, 1850\u003c/b\u003e — \u003ccode\u003ePT/ADFAR/JUD/TJCTVR/001/04881\u003c/code\u003e. \u003cb\u003e\u003cem\u003eMorgado\u003c/em\u003e is the word for an entailed estate\u003c/b\u003e, so the byname alone is worth the trip; it may descend from a property or be nothing more than a family nickname, and only the document will say. The others: \u003ccode\u003e001/05841\u003c/code\u003e (1806), \u003ccode\u003e001/05966\u003c/code\u003e (1809), \u003ccode\u003e001/05744\u003c/code\u003e (1832).\u003c/p\u003e","t-12-the-third-order-s-own-books-the-one-archive-":"\u003cp\u003eFive of this family are buried in the ground of the \u003cb\u003eVenéravel Ordem Terceira de São Francisco\u003c/b\u003e (see the sidebar above), but no document we hold names any of them as an \u003cem\u003eirmão\u003c/em\u003e. A Third Order kept its own registers: \u003cb\u003e\u003cem\u003elivros de entrada / assento de irmãos\u003c/em\u003e\u003c/b\u003e (admissions — name, spouse, trade, parish, sponsor, date), \u003cb\u003e\u003cem\u003elivros de actas da mesa e do definitório\u003c/em\u003e\u003c/b\u003e (elections and minutes), and \u003cb\u003e\u003cem\u003elivros de óbitos e sepulturas\u003c/em\u003e\u003c/b\u003e (burials and grave numbers). An admission entry would give a trade and a parish for a man we currently have neither for.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eThe catalogues have been searched. Here is exactly where things stand.\u003c/b\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eNot at the district archive as a fonds.\u003c/b\u003e \u003ccode\u003ePT/ADFAR/CON\u003c/code\u003e — Faro’s confraternity holdings — contains only the maritime \u003cem\u003ecompromissos\u003c/em\u003e and \u003cem\u003emontepios\u003c/em\u003e of Faro, Olhão, Lagos, Portimão and Tavira. No Third Order.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eWhat Faro does hold\u003c/b\u003e is the state’s supervision paper, produced after 1834 when confraternities answered to the civil governor. One item names this exact body: \u003cb\u003e\u003ccode\u003ePT/ADFAR/ACD/GCFAR/I-FF/004/0040\u003c/code\u003e — \u003cem\u003e“Contas da Venéravel Ordem Terceira de São Francisco da freguesia de Santiago do concelho de Tavira”\u003c/em\u003e, 1898–1899.\u003c/b\u003e It sits in series \u003ccode\u003eI-FF/004\u003c/code\u003e, \u003cem\u003eContas de confrarias e irmandades\u003c/em\u003e, 1851–1911; see also \u003ccode\u003eI-FF/004/0027\u003c/code\u003e, \u003cem\u003eOrçamentos das confrarias do concelho de Tavira\u003c/em\u003e, 1901–02. Accounts, not membership — but accounts name the officers, and arrears name the brothers.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eWhat Tavira holds.\u003c/b\u003e The Arquivo Municipal’s \u003cem\u003eAdministração do Concelho de Tavira\u003c/em\u003e fonds (\u003ccode\u003ePT MTVR ACT\u003c/code\u003e, 1834–1954) is catalogued online and has three relevant series: \u003ccode\u003eACT/D/003\u003c/code\u003e, \u003cem\u003eInventários de instituições de piedade, assistência e beneficência\u003c/em\u003e, 1867–1930, eleven \u003cem\u003emaços\u003c/em\u003e — these include the property inventories mandated by the \u003cb\u003eSeparation Law of 20 April 1911\u003c/b\u003e, and they explicitly cover the Venéravel Ordem Terceira de São Francisco; \u003ccode\u003eACT/E/002\u003c/code\u003e, budgets and accounts, 1876–1924; and \u003ccode\u003eACT/K/C/003\u003c/code\u003e, statutes, 1911–1920. A 1911 inventory of an institution’s property \u003cb\u003ecan enumerate its archive\u003c/b\u003e, which would tell us what survived and where it went. Also there: Cx. \u003ccode\u003eAC.57\u003c/code\u003e, the 1818 statutes of the Confraria de Nossa Senhora das Dores \u003cem\u003eem S. Francisco\u003c/em\u003e.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eThe internal books are in no public catalogue — which does not mean they are lost.\u003c/b\u003e The comparators are encouraging: the Venéravel Ordem Terceira of \u003cb\u003eCoimbra\u003c/b\u003e has a described archive running \u003cb\u003e1659–2008\u003c/b\u003e, and \u003cb\u003ePorto\u003c/b\u003e’s is online. Both are held \u003cem\u003eby the Order itself\u003c/em\u003e, not by a state archive. That is the normal custody pattern, and it is where Tavira’s should be looked for.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eOne thing this page briefly got wrong, corrected.\u003c/b\u003e The 1808 margin \u003cem\u003e“Jaz. 480”\u003c/em\u003e was described here as a numbered grave that might index a plot register. \u003cb\u003eIt is a price, not a plot number.\u003c/b\u003e The third slot of an O9 margin is the burial charge, and across the book it takes essentially two figures and one word: \u003cb\u003e480 \u003cem\u003eréis\u003c/em\u003e for an adult, 250 for an infant, and \u003cem\u003e“Pobre”\u003c/em\u003e written in place of the number\u003c/b\u003e where the fee was waived. Checked on three separate leaves — four adults at 480, three infants at 250, and \u003cem\u003ePobre\u003c/em\u003e standing in the identical slot, which no grave number could. So it indexes nothing.\u003c/p\u003e\n      \u003cp\u003eWhat it does give is \u003cb\u003ea price on the family’s standing\u003c/b\u003e. \u003cem\u003eJaz.\u003c/em\u003e is \u003cem\u003ejazigo\u003c/em\u003e, a built grave rather than open ground, and 480 is the full adult rate — paid in a book where the priest was writing \u003cem\u003ePobre\u003c/em\u003e a few entries away, and where deaths in the Hospital Real carry no charge at all. It is the same argument the sidebar makes, now with a number attached.\u003c/p\u003e\n      \n    \u003c/div\u003e","t-es-nerva-marriage-of-juan-and-agustina":"Pre-1890, and not yet located. Likely Nerva itself or Fuente del Maestre. Worth requesting the \u003cem\u003eexpediente matrimonial\u003c/em\u003e — the file, not just the register entry — because a Portuguese groom’s file can contain a baptismal certificate obtained from his home parish.","t-es-nerva-births-of-the-other-children":"\u003cp\u003eManuela and her siblings. Their birth years bracket when the family actually left Spain, which turns a vague post-1890 window into a real arrival window for the Buenos Aires passenger lists.\u003c/p\u003e","t-es-titulo-de-nacionalidad":"The 1890 acta records his occupation and then, in the same breath, that he appeared \u003cem\u003e“con Título de Nacionalidad”\u003c/em\u003e — capitalised on the page, as a named instrument rather than a description. \u003cb\u003eWe do not have that document.\u003c/b\u003e All we have is the clerk noting that Juan put it on the table.\u003cbr\u003e\u003cbr\u003eHis own certificate is almost certainly gone; these were personal papers carried by the holder. \u003cb\u003eWhat survives is the register that issued it.\u003c/b\u003e Consulates of this period kept nationality registers — Spain's own system was formalised by the Royal Decree of 5 September 1871 approving a \u003cem\u003eReglamento para el Registro de Nacionalidad\u003c/em\u003e, and a holder already registered could even vouch for a newcomer. Portugal's consulates kept the equivalent: their Huelva books are precisely the source historians use to count the Portuguese in the mining basin.\u003cbr\u003e\u003cbr\u003eSo the thing to hunt is \u003cb\u003ethe consular register entry, not the certificate\u003c/b\u003e. It would give the date he registered, where he was living, and possibly his trade and household — and it would confirm whether he was still a Portuguese national in 1890 or had taken Spanish nationality, which \u003cem\u003enatural de Tavira\u003c/em\u003e does not settle either way.","t-es-death-of-juan-viegas-in-cordoba-argentina":"After 1920. The lime-factory suburb points at \u003cstrong\u003eLa Calera\u003c/strong\u003e (including Dumesnil) or \u003cstrong\u003eMalagueño\u003c/strong\u003e — provincial registry jurisdiction, not the Córdoba capital municipal registry. Search variants: Viega, Viegas, Viegas Leiria, Leiria alone, Biega, Biegas. Born c.1861–62, so expect an age in the 60s–80s.","t-es-death-of-agustina-ramirez-rivera":"\u003cp\u003eAlso unlocated. Same jurisdictions and the same age cross-check.\u003c/p\u003e","t-es-argentine-cemetery-records":"FamilySearch’s indexed \u003cem\u003eArgentina, Cemetery Records, 1882–2019\u003c/em\u003e covers Córdoba, including San Jerónimo and San Vicente in the capital. Its burial-authorisation papers carry death date, age and cause — a functional death record. La Calera’s own cemetery is \u003cstrong\u003enot\u003c/strong\u003e in the collection.","t-es-cordoba-probate-and-guardianship-files":"A \u003cem\u003ejuicio sucesorio\u003c/em\u003e states the death date. The judicial Archivo General holds files from 1926 onward (archivomet2@justiciacordoba.gob.ar). The sister’s adoption would have been a pre-1948 \u003cem\u003etutela\u003c/em\u003e proceeding, and those files routinely documented parental deaths.","t-es-riotinto-company-worker-registers":"The company's own \u003cb\u003ePersonnel Registry Office\u003c/b\u003e survives as a fonds, and its series start early enough to matter: \u003cb\u003eExpedientes personales RTCL\u003c/b\u003e, legajos 1–1238, \u003cb\u003e1890–1988\u003c/b\u003e — beginning the very year Arturo was born — and a \u003cb\u003eRegistro de obreros españoles\u003c/b\u003e, libros 1034–1099, \u003cb\u003e1873–1900\u003c/b\u003e.\u003cbr\u003e\u003cbr\u003eThe catch is nationality. A separate \u003cb\u003eRegistro de obreros extranjeros\u003c/b\u003e runs only \u003cb\u003e1897–1900\u003c/b\u003e, so a Portuguese labourer in 1890 may fall outside it entirely. Worth asking the archive directly whether the early \u003cem\u003eexpedientes\u003c/em\u003e and the “españoles” books are in practice segregated by nationality, and whether men hired through a \u003cem\u003econtratista\u003c/em\u003e rather than by the company appear at all.","t-es-nerva-padron":"This is the record that would actually settle what Juan did for a living. A \u003cem\u003epadrón\u003c/em\u003e lists occupation, often the employer or workplace, the address, and the whole household together — where the birth registration gives only the bare word \u003cem\u003ejornalero\u003c/em\u003e.\u003cbr\u003e\u003cbr\u003eNerva was constituted a municipality in its own right on \u003cb\u003e7 August 1885\u003c/b\u003e, segregated from Zalamea la Real, so it was barely four years old when Arturo was born and its own series should begin in time. The family were on \u003cb\u003eCalle Angosta\u003c/b\u003e (or Augusta) in January 1890."},"queueBody":{"q-01-the-blotted-marriage":"\u003cp class=\"why\" style=\"border-left:3px solid var(--hot);background:var(--hot-bg);padding:14px 18px;border-radius:3px\"\u003e\u003cstrong\u003eSuperseded — read this first.\u003c/strong\u003e A baptism found since this page was written (\u003cstrong\u003eJoão, son of Domingos Viegas and Maria das Dores, 3 April 1808\u003c/strong\u003e) calls him a child \u003cem\u003e“do primeiro Matrimonio de ambos”\u003c/em\u003e. Their marriage therefore \u003cstrong\u003epredates April 1808\u003c/strong\u003e, and this January 1812 entry cannot be it. The item is kept because the page below is still unread and still a Viegas marriage — but it is \u003cstrong\u003eno longer the couple we are looking for\u003c/strong\u003e. The live search has moved to Santiago C8 before mid-1807 and to Santa Maria C11 (1799–1809).\u003c/p\u003e\n\n  \u003cp class=\"why\"\u003eThis was the last place in either Tavira city parish where the marriage of \u003cstrong\u003eDomingos Viegas and Maria das Dores\u003c/strong\u003e was thought to be hiding. Santiago's marriage book is cleared from May 1808 to January 1814. Santa Maria's is cleared from 1809 to July 1812. Every entry in that span has been read except this one — and this one is a Viegas marriage, in the right month, in the right parish, with an ink blot sitting exactly where the bride's parents should be.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-01.jpeg\" alt=\"Full page spread of the Santa Maria marriage register, spread 38, with dense overwritten script and heavy ink bleed\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eFull page spread of the Santa Maria marriage register, spread 38, with dense overwritten script and heavy ink bleed\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe full spread. The entry in question is the lower one on the right-hand page. The left page is worse — it is not a separate problem, it is the same ink coming through from the other side of the leaf.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-02.jpeg\" alt=\"Close crop of the blotted marriage entry, with a large ink blot obscuring several words\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eClose crop of the blotted marriage entry, with a large ink blot obscuring several words\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe entry, de-bleached and enlarged. This is the best the digitised copy gives at any setting I have tried — background subtraction, autocontrast, and several gain levels in between.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese — fragments only\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAos \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e dias do mez de Janeiro de mil oito centos e doze annos, nesta Igreja Matriz \u003cspan class=\"gap\"\u003e[e Colegiada de Santa Maria do Castello]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e em minha prezença e de \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e Lourenço \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, e de \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, testemunhas \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e abaixo assignados, se celebrarão \u003cspan class=\"gap\"\u003e[o Santo Sacramento do]\u003c/span\u003e Matrimonio por palavras do prezente \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003eViegas\u003c/em\u003e, \u003cspan class=\"gap\"\u003e[filho de]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e naturaes desta Cidade \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e de Jesus \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish — fragments only\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e day of the month of January of one thousand eight hundred and twelve, in this Matriz Church \u003cspan class=\"gap\"\u003e[and Collegiate of Santa Maria do Castelo]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e in my presence and that of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e Lourenço \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, and of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e, witnesses \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e undersigned, was celebrated \u003cspan class=\"gap\"\u003e[the Holy Sacrament of]\u003c/span\u003e Matrimony by words of the present \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003eViegas\u003c/em\u003e, \u003cspan class=\"gap\"\u003e[son of]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e natives of this City \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e de Jesus \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003eThe groom's surname is \u003cstrong\u003eViegas\u003c/strong\u003e — I am confident of that much. \u003cstrong\u003eIs his given name recoverable?\u003c/strong\u003e If it is \u003cem\u003eDomingos\u003c/em\u003e, everything else follows.\u003c/li\u003e\n      \u003cli\u003eDoes the groom's father read \u003cstrong\u003eFrancisco Viegas\u003c/strong\u003e? I think I see something like \u003cem\u003eJosé Fran.\u003csup\u003eco\u003c/sup\u003e\u003c/em\u003e on that line, which would rule him out — but I do not trust my own reading here.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eIs the word \u003cem\u003eRodrigo\u003c/em\u003e anywhere on this entry?\u003c/strong\u003e It is the rarest name in our family and the single fastest test. If it appears, this is our marriage.\u003c/li\u003e\n      \u003cli\u003eThe trailing \u003cem\u003ede Jesus\u003c/em\u003e — is it attached to a bride, or to a witness?\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cp class=\"verdict\"\u003e\u003cstrong\u003eMy honest position:\u003c/strong\u003e I cannot read this and I do not think more image processing will change that. The blot is physical damage to the paper, not a scanning problem. If it matters enough, the way to settle it is the original volume at the Arquivo Distrital de Faro.\u003c/p\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR05/002/C12 — Santa Maria, Tavira, marriages 1809–1819 — spread 38, right page, lower entry\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/e58d14e8c013436ba03e5354445221ff\u003c/code\u003e — image 38\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","q-02-the-1811-pereira-marriage":"\u003cp class=\"why\"\u003eThis is the marriage of \u003cstrong\u003eFrancisco José Pereira\u003c/strong\u003e — Maria das Dores's brother. It had been sitting in our notes for three sessions as nothing but a date. Reading it gives us a whole generation we did not have, and it answers the question of which parish this family belonged to. Because so much now rests on four names in one line of cursive, I would like them read cold by someone else.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-03.jpeg\" alt=\"Full spread of the Santiago marriage register at folio 116, four entries visible\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eFull spread of the Santiago marriage register at folio 116, four entries visible\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe full spread. Our entry is the middle one on the right-hand page, tagged in the margin \u003cem\u003eFran.\u003csup\u003eco\u003c/sup\u003e José P.\u003csup\u003era\u003c/sup\u003e / M.\u003csup\u003ea\u003c/sup\u003e de S.\u003csup\u003eta\u003c/sup\u003e Anna\u003c/em\u003e.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-04.jpeg\" alt=\"Close crop of the opening lines of the 3 June 1811 marriage entry\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eClose crop of the opening lines of the 3 June 1811 marriage entry\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eOpening: the date, the church, and the two witnesses — both retired majors.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-05.jpeg\" alt=\"Close crop of the lines naming the groom, his parents and his four grandparents\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eClose crop of the lines naming the groom, his parents and his four grandparents\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003e\u003cstrong\u003eThe important lines.\u003c/strong\u003e Groom, parents, then both sets of grandparents. Read this one before you read my column.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAos tres dias, do mes de Junho de mil oito centos e onze annos, nesta Igreja Matriz e Colegiada de Santiago de Tavira, em minha prezença e do Manjor Reformado \u003cem class=\"name\"\u003eAntonio Paullas Soarez\u003c/em\u003e, e do Manjor Reformado \u003cem class=\"name\"\u003eJoaquim Jose de Mattos\u003c/em\u003e, testemunhas prezentes, com mais abaixo assignados, se celebrarão o Sacramento do Matrimonio por palavras do prezente, segundo Ordena o Sagrado Concillio Tredentino e Constituições deste Bispado = \u003cem class=\"name\"\u003eFrancisco Jose Pereira\u003c/em\u003e, Solteiro, filho de \u003cem class=\"name\"\u003eRodrigo Jose Pereira\u003c/em\u003e, Serrador, e de \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, naturais desta Freguezia; neto paterno de \u003cem class=\"name\"\u003eJose dos Santos\u003c/em\u003e e de \u003cem class=\"name\"\u003eAnna Cabrita\u003c/em\u003e; neto Materno de \u003cem class=\"name\"\u003eJose Rodrigues\u003c/em\u003e, e de \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, todos naturais desta Cidade = com \u003cem class=\"name\"\u003eMaria de Santa Anna\u003c/em\u003e, viuva de \u003cem class=\"name\"\u003eAntonio da Costa Pereira\u003c/em\u003e, naturais desta Cidade. De que tudo fis em virtude de hum mandado que me foi aprezentado da Camara Ecleziastica deste Bispado, registado a folhas sesenta e nove, do que fis este assento, que assignei com as sobreditas testemunhas, dia, mes e Era, ut supra.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the third day of the month of June of one thousand eight hundred and eleven, in this Matriz and Collegiate Church of Santiago de Tavira, in my presence and that of the Retired Major \u003cem class=\"name\"\u003eAntónio Paulas Soares\u003c/em\u003e and the Retired Major \u003cem class=\"name\"\u003eJoaquim José de Matos\u003c/em\u003e, witnesses present, together with those undersigned below, was celebrated the Sacrament of Matrimony by words of the present, according as the Sacred Council of Trent and the Constitutions of this Bishopric ordain = \u003cem class=\"name\"\u003eFrancisco José Pereira\u003c/em\u003e, bachelor, son of \u003cem class=\"name\"\u003eRodrigo José Pereira\u003c/em\u003e, \u003cstrong\u003esawyer\u003c/strong\u003e, and of \u003cem class=\"name\"\u003eIgnes de Jesus\u003c/em\u003e, natives \u003cstrong\u003eof this parish\u003c/strong\u003e; paternal grandson of \u003cem class=\"name\"\u003eJosé dos Santos\u003c/em\u003e and of \u003cem class=\"name\"\u003eAna Cabrita\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eJosé Rodrigues\u003c/em\u003e and of \u003cem class=\"name\"\u003eMargarida da Conceição\u003c/em\u003e, all natives of this City = with \u003cem class=\"name\"\u003eMaria de Santa Ana\u003c/em\u003e, widow of \u003cem class=\"name\"\u003eAntónio da Costa Pereira\u003c/em\u003e, natives of this City. All of which was done by virtue of a warrant presented to me from the Ecclesiastical Chamber of this Bishopric, registered at folio sixty-nine. Whereof I made this entry, which I signed with the aforesaid witnesses, on the day, month and year as above.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eThe four grandparent names.\u003c/strong\u003e I read \u003cem\u003eJosé dos Santos\u003c/em\u003e, \u003cem\u003eAnna Cabrita\u003c/em\u003e, \u003cem\u003eJosé Rodrigues\u003c/em\u003e, \u003cem\u003eMargarida da Conceição\u003c/em\u003e. These are new great-great-great-grandparents, so they are worth a slow second look.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003e“naturais desta Freguezia.”\u003c/strong\u003e This is the load-bearing phrase — \u003cem\u003eof this parish\u003c/em\u003e, meaning Santiago, not merely \u003cem\u003eof this City\u003c/em\u003e. It is the first positive evidence that Maria das Dores's family were Santiago people rather than Santa Maria people, and it redirects the whole search. Does it say what I think it says?\u003c/li\u003e\n      \u003cli\u003eRodrigo's trade: I read \u003cstrong\u003eSerrador\u003c/strong\u003e, a sawyer. Could it be \u003cem\u003eLavrador\u003c/em\u003e?\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cp class=\"verdict\"\u003e\u003cstrong\u003eThe one soft joint:\u003c/strong\u003e Francisco José Pereira is Maria das Dores's brother because his parents are named as \u003cem\u003eRodrigo José Pereira and Ignes de Jesus\u003c/em\u003e — exactly hers, from four separate baptism entries. That pair is rare. But it is still a name match, not a document that says “brother.” A baptism naming both children would close it, and finding it is the same search as finding hers.\u003c/p\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — \u003cstrong\u003efolio 116\u003c/strong\u003e, right page, middle entry\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 118\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","q-03-another-domingos-viegas-this-one-from-sa":"\u003cp class=\"why\"\u003eEleven distinct men named Domingos Viegas have turned up in these registers so far, and each one costs time until it is excluded. Here is a twelfth, from a Viegas family at \u003cstrong\u003eSanta Bárbara de Nexe\u003c/strong\u003e, outside Faro — the same village that produced the \u003cem\u003eAntonio Viegas\u003c/em\u003e and \u003cem\u003eManoel Viegas\u003c/em\u003e we logged earlier in this book. I read him as excluded. I would rather have that confirmed than assumed.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-06.jpeg\" alt=\"Close crop of a marriage entry naming Manoel Viegas and Domingos Viegas of Santa Bárbara\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eClose crop of a marriage entry naming Manoel Viegas and Domingos Viegas of Santa Bárbara\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe entry, de-bleached. Legible throughout, which is what makes it a good exclusion test.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003e\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e se celebrarão o Sacramento do Matrimonio por palavras de prezente, segundo ordena o Sagrado Concilio Tridentino, e Constituição deste Bispado; \u003cem class=\"name\"\u003eJosé de Jesus\u003c/em\u003e, Viuvo de \u003cem class=\"name\"\u003eCatharina Maria\u003c/em\u003e, natural desta Freguezia, com \u003cem class=\"name\"\u003eAnna de Jesus\u003c/em\u003e, Solteira, natural da Freguezia de Santa Barbara, termo de Faro, filha de \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eBarbara Joaquina\u003c/em\u003e, neta paterna de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e, e de \u003cem class=\"name\"\u003eBarbara Martins\u003c/em\u003e, neta materna de \u003cem class=\"name\"\u003eAntonio Fernandes\u003c/em\u003e, todos naturais da sobredita Freguezia de Santa Barbara; aos quais dei as bençãos nupciais, tudo em virtude de hum Mandado que me foi aprezentado da Camara Ecclesiastica deste Bispado, registado a folhas setenta, e duas; de que fis este assento, que com as sobreditas testemunhas assignei, dia \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003e\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e was celebrated the Sacrament of Matrimony by words of the present, according as the Sacred Council of Trent and the Constitution of this Bishopric ordain; \u003cem class=\"name\"\u003eJosé de Jesus\u003c/em\u003e, widower of \u003cem class=\"name\"\u003eCatarina Maria\u003c/em\u003e, native of this parish, with \u003cem class=\"name\"\u003eAna de Jesus\u003c/em\u003e, spinster, native of the parish of \u003cstrong\u003eSanta Bárbara, in the district of Faro\u003c/strong\u003e, daughter of \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eBárbara Joaquina\u003c/em\u003e; paternal granddaughter of \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eBárbara Martins\u003c/em\u003e; maternal granddaughter of \u003cem class=\"name\"\u003eAntónio Fernandes\u003c/em\u003e; \u003cstrong\u003eall natives of the aforesaid parish of Santa Bárbara\u003c/strong\u003e. To whom I gave the nuptial blessings, all by virtue of a Warrant presented to me from the Ecclesiastical Chamber of this Bishopric, registered at folio seventy-two. Whereof I made this entry, which I signed with the aforesaid witnesses, on the day \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003eConfirm the exclusion. Our Domingos's family is always written \u003cem\u003enaturais desta Cidade\u003c/em\u003e. This one is \u003cem\u003etodos naturais da sobredita Freguezia de Santa Barbara\u003c/em\u003e — a different place, thirty kilometres west. \u003cstrong\u003eDoes that phrase really cover the grandparents, or only the bride?\u003c/strong\u003e That is the whole exclusion.\u003c/li\u003e\n      \u003cli\u003eA thought worth someone else's judgement: this Domingos Viegas has a son \u003cem\u003eManoel Viegas\u003c/em\u003e, and we logged a \u003cem\u003eManoel Viegas of Santa Bárbara\u003c/em\u003e as a grandparent elsewhere in this same book. They are probably the same man. If so, Santa Bárbara has its own Viegas dynasty and every Viegas from there can be set aside in one go.\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — spread 71, left page\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 71\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","q-04-matheos-pereira-s-marriage":"\u003cp class=\"why\"\u003ePereira is the surname on Maria das Dores's side, and this marriage sits three years before her brother's in the same book. It is close enough to be worth a look and far enough from our known names that I read it as a different family — but the Pereira line is the one we know least about, so a second opinion is cheap here.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-07.jpeg\" alt=\"Close crop of the opening lines of the 1 May 1808 marriage entry\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eClose crop of the opening lines of the 1 May 1808 marriage entry\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eOpening: 1 May 1808, Santiago, with the witnesses.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-08.jpeg\" alt=\"Close crop of the lines naming the bride and groom and their parents and grandparents\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eClose crop of the lines naming the bride and groom and their parents and grandparents\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe parties, their parents and their grandparents.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAo primeiro dia do mez de Maio de mil oito centos e oito annos, nesta Igreja Matriz e Colegiada de Santiago de Tavira, em minha prezença e de \u003cem class=\"name\"\u003eLourenço Martins Ramos\u003c/em\u003e, e de \u003cem class=\"name\"\u003eManoel José Ga\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/em\u003e, testemunhas, no fim deste, commigo abaixo assignadas, se celebrarão o Santo Sacramento do Matrimonio por palavras do prezente, segundo ordena o Sagrado Concillio Tridentino, e Constituições deste Bispado. \u003cem class=\"name\"\u003eMatheos Pereira\u003c/em\u003e, Solteiro, filho de \u003cem class=\"name\"\u003eJosé Pereira\u003c/em\u003e, e de \u003cem class=\"name\"\u003eAndreza da Conceição\u003c/em\u003e, neto Paterno de \u003cem class=\"name\"\u003eDomingos Pereira Brabo\u003c/em\u003e, e de \u003cem class=\"name\"\u003eDomingas Martins\u003c/em\u003e, neto Materno de \u003cem class=\"name\"\u003eClemente Correia\u003c/em\u003e e de \u003cem class=\"name\"\u003eAnna da Graça\u003c/em\u003e, naturais de Santo Estevam; com \u003cem class=\"name\"\u003eRitta do Carmo\u003c/em\u003e, Solteira, natural desta Freguezia, filha de \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e, natural de Moncarapacho, e de \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e da Freguezia da Luz; neta Paterna de \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e e \u003cem class=\"name\"\u003eFelicia da \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e\u003c/em\u003e, naturais de Moncarapacho; neta Materna de \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003ede Almeida\u003c/em\u003e e de \u003cem class=\"name\"\u003eMargarida José\u003c/em\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the first day of the month of May of one thousand eight hundred and eight, in this Matriz and Collegiate Church of Santiago de Tavira, in my presence and that of \u003cem class=\"name\"\u003eLourenço Martins Ramos\u003c/em\u003e and of \u003cem class=\"name\"\u003eManoel José Ga\u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/em\u003e, witnesses, undersigned with me at the foot of this, was celebrated the Holy Sacrament of Matrimony by words of the present, according as the Sacred Council of Trent and the Constitutions of this Bishopric ordain. \u003cem class=\"name\"\u003eMateus Pereira\u003c/em\u003e, bachelor, son of \u003cem class=\"name\"\u003eJosé Pereira\u003c/em\u003e and of \u003cem class=\"name\"\u003eAndreza da Conceição\u003c/em\u003e; paternal grandson of \u003cem class=\"name\"\u003eDomingos Pereira Brabo\u003c/em\u003e and of \u003cem class=\"name\"\u003eDomingas Martins\u003c/em\u003e; maternal grandson of \u003cem class=\"name\"\u003eClemente Correia\u003c/em\u003e and of \u003cem class=\"name\"\u003eAna da Graça\u003c/em\u003e, natives of \u003cstrong\u003eSanto Estêvão\u003c/strong\u003e; with \u003cem class=\"name\"\u003eRita do Carmo\u003c/em\u003e, spinster, native of this parish, daughter of \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e, native of Moncarapacho, and of \u003cem class=\"name\"\u003eMaria Joaquina\u003c/em\u003e of the parish of Luz; paternal granddaughter of \u003cem class=\"name\"\u003eManoel Rodrigues\u003c/em\u003e and \u003cem class=\"name\"\u003eFelícia da \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e\u003c/em\u003e, natives of Moncarapacho; maternal granddaughter of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e \u003cem class=\"name\"\u003ede Almeida\u003c/em\u003e and of \u003cem class=\"name\"\u003eMargarida José\u003c/em\u003e \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eDomingas or Domingos Martins?\u003c/strong\u003e The scribe writes what looks like \u003cem\u003eDomingos Martins\u003c/em\u003e in a slot that must hold a woman — the paternal grandmother. I have read it as \u003cem\u003eDomingas\u003c/em\u003e, the feminine form. If it really is \u003cem\u003eDomingos\u003c/em\u003e, the scribe made an error and this entry is less reliable than it looks.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eCould this José Pereira be Rodrigo José Pereira's brother?\u003c/strong\u003e That is the only way this family touches ours. Rodrigo's parents were José dos Santos and Anna Cabrita (item 2); this Matheos's grandparents are Domingos Pereira Brabo and Domingas Martins, of Santo Estêvão. Different names, different parish — so my answer is no. Sanity-check me.\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/002/C8 — Santiago, Tavira, marriages 1798–1822 — spread 97, right page\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/2a92610370b649bcb03a8cbcea67a137\u003c/code\u003e — image 97\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","q-05-a-jose-viegas-dies-in-1847":"\u003cp class=\"why\"\u003eOur José Viegas Leiria was alive in 1847 — he married Catarina do Rosário in 1850 — so this is not him. But a married José Viegas dying in Santiago in the same decade is plausibly a relative, and the entry names his wife and where they lived. Those are the two things I cannot read. If the wife's name is one we already know, this man joins the tree.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-09.jpeg\" alt=\"Close crop of a death entry with the margin tag José Viegas, cazado\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eClose crop of a death entry with the margin tag José Viegas, cazado\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe entry, enlarged. The margin tag \u003cem\u003eJosé Viegas / Caz.\u003c/em\u003e is clear; the wife's name on the second line is not.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-10.jpeg\" alt=\"Full right-hand page of the death register showing six entries from November 1847\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eFull right-hand page of the death register showing six entries from November 1847\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe whole page, for context — November 1847, all in the hand of Prior Francisco Xavier Lopes Torres, who signed most of our family's records including Maria das Dores's death.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003ePortuguese\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003eAos onze dias do mez de Novembro de mil oito centos quarenta e sete annos, faleceo \u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e, cazado que foi com \u003cem class=\"name\"\u003e\u003cspan class=\"gap\"\u003e[?? Duarte ??]\u003c/span\u003e\u003c/em\u003e, sendo moradores no sitio do \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e; recebeo os Sacramentos do Costume, mas não fez testamento; e no dia seguinte foi encomendado segundo o rito, e sepultado no cemiterio publico desta Cidade. Em fé do que fis este termo, que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eEnglish\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003eOn the eleventh day of the month of November of one thousand eight hundred and forty-seven died \u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e, who was married to \u003cem class=\"name\"\u003e\u003cspan class=\"gap\"\u003e[?? Duarte ??]\u003c/span\u003e\u003c/em\u003e, they being residents at the place of \u003cspan class=\"gap\"\u003e[??]\u003c/span\u003e. He received the customary Sacraments but made no will; and on the following day he was commended according to the rite and buried in the public cemetery of this City. In witness whereof I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Francisco Xavier Lopes Torres\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eThe wife's name.\u003c/strong\u003e Two words on the second line. I think the second is \u003cem\u003eDuarte\u003c/em\u003e and I cannot get the first at all.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eThe place.\u003c/strong\u003e \u003cem\u003e“moradores no sitio do …”\u003c/em\u003e — our family lived at \u003cem\u003eOrtas d'Atalaia\u003c/em\u003e and later \u003cem\u003eRua de São Sebastião\u003c/em\u003e. If this reads as either, he is close kin.\u003c/li\u003e\n    \u003c/ol\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"meta\"\u003e\u003cdl\u003e\n    \u003cdt\u003eArchive\u003c/dt\u003e\u003cdd\u003ePT/TT/PRQ/PTVR06/003/O10 — Santiago, Tavira, deaths 1826–1853 — \u003cstrong\u003efolio 114\u003c/strong\u003e, right page, third entry\u003c/dd\u003e\n    \u003cdt\u003eOnline\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003edigitarq.arquivos.pt/fileViewer/8442bc8ef6b54dac985c1af92216f368\u003c/code\u003e — image 114\u003c/dd\u003e\n    \n  \u003c/dl\u003e\u003c/div\u003e","q-06-francisco-viegas-s-em-other-em-wife":"\u003cp class=\"why\"\u003eDomingos’s parents are fixed beyond argument as \u003cstrong\u003eFrancisco Viegas and Francisca de Jesus\u003c/strong\u003e — both of João’s 1808 baptism and Rodrigo’s 1816 one name them, word for word. This 1805 marriage names the bride’s paternal grandparents as \u003cstrong\u003eFrancisco Viegas and \u003cem\u003eBarbara\u003c/em\u003e de Jesus\u003c/strong\u003e, all “desta Cidade”. If that is the same Francisco, then \u003cstrong\u003eHenrique Viegas is a brother or half-brother of Domingos\u003c/strong\u003e and we have gained a whole sibling line in the generation above. If it is a different Francisco, it is a decoy that will fool the next person who searches on the name.\u003c/p\u003e\n\n  \u003cfigure\u003e\n    \u003cdiv class=\"scroller\"\u003e\u003cfigure class=\"docimg\"\u003e\u003cimg src=\"img/queue-queue-img-11.jpeg\" alt=\"Santiago marriage register C8, folio 62, the entry of 24 August 1805, enlarged\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eSantiago marriage register C8, folio 62, the entry of 24 August 1805, enlarged\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\n    \u003cfigcaption\u003eThe filiation clause, enlarged. The line that matters is the second from the bottom: \u003cem\u003e“Neta Paterna de Francisco Viegas e Barbara de Jesus”\u003c/em\u003e.\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eWhat I read on the page\u003c/p\u003e\n      \u003cdiv class=\"pt\"\u003e\n        \u003cp\u003e…\u003cspan class=\"name\"\u003eJozé Antonio\u003c/span\u003e Solteiro filho de \u003cspan class=\"name\"\u003eJozé da Palma\u003c/span\u003e e \u003cspan class=\"name\"\u003eMaria do Espirito Santo\u003c/span\u003e, neto Paterno de \u003cspan class=\"name\"\u003eJacinto da Palma\u003c/span\u003e e \u003cspan class=\"name\"\u003eAntonia Maria\u003c/span\u003e, este dalidade e aquela da Luz; neto Materno de \u003cspan class=\"name\"\u003eAntonio Rodrigues Cavaleiro\u003c/span\u003e e \u003cspan class=\"name\"\u003eIzabel da Conceição\u003c/span\u003e da Luz; com \u003cspan class=\"name\"\u003eMaria da Graça\u003c/span\u003e Solteira filha de \u003cspan class=\"name\"\u003eHenrique Viegas\u003c/span\u003e e \u003cspan class=\"name\"\u003eSebastiana da Graça\u003c/span\u003e. \u003cstrong\u003eNeta Paterna de \u003cspan class=\"name\"\u003eFrancisco Viegas\u003c/span\u003e e \u003cspan class=\"name\"\u003eBarbara de Jesus\u003c/span\u003e\u003c/strong\u003e, neta Materna de \u003cspan class=\"name\"\u003eJozé Rodrigues\u003c/span\u003e e \u003cspan class=\"name\"\u003eFrancisca Gomes\u003c/span\u003e, todos desta Cidade…\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cp class=\"lang-label\"\u003eIn English\u003c/p\u003e\n      \u003cdiv class=\"en\"\u003e\n        \u003cp\u003e…\u003cspan class=\"name\"\u003eJosé Antonio\u003c/span\u003e, bachelor, son of \u003cspan class=\"name\"\u003eJosé da Palma\u003c/span\u003e and \u003cspan class=\"name\"\u003eMaria do Espírito Santo\u003c/span\u003e — paternal grandson of \u003cspan class=\"name\"\u003eJacinto da Palma\u003c/span\u003e and \u003cspan class=\"name\"\u003eAntonia Maria\u003c/span\u003e, he of this city and she of Luz; maternal grandson of \u003cspan class=\"name\"\u003eAntonio Rodrigues Cavaleiro\u003c/span\u003e and \u003cspan class=\"name\"\u003eIzabel da Conceição\u003c/span\u003e of Luz — with \u003cspan class=\"name\"\u003eMaria da Graça\u003c/span\u003e, spinster, daughter of \u003cspan class=\"name\"\u003eHenrique Viegas\u003c/span\u003e and \u003cspan class=\"name\"\u003eSebastiana da Graça\u003c/span\u003e. \u003cstrong\u003ePaternal granddaughter of \u003cspan class=\"name\"\u003eFrancisco Viegas\u003c/span\u003e and \u003cspan class=\"name\"\u003eBarbara de Jesus\u003c/span\u003e\u003c/strong\u003e; maternal granddaughter of \u003cspan class=\"name\"\u003eJosé Rodrigues\u003c/span\u003e and \u003cspan class=\"name\"\u003eFrancisca Gomes\u003c/span\u003e — all natives of this city.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"ask\"\u003e\n    \u003ch3\u003eWhat I need answered\u003c/h3\u003e\n    \u003col\u003e\n      \u003cli\u003e\u003cstrong\u003eIs it \u003cem\u003eBarbara\u003c/em\u003e?\u003c/strong\u003e That is the whole question. Read the word cold before you read my column. Our Francisco’s wife is written \u003cem\u003eFrancisca de Jesus\u003c/em\u003e, \u003cem\u003eFrancisca Maria\u003c/em\u003e and \u003cem\u003eFrancisca da Conceição\u003c/em\u003e across five records — the \u003cem\u003esecond\u003c/em\u003e element varies, the first never has. “Barbara” would be a change of the first element, which is a different kind of variation and argues for a different woman.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eDoes it say \u003cem\u003eViegas\u003c/em\u003e or something else?\u003c/strong\u003e The surname travels sideways in this family: elsewhere in this same book a man recorded as “José Viegas” has a father surnamed \u003cem\u003eFernandes\u003c/em\u0
