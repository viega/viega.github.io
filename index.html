<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Viegas Leiria Family</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Five generations of the Viegas Leiria family, from Tavira in the Algarve to Nerva in Spain, built from the parish and civil registers themselves.">
<style>
:root{
  --paper:#F5F6F3; --panel:#E7EAE4; --panel2:#EFF1EC;
  --ink:#171B24; --muted:#616B79; --rule:#D2D7CD;
  --azulejo:#1F4E68; --azulejo-soft:#4A7E9B; --open:#8A6A2F;
  --hot:#A24B3C; --hot-bg:#F6E9E6;
  --st:#0F6E77; --sm:#B0741A; --ot:#5C6470; --an:#171B24;
  --st-soft:#E2F0F1; --sm-soft:#F7EBD8; --riv:#7FA8C4; --ink-2:#39404B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13161B; --panel:#1C2028; --panel2:#181C22;
  --ink:#E7EAE5; --muted:#98A2AE; --rule:#2A3038;
  --azulejo:#7DB2D0; --azulejo-soft:#5D8FAB; --open:#C9A263;
  --hot:#E08272; --hot-bg:#2A1D1A;
  --st:#45B9C2; --sm:#E2A44C; --ot:#939DAA; --an:#E7EAE5;
  --st-soft:#123037; --sm-soft:#33260F; --riv:#3F6A86; --ink-2:#B9C0CA;
}}
:root[data-theme="dark"]{
  --paper:#13161B; --panel:#1C2028; --panel2:#181C22;
  --ink:#E7EAE5; --muted:#98A2AE; --rule:#2A3038;
  --azulejo:#7DB2D0; --azulejo-soft:#5D8FAB; --open:#C9A263;
  --hot:#E08272; --hot-bg:#2A1D1A;
  --st:#45B9C2; --sm:#E2A44C; --ot:#939DAA; --an:#E7EAE5;
  --st-soft:#123037; --sm-soft:#33260F; --riv:#3F6A86; --ink-2:#B9C0CA;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  font-size:17px;line-height:1.6;margin:0;padding:0 20px 96px}
.wrap{max-width:980px;margin:0 auto}
.wrap.wide{max-width:1480px}
a{color:var(--azulejo)}
h1{font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.12;margin:0 0 16px;font-weight:600;
  letter-spacing:-.015em;text-wrap:balance}
h2{font-size:1.5rem;margin:0 0 8px;font-weight:600;text-wrap:balance}
h3{font-size:1.16rem;margin:26px 0 8px;font-weight:600}
code{font-family:var(--mono);font-size:.85em}
blockquote{margin:0 0 18px;padding:14px 20px;border-left:2px solid var(--rule);
  font-style:italic;color:var(--muted);max-width:70ch}

/* nav */
nav.top{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;
  padding:18px 0 0;font-family:var(--sans);font-size:.86rem}
nav.top a{display:inline-block;padding:6px 12px;border-radius:2px;text-decoration:none;
  color:var(--muted);border:1px solid transparent}
nav.top a:hover{color:var(--ink);background:var(--panel2)}
nav.top a.on{color:var(--paper);background:var(--azulejo);border-color:var(--azulejo)}
nav.top .brand{font-family:var(--serif);font-weight:600;font-size:1rem;color:var(--ink);
  margin-right:12px;padding:6px 0;text-decoration:none;border:0}
nav.top .brand:hover{background:none}

header.masthead{max-width:66ch;padding:38px 0 30px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--azulejo);margin:0 0 16px}
.standfirst{font-size:1.06rem;color:var(--muted);margin:0}
.sec{margin-top:52px;padding-top:28px;border-top:1px solid var(--rule)}
.kind{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.lede{color:var(--muted);margin:0 0 24px;max-width:72ch}
.prose{max-width:70ch}
.prose h2{margin-top:38px}
.prose h3{margin-top:30px}

/* legend + controls */
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 18px;
  font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.swatch{width:26px;height:14px;border-radius:2px;flex:none}
.sw-doc{background:var(--panel);border-left:3px solid var(--azulejo)}
.sw-open{background:transparent;border:1px dashed var(--open);border-left:3px dashed var(--open)}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;margin:0 0 24px;font-family:var(--sans);font-size:.84rem}
.controls button{font:inherit;cursor:pointer;padding:6px 13px;border-radius:2px;
  border:1px solid var(--rule);background:var(--panel2);color:var(--ink)}
.controls button:hover{border-color:var(--azulejo-soft)}
.controls button[aria-pressed="true"]{background:var(--azulejo);color:var(--paper);border-color:var(--azulejo)}

/* tree */
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:14px;padding-left:16px;border-left:1px solid var(--rule)}
ul.tree li{position:relative;padding:7px 0 0}
ul.tree ul>li::before{content:"";position:absolute;left:-16px;top:26px;width:14px;height:1px;background:var(--rule)}
@media (min-width:700px){ul.tree ul{margin-left:20px;padding-left:24px}
  ul.tree ul>li::before{left:-24px;width:22px}}
.person{padding:10px 14px;border-radius:2px;background:var(--panel);border-left:3px solid var(--azulejo);
  position:relative}
.person.open{background:transparent;border:1px dashed var(--rule);border-left:3px dashed var(--open)}
.person.collateral{background:var(--panel2);opacity:.92}
.pname{font-weight:600;font-size:1.04rem;line-height:1.3}
.pname a{text-decoration:none;color:inherit;border-bottom:1px solid transparent}
.pname a:hover{border-bottom-color:var(--azulejo-soft)}
.pname .alt{font-weight:400;color:var(--muted);font-size:.9rem}
.pmeta{font-family:var(--sans);font-size:.83rem;color:var(--muted);margin-top:3px}
.pmeta b{color:var(--ink);font-weight:600}
.pill{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;
  margin-left:8px;vertical-align:2px}
.pill.doc{background:var(--azulejo);color:var(--paper)}
.pill.open{border:1px solid var(--open);color:var(--open)}
.pill.coll{border:1px solid var(--rule);color:var(--muted)}
.rel{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--azulejo-soft);display:block;margin-bottom:2px}
.tog{position:absolute;left:-30px;top:11px;width:20px;height:20px;line-height:18px;
  text-align:center;cursor:pointer;font-family:var(--sans);font-size:13px;
  border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--muted);
  user-select:none;padding:0}
.tog:hover{color:var(--ink);border-color:var(--azulejo-soft)}
li.collapsed>ul{display:none}

/* fact list */
dl.facts{display:grid;grid-template-columns:1fr;gap:0;margin:0}
@media (min-width:660px){dl.facts{grid-template-columns:minmax(120px,170px) 1fr}}
dl.facts dt{font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);padding:13px 16px 4px 0;border-top:1px solid var(--rule)}
dl.facts dd{margin:0;padding:13px 0 13px 0;border-top:1px solid var(--rule)}
@media (max-width:659px){dl.facts dt{border-top:1px solid var(--rule);padding-bottom:0}
  dl.facts dd{border-top:0;padding-top:2px}}
.fact.sourced{font-weight:600}
.fact.unsourced{color:var(--muted);font-style:italic}
.fact .where{font-weight:400;color:var(--muted);font-style:normal}
.srcs{font-family:var(--sans);font-size:.76rem;margin-top:4px}
.srcs a{display:inline-block;margin-right:9px;color:var(--azulejo-soft);text-decoration:none;
  border-bottom:1px dotted var(--azulejo-soft)}
.unsourced-note{font-family:var(--sans);font-size:.74rem;color:var(--open);margin-top:4px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:700}

/* records */
article.record{padding-top:30px;margin-top:36px;border-top:1px solid var(--rule)}
.rec-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:5px}
.rec-head .year{font-family:var(--sans);font-weight:700;font-size:1.5rem;color:var(--azulejo);
  letter-spacing:-.01em}
.rec-head .rkind{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.whenwhere{font-family:var(--sans);font-size:.86rem;color:var(--muted);margin:0 0 20px;max-width:78ch}
.cols{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:860px){.cols{grid-template-columns:1fr 1fr;gap:30px}}
.lang-label{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--azulejo);margin:0 0 8px}
.pt,.en{background:var(--panel2);border:1px solid var(--rule);border-radius:2px;padding:15px 18px}
.pt{font-style:italic}
.pt p,.en p{margin:0 0 11px}.pt p:last-child,.en p:last-child{margin:0}
dl.meta{margin:24px 0 0}
dl.meta dt{font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.05em;
  color:var(--azulejo);margin-top:15px}
dl.meta dd{margin:3px 0 0;max-width:76ch}
.card{background:var(--panel2);border:1px solid var(--rule);border-left:3px solid var(--azulejo-soft);
  border-radius:2px;padding:15px 18px;margin:18px 0}
.card.warn{border-left-color:var(--hot);background:var(--hot-bg)}
details.hunt{margin:22px 0 0;border:1px dashed var(--rule);border-left:3px dashed var(--open);
  border-radius:2px;background:transparent;padding:0}
details.hunt>summary{cursor:pointer;padding:12px 18px;font-family:var(--sans);font-size:.8rem;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--open)}
details.hunt>.hbody{padding:0 18px 16px;max-width:76ch}
details.hunt[open]>summary{border-bottom:1px dashed var(--rule)}
.docimg{margin:18px 0 0}
.docimg img{width:100%;height:auto;border:1px solid var(--rule);border-radius:2px;background:#fff}
.docimg.photo img{max-height:66vh;width:auto;max-width:100%;display:block}
.docimg figcaption{font-family:var(--sans);font-size:.78rem;color:var(--muted);margin-top:7px}
.localnote{font-family:var(--sans);font-size:.8rem;color:var(--open);border:1px dashed var(--open);
  border-radius:2px;padding:9px 13px;display:inline-block;margin-top:6px}

/* index cards / lists */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:780px){.grid{grid-template-columns:1fr 1fr;gap:18px 26px}}
.tile{background:var(--panel2);border:1px solid var(--rule);border-left:3px solid var(--azulejo-soft);
  border-radius:2px;padding:16px 18px}
.tile h4{font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--azulejo);margin:0 0 7px}
.tile h4 a{text-decoration:none}
.tile p{margin:0;font-size:.95rem}
.tile .where{font-family:var(--sans);font-size:.81rem;color:var(--muted);margin-top:9px;display:block}
.tile.done{border-left-color:var(--azulejo);opacity:.72}
.tile.hot{border-left-color:var(--hot)}
.status{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;padding:2px 7px;border-radius:2px;margin-left:8px}
.status.open{border:1px solid var(--open);color:var(--open)}
.status.found,.status.closed{background:var(--azulejo);color:var(--paper)}
.status.superseded{border:1px solid var(--rule);color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto;margin:0 0 8px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.93rem}
thead th{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);text-align:left;padding:0 16px 10px 0;
  border-bottom:1px solid var(--rule)}
tbody td{padding:11px 16px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
tbody td:first-child{font-weight:600;white-space:nowrap}
tbody th.grp{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--azulejo);text-align:left;padding:22px 0 8px;
  border-bottom:1px solid var(--rule)}
.rs{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.rs.read{background:var(--azulejo);color:var(--paper)}
.rs.partial{border:1px solid var(--open);color:var(--open)}
.rs.unread{border:1px solid var(--rule);color:var(--muted)}

footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--rule);
  font-family:var(--sans);font-size:.83rem;color:var(--muted);max-width:74ch}
.backlink{font-family:var(--sans);font-size:.84rem;margin:22px 0 0}
.crumbs{font-family:var(--sans);font-size:.82rem;color:var(--muted);margin:20px 0 10px}
.crumbs a{text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0;font-family:var(--sans);font-size:.82rem}
.chips a{padding:4px 10px;border:1px solid var(--rule);border-radius:2px;text-decoration:none;
  background:var(--panel2)}
.chips a:hover{border-color:var(--azulejo-soft)}
.empty{color:var(--muted);font-style:italic}

/* accessibility + polish */
a:focus-visible,button:focus-visible,summary:focus-visible{
  outline:2px solid var(--azulejo-soft);outline-offset:2px;border-radius:2px}
.rec-head .year,tbody td:first-child{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
img{max-width:100%;height:auto}
.sibgroup>ul{border-left-style:dotted!important}

/* ---- home: text | tree split with a draggable divider ---- */
.split{display:block}
.pane-tree{min-width:0}
.pane-text{min-width:0}
.splitter{display:none}
@media (min-width:900px){
  .split{display:grid;grid-template-columns:var(--split,360px) 15px minmax(0,1fr);
    align-items:start;column-gap:0}
  .split.text-hidden{grid-template-columns:0 15px minmax(0,1fr)}
  .split.text-hidden .pane-text{display:none}
  /* The text pane deliberately does NOT scroll independently. Making it an
     overflow container clipped glyph overhang on its left edge and, inside a
     sticky element, left the bottom unreachable in Safari. It flows with the
     page instead; the divider handle stays in reach via a sticky child. */
  .pane-text{padding:0 30px 0 3px}
  .splitter{display:block;position:relative;align-self:stretch;min-height:220px;
    cursor:col-resize;background:transparent;border:0;padding:0;width:15px;
    justify-self:center;touch-action:none}
  .splitter::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;
    background:var(--rule)}
  .splitter:hover::before,.splitter[data-dragging="true"]::before{background:var(--azulejo-soft);width:2px;left:6.5px}
  .splitControls{position:sticky;top:42vh;display:flex;flex-direction:column;
    align-items:center;gap:9px}
  .splitter .grip{width:15px;height:38px;border-radius:8px;background:var(--panel);
    border:1px solid var(--rule);display:flex;align-items:center;justify-content:center}
  .splitter:hover .grip{border-color:var(--azulejo-soft)}
  .splitter .grip::after{content:"";width:2px;height:16px;border-radius:2px;background:var(--muted)}
  .splitter:focus-visible{outline:2px solid var(--azulejo-soft);outline-offset:1px;border-radius:4px}
  .paneToggle{width:24px;height:24px;border-radius:50%;background:var(--panel);
    border:1px solid var(--rule);color:var(--muted);font-family:var(--sans);font-size:12px;
    line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .paneToggle:hover{border-color:var(--azulejo-soft);color:var(--ink)}
}
@media (max-width:899px){
  .pane-text{margin-bottom:34px}
}
/* the intro sits in a column beside the tree, so it is set smaller and tighter
   than body prose - a narrow column of 17px serif at 1.6 reads as a wall */
@media (min-width:900px){
  .pane-text .prose{font-size:15px;line-height:1.54}
  .pane-text .prose p{margin:0 0 11px}
  .pane-text .prose ul,.pane-text .prose ol{margin:0 0 12px;padding-left:19px}
  .pane-text .prose li{margin-bottom:5px}
  .pane-text .prose h2{font-size:1.12rem;margin:20px 0 6px}
  .pane-text .prose h3{font-size:1rem;margin:16px 0 5px}
  .pane-text .prose blockquote{margin:0 0 12px;padding:9px 14px;font-size:14.5px}
}
.lede.tight{margin:0 0 14px;font-size:.94rem}

/* trades table on the family story page */
table.trades{min-width:660px}
table.trades td{vertical-align:top}
table.trades td:first-child{white-space:nowrap;width:1%;font-weight:400}
.trade{display:block;font-style:italic;font-weight:600;font-size:1.05rem;color:var(--azulejo)}
.tradelang{display:block;font-family:var(--sans);font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tradenote{color:var(--muted);font-size:.9rem;margin-top:6px;max-width:54ch}
.pane-tree .kind{margin-bottom:10px}

/* ---- parish maps (hand-drawn SVG, ported from tavira_parish_map.html) ---- */
figure.mapfig{margin:0 0 26px}
.mapwrap{overflow-x:auto;background:var(--panel2);border:1px solid var(--rule);border-radius:3px;padding:10px}
svg.map{width:100%;min-width:600px;height:auto;display:block}
svg.map text{font:12px/1 ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
svg.map .pt-st circle{fill:var(--st)} svg.map .pt-st text{fill:var(--st)}
svg.map .pt-sm circle{fill:var(--sm)} svg.map .pt-sm text{fill:var(--sm)}
svg.map .pt-ot circle{fill:none;stroke:var(--ot);stroke-width:1.4} svg.map .pt-ot text{fill:var(--ot)}
svg.map .pt-bo circle{fill:var(--sm);stroke:var(--st);stroke-width:3}
svg.map .pt-bo text{fill:var(--ink);font-weight:600}
svg.map .pt-an rect{fill:var(--an)} svg.map .pt-an text{fill:var(--an);font-weight:600}
svg.map .dashed circle{fill:none;stroke-width:1.6;stroke-dasharray:3 2.4}
svg.map .pt-st.dashed circle{stroke:var(--st)} svg.map .pt-sm.dashed circle{stroke:var(--sm)}
svg.map .river{stroke:var(--riv);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
svg.map .river-lbl{fill:var(--riv);font:italic 12px Georgia,serif;opacity:.9}
svg.map .bnd{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:9 6;opacity:.55}
svg.map .bnd-lbl{fill:var(--ink);font:italic 11px Georgia,serif;opacity:.7}
svg.map .deco path{stroke:var(--muted);stroke-width:1.2}
svg.map .lbl-n,svg.map .lbl-s{fill:var(--muted);font-size:11px;font-family:var(--mono)}
svg.map .lbl-n{text-anchor:middle}
figcaption .t{font-weight:600;font-size:1.06rem;margin-bottom:5px}
figcaption .d{font-family:var(--sans);font-size:.85rem;color:var(--muted);max-width:74ch}

/* parish chips */
.chip{display:inline-block;padding:2px 8px;border-radius:2px;
  font:600 11.5px/1.5 var(--mono);white-space:nowrap}
.c-santiago{background:var(--st-soft);color:var(--st)}
.c-santa{background:var(--sm-soft);color:var(--sm)}
.c-both{background:var(--sm-soft);color:var(--st);box-shadow:inset 0 0 0 1px var(--st)}
.c-other,.c-anchor{background:var(--panel);color:var(--muted)}
.conf{font:600 11.5px/1.5 var(--mono)}
.c-high{color:var(--st)} .c-med{color:var(--sm)} .c-low{color:var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.82rem;
  color:var(--ink-2);white-space:nowrap}
tbody tr.ours td{background:var(--panel)}
tbody tr.ours td:first-child::after{content:" ★";color:var(--azulejo)}
.filterbar{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px;font-family:var(--sans);font-size:.83rem}
.filterbar input{padding:6px 10px;border:1px solid var(--rule);border-radius:3px;
  background:var(--paper);color:var(--ink);font:inherit;min-width:190px}
.filterbar button{font:inherit;cursor:pointer;padding:5px 11px;border-radius:3px;
  border:1px solid var(--rule);background:var(--panel2);color:var(--ink)}
.filterbar button[aria-pressed="true"]{background:var(--azulejo);color:var(--paper);border-color:var(--azulejo)}

<script>window.__DATA__={"site":{"title":"The Viegas Leiria Family","metaDescription":"Five generations of the Viegas Leiria family, from Tavira in the Algarve to Nerva in Spain, built from the parish and civil registers themselves.","rootPersonId":"arturo-viegas-ramirez-1890","favicon":"🪶","pageImages":[{"file":"pages/a-veiga-sign.jpeg","alt":"A weathered corten-steel sign on wooden posts reading A VEIGA, on a grass verge beside a road in the suburbs of A Coruña, Galicia","caption":"A Veiga — a neighborhood in the suburbs of A Coruña, and one of many Galician places that carry the name"},{"file":"pages/tavira-third-order-church.jpeg","alt":"The whitewashed church of the Third Order in Tavira, with a domed lantern tower, three iron-railed balconies along the upper storey and a green arched door onto the square","caption":"The Church of the Third Order, Tavira — where most of the family's burials were recorded. Photograph from visitartavira.pt"}],"footer":"Built from the Tavira parish and civil registers.","pagesRepo":"viega/viega.github.io","pagesHost":"viega.github.io","pagesDir":"~/viega.github.io"},"people":[{"altNames":["Arturo Viega"],"sex":"M","fatherId":"joao-viegas-1861","motherId":"agustina-ramirez-rivera","birth":{"dateText":"24 January 1890, 12 noon","place":"en su casa morada, Villa de Nerva, Huelva, Spain","sources":["1890-birth-arturo-viegas-ramirez"]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Nerva, Huelva, Spain","sources":["1890-birth-arturo-viegas-ramirez"]},"marriages":[],"occupations":[],"residences":[],"summary":"The first of the line born outside Portugal. Registered at Nerva two days after his birth, acta nº 35.","notes":"He is the point where the surname loses its final s — he appears later as Arturo **Viega**.","id":"arturo-viegas-ramirez-1890","name":"Arturo Timoteo Viegas Ramírez"},{"altNames":["João Viegas","Juan Viegas Leiria","Juan Viegas","Juan Viega"],"sex":"M","fatherId":"jose-viegas-leiria-1820","motherId":"catarina-do-rosario-1832","birth":{"dateText":"16 February 1861, 11 p.m.","place":"horta das Freiras, Santiago, Tavira","sources":["1861-baptism-joao-viegas-jose"]},"baptism":{"dateText":"3 March 1861","place":"Santiago, Tavira","sources":["1861-baptism-joao-viegas-jose"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Tavira (Santiago), Portugal","sources":["1861-baptism-joao-viegas-jose","1890-birth-arturo-viegas-ramirez"]},"marriages":[{"spouseId":"agustina-ramirez-rivera","dateText":"before January 1890","place":"Spain — not yet located","order":1,"ancestral":true,"sources":[]}],"occupations":[{"text":"jornalero","whenText":"1890, Nerva","sources":["1890-birth-arturo-viegas-ramirez"]}],"residences":[{"text":"Calle Angosta, Nerva","whenText":"January 1890","sources":["1890-birth-arturo-viegas-ramirez"]}],"summary":"Born in Tavira, he was a day laborer at Nerva in the Rio Tinto mining basin by 1890. He was probably a miner there. And those mines were famously awful, so it's not too surprising that he soon emigrated to Buenos Aires, and eventually to Córdoba, Argentina.","notes":"His 1890 declaration at Nerva states *natural de Tavira (Portugal)* and gives his age as 28 — the record that ties the Portuguese and Spanish halves together. He could not sign it: *\"por manifestar no saber.\"* **His death record has not yet been found.**\n\nOne caution: the 1890 acta calls him a *jornalero*, which is a day labourer and nothing more — it names no sector and no employer. Nerva was a mining town, but the document does not explicitly say he worked the mines. \n\nIt may be possible to get Rio Tinto records... in person. But only if he was a direct employee, and even then it might depend on when he started.","id":"joao-viegas-1861","name":"João Viegas Leiria"},{"altNames":[],"sex":"F","fatherId":"diego-ramirez-medina","motherId":"isidra-rivera-gutierrez","birth":{"dateText":"c. 1861–62","place":"Fuente del Maestre, Badajoz, Spain","sources":["1890-birth-arturo-viegas-ramirez"]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Fuente del Maestre, Badajoz, Spain","sources":["1890-birth-arturo-viegas-ramirez"]},"marriages":[{"spouseId":"joao-viegas-1861","dateText":"before January 1890","place":"Spain — not yet located","order":1,"ancestral":true,"sources":[]}],"occupations":[],"residences":[],"summary":"From Fuente del Maestre in Badajoz — Extremadura, the region that supplied much of the labour to the Huelva mines.","notes":"Her age is given as 28 in January 1890. **Her death record has not been found.**","id":"agustina-ramirez-rivera","name":"Agustina Ramírez Rivera"},{"altNames":[],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Fuente del Maestre, Badajoz","sources":["1890-birth-arturo-viegas-ramirez"]},"marriages":[],"occupations":[],"residences":[],"summary":"Named as Agustina’s father in her son’s 1890 birth registration.","notes":"","id":"diego-ramirez-medina","name":"Diego Ramírez Medina"},{"altNames":[],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"before January 1890","place":"","sources":["1890-birth-arturo-viegas-ramirez"]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Fuente del Maestre, Badajoz","sources":["1890-birth-arturo-viegas-ramirez"]},"marriages":[],"occupations":[],"residences":[],"summary":"Named as Agustina’s mother in 1890, where the entry calls her *difunta* — already dead by then.","notes":"Reading not fully resolved: *Isidra* or *Isidora*.","id":"isidra-rivera-gutierrez","name":"Isidra Rivera Gutiérrez"},{"altNames":[],"sex":"M","fatherId":"domingos-viegas-leiria-1780","motherId":"maria-das-dores","birth":{"dateText":"2 June 1820","place":"Santiago, Tavira","sources":["1820-baptism-jose-domingos-viegas"]},"baptism":{"dateText":"18 June 1820","place":"Santiago, Tavira","sources":["1820-baptism-jose-domingos-viegas"]},"death":{"dateText":"13 July 1895, 11 p.m.","place":"Rua dos Toureiros, Santiago, Tavira","sources":["1895-death-jose-viegas-leiria"]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Tavira (Santiago)","sources":["1820-baptism-jose-domingos-viegas"]},"marriages":[{"spouseId":"maria-jose","dateText":"13 January 1845","place":"Santiago, Tavira","order":1,"ancestral":false,"sources":["1845-marriage-jose-viegas-leiria"]},{"spouseId":"catarina-do-rosario-1832","dateText":"10 July 1850","place":"Santiago, Tavira","order":2,"ancestral":true,"sources":["1850-marriage-jose-viegas-leiria"]}],"occupations":[{"text":"hortelão — market gardener","whenText":"1861","sources":["1861-baptism-joao-viegas-jose"]},{"text":"trabalhador — day labourer","whenText":"1895","sources":["1895-death-jose-viegas-leiria"]}],"residences":[{"text":"Rua dos Toureiros","whenText":"1895","sources":["1895-death-jose-viegas-leiria"]}],"summary":"Twice married — his first wife Maria José died in 1850, and he remarried within seven weeks.\n","notes":"In 19th century Priest Chicken Scratch, it's often easy to mistake José and Joaō!","id":"jose-viegas-leiria-1820","name":"José Viegas Leiria"},{"altNames":["Catalina Rosária das Chagas"],"sex":"F","fatherId":"manoel-de-santa-ana","motherId":"anna-maria","birth":{"dateText":"5 June 1832","place":"Santa Maria, Tavira","sources":["1832-baptism-catarina-manoel-santa"]},"baptism":{"dateText":"11 June 1832","place":"Santa Maria, Tavira","sources":["1832-baptism-catarina-manoel-santa"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Tavira (Santa Maria)","sources":["1832-baptism-catarina-manoel-santa"]},"marriages":[{"spouseId":"jose-viegas-leiria-1820","dateText":"10 July 1850","place":"Santiago, Tavira","order":1,"ancestral":true,"sources":["1850-marriage-jose-viegas-leiria"]}],"occupations":[],"residences":[{"text":"Rua de São Sebastião","whenText":"before her marriage, 1850","sources":["1850-marriage-jose-viegas-leiria"]}],"summary":"Married at eighteen. She is the grandmother named in the 1890 Nerva record — written there, in Spanish, as *Catalina Rosária Chagas*.","notes":"The Nerva spelling is independent corroboration of this identification: *Chagas* is her own maternal grandmother’s name (Catarina das Chagas), which she appears to have carried. **Her death has not yet been found.**","id":"catarina-do-rosario-1832","name":"Catarina do Rosário"},{"altNames":[],"sex":"M","fatherId":"francisco-viegas-leiria","motherId":"francisca-de-jesus","birth":{"dateText":"February 1780","place":"sítio de Bernardinheiro, Santiago, Tavira","sources":["1780-baptism-domingos"]},"baptism":{"dateText":"February 1780","place":"Santiago, Tavira","sources":["1780-baptism-domingos"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Tavira (Santiago)","sources":["1780-baptism-domingos","1807-marriage-domingos-viegas-maria"]},"marriages":[{"spouseId":"maria-das-dores","dateText":"20 March 1807","place":"Ermida de Nossa Senhora da Consolação, then the matriz of Santiago, Tavira","order":1,"ancestral":true,"sources":["1807-marriage-domingos-viegas-maria"]}],"occupations":[{"text":"soldado, Regiment nº 4","whenText":"1813","sources":["1813-baptism-giraldo-domingos-viegas"]},{"text":"soldado of the Garrison","whenText":"1816","sources":["1816-baptism-rodrigo-domingos-viegas"]},{"text":"trabalhador — day labourer","whenText":"1820","sources":["1820-baptism-jose-domingos-viegas"]},{"text":"lavrador — works land as smallholder or tenant","whenText":"1845","sources":["1845-marriage-jose-viegas-leiria"]}],"residences":[{"text":"sítio de Bernardinheiro","whenText":"1780","sources":["1780-baptism-domingos"]},{"text":"Hortas d’Atalaia","whenText":"January 1845","sources":["1845-marriage-jose-viegas-leiria"]},{"text":"Rua de São Sebastião","whenText":"by 1855","sources":["1855-death-maria-dores-domingos"]}],"summary":"Aged 27 at his marriage, and a soldier at the time. Between 1820 and 1845 he moved from working for wages to working land of his own — the one upward step visible in four generations. He signed a register with a **cross** in 1809; he could not write.\n\n**We've found no death record** He outlived his wife, who died in April 1855 described as married rather than widowed, so he died 1855 or later — and Santiago’s death registers have all been scoured from 1826–1880.\n\nThey were very meticulously keeping parish records at this point in history, yet there were some gaps where life was too dire to keep up, like in the 1755.\n\nIn this case, I think it's far more likely he died later in 1855, where there was a huge Cholera outbreak. It would be easy for so many people to be dying that there are gaps like this.","notes":"","id":"domingos-viegas-leiria-1780","name":"Domingos Viegas Leiria"},{"altNames":[],"sex":"F","fatherId":"rodrigo-jose-pereira","motherId":"ignes-de-jesus","birth":{"dateText":"c. 1790–95","place":"Tavira","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"2 April 1855","place":"Rua de São Sebastião, Santiago, Tavira","sources":["1855-death-maria-dores-domingos"]},"burial":{"dateText":"","place":"cemetery of the Third Order of Saint Francis","sources":["1855-death-maria-dores-domingos"]},"origin":{"text":"Tavira (Santiago)","sources":["1811-marriage-francisco-jose-pereira"]},"marriages":[{"spouseId":"domingos-viegas-leiria-1780","dateText":"20 March 1807","place":"Santiago, Tavira","order":1,"ancestral":true,"sources":["1807-marriage-domingos-viegas-maria"]}],"occupations":[],"residences":[],"summary":"Died suddenly, with no time for the sacraments and no will. Her brother’s 1811 marriage is what places her family in Santiago parish rather than Santa Maria, and what carries her line two generations further back than any other branch.\n\nInterestingly, this was a few months BEFORE the 1855 Cholera outbreak that devastated Tavira.","notes":"Her baptism and her own marriage entry aside, no record of her birth has been found; the c.1790–95 window is inferred, not stated.","id":"maria-das-dores","name":"Maria das Dores"},{"altNames":[],"sex":"M","fatherId":"antonio-viegas-leiria","motherId":"maria-gonsalves","birth":{"dateText":"10 December 1731 (probable)","place":"sítio do Curral da Pedra, Santa Catarina da Fonte do Bispo","sources":["1731-baptism-francisco-viegas"]},"baptism":{"dateText":"December 1731 (probable)","place":"Santa Catarina da Fonte do Bispo","sources":["1731-baptism-francisco-viegas"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"natural desta Cidade — Tavira","sources":["1807-marriage-domingos-viegas-maria"]},"marriages":[],"occupations":[],"residences":[],"summary":"Named in all four of his grandchildren’s baptisms and in three marriages, and given the byname *Leiria* outright in his son’s marriage of 1807.  His baptism has now **probably** been found: 10 December 1731 at Santa Catarina, to a Maria Gonçalves — though the entry writes his father’s name as *Domingos* rather than *António*.  So most likely born around 6 Dec / 7 Dec.\n\nThere's good reason to believe that was just a brain fart, that the priest only wrote one of two names, or that the parents changed their minds and started calling him Antonio from an early age (my grandmother didn't know she was born Patricia until she got her birth certificate-- she thought she'd been born Marie).\n\nIt the only possible record we can find that comes close to the other data we have, and it is dead on, in every other detail.","notes":"Careful: his nephew was also called Francisco Viegas, so there are two men of the name in adjacent generations. ","id":"francisco-viegas-leiria","name":"Francisco Viegas Leiria"},{"altNames":["Francisca Maria","Francisca da Conceição"],"sex":"F","fatherId":"antonio-correa","motherId":"elena-maria","birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"natural desta Cidade — Tavira","sources":["1807-marriage-domingos-viegas-maria"]},"marriages":[],"occupations":[],"residences":[],"summary":"One woman under three devotional names across five records.","notes":"","id":"francisca-de-jesus","name":"Francisca de Jesus"},{"altNames":["Antonio Viegas"],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"about 1660–75","place":"","sources":["1694-burial-manoel-viegas"]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"16 May 1734","place":"freguesia de Santa Catarina da Fonte do Bispo","sources":["1734-burial-antonio-viegas"]},"burial":{"dateText":"16 May 1734","place":"Igreja de Santa Catarina da Fonte do Bispo (jazigo, fee 300)","sources":["1734-burial-antonio-viegas"]},"origin":{"text":"“da freguezia de Nossa Senhora da Luz” — stated in 1724 at his marriage and again in 1734 at his burial, ten years and two scribes apart. The later “naturais de Santa Catarina” of 1807 reflects where the family had settled, not where he began.","sources":["1724-marriage-antonio-viegas-maria","1734-burial-antonio-viegas","1807-marriage-domingos-viegas-maria"]},"marriages":[{"spouseId":"apolonia-gonsalves","dateText":"before 1712 — the record does not survive","place":"probably Nossa Senhora da Luz","order":1,"ancestral":false,"sources":["1724-marriage-antonio-viegas-maria"]},{"spouseId":"maria-gonsalves","dateText":"28 December 1724","place":"Igreja de Santa Catarina da Fonte do Bispo","order":2,"ancestral":true,"sources":["1724-marriage-antonio-viegas-maria"]}],"occupations":[],"residences":[],"summary":"The oldest man in the direct line who can be named from a document, and the point at which the line currently stops. He is named as Francisco's father in the \u003cstrong\u003e1780 baptism of Domingos\u003c/strong\u003e and again in the \u003cstrong\u003e1807 marriage\u003c/strong\u003e, both giving him the same wife, \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e, and the same parish, \u003cstrong\u003eSanta Catarina da Fonte do Bispo\u003c/strong\u003e.\n\nHe had two marriages: first to \u003cstrong\u003eApolónia Gonsalves\u003c/strong\u003e, a household already keeping a child at the sítio das Casas Altas by 1694; then, after her death, to \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e on 28 December 1724. Our line descends from the second. Both his marriage and his burial call him a parishioner of \u003cstrong\u003eNossa Senhora da Luz\u003c/strong\u003e. He died in Santa Catarina in May 1734.\n\n\u003cstrong\u003eHis parents are unknown.\u003c/strong\u003e No record yet found names them.","notes":"\u003cstrong\u003eHis birth is calculated, not documented.\u003c/strong\u003e The 1694 burial of his son Manoel puts him at the head of a household with children by then, so he was born around \u003cstrong\u003e1660–75\u003c/strong\u003e — roughly fifty at his 1724 remarriage and in his sixties at his death in 1734.\n\n\u003cstrong\u003eA retired hypothesis, kept because the reasoning matters.\u003c/strong\u003e A baptism of 19 April 1688 at the sítio do Bengado — \u003cem\u003eAntónio, filho de Manoel Viegas e Maria das Neves\u003c/em\u003e — was for a long time taken to be his, on the grounds that it was the only “António, son of a Viegas” in either surviving Santa Catarina baptism book. \u003cstrong\u003eIt is not his\u003c/strong\u003e, and Manoel Viegas and Maria das Neves are no longer shown as his parents: a man burying a son in September 1694 was not baptised in April 1688. The argument for the 1688 entry was an argument from absence, and the absence had a simpler explanation — he was born before these registers begin.\n\nThe counter-argument was that the 1694 couple were a second António Viegas married to a second Apolónia Gonsalves. That is possible in a parish this thick with Viegases, but Apolónia is not one of the interchangeable devotional names, and the 1688 reading also left his daughter Catharina “de maior idade” in 1724 and his styling as a man of Luz both needing special pleading. The later birth removes all three strains at once.","id":"antonio-viegas-leiria","name":"António Viegas Leiria"},{"altNames":[],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Santa Catarina da Fonte do Bispo","sources":["1807-marriage-domingos-viegas-maria","1724-marriage-antonio-viegas-maria"]},"marriages":[{"spouseId":"antonio-viegas-leiria","dateText":"28 December 1724","place":"Igreja de Santa Catarina da Fonte do Bispo","order":2,"ancestral":true,"sources":["1724-marriage-antonio-viegas-maria"]}],"occupations":[],"residences":[],"summary":"A widow of Simão Rodrigues when she married António Viegas on 28 December 1724, at the sítio da Alcaria.","notes":"","id":"maria-gonsalves","name":"Maria Gonçalves"},{"altNames":[],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"natural desta Cidade — Tavira","sources":["1780-baptism-domingos"]},"marriages":[],"occupations":[{"text":"çapateiro — shoemaker","whenText":"1780","sources":["1780-baptism-domingos"]}],"residences":[],"summary":"His surname is unreadable in the 1807 marriage record PDF, where it sits under a strike-through — but the 1780 baptism names him plainly as António Correa, a shoemaker.","notes":"","id":"antonio-correa","name":"António Correa"},{"altNames":["Helena Maria"],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"natural desta Cidade — Tavira","sources":["1807-marriage-domingos-viegas-maria","1780-baptism-domingos"]},"marriages":[],"occupations":[],"residences":[],"summary":"","notes":"","id":"elena-maria","name":"Elena Maria"},{"altNames":[],"sex":"M","fatherId":"jose-dos-santos","motherId":"anna-cabrita","birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"todos desta Freguezia — Santiago, Tavira, stated outright","sources":["1782-marriage-rodrigo-jose-pereira"]},"marriages":[{"spouseId":"ignes-de-jesus","dateText":"30 November 1782","place":"Santiago, Tavira","order":1,"ancestral":true,"sources":["1782-marriage-rodrigo-jose-pereira"]}],"occupations":[{"text":"serrador — sawyer","whenText":"","sources":["1782-marriage-rodrigo-jose-pereira"]}],"residences":[],"summary":"A Sawyer (person who saws trees I believe), and a bachelor at his marriage in 1782. Alive and present in March 1816, standing as godfather to his own grandson Rodrigo.","notes":"","id":"rodrigo-jose-pereira","name":"Rodrigo José Pereira"},{"altNames":["Ignez de Jesus"],"sex":"F","fatherId":"jose-domingues","motherId":"margarida-da-conceicao","birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"tambem desta Freguezia — Santiago, Tavira","sources":["1782-marriage-rodrigo-jose-pereira"]},"marriages":[{"spouseId":"rodrigo-jose-pereira","dateText":"30 November 1782","place":"Santiago, Tavira","order":1,"ancestral":true,"sources":["1782-marriage-rodrigo-jose-pereira"]}],"occupations":[],"residences":[],"summary":"A spinster at her marriage, and named identically in all four grandchildren’s baptisms and in three marriages.","notes":"","id":"ignes-de-jesus","name":"Ignes de Jesus"},{"altNames":[],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"todos desta Freguezia — Santiago","sources":["1782-marriage-rodrigo-jose-pereira","1811-marriage-francisco-jose-pereira"]},"marriages":[],"occupations":[],"residences":[],"summary":"Named in two independent records twenty-nine years apart — his son’s marriage in 1782 and his grandson’s in 1811 — both times paired with Ana Cabrita. That agreement is what makes this branch solid.","notes":"His surname does not descend: his son is a *Pereira*. Ordinary in these registers; *Viegas* descends the same way on the other side.","id":"jose-dos-santos","name":"José dos Santos"},{"altNames":["Anna Cabritta"],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Santiago, Tavira","sources":["1782-marriage-rodrigo-jose-pereira","1811-marriage-francisco-jose-pereira"]},"marriages":[],"occupations":[],"residences":[],"summary":"Named in both the 1782 and 1811 marriages.","notes":"**Cabrita is a distinctive Algarve surname** and the best thing to search on in this branch.","id":"anna-cabrita","name":"Anna Cabrita"},{"altNames":["José Rodrigues"],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Santiago, Tavira","sources":["1782-marriage-rodrigo-jose-pereira","1811-marriage-francisco-jose-pereira"]},"marriages":[],"occupations":[],"residences":[],"summary":"His surname is genuinely in conflict, not merely spelled two ways: his daughter’s marriage of 1782 calls him *Domingues*, his grandson’s of 1811 calls him *Rodrigues*. His wife is Margarida da Conceição in both, and the rest of the entry matches, so this is one man under two surnames.","notes":"The 1807 marriage gives a third vote — *Domingues* — so it stands two to one. A sibling’s baptism would name him again and settle it. Until then, **search both**.","id":"jose-domingues","name":"José Domingues"},{"altNames":[],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Santa Catarina","sources":["1807-marriage-domingos-viegas-maria"]},"marriages":[],"occupations":[],"residences":[],"summary":"The fixed point that holds this couple together while her husband’s surname wobbles — named identically in 1782, 1807 and 1811.","notes":"**Not** the Margarida da Conceição who was mother of Maria José, José Viegas’s first wife; that one is a Dias Pires on an unrelated branch. *da Conceição* is a devotional name, not a surname.","id":"margarida-da-conceicao","name":"Margarida da Conceição"},{"altNames":[],"sex":"M","fatherId":"jose-correia-minhos","motherId":"joanna-rita","birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"d 11-marriage-francisco-jose-pereira"]}],"occupations":[],"residences":[],"summary":"","notes":"","id":"maria-de-santa-ana","name":"Maria de Santa Ana"},{"altNames":[],"sex":"M","fatherId":"antonio-viegas-leiria","motherId":"maria-gonsalves","birth":{"dateText":"August 1726","place":"sítio [...] Gago, Santa Catarina da Fonte do Bispo","sources":["1726-baptism-manoel-antonio-viegas"]},"baptism":{"dateText":"8 August 1726","place":"Santa Catarina da Fonte do Bispo","sources":["1726-baptism-manoel-antonio-viegas"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"","sources":[]},"marriages":[],"occupations":[],"residences":[],"summary":"The eldest of António and Maria Gonçalves's three known children — Manoel (1726), \u003cstrong\u003eMaria (1729)\u003c/strong\u003e and Francisco (1731) — and Francisco's brother, which makes him a great-uncle of this line. Very probably the Manoel Viegas Leiria living at Bernardinheiro by 1756.","notes":"He named a son Francisco Viegas too, which is the source of the two-Franciscos trap.","id":"manoel-viegas-1726","name":"Manoel Viegas"},{"altNames":[],"sex":"F","fatherId":"antonio-viegas-leiria","motherId":"maria-gonsalves","birth":{"dateText":"15 August 1729","place":"sítio do Lagar, Santa Catarina da Fonte do Bispo","sources":["1729-baptism-maria-antonio-viegas"]},"baptism":{"dateText":"26 August 1729","place":"Santa Catarina da Fonte do Bispo","sources":["1729-baptism-maria-antonio-viegas"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Santa Catarina da Fonte do Bispo","sources":["1729-baptism-maria-antonio-viegas"]},"marriages":[],"occupations":[],"residences":[],"summary":"Francisco's sister, and the middle child of the three — born between Manoel (1726) and Francisco (1731). Her baptism is the entry that finally names where the family actually lived: the \u003cstrong\u003esítio do Lagar\u003c/strong\u003e. Nothing is known of her after the day she was christened.","notes":"","id":"maria-viegas-1729","name":"Maria Viegas"},{"altNames":["Apolónia Gonçalves"],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"15 February 1684 (probable)","place":"Santa Catarina da Fonte do Bispo","sources":[]},"baptism":{"dateText":"22 February 1684 (probable)","place":"Santa Catarina da Fonte do Bispo","sources":[]},"death":{"dateText":"before 1718 — the record does not survive","place":"probably Nossa Senhora da Luz","sources":["1724-burial-catharina-viegas"]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Lived with António at the \u003cstrong\u003esítio da Luz\u003c/strong\u003e. A candidate baptism at Santa Catarina in February 1684 — daughter of Manoel Gonsalves and Apolónia Rodrigues — fits a marriage in about 1712, when she would be 28. It is \u003cstrong\u003enot proven\u003c/strong\u003e; Gonsalves is the commonest surname in that book.","sources":["1724-burial-catharina-viegas"]},"marriages":[{"spouseId":"antonio-viegas-leiria","dateText":"before 1712 — the record does not survive","place":"probably Nossa Senhora da Luz","order":1,"ancestral":false,"sources":["1724-marriage-antonio-viegas-maria"]}],"occupations":[],"residences":[],"summary":"António's \u003cstrong\u003efirst wife\u003c/strong\u003e, and the mother of the family he had before the one this line descends from. She is named only twice, and never in her own right: in her daughter Catharina's burial of May 1724, which calls her \u003cem\u003ejá defunta\u003c/em\u003e — already dead — and seven months later in António's remarriage, which calls him her \u003cem\u003ewidower\u003c/em\u003e. Both of the records that would date her, her marriage and her burial, fall in volumes that no longer exist.","notes":"Two lost books stand between us and her. Luz marriage registers run 1684–1699 and then 1711–1784, so a wedding in about 1706–12 is gone; Luz burial registers run 1625–1640 and then 1718–1761, and a full margin scan of the surviving book from 1718 to May 1724 does not contain her — so she died before 1718 and that record is gone too. \u003cstrong\u003eAntónio was therefore a widower for at least six years before he remarried\u003c/strong\u003e, not seven months: the seven-month figure measures from his daughter's death, not his wife's.","id":"apolonia-gonsalves","name":"Apolónia Gonsalves"},{"altNames":[],"sex":"F","fatherId":"antonio-viegas-leiria","motherId":"apolonia-gonsalves","birth":{"dateText":"undated — somewhere about 1705–1717","place":"","sources":["1724-burial-catharina-viegas"]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"9 May 1724","place":"sítio da Luz, freguesia de Nossa Senhora da Luz","sources":["1724-burial-catharina-viegas"]},"burial":{"dateText":"9 May 1724","place":"Igreja de Nossa Senhora da Luz (jazigo, fee 350)","sources":["1724-burial-catharina-viegas"]},"origin":{"text":"Nossa Senhora da Luz","sources":["1724-burial-catharina-viegas"]},"marriages":[],"occupations":[],"residences":[],"summary":"\u003cstrong\u003eFrancisco's half-sister\u003c/strong\u003e, and the only known child of António's first marriage. She died an adult — \u003cem\u003ede maior idade\u003c/em\u003e — on 9 May 1724, seven months before her father remarried. Her burial is the only record that names her mother.","notes":"Called “de maior idade” at death, which places her in the adult fee tier (jazigo 350) rather than the child tier (275) — but the age that divide represents is not known, and in books of this kind it is often about seven rather than legal majority. Her birth should therefore be treated as undated.","id":"catharina-viegas-1724","name":"Catharina Viegas"},{"altNames":[],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Living at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e, Santa Catarina da Fonte do Bispo, in 1688.","sources":["1688-baptism-antonio-viegas"]},"marriages":[{"spouseId":"maria-das-neves","dateText":"before 1688","place":"probably Santa Catarina da Fonte do Bispo","order":1,"ancestral":false,"sources":["1688-baptism-antonio-viegas"]}],"occupations":[],"residences":[],"summary":"Head of a Viegas household at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e, Santa Catarina da Fonte do Bispo, named with his wife Maria das Neves in the baptism of their son António on 19 April 1688, and with her again at Luz in 1665.","notes":"\u003cstrong\u003eFormerly shown as António Viegas Leiria's father; that link has been removed.\u003c/strong\u003e Their son António, baptised in 1688, was taken for our António until the burial of September 1694 showed our man already had a household of his own. The two are different people.\n\nThey are kept here because they are a genuine, documented couple, and because the Bengado is a Viegas neighbourhood that may still matter: it held at least five separate Viegas parties in 1688–90. If they are ever to be traced further, the search key is \u003cem\u003eMaria das Neves\u003c/em\u003e, not \u003cem\u003eManoel Viegas\u003c/em\u003e — Santa Catarina carried at least five distinct Manoel Viegases in this generation, separated only by a wife's name or a byname (Viegas Souza, Viegas Cavaco, Viegas do Seixe).","id":"manoel-viegas-bengado","name":"Manoel Viegas"},{"altNames":[],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"about 1640–45 (revised)","place":"probably Nossa Senhora da Luz","sources":["1665-godparent-maria-das-neves"]},"baptism":{"dateText":"19 August 1660 — a candidate, now doubtful","place":"Nossa Senhora da Luz","sources":["1660-baptism-twins-maria-izabel"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Living at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e, Santa Catarina da Fonte do Bispo, in 1688.","sources":["1688-baptism-antonio-viegas"]},"marriages":[{"spouseId":"manoel-viegas-bengado","dateText":"by April 1665","place":"probably Nossa Senhora da Luz","order":1,"ancestral":false,"sources":["1665-godparent-maria-das-neves","1688-baptism-antonio-viegas"]}],"occupations":[],"residences":[],"summary":"Wife of Manoel Viegas of the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e. The couple are \u003cstrong\u003emarried by April 1665\u003c/strong\u003e, when she stands godmother at Luz and the register calls her \u003cem\u003e“Maria das Neves, molher de Manoel Viegas”\u003c/em\u003e, and they appear together again in the baptism of their son António in 1688. That puts her birth around \u003cstrong\u003e1640–45\u003c/strong\u003e.","notes":"\u003cstrong\u003eFormerly shown as António Viegas Leiria's mother; that link has been removed\u003c/strong\u003e — see the note on her husband.\n\n\u003cstrong\u003eA candidate baptism was proposed and then undermined.\u003c/strong\u003e The Luz registers yielded a \u003cem\u003eMaria das Neves\u003c/em\u003e heading a large family, with twin girls Maria and Izabel baptised on 19 August 1660. That Maria cannot be this one: the 1665 godparent entry shows Maria das Neves already \u003cem\u003emarried\u003c/em\u003e, and the girl baptised in 1660 was four years old. The twin is kept in the collection as a tested and discarded candidate because the reasoning is worth preserving.","id":"maria-das-neves","name":"Maria das Neves"},{"altNames":["José Viegas Leria"],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Living at the \u003cstrong\u003esítio da Fonte do Bispo\u003c/strong\u003e, Santa Catarina, in 1688.","sources":["1688-baptism-magdalena-viegas-leria"]},"marriages":[{"spouseId":null,"dateText":"before 1688","place":"","order":1,"ancestral":false,"sources":[]}],"occupations":[],"residences":[],"summary":"\u003cstrong\u003eNot yet connected to this family\u003c/strong\u003e — and recorded anyway, because he carries the byname \u003cem\u003eViegas Leria\u003c/em\u003e in \u003cstrong\u003e1688\u003c/strong\u003e, which is 119 years earlier than any other attestation of it. He was living at the sítio da Fonte do Bispo in the same parish, in the same book, in the very year António was baptised.","notes":"Kinship with Manoel Viegas and Maria das Neves is likely but unproven: two Viegas households in one small parish in the same year. His own marriage and baptism, and his other children, are the obvious route to whatever ancestor the two share.","id":"joze-viegas-leria-1688","name":"Joze Viegas Leria"},{"altNames":[],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"before April 1688, if she is Manoel's first wife — not found","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"Living at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e, Santa Catarina, in 1680.","sources":["1680-baptism-domingas-viegas"]},"marriages":[],"occupations":[],"residences":[],"summary":"Wife of a \u003cstrong\u003eManoel Viegas\u003c/strong\u003e at the sítio do Bengado in 1680, and mother of Domingas. Whether her husband is António's father is \u003cstrong\u003enot known\u003c/strong\u003e: at least two and probably three men of that name were living at that one sítio in these years.","notes":"","id":"sebastianna-luis","name":"Sebastianna Luis"},{"altNames":[],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"8 December 1680","place":"sítio do Bengado, Santa Catarina da Fonte do Bispo","sources":["1680-baptism-domingas-viegas"]},"baptism":{"dateText":"15 December 1680","place":"Igreja de Santa Catarina da Fonte do Bispo","sources":["1680-baptism-domingas-viegas"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"sítio do Bengado, Santa Catarina da Fonte do Bispo","sources":["1680-baptism-domingas-viegas"]},"marriages":[],"occupations":[],"residences":[],"summary":"Born at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e in December 1680 to a \u003cstrong\u003eManoel Viegas\u003c/strong\u003e and \u003cstrong\u003eSebastianna Luis\u003c/strong\u003e. She was briefly taken for António's half-sister — but the Bengado turns out to hold \u003cstrong\u003eseveral\u003c/strong\u003e Manoel Viegas households, so \u003cstrong\u003eher relationship to this family is unknown\u003c/strong\u003e.","notes":"A third Manoel Viegas appears at the same sítio in April 1690 with yet another wife, Izabel Pires. Three wives in ten years is not one man's life, so the name cannot be used to link households here. Her parents are left unattached in this tree deliberately.","id":"domingas-viegas-1680","name":"Domingas Viegas"},{"altNames":[],"sex":"M","fatherId":"antonio-viegas-leiria","motherId":"apolonia-gonsalves","birth":{"dateText":"before September 1694","place":"","sources":["1694-burial-manoel-viegas"]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"by 15 September 1694, a child","place":"sítio das Casas Altas, Santa Catarina da Fonte do Bispo","sources":["1694-burial-manoel-viegas"]},"burial":{"dateText":"15 September 1694","place":"Igreja de Santa Catarina da Fonte do Bispo","sources":["1694-burial-manoel-viegas"]},"origin":{"text":"sítio das Casas Altas, Santa Catarina da Fonte do Bispo","sources":["1694-burial-manoel-viegas"]},"marriages":[],"occupations":[],"residences":[],"summary":"A child buried at Santa Catarina on \u003cstrong\u003e15 September 1694\u003c/strong\u003e as a \u003cem\u003emenor\u003c/em\u003e, named in his burial as the son of \u003cstrong\u003eAntónio Viegas and his wife Appollonia Gonsalves\u003c/strong\u003e, of the sítio das Casas Altas.","notes":"\u003cstrong\u003eNow attached to this family.\u003c/strong\u003e He was for a time set aside as the child of a second António Viegas married to a second Apolónia Gonsalves, because our António was believed to have been baptised in April 1688 and so could not have been burying a son in 1694. That baptism is no longer thought to be our António's, and this burial is the reason: it is the only sight we have of his first marriage while it was still a living household, thirty years before the documents that record it as ended.","id":"manoel-viegas-1694","name":"Manoel Viegas"},{"altNames":[],"sex":"M","fatherId":"gaspar-fernandes-luz","motherId":"maria-das-neves-elder","birth":{"dateText":"born about 1650","place":"freguesia de Nossa Senhora da Luz","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"","sources":[]},"marriages":[],"occupations":[],"residences":[],"summary":"The eldest of the family that can be dated. He married Maria Gonsalves at Luz on 7 May 1674, his father already dead.","notes":"A child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.","id":"lourenco-fernandes-luz","name":"Lourenço Fernandes"},{"altNames":[],"sex":"M","fatherId":"gaspar-fernandes-luz","motherId":"maria-das-neves-elder","birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"23 October 1656","place":"Nossa Senhora da Luz","sources":["1660-baptism-twins-maria-izabel"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"","sources":[]},"marriages":[],"occupations":[],"residences":[],"summary":"Baptised at Luz on 23 October 1656 — the first child of this couple to be found in the register, and the entry that confirmed the family was there to be found.","notes":"A child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.","id":"bertolameu-fernandes-1656","name":"Bertolameu"},{"altNames":[],"sex":"F","fatherId":"gaspar-fernandes-luz","motherId":"maria-das-neves-elder","birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"30 June 1658","place":"Nossa Senhora da Luz","sources":["1660-baptism-twins-maria-izabel"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"","sources":[]},"marriages":[],"occupations":[],"residences":[],"summary":"Baptised at Luz on 30 June 1658. She may be the daughter of the house who married there in 1684.","notes":"A child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.","id":"catherina-fernandes-1658","name":"Catherina"},{"altNames":[],"sex":"F","fatherId":"gaspar-fernandes-luz","motherId":"maria-das-neves-elder","birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"19 August 1660, a twin","place":"Nossa Senhora da Luz","sources":["1660-baptism-twins-maria-izabel"]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"","sources":[]},"marriages":[],"occupations":[],"residences":[],"summary":"Twin sister of Maria, baptised with her at Luz on 19 August 1660. On present evidence she is as good a candidate as her sister for the woman who left Luz and married Manoel Viegas.","notes":"A child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.","id":"izabel-das-neves-1660","name":"Izabel"},{"altNames":[],"sex":"M","fatherId":"gaspar-fernandes-luz","motherId":"maria-das-neves-elder","birth":{"dateText":"born about 1665","place":"freguesia de Nossa Senhora da Luz","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"","sources":[]},"marriages":[],"occupations":[],"residences":[],"summary":"He married at Luz in 1691, his father long dead and his mother still living — the last sighting of the household.","notes":"A child of Gaspar Fernandes and Maria das Neves of Luz. The family was reconstructed while searching for António's mother; the link to her is \u003cstrong\u003enot\u003c/strong\u003e established — see Maria das Neves.","id":"sebastiao-fernandes-luz","name":"Sebastião"},{"altNames":[],"sex":"M","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"between 1661 and 1674","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"freguesia de Nossa Senhora da Luz","sources":["1660-baptism-twins-maria-izabel"]},"marriages":[{"spouseId":"maria-das-neves-elder","dateText":"by about 1649","place":"probably Nossa Senhora da Luz","order":1,"ancestral":true,"sources":["1660-baptism-twins-maria-izabel"]}],"occupations":[],"residences":[],"summary":"A Luz parishioner, husband of \u003cstrong\u003eMaria das Neves\u003c/strong\u003e. He was alive in November 1661, when the register calls her \u003cem\u003emolher de Gaspar Fernandes\u003c/em\u003e, and dead by May 1674, when she marries off their son Lourenço as his widow.","notes":"Known only through his children and his wife — no baptism, marriage or burial of his own has been found. The Luz burial register for his lifetime does not survive: there is no óbito book between 1640 and 1718. \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eThe link to António is no longer claimed.\u003c/strong\u003e Their daughter Maria, baptised in 1660, was too young to be the \u003cem\u003eMaria das Neves, molher de Manoel Viegas\u003c/em\u003e who stands godmother at Luz in 1665. This family is kept as a fully documented Luz household of the right surname, not as ancestors.","id":"gaspar-fernandes-luz","name":"Gaspar Fernandes"},{"altNames":["Maria dos Neves"],"sex":"F","fatherId":null,"motherId":null,"birth":{"dateText":"","place":"","sources":[]},"baptism":{"dateText":"","place":"","sources":[]},"death":{"dateText":"after 1691","place":"","sources":[]},"burial":{"dateText":"","place":"","sources":[]},"origin":{"text":"freguesia de Nossa Senhora da Luz","sources":["1660-baptism-twins-maria-izabel"]},"marriages":[{"spouseId":"gaspar-fernandes-luz","dateText":"by about 1649","place":"probably Nossa Senhora da Luz","order":1,"ancestral":true,"sources":["1660-baptism-twins-maria-izabel"]}],"occupations":[],"residences":[],"summary":"The head of a large \u003cem\u003edas Neves\u003c/em\u003e family at Luz, and — if the identification holds — António's grandmother. She is documented across \u003cstrong\u003ethirty years\u003c/strong\u003e: a godmother in 1661 with her husband Gaspar Fernandes alive; twice widowed by 1674, when she marries off a son and a daughter within two months; another daughter married in 1684; and a second son, Sebastião, in 1691, when she is still living.","notes":"Born about 1625–30. She is far too old to be António's own mother — a woman marrying off children in 1674 would have been about sixty in 1688 — which is precisely why the search moved to her \u003cem\u003edaughters\u003c/em\u003e. \u003cbr\u003e\u003cbr\u003eHer family also shows the naming habit that runs through this whole district: her daughter \u003cstrong\u003eBarbora\u003c/strong\u003e is styled \u003cem\u003edas Neves\u003c/em\u003e in her 1674 marriage although her father was a Barocadas. The surname descended through the women. \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eThe link to António is no longer claimed.\u003c/strong\u003e Their daughter Maria, baptised in 1660, was too young to be the \u003cem\u003eMaria das Neves, molher de Manoel Viegas\u003c/em\u003e who stands godmother at Luz in 1665. This family is kept as a fully documented Luz household of the right surname, not as ancestors.","id":"maria-das-neves-elder","name":"Maria das Neves"}],"records":[{"id":"1724-marriage-antonio-viegas-maria","year":"1724","kind":"Marriage","kindDetail":"","title":"Antonio Viegas and Maria Gonsalves","whenWhere":"28 December 1724 · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003ethe oldest record in this collection — and a second marriage for both\u003c/strong\u003e","principals":["antonio-viegas-leiria","maria-gonsalves"],"mentions":[],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003evinte e outo de Dezembro de mil settecentos e vinte e quatro\u003c/strong\u003e, em prezença de mim \u003cem class=\"name\"\u003eJoseph Rois Valente\u003c/em\u003e, Coadjutor nesta Igreja de \u003cem class=\"name\"\u003eSanta Catharina da Fonte do Bispo\u003c/em\u003e, contrahiraõ Matrimonio por palavras de prezente … Constituiçõis deste Bispado \u003cem class=\"name\"\u003eAntonio Viegas\u003c/em\u003e, da freguezia de \u003cem class=\"name\"\u003eNossa Senhora da Luz\u003c/em\u003e, \u003cstrong\u003eviuvo de \u003cem class=\"name\"\u003eApolonia Gonsalves\u003c/em\u003e\u003c/strong\u003e, e \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, \u003cstrong\u003eviuva de \u003cem class=\"name\"\u003eSimaõ Rodrigues\u003c/em\u003e\u003c/strong\u003e, do sítio \u003cstrong\u003eda Alcaria Nova, desta freguezia de Santa Catharina da Fonte do Bispo\u003c/strong\u003e; foraõ testemunhas \u003cem class=\"name\"\u003eManoel Rois Faisca\u003c/em\u003e, da freg.\u003csup\u003ea\u003c/sup\u003e de Nossa S.\u003csup\u003era\u003c/sup\u003e da Luz, \u003cem class=\"name\"\u003eLuis Dias\u003c/em\u003e de \u003cem class=\"name\"\u003eS.\u003csup\u003eto\u003c/sup\u003e Estevam\u003c/em\u003e […] m.\u003csup\u003ea\u003c/sup\u003e freg.\u003csup\u003ea\u003c/sup\u003e De que fis este termo, que assigney.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJoseph Rois Valente, Coadjutor · Manoel Rois Faisca · Luis Dias\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003etwenty-eighth of December of one thousand seven hundred and twenty-four\u003c/strong\u003e, in my presence — \u003cem class=\"name\"\u003eJoseph Rois Valente\u003c/em\u003e, priest-in-charge of this Church of \u003cem class=\"name\"\u003eSanta Catarina da Fonte do Bispo\u003c/em\u003e — there contracted Matrimony by words of the present … \u003cem class=\"name\"\u003eAntonio Viegas\u003c/em\u003e, of the parish of \u003cem class=\"name\"\u003eNossa Senhora da Luz\u003c/em\u003e, \u003cstrong\u003ewidower of \u003cem class=\"name\"\u003eApolónia Gonsalves\u003c/em\u003e\u003c/strong\u003e, and \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, \u003cstrong\u003ewidow of \u003cem class=\"name\"\u003eSimão Rodrigues\u003c/em\u003e\u003c/strong\u003e, \u003cstrong\u003eof the sítio da Alcaria Nova, of this parish of Santa Catarina da Fonte do Bispo\u003c/strong\u003e. The witnesses were \u003cem class=\"name\"\u003eManoel Rois Faisca\u003c/em\u003e, of the parish of Nossa Senhora da Luz, and \u003cem class=\"name\"\u003eLuis Dias\u003c/em\u003e of \u003cem class=\"name\"\u003eSanto Estêvão\u003c/em\u003e, […] of my parish. Whereof I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJoseph Rois Valente, assistant priest · Manoel Rois Faisca · Luis Dias\u003c/span\u003e","details":[{"label":"Who they are","body":"\u003cstrong\u003eDomingos Viegas's paternal grandparents\u003c/strong\u003e — the couple named in both the 1807 marriage and the 1780 baptism below. This is now the oldest document in the collection, and it reaches back \u003cstrong\u003eseven generations\u003c/strong\u003e from João of 1861.","scope":"family"},{"label":"Why the identification holds","body":"Three things coincide: the \u003cstrong\u003eexact name pair\u003c/strong\u003e, the \u003cstrong\u003eexact parish\u003c/strong\u003e that both later records give as theirs, and a \u003cstrong\u003edate that fits all three known sons\u003c/strong\u003e — Manuel, José and Francisco, born across roughly 1725–1750. Santa Catarina holds more than one Antonio Viegas, but the other one documented in these years married an \u003cem\u003eIzabel\u003c/em\u003e Gonsalves and has different parents; for \u003cstrong\u003eAntonio Viegas and \u003cem\u003eMaria\u003c/em\u003e Gonsalves\u003c/strong\u003e there is exactly one record.","scope":"hunt"},{"label":"It is his second marriage — and ours is the second family","body":"Antonio is \u003cem\u003eviuvo de Apolónia Gonsalves\u003c/em\u003e. Our line descends from \u003cstrong\u003ethis\u003c/strong\u003e marriage, not the first: the 1807 record names Francisco Viegas Leiria's mother as \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e specifically. So there is \u003cstrong\u003ean entire earlier branch\u003c/strong\u003e — Antonio's children by Apolónia — who are half-siblings of Francisco and were unknown until now.","scope":"family"},{"label":"And she brought a first family too","body":"Maria Gonsalves is \u003cem\u003eviuva de Simão Rodrigues\u003c/em\u003e. Any children of hers by him are Francisco's half-siblings on the mother's side.","scope":"family"},{"label":"Luz or Santa Catarina? — a correction","body":"This entry was previously transcribed here as placing the couple \u003cem\u003e“ambos desta freguezia de Santa Catharina”\u003c/em\u003e, and read as meaning Antonio was Luz-born but a Santa Catarina parishioner by 1724. \u003cstrong\u003eRead again at 11×, there is no “ambos.”\u003c/strong\u003e Line 11 runs \u003cem\u003e“da Alcaria nova desta freguezia de S.\u003csup\u003eta\u003c/sup\u003e”\u003c/em\u003e — the phrase attaches to the \u003cstrong\u003esítio\u003c/strong\u003e, and so locates \u003cem\u003eMaria\u003c/em\u003e. Antonio is described once and plainly: \u003cstrong\u003eof the parish of Nossa Senhora da Luz\u003c/strong\u003e. He is a Luz man marrying a Santa Catarina widow in her own parish, which is the ordinary rule, and a Luz witness comes with him. \u003cstrong\u003eHis burial ten years later says the same thing again\u003c/strong\u003e — see the record of 1734. The \u003cem\u003enaturais de Santa Catarina\u003c/em\u003e of 1807 describes where the family had been settled for two generations by then, not where Antonio began.","scope":"hunt"},{"label":"What it does not give","body":"\u003cstrong\u003eAntonio's parents.\u003c/strong\u003e Portuguese remarriage entries name the \u003cem\u003eprevious spouse\u003c/em\u003e in place of the filiation, so there is none here. The record that will name them is \u003cstrong\u003ehis first marriage, to Apolónia Gonsalves\u003c/strong\u003e — and because he is described as a man of Luz, that entry is most likely in the \u003cstrong\u003eLuz de Tavira marriage register\u003c/strong\u003e. That is the live search.","scope":"family"},{"label":"A note on legibility","body":"These pages are stamped \u003cem\u003e“tinta descolorida”\u003c/em\u003e — faded ink — by the archive itself. The entry was read with a background-division pass and a percentile contrast stretch; a plain contrast boost does not lift it.","scope":"hunt"},{"label":"Three smaller corrections to this transcript","body":"The day is \u003cstrong\u003e“vinte e outo” — the twenty-eighth\u003c/strong\u003e, not the twenty-fifth. Joseph Rois Valente signs as \u003cstrong\u003eCoadjutor\u003c/strong\u003e (assistant priest), not Cura. The first witness gives his full name, \u003cstrong\u003eManoel Rois Faisca\u003c/strong\u003e; the second is \u003cstrong\u003eLuis Dias of Santo Estêvão\u003c/strong\u003e — this page had him as “Christovão de Oliveira”, which the line does not support. The word that follows, once transcribed \u003cem\u003e“ambos”\u003c/em\u003e, does not resolve at any magnification these scans support and is left as […]; whatever it is, it cannot mean “both,” since Manoel Rois Faisca has just been placed in Luz.","scope":"hunt"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR04/002/C2 — Santa Catarina da Fonte do Bispo, marriages 1708–1728 — spread 112, left page, lower entry. Margin tag \u003cem\u003eAn.\u003csup\u003eto\u003c/sup\u003e Viegas / e M.\u003csup\u003ea\u003c/sup\u003e G.\u003csup\u003elis\u003c/sup\u003e\u003c/em\u003e."},"online":{"docId":"d8b049ad0e5e4e57a2aa7d4733909245","image":"112","url":"https://digitarq.arquivos.pt/fileViewer/d8b049ad0e5e4e57a2aa7d4733909245","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/d8b049ad0e5e4e57a2aa7d4733909245\u003c/code\u003e — image 112"},"localOnly":false,"embeddedImages":[]},{"id":"1726-baptism-manoel-antonio-viegas","year":"1726","kind":"Baptism","kindDetail":"August","title":"Manoel, son of Antonio Viegas and Maria Gonçalves","whenWhere":"Born August 1726, chrismated the 8th · Igreja Parochial de Santa Catarina da Fonte do Bispo · \u003cstrong\u003ea son born twenty months after the 1724 marriage\u003c/strong\u003e","principals":["manoel-viegas-1726"],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003eAos […] dias de \u003cstrong\u003eAgosto de mil e sete centos, e vinte e seis\u003c/strong\u003e annos nasceo \u003cem class=\"name\"\u003eManoel\u003c/em\u003e, \u003cstrong\u003efilho legitimo de \u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e, e de sua mulher \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e\u003c/strong\u003e, do [sítio…] Gago, limite desta freguezia; ao qual eu \u003cem class=\"name\"\u003eJoão Dias Sacramento\u003c/em\u003e, Cura da Igreja Parochial desta de Santa Catharina da Fonte do Bispo, baptizei, e puz os santos oleos aos \u003cstrong\u003eoito\u003c/strong\u003e do ditto mez. Foi padrinho \u003cem class=\"name\"\u003e[…] Cabral\u003c/em\u003e desta freguezia. De que fis este termo, que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJoão Dias Sacramento, Cura\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the […] day of \u003cstrong\u003eAugust 1726\u003c/strong\u003e was born \u003cem class=\"name\"\u003eManoel\u003c/em\u003e, \u003cstrong\u003elawful son of \u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e and of his wife \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e\u003c/strong\u003e, of the sítio […] Gago, within the bounds of this parish. Whom I, \u003cem class=\"name\"\u003eJoão Dias Sacramento\u003c/em\u003e, priest-in-charge of this parish church of Santa Catarina da Fonte do Bispo, baptised, and administered the holy oils on the \u003cstrong\u003eeighth\u003c/strong\u003e of the said month. The godfather was \u003cem class=\"name\"\u003e[…] Cabral\u003c/em\u003e of this parish. Whereof I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJoão Dias Sacramento, priest-in-charge\u003c/span\u003e","details":[{"label":"Why it matters","body":"\u003cstrong\u003eIt confirms the 1724 marriage is the right couple.\u003c/strong\u003e António Viegas and Maria Gonçalves have a son \u003cstrong\u003etwenty months after their wedding\u003c/strong\u003e, in the same parish. The couple named as Domingos's paternal grandparents in 1780 and 1807 are now documented as a working household, with a child.","scope":"family"},{"label":"Who Manoel is","body":"Very probably \u003cstrong\u003eManoel Viegas Leiria\u003c/strong\u003e, who by 1756 is living at the sítio de \u003cstrong\u003eBernardinheiro\u003c/strong\u003e in Santiago with his wife Marg
