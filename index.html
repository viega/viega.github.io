an class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres · Francisco Rodrigues · \u003cstrong\u003eGeraldo Viegas\u003c/strong\u003e\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eJosé Viegas Leiria, widower — Catarina do Rosário, spinster\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eOn the tenth day of the month of July of one thousand eight hundred and fifty, in this Parish Matriz and Collegiate Church of Santiago of the City of Tavira, in my presence and that of the undersigned witnesses \u003cem class=\"name\"\u003eFrancisco Rodrigues Milhomens\u003c/em\u003e and \u003cem class=\"name\"\u003eGiraldo Viegas Leiria\u003c/em\u003e of this same City, were joined by words of the present in the form of the canonical rite and the constitutions of this Bishopric of the Algarve — \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, \u003cstrong\u003ewidower of \u003cem class=\"name\"\u003eMaria José\u003c/em\u003e\u003c/strong\u003e, buried in the cemetery of the Third Order of Saint Francis of this City, as appears from the respective entry; and \u003cem class=\"name\"\u003eCatarina do Rosário\u003c/em\u003e, spinster, baptized in the Matriz of Santa Maria of this same City, legitimate daughter of \u003cem class=\"name\"\u003eManoel de Sant'Ana\u003c/em\u003e and \u003cem class=\"name\"\u003eAna Maria\u003c/em\u003e, living on the Rua de São Sebastião; paternal granddaughter of \u003cem class=\"name\"\u003eJosé Correia Minhós\u003c/em\u003e and \u003cem class=\"name\"\u003eJoana Rita\u003c/em\u003e; and maternal granddaughter of \u003cem class=\"name\"\u003eJosé Rodrigues Mateus\u003c/em\u003e and \u003cem class=\"name\"\u003eCatarina das Chagas\u003c/em\u003e, all natives of this City. Inasmuch as the banns were read where required, and the other customary enquiries made, no canonical impediment arose to obstruct the marriage they contracted, the Laws of the Realm, regulations and Pastorals in force having been observed. In witness whereof I made this entry, which I signed, and the witnesses, on the day, month and year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Francisco Xavier Lopes Torres · Francisco Rodrigues · \u003cstrong\u003eGeraldo Viegas\u003c/strong\u003e\u003c/span\u003e","details":[{"label":"Note","body":"Catarina was eighteen — she had turned eighteen five weeks earlier. His brother \u003cstrong\u003eGiraldo stood as witness and signed his own name\u003c/strong\u003e. Because José married as a widower, the entry names his late wife instead of his parents, and gives no age. Read with the two records above, the sequence is stark: \u003cstrong\u003ehis wife died on 25 May, their son João on 27 June, and he remarried on 10 July\u003c/strong\u003e — ten weeks. Fast by modern eyes, ordinary for a widower left with young children.","scope":"hunt"}],"notes":"","archive":{"text":"PT/ADFAR/PRQ/TVR06/002/0017 — \"Cazamentos da Freguezia de Sant'Iago 1849–1859\" — spread 13, left-hand page, top entry"},"online":{"docId":"5c7af766dc6949238bc49e0e6505b792","image":"13","url":"https://digitarq.arquivos.pt/fileViewer/5c7af766dc6949238bc49e0e6505b792","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/5c7af766dc6949238bc49e0e6505b792\u003c/code\u003e — image 13"},"localOnly":false,"embeddedImages":[]},{"id":"1855-death-maria-dores-domingos","year":"1855","kind":"Death","kindDetail":"","title":"Maria das Dores, wife of Domingos Viegas Leiria","whenWhere":"Died 2 April 1855 · Rua de São Sebastião, freguesia de Santiago, Tavira","principals":["maria-das-dores"],"mentions":["domingos-viegas-leiria-1780"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eMaria das Dores, Caz.\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eAos dois dias do mez d'Abril de mil oito centos cincoenta e cinco annos, falleceu \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, cazada que foi com \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e, moradores na Rua de São Sebastião, não recebeo os Sacramentos do costume \u003cstrong\u003eporque falleceu de repente\u003c/strong\u003e, não fez testamento, e no dia seguinte foi encommendada segundo o rito, e sepultada no cimiterio dos Terceiros de São Francisco desta Cidade. Em fé do que fiz este termo, que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eMaria das Dores, married\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eOn the second day of the month of April of one thousand eight hundred and fifty-five, there died \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, who was married to \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e, residents on the Rua de São Sebastião. She did not receive the customary Sacraments \u003cstrong\u003ebecause she died suddenly\u003c/strong\u003e; she made no will. On the following day she was commended according to the rite, and buried in the cemetery of the Third Order of Saint Francis of this City. In witness whereof I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Francisco Xavier Lopes Torres\u003c/span\u003e","details":[{"label":"Why it matters","body":"She is entered as \u003cstrong\u003e\"cazada\"\u003c/strong\u003e — married, not widowed — so \u003cstrong\u003eDomingos was still alive on 2 April 1855\u003c/strong\u003e. That is the latest we can place him, and it is the tightest bracket we have ever had on his death.","scope":"family"},{"label":"The family's places","body":"They were living on the \u003cstrong\u003eRua de São Sebastião\u003c/strong\u003e — the same street Catarina came from in 1850, and where Maria José's family lived in 1845. And she was buried in the \u003cstrong\u003ecemetery of the Third Order of Saint Francis\u003c/strong\u003e, the same ground as her daughter-in-law Maria José and her grandson João, both of whom had died there five years earlier.","scope":"family"}],"notes":"","archive":{"text":"PT/ADFAR/PRQ/TVR06/003/0018 — Santiago, Tavira, \"Óbitos\" 1853–1859 — image 11, left-hand page, second entry"},"online":{"docId":"1358fdf34a094f26a5bb66fa7100cf74","image":"11","url":"https://digitarq.arquivos.pt/fileViewer/1358fdf34a094f26a5bb66fa7100cf74","note":"DigitArq — Santiago óbitos 1853–59 (ADFAR), image 11"},"localOnly":false,"embeddedImages":["maria_das_dores_1855/01_name_and_husband.jpg","maria_das_dores_1855/02_entry_rest.jpg"],"imageCaptions":["Her name, and her husband named as living","The rest of the entry"]},{"id":"1861-baptism-joao-viegas-jose","year":"1861","kind":"Baptism","kindDetail":"","title":"João Viegas, son of José Viegas Leiria and Catarina do Rosário","whenWhere":"Born 16 February 1861 at eleven at night · baptized 3 March 1861 · Igreja Paroquial de Santiago, Tavira · entry nº 43","principals":["joao-viegas-1861"],"mentions":["jose-viegas-leiria-1820","catarina-do-rosario-1832","domingos-viegas-leiria-1780","maria-das-dores","manoel-de-santa-ana","anna-maria"],"transcriptPt":"\u003cp\u003eAos tres dias do mez de Março do anno de mil oito centos e sessenta e um pelas cinco oras da tarde na Igreja Parochial de Sant=Iago, Concelho e Districto Ecclesiastico de Tavira, Diocese do Algarve, eu o Presbytero \u003cem class=\"name\"\u003eManoel José Bernardo Coelho\u003c/em\u003e, Prior da mesma Igreja, baptizei solemnemente e puz os Santos Oleos a uma criança do sexo masculino, a que dei o nome de \u003cem class=\"name\"\u003eJoão Viegas\u003c/em\u003e, que nasceu ás onze oras da noite do dia dezeseis, filho legitimo primeiro do nome de \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, Hortelão, e \u003cem class=\"name\"\u003eCatharina do Rosario\u003c/em\u003e, recebidos nesta Igreja e parochianos da mesma, moradores na horta das Freiras, neto paterno de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, materno de \u003cem class=\"name\"\u003eManoel de Sant=Anna\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria Catharina\u003c/em\u003e, Padrinho \u003cem class=\"name\"\u003eManoel José da Conceição\u003c/em\u003e, cazado, Hortelão, morador na horta do Tiro, e tocou com o Diadema de Nossa Senhora \u003cem class=\"name\"\u003eJoão Viegas\u003c/em\u003e, cazado, morador na horta do Vau, aos quaes todos conheço serem os proprios. E para constar lavrei em duplicado o presente assento, que depois de ser lido e conferido perante o padrinho o assignei. Era ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eOs Padrinhos não assignarão por não saberem escrever. — O Prior Manoel José Bernardo Coelho\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the third day of the month of March of the year one thousand eight hundred and sixty-one, at five in the afternoon, in the Parish Church of Santiago, municipality and ecclesiastical district of Tavira, Diocese of the Algarve, I, the priest \u003cem class=\"name\"\u003eManoel José Bernardo Coelho\u003c/em\u003e, Prior of the same Church, solemnly baptized and applied the holy oils to a child of the male sex, to whom I gave the name \u003cem class=\"name\"\u003eJoão Viegas\u003c/em\u003e, \u003cstrong\u003eborn at eleven at night on the sixteenth\u003c/strong\u003e, legitimate son, first of this name, of \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, market gardener, and \u003cem class=\"name\"\u003eCatarina do Rosário\u003c/em\u003e — \u003cstrong\u003emarried in this church\u003c/strong\u003e and parishioners of it, living at the horta das Freiras — paternal grandson of \u003cstrong\u003e\u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e\u003c/strong\u003e, maternal grandson of \u003cem class=\"name\"\u003eManoel de Sant'Ana\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Catarina\u003c/em\u003e. Godfather \u003cem class=\"name\"\u003eManoel José da Conceição\u003c/em\u003e, married, market gardener, living at the horta do Tiro; and \u003cem class=\"name\"\u003eJoão Viegas\u003c/em\u003e, married, living at the horta do Vau, touched him with the Diadem of Our Lady — all of whom I know to be who they say they are. In witness whereof I made this entry in duplicate, which, after being read and checked before the godfather, I signed. Year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe godparents did not sign, not knowing how to write. — The Prior Manoel José Bernardo Coelho\u003c/span\u003e","details":[{"label":"Note","body":"This entry names \u003cstrong\u003eDomingos Viegas and Maria das Dores\u003c/strong\u003e as the child's paternal grandparents — recorded in 1861, in José's own lifetime and his own parish, so it confirms the line independently of the 1895 death record. \u003cstrong\u003e\"Recebidos nesta Igreja\"\u003c/strong\u003e — married in this church — matches the 10 July 1850 entry. José is a \u003cem\u003ehortelão\u003c/em\u003e, a market gardener, at the horta das Freiras; by 1895 he is recorded as a labourer. The \u003cem\u003eJoão Viegas of the horta do Vau\u003c/em\u003e who performs the crown-touching is almost certainly kin, and likely why the boy is named João.","scope":"hunt"},{"label":"Discrepancy","body":"The maternal grandmother is written \u003cstrong\u003e\"Maria Catharina\"\u003c/strong\u003e here, but Catarina's own 1832 baptism and her 1850 marriage both say \u003cstrong\u003e\"Anna Maria\"\u003c/strong\u003e. Two earlier first-hand records against one later one, so Anna Maria should stand — but the inconsistency is real and worth knowing about. Catarina's own maternal grandmother was Catarina das Chagas, a plausible source of the slip.","scope":"hunt"}],"notes":"","archive":{"text":"PT/ADFAR/PRQ/TVR06/001/00033 — Santiago, Tavira, baptisms — \u003cstrong\u003efolio 12\u003c/strong\u003e, entry nº 43"},"online":{"docId":"6c695ed7a6db4aba9965d3ae13580b7a","image":"13","url":"https://digitarq.arquivos.pt/fileViewer/6c695ed7a6db4aba9965d3ae13580b7a","note":"DigitArq — Santiago baptisms 1861 (ADFAR), image 13"},"localOnly":false,"embeddedImages":["joao_1861/01_entry_part1.jpg","joao_1861/02_entry_part2.jpg","joao_1861/03_entry_part3.jpg"],"imageCaptions":["The entry begins","Parents and grandparents","Godparents and the close"]},{"id":"1851-1858-four-baptisms-manoel-jose-rita","year":"1851–1858","kind":"Four baptisms","kindDetail":"","title":"Manoel, José, Rita and Francisco — the elder children of José Viegas Leiria and Catarina do Rosário","whenWhere":"Igreja Matriz de Santiago, Tavira · all four from the same register, ADFAR Santiago baptisms vol. 31 (1846–1859), read for the first time","principals":["manoel-viegas-1851","jose-viegas-c1853","rita-viegas-c1855","francisco-viegas-1858"],"mentions":["jose-viegas-leiria-1820","catarina-do-rosario-1832"],"transcriptPt":"\u003cp\u003eAos treze dias do mez de Novembro de mil oito centos cincoenta e hum annos, nesta Igreja Parochial Matriz Collegiada de Sant=Iago da Cidade de Tavira, baptizei solemnemente, e puz os Santos Oleos a \u003cem class=\"name\"\u003eManoel\u003c/em\u003e que nasceo aos trez dias do mez e Era supra, filho legitimo de \u003cem class=\"name\"\u003eJozé Viegas Leiria\u003c/em\u003e e \u003cem class=\"name\"\u003eCatharina do Rozario\u003c/em\u003e, naturaes desta Cidade, moradores na Orta do Dezembargador, primeiro do nome, do segundo matrimonio do Pae, e primeiro da mulher; neto paterno de \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e; e materno de \u003cem class=\"name\"\u003eManoel de Sant'Anna\u003c/em\u003e e \u003cem class=\"name\"\u003eAnna Maria\u003c/em\u003e, todos naturaes desta Cidade. Foi padrinho \u003cem class=\"name\"\u003eManoel Jozé da Conceição\u003c/em\u003e, morador na Orta do Tiro, e tocou com huma Espada da Senhora das Dores \u003cem class=\"name\"\u003eGiraldo Viegas Leiria\u003c/em\u003e. Em fé do que fiz este termo, que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Francisco Xavier Lopes Torres\u003c/span\u003e","transcriptEn":"","details":[{"label":"What these are","body":"José and Catarina married in July 1850 and João, the boy the tree descends from, was not born until February 1861. That eleven-year gap is now filled. Four elder siblings, all baptized at Santiago, all naming \u003cstrong\u003eDomingos Viegas Leiria and Maria das Dores\u003c/strong\u003e as paternal grandparents.","scope":"family"}],"notes":"","archive":{"text":"PT/ADFAR/PRQ/TVR06/001/00031 — Santiago, Tavira, baptisms 1846–1859. Four separate entries in one book: \u003cb\u003eimage 118\u003c/b\u003e (Manoel, 1851), \u003cb\u003e154\u003c/b\u003e (José, 1853), \u003cb\u003e185\u003c/b\u003e (Rita, 1855) and \u003cb\u003e274\u003c/b\u003e (Francisco, 1858)."},"online":{"docId":"8accc83bdbb14510ada31a8fda4e1408","image":"","url":"https://digitarq.arquivos.pt/fileViewer/8accc83bdbb14510ada31a8fda4e1408","note":"DigitArq — Santiago baptisms 1846–59 (ADFAR)"},"localOnly":false,"embeddedImages":["jose_catarina_children_1851_1858/01_manoel_1851_img118.jpg","jose_catarina_children_1851_1858/02_jose_1853_img154.jpg","jose_catarina_children_1851_1858/03_rita_1855_img185r.jpg","jose_catarina_children_1851_1858/04_francisco_1858_img274.jpg"],"imageCaptions":["Manoel, 1851","José, 1853","Rita, 1855","Francisco, 1858"]},{"id":"1863-death-francisco-jose-viegas","year":"1863","kind":"Death","kindDetail":"","title":"Francisco, son of José Viegas Leiria and Catarina do Rosário","whenWhere":"Died 16 November 1863 at six in the evening · a house at the Horta das Lavas, freguesia de Santiago, Tavira · entry nº 156","principals":["francisco-viegas-1858"],"mentions":["jose-viegas-leiria-1820","catarina-do-rosario-1832"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eAos dezeseis dias do mez de Novembro do anno de mil oito centos e sessenta e tres, ás seis oras de tarde, n'uma casa da horta das Lavas desta freguezia de Sant=Iago, Concelho de Tavira, Diocese do Algarve, falleceu \u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e, de cinco mezes, natural desta freguezia, filho legitimo de \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e e \u003cem class=\"name\"\u003eCatharina do Rosario\u003c/em\u003e, todos desta freguezia, o qual foi sepultado no cimiterio dos Terceiros de São Francisco. E para constar lavrei em duplicado o presente assento, que assigno. Era ut supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Manoel José Bernardo Coelho\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eOn the sixteenth day of the month of November of the year one thousand eight hundred and sixty-three, at six in the evening, in a house at the horta das Lavas of this parish of Santiago, municipality of Tavira, Diocese of the Algarve, there died \u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e, \u003cstrong\u003eaged five months\u003c/strong\u003e, a native of this parish, legitimate son of \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eCatarina do Rosário\u003c/em\u003e, all of this parish; who was buried in the cemetery of the Third Order of Saint Francis. In witness whereof I made this entry in duplicate, which I sign. Year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Manoel José Bernardo Coelho\u003c/span\u003e","details":[{"label":"Why it matters","body":"A \u003cstrong\u003epreviously unknown child of José and Catarina\u003c/strong\u003e — the first of their missing children to surface. Aged five months on 16 November 1863, so \u003cstrong\u003eborn about June 1863\u003c/strong\u003e: a younger brother of João (b. 16 February 1861). He is named \u003cstrong\u003eFrancisco\u003c/strong\u003e, after his great-grandfather Francisco Viegas.","scope":"family"},{"label":"He is the second Francisco","body":"Found later, and it changes the reading of this entry: an \u003cstrong\u003eearlier Francisco was baptized on 17 November 1858\u003c/strong\u003e and described there as \u003cem\u003e\"primeiro filho d'este nome\"\u003c/em\u003e. So the name was reused, which means the 1858 boy had almost certainly died by mid-1863. That earlier death has not been found. Two children of this couple were called Francisco, and only the second one's death is in hand.","scope":"family"},{"label":"Identification","body":"The parent pair is written out in full and matches exactly — \u003cem\u003eJosé Viegas Leiria\u003c/em\u003e and \u003cem\u003eCatharina do Rosario\u003c/em\u003e, married in this parish in 1850. Note the burial ground: the \u003cstrong\u003eTerceiros de São Francisco\u003c/strong\u003e again, the same ground as his grandmother Maria das Dores (1855), his father's first wife Maria José (1850) and the first João (1850).","scope":"hunt"},{"label":"Uncertain reading","body":"The place is written \u003cem\u003ehorta das La—as\u003c/em\u003e; the middle letter can be read as either \u003cstrong\u003ev\u003c/strong\u003e or \u003cstrong\u003en\u003c/strong\u003e, so \u003cem\u003eLavas\u003c/em\u003e or \u003cem\u003eLanas\u003c/em\u003e. Nothing else in the entry turns on it.","scope":"hunt"}],"notes":"","archive":{"text":"PT/ADFAR/PRQ/TVR06/003/0022 — Santiago, Tavira, \"Óbitos\" 1863 — entry nº 156, beginning at the foot of image 23 right-hand page and continuing at the top of image 24 left-hand page"},"online":{"docId":"b94428ee2d4f461d8a6657f24098c0dd","image":"23","url":"https://digitarq.arquivos.pt/fileViewer/b94428ee2d4f461d8a6657f24098c0dd","note":"DigitArq — Santiago óbitos 1863 (ADFAR), image 23"},"localOnly":false,"embeddedImages":["francisco_1863/01_entry_start_img23r.jpg","francisco_1863/02_entry_continuation_img24l.jpg"],"imageCaptions":["The entry begins","The entry continues overleaf"]},{"id":"1878-death-giraldo-viegas-leiria","year":"1878","kind":"Death","kindDetail":"","title":"Giraldo Viegas Leiria, brother of José","whenWhere":"Died 4 December 1878 at nine at night · a house on the Largo d'Atalaia, freguesia de Santiago, Tavira · entry nº 109","principals":["giraldo-viegas-1813"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","maria-do-carmo"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eGirardo Viegas Leiria\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eAos quatro dias do mez de Dezembro do anno de mil oito centos setenta e oito pelas nove horas da noite n'uma casa do largo d'Atalaia desta freguezia de Sant=Iago, concelho e cidade de Tavira, diocese do Algarve falleceu, não tendo recebido os Sacramentos, um individuo do sexo masculino por nome \u003cem class=\"name\"\u003eGirardo Viegas Leiria\u003c/em\u003e, d'edade de sessenta e seis annos, trabalhador, natural desta cidade, morador na dita casa, casado com \u003cem class=\"name\"\u003eMaria do Carmo\u003c/em\u003e, o qual não fez testamento, deixou filhos e foi sepultado no cemiterio da Ordem de São Francisco. E para constar lavrei em duplicado o presente assento, que assigno. Era supra.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Prior Manoel José Bernardo Coelho\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eGirardo Viegas Leiria\u003c/em\u003e \u003cspan class=\"gap\"\u003e(margin)\u003c/span\u003e\u003c/p\u003e\n        \u003cp\u003eOn the fourth day of the month of December of the year one thousand eight hundred and seventy-eight, at nine at night, in a house on the Largo d'Atalaia of this parish of Santiago, municipality and city of Tavira, Diocese of the Algarve, there died, \u003cstrong\u003enot having received the Sacraments\u003c/strong\u003e, an individual of the male sex by the name of \u003cem class=\"name\"\u003eGirardo Viegas Leiria\u003c/em\u003e, \u003cstrong\u003eaged sixty-six years\u003c/strong\u003e, a labourer, a native of this city, living in the said house, \u003cstrong\u003emarried to \u003cem class=\"name\"\u003eMaria do Carmo\u003c/em\u003e\u003c/strong\u003e; who made no will, \u003cstrong\u003eleft children\u003c/strong\u003e, and was buried in the cemetery of the Order of Saint Francis. In witness whereof I made this entry in duplicate, which I sign. Year as above.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eThe Prior Manoel José Bernardo Coelho\u003c/span\u003e","details":[{"label":"Why it matters","body":"The death of \u003cstrong\u003eJosé's elder brother\u003c/strong\u003e — the eldest of Domingos's four known children, baptized 1 September 1813. It closes a life we previously knew only from its two ends.","scope":"family"},{"label":"Identification — three locks","body":"The name is written out in full as \u003cstrong\u003eGirardo Viegas Leiria\u003c/strong\u003e (one of the four spellings already recorded for him). The wife is \u003cstrong\u003eMaria do Carmo\u003c/strong\u003e, whom he married at Santa Maria on 31 January 1842. And he died at the \u003cstrong\u003eLargo d'Atalaia\u003c/strong\u003e — his father Domingos was living at the Hortas d'Atalaia in January 1845. Any one of these alone would be weak; together they are decisive.","scope":"hunt"},{"label":"The age is wrong by one","body":"The entry says sixty-six. Born 25 August 1813, he was \u003cstrong\u003esixty-five\u003c/strong\u003e on 4 December 1878. A reminder that ages in these entries are approximations — José's 1895 record is out by seven years.","scope":"hunt"},{"label":"What it opens","body":"\u003cstrong\u003e\"Deixou filhos\"\u003c/strong\u003e — he left children. Giraldo is reported to have had five between 1844 and 1862 and at least some were alive in 1878, so his descendants are a live thread. Note also that he was still a \u003cem\u003etrabalhador\u003c/em\u003e, like his father and his brother, and buried in the same Third Order ground as the rest of the family.","scope":"family"},{"label":"What it does not give","body":"This priest's format names no parents for adults, so the entry does \u003cstrong\u003enot\u003c/strong\u003e bracket Domingos's death.","scope":"family"}],"notes":"","archive":{"text":"PT/ADFAR/PRQ/TVR06/003/0037 — Santiago, Tavira, \"Óbitos\" 1878 — folio 24, entry nº 109, image 26 left-hand page, continuing at the top of the right-hand page"},"online":{"docId":"90d31fbc430742dcaf6a940841f4ee97","image":"26","url":"https://digitarq.arquivos.pt/fileViewer/90d31fbc430742dcaf6a940841f4ee97","note":"DigitArq — Santiago óbitos 1878 (ADFAR), image 26"},"localOnly":false,"embeddedImages":["giraldo_1878/01_entry_img26l.jpg","giraldo_1878/02_entry_tail_img26r.jpg"],"imageCaptions":["The entry","The close, overleaf"]},{"id":"1895-death-jose-viegas-leiria","year":"1895","kind":"Death","kindDetail":"","title":"José Viegas Leiria","whenWhere":"Died 13 July 1895, 11 p.m. · Rua dos Toureiros, freguesia de Santiago, Tavira · entry nº 50","principals":["jose-viegas-leiria-1820"],"mentions":["domingos-viegas-leiria-1780","maria-das-dores","catarina-do-rosario-1832"],"transcriptPt":"\u003cp\u003eAos treze dias do mez de julho do anno de mil oito centos e noventa e cinco pelas onze horas da noite n'uma casa da rua dos Toureiros desta freguezia de Sant'Iago, concelho e cidade de Tavira, Diocese do Algarve, falleceu, tendo recebido os Sacramentos, um individuo do sexo masculino, por nome \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, d'edade de \u003cstrong\u003eoitenta e dois annos\u003c/strong\u003e, trabalhador, \u003cstrong\u003enatural e parochiano desta freguezia\u003c/strong\u003e, casado com \u003cem class=\"name\"\u003eCatharina do Rosario\u003c/em\u003e, morador na dita casa, filho legitimo de \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, naturaes desta cidade, o qual não fez testamento, deixou filhos \u003cspan class=\"gap\"\u003e…\u003c/span\u003e\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the thirteenth day of the month of July of the year one thousand eight hundred and ninety-five, at eleven o'clock at night, in a house on the Rua dos Toureiros of this parish of Santiago, municipality and city of Tavira, Diocese of the Algarve, there died, having received the Sacraments, an individual of the male sex, by name \u003cem class=\"name\"\u003eJosé Viegas Leiria\u003c/em\u003e, \u003cstrong\u003eaged eighty-two\u003c/strong\u003e, a labourer, \u003cstrong\u003enative and parishioner of this parish\u003c/strong\u003e, married to \u003cem class=\"name\"\u003eCatarina do Rosário\u003c/em\u003e, resident in the said house, legitimate son of \u003cem class=\"name\"\u003eDomingos Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria das Dores\u003c/em\u003e, natives of this city; who made no will, and left children \u003cspan class=\"gap\"\u003e…\u003c/span\u003e\u003c/p\u003e","details":[{"label":"Note","body":"This is the record that ties the family together: it names Catarina as his wife and Domingos and Maria das Dores as his parents, and states he was born in Santiago parish. It gives his age as 82 — but his baptism, found in Santiago B19, shows he was born 2 June 1820 and so was \u003cstrong\u003e75\u003c/strong\u003e. The parish is right; the age is seven years out.","scope":"hunt"}],"notes":"","archive":{"text":"Santiago, Tavira — óbitos, 1895, entry nº 50 (Arquivo Distrital de Faro)"},"online":null,"localOnly":false,"embeddedImages":["jose_1895/01_entry_part1.jpg","jose_1895/02_entry_part2.jpg"],"imageCaptions":["The entry begins","The rest of the entry"]},{"id":"1890-birth-arturo-viegas-ramirez","year":"1890","kind":"Birth","kindDetail":"24 January · civil","title":"Arturo Timoteo Viegas Ramírez, born at Nerva","whenWhere":"Born 24 January 1890, 12 noon, en su casa morada · registered 26 January · Juzgado municipal de la Villa de Nerva, Huelva, Spain · acta nº 35","principals":["arturo-viegas-ramirez-1890"],"mentions":["joao-viegas-1861","agustina-ramirez-rivera","jose-viegas-leiria-1820","catarina-do-rosario-1832","diego-ramirez-medina","isidra-rivera-gutierrez"],"transcriptPt":"","transcriptEn":"\u003cp\u003eIn the Villa of \u003cstrong\u003eNerva\u003c/strong\u003e, at ten in the morning of the \u003cstrong\u003etwenty-sixth of January 1890\u003c/strong\u003e, before the municipal judge and the secretary, appeared \u003cstrong\u003eJuan Viegas Leiria\u003c/strong\u003e, \u003cstrong\u003enative of Tavira (Portugal)\u003c/strong\u003e, aged \u003cstrong\u003etwenty-eight\u003c/strong\u003e, occupation \u003cstrong\u003ejornalero\u003c/strong\u003e, holding a certificate of nationality, resident in this town, Calle Angosta — to register his son, and as his father declared:\u003c/p\u003e\u003cp\u003eThat the said child was born \u003cstrong\u003ein his dwelling house\u003c/strong\u003e on the \u003cstrong\u003etwenty-fourth\u003c/strong\u003e of the present month at \u003cstrong\u003etwelve noon\u003c/strong\u003e. That he is the lawful son of the declarant and of his wife \u003cstrong\u003eAgustina Ramírez Rivera\u003c/strong\u003e, native of \u003cstrong\u003eFuente del Maestre (Badajoz)\u003c/strong\u003e, aged twenty-eight, resident with her husband.\u003c/p\u003e\u003cp\u003eThat he is grandson on the paternal side of \u003cstrong\u003eJosé Viegas Leiria\u003c/strong\u003e and \u003cstrong\u003eCatalina Rosária [das] Chagas\u003c/strong\u003e, \u003cstrong\u003enatives of Tavira\u003c/strong\u003e; and on the maternal side of \u003cstrong\u003eDiego Ramírez Medina\u003c/strong\u003e and \u003cstrong\u003eIsidra Rivera Gutiérrez\u003c/strong\u003e, \u003cem\u003ethe latter deceased\u003c/em\u003e, natives of Fuente del Maestre.\u003c/p\u003e\u003cp\u003eAnd that the said child was given the name \u003cstrong\u003eArturo Timoteo\u003c/strong\u003e. Witnesses: Marcelino Cardón Sánchez, native of Monasterio, 34, married, jornalero, of this town; and Francisco Beato Serrano, 47, married, of this town. The judge and witnesses signed, \u003cstrong\u003eand not the declarant, for stating that he did not know how\u003c/strong\u003e.\u003c/p\u003e","details":[{"label":"It is the hinge between Portugal and Spain","scope":"family","body":"The only document so far that names \u003cstrong\u003eTavira\u003c/strong\u003e and a Spanish town in the same breath. It states outright that Juan was \u003cem\u003enatural de Tavira (Portugal)\u003c/em\u003e, which is what joins the Portuguese registers to everything that follows in Spain and Argentina."},{"label":"Nerva is a mining town","scope":"family","body":"Nerva sits in the \u003cstrong\u003eRiotinto mining basin\u003c/strong\u003e. A Portuguese \u003cem\u003ejornalero\u003c/em\u003e living there in 1890, with a wife from Badajoz, is the ordinary shape of that migration: the mines drew labour from both the Algarve and Extremadura."},{"label":"It gives both parents’ ages","scope":"family","body":"Both are twenty-eight in January 1890, so both were born about \u003cstrong\u003e1861–62\u003c/strong\u003e. Juan’s age here agrees with his Tavira baptism of 16 February 1861."},{"label":"He could not write","scope":"family","body":"The acta closes by recording that the declarant did not sign, \u003cem\u003e“por manifestar no saber”\u003c/em\u003e — for stating that he did not know how. His grandfather Domingos had signed with a cross in 1809."},{"label":"It corroborates João’s mother","scope":"hunt","body":"The paternal grandmother is written \u003cem\u003eCatalina Rosária Chagas\u003c/em\u003e. The Tavira registers give José’s second wife as \u003cstrong\u003eCatarina do Rosário\u003c/strong\u003e, whose own maternal grandmother was \u003cstrong\u003eCatarina das Chagas\u003c/strong\u003e — so the Spanish spelling is an independent hit on the same woman, arrived at from a different country and a different language."},{"label":"A reading left open","scope":"hunt","body":"The street is \u003cem\u003eCalle Angosta\u003c/em\u003e or \u003cem\u003eAugusta\u003c/em\u003e — not resolved. \u003cem\u003eIsidra\u003c/em\u003e may be \u003cem\u003eIsidora\u003c/em\u003e. The paternal grandfather’s byname is rendered close to “Lemos” by this clerk’s hand but is \u003cstrong\u003eLeiria\u003c/strong\u003e."},{"label":"A trap in the year","scope":"hunt","body":"The pre-printed form reads \u003cem\u003e“mil ochocientos ochen-ta y”\u003c/em\u003e. That is \u003cstrong\u003estruck through\u003c/strong\u003e and \u003cem\u003enoventa\u003c/em\u003e written in by hand. The year is \u003cstrong\u003e1890\u003c/strong\u003e, not 188-something."},{"label":"It does not say he mined","scope":"hunt","body":"\u003cem\u003eJornalero\u003c/em\u003e means day labourer and nothing more — no sector, no employer. The mining reading is an inference from where Nerva is, not something the acta states. Nerva was a four-year-old boom town in January 1890, and a day labourer there could as easily have been on construction, on the Riotinto railway, carting, cutting wood and charcoal for the open-air calcination beds, or on the surrounding farmland. He may also have been hired through a \u003cem\u003econtratista\u003c/em\u003e rather than by the company itself, which would matter for whether he appears in its registers at all. The \u003cb\u003epadrón de habitantes\u003c/b\u003e is what would settle it."}],"notes":"Requested from the Nerva civil registry in Spain and obtained as a certified electronic copy — validation code RG:NMa7-SanX-b4fY-XjxE, issued 10 August 2026. **There is no online image of this record**; the certified copy is the primary source and it exists only locally, so the page images are embedded here rather than linked.","archive":{"text":"Registro Civil de Nerva, Huelva, Spain — Sección de Nacimientos, acta nº 35, page 160 of the volume. Certified copy issued by the Ministerio de Justicia (sede.mjusticia.gob.es), validation code RG:NMa7-SanX-b4fY-XjxE."},"online":{"docId":"","image":"","url":"","note":""},"localOnly":true,"embeddedImages":["arturo_1890/08_full_page1.jpg","arturo_1890/09_full_page2.jpg"],"imageCaptions":["Page 1 of the certified copy","Page 2 — the maternal line, the naming, and the signatures"]},{"id":"1752-baptism-francisco-manoel-viegas","year":"1752","kind":"Baptism","kindDetail":"December","title":"Francisco, son of Manoel Viegas and Margarida Gaga","whenWhere":"Born 5 December 1752 · Igreja Matriz de Santiago, Tavira · \u003cstrong\u003ethe earliest record naming António and Maria Gonçalves as a couple with grandchildren\u003c/strong\u003e","principals":[],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e, filho de \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e e de \u003cem class=\"name\"\u003eMargarida Gaga\u003c/em\u003e. Neto pela parte Paterna de \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e\u003c/strong\u003e, e pela Materna de \u003cem class=\"name\"\u003eManoel de [Costa]\u003c/em\u003e e de \u003cem class=\"name\"\u003eFeliciana Gaga\u003c/em\u003e. Nasceo aos \u003cstrong\u003ecinco dias do mez de Dezembro de mil sete centos cincoenta e dous\u003c/strong\u003e…\u003c/p\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e, son of \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eMargarida Gaga\u003c/em\u003e. Grandson on the father's side of \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e\u003c/strong\u003e, and on the mother's of \u003cem class=\"name\"\u003eManoel de [Costa]\u003c/em\u003e and \u003cem class=\"name\"\u003eFeliciana Gaga\u003c/em\u003e. Born on the \u003cstrong\u003efifth day of December 1752\u003c/strong\u003e…\u003c/p\u003e","details":[{"label":"This Francisco is \u003cem\u003enot\u003c/em\u003e ours","body":"He is \u003cstrong\u003eManoel's son\u003c/strong\u003e — a nephew of our Francisco, born 5 December 1752. He is the man who married at Santa Maria on 10 August 1778 aged 25. He has been mistaken for our Francisco before; he now has a birth date and can be excluded on sight.","scope":"family"},{"label":"What it does establish","body":"That \u003cstrong\u003eAntónio Viegas and Maria Gonçalves were a real couple with a grown son fathering children in Santiago by 1752\u003c/strong\u003e. Until the 1756 entry was found, this was the earliest such attestation.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B10 — Santiago, Tavira, baptisms 1752–1758 — image 28, left page. Margin tag \u003cem\u003eFrancisco\u003c/em\u003e."},"online":{"docId":"07ee89d74d7d4d309337be91145608a2","image":"28","url":"https://digitarq.arquivos.pt/fileViewer/07ee89d74d7d4d309337be91145608a2","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/07ee89d74d7d4d309337be91145608a2\u003c/code\u003e — image 28"},"localOnly":false,"embeddedImages":[]},{"id":"1756-baptism-jose-manoel-viegas-leiria","year":"1756","kind":"Baptism","kindDetail":"January","title":"José, son of Manoel Viegas Leiria, at Bernardinheiro","whenWhere":"January 1756 · Igreja Matriz de Santiago, Tavira · \u003cstrong\u003ethe earliest appearance anywhere of the name “Viegas Leiria” — and it is applied to António himself\u003c/strong\u003e","principals":[],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eJosé\u003c/em\u003e — Filho de \u003cstrong\u003e\u003cem class=\"name\"\u003eManoel Viegas Leiria\u003c/em\u003e\u003c/strong\u003e, do \u003cstrong\u003eSítio de Bernardinheiro\u003c/strong\u003e, natural da freguezia de \u003cstrong\u003eSancta Catharina\u003c/strong\u003e, e de sua legítima mulher \u003cem class=\"name\"\u003eMargarida Gaga\u003c/em\u003e, natural da freguezia de \u003cem class=\"name\"\u003eSancto Estevão\u003c/em\u003e. Netto pella parte Paterna de \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e e de \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, naturaes da freguezia de Sancta Catharina da Fonte do Bispo\u003c/strong\u003e. E pella Materna de \u003cem class=\"name\"\u003eManoel [da Costa]\u003c/em\u003e, natural da \u003cem class=\"name\"\u003eAldeia de Cachopo\u003c/em\u003e, e de \u003cem class=\"name\"\u003eFeliciana Gaga\u003c/em\u003e, natural da freguezia de Sancta Catharina…\u003c/p\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eJosé\u003c/em\u003e — son of \u003cstrong\u003e\u003cem class=\"name\"\u003eManoel Viegas Leiria\u003c/em\u003e\u003c/strong\u003e, of the \u003cstrong\u003esítio of Bernardinheiro\u003c/strong\u003e, native of the parish of \u003cstrong\u003eSanta Catarina\u003c/strong\u003e, and of his lawful wife \u003cem class=\"name\"\u003eMargarida Gaga\u003c/em\u003e, native of the parish of \u003cem class=\"name\"\u003eSanto Estêvão\u003c/em\u003e. Grandson on the father's side of \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, natives of the parish of Santa Catarina da Fonte do Bispo\u003c/strong\u003e. And on the mother's of \u003cem class=\"name\"\u003eManoel [da Costa]\u003c/em\u003e, native of the \u003cem class=\"name\"\u003eAldeia de Cachopo\u003c/em\u003e, and \u003cem class=\"name\"\u003eFeliciana Gaga\u003c/em\u003e, native of Santa Catarina…\u003c/p\u003e","details":[{"label":"It moves the byname back fifteen years","body":"“\u003cstrong\u003eViegas Leiria\u003c/strong\u003e” was previously first attested in 1771. Here it is in \u003cstrong\u003eJanuary 1756\u003c/strong\u003e — and crucially it is attached \u003cstrong\u003eto António himself\u003c/strong\u003e, not only to his sons. Whatever the byname means, António carried it.","scope":"family"},{"label":"It explains Bernardinheiro","body":"Our Francisco is at the sítio de Bernardinheiro in 1773 and 1780, and that has never been explained. Here his brother \u003cstrong\u003eManoel is already living there in 1756\u003c/strong\u003e — seventeen years earlier. The family did not arrive at a random hamlet.","scope":"family"},{"label":"How we know it is the same Manoel","body":"The wife \u003cstrong\u003eMargarida Gaga\u003c/strong\u003e of Santo Estêvão and her mother \u003cstrong\u003eFeliciana Gaga\u003c/strong\u003e appear identically in the 1752 and 1771 baptisms of this same couple's children. That two-name match is what ties the three records together.","scope":"family"},{"label":"What it does \u003cem\u003enot\u003c/em\u003e prove","body":"It ties \u003cstrong\u003eManoel\u003c/strong\u003e to António. \u003cstrong\u003eNo document names Manoel and Francisco as brothers\u003c/strong\u003e — they are linked only through the shared parent-pair “António Viegas Leiria and Maria Gonçalves of Santa Catarina”. That inference carries the reconstruction and should be read as an inference.","scope":"caution"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B10 — Santiago, Tavira, baptisms 1752–1758 — image 120, left page. Margin tag \u003cem\u003eJosé\u003c/em\u003e."},"online":{"docId":"07ee89d74d7d4d309337be91145608a2","image":"120","url":"https://digitarq.arquivos.pt/fileViewer/07ee89d74d7d4d309337be91145608a2","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/07ee89d74d7d4d309337be91145608a2\u003c/code\u003e — image 120"},"localOnly":false,"embeddedImages":[]},{"id":"1771-baptism-izabel-manoel-viegas","year":"1771","kind":"Baptism","kindDetail":"October","title":"Izabel, daughter of Manoel Viegas and Margarida Gaga","whenWhere":"Born 19 October 1771 · Igreja Matriz de Santiago, Tavira · \u003cstrong\u003estates outright that Manoel was born in Santa Catarina\u003c/strong\u003e","principals":[],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eIzabel\u003c/em\u003e, filha de \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e, \u003cstrong\u003enatural da freguezia de Santa Catharina\u003c/strong\u003e, e de \u003cem class=\"name\"\u003eMargarida Gaga\u003c/em\u003e da freguezia de \u003cem class=\"name\"\u003eSanto Estevam\u003c/em\u003e: neta paterna de \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e e de \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e da dita freguezia\u003c/strong\u003e: neta materna de \u003cem class=\"name\"\u003eManoel da [Costa]\u003c/em\u003e e de \u003cem class=\"name\"\u003eFeliciana Gaga\u003c/em\u003e de Santo Estevam: nasceu em \u003cstrong\u003edezanove dias do mez de Outubro de mil sete centos e setenta e hum\u003c/strong\u003e annos; foi baptizada nesta Igreja Matriz de Santiago de Tavira.\u003c/p\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eIzabel\u003c/em\u003e, daughter of \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e, \u003cstrong\u003enative of the parish of Santa Catarina\u003c/strong\u003e, and of \u003cem class=\"name\"\u003eMargarida Gaga\u003c/em\u003e of the parish of \u003cem class=\"name\"\u003eSanto Estêvão\u003c/em\u003e: granddaughter on the father's side of \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e of the said parish\u003c/strong\u003e; on the mother's of \u003cem class=\"name\"\u003eManoel da [Costa]\u003c/em\u003e and \u003cem class=\"name\"\u003eFeliciana Gaga\u003c/em\u003e of Santo Estêvão. Born on the \u003cstrong\u003enineteenth of October 1771\u003c/strong\u003e; baptised in this parish church of Santiago de Tavira.\u003c/p\u003e","details":[{"label":"It places Manoel's birth","body":"Manoel is \u003cem\u003enatural da freguezia de Santa Catharina\u003c/em\u003e — consistent with the boy baptised there in \u003cstrong\u003eAugust 1726\u003c/strong\u003e to António Viegas and Maria Gonçalves.","scope":"family"},{"label":"It repeats the two-name key","body":"Wife \u003cstrong\u003eMargarida Gaga\u003c/strong\u003e and her mother \u003cstrong\u003eFeliciana Gaga\u003c/strong\u003e match the 1752 and 1756 entries exactly — the same household across nineteen years.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B12 — Santiago, Tavira, baptisms 1768–1779 — image 62, left page, lower entry."},"online":{"docId":"104f1e176ef7406a8d5cb1e35fa79e55","image":"62","url":"https://digitarq.arquivos.pt/fileViewer/104f1e176ef7406a8d5cb1e35fa79e55","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/104f1e176ef7406a8d5cb1e35fa79e55\u003c/code\u003e — image 62"},"localOnly":false,"embeddedImages":[]},{"id":"1771-baptism-joanna-jose-viegas","year":"1771","kind":"Baptism","kindDetail":"","title":"Joanna, daughter of José Viegas and Maria do Nascimento","whenWhere":"1771 · Igreja Matriz de Santiago, Tavira · sítio de [São] Pedro","principals":[],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eJoanna\u003c/em\u003e, filha de \u003cem class=\"name\"\u003eJozeph Viegas\u003c/em\u003e e de sua legítima mulher \u003cem class=\"name\"\u003eMaria do Nascimento\u003c/em\u003e, [natural] nesta Cidade e moradores no \u003cstrong\u003esítio de [São] Pedro\u003c/strong\u003e desta freguezia: neta paterna de \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e e de \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, da freguezia de Santa [Catarina]\u003c/strong\u003e: neta materna de \u003cem class=\"name\"\u003eManoel Martins\u003c/em\u003e desta Cidade e de \u003cem class=\"name\"\u003e[Antó]nia Maria\u003c/em\u003e da freguezia de Santa Catharina: nasceu … de \u003cstrong\u003emil sete centos e setenta e hum\u003c/strong\u003e annos.\u003c/p\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eJoanna\u003c/em\u003e, daughter of \u003cem class=\"name\"\u003eJoseph Viegas\u003c/em\u003e and of his lawful wife \u003cem class=\"name\"\u003eMaria do Nascimento\u003c/em\u003e, [native] of this City and dwelling at the \u003cstrong\u003esítio de [São] Pedro\u003c/strong\u003e of this parish: granddaughter on the father's side of \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, of the parish of Santa [Catarina]\u003c/strong\u003e; on the mother's of \u003cem class=\"name\"\u003eManoel Martins\u003c/em\u003e of this City and \u003cem class=\"name\"\u003e[Antó]nia Maria\u003c/em\u003e of Santa Catarina. Born in \u003cstrong\u003e1771\u003c/strong\u003e.\u003c/p\u003e","details":[{"label":"A third son naming the same parents","body":"José Viegas gives the same paternal pair — \u003cstrong\u003eAntónio Viegas Leiria and Maria Gonsalves of Santa Catarina\u003c/strong\u003e — as Manoel does in 1756 and 1771. Three separate households, one parent-pair.","scope":"family"},{"label":"Caution on the name José Viegas","body":"An \u003cstrong\u003eunrelated\u003c/strong\u003e José Viegas — son of Innocencio Viega, married to Margarida Gonçalves — was living at Bernardinheiro in the same years. The two are told apart only by wife and by named parents.","scope":"caution"}],"notes":"Day and month not recovered from the entry.","archive":{"text":"PT/TT/PRQ/PTVR06/001/B12 — Santiago, Tavira, baptisms 1768–1779 — image 57, left page, lower entry."},"online":{"docId":"104f1e176ef7406a8d5cb1e35fa79e55","image":"57","url":"https://digitarq.arquivos.pt/fileViewer/104f1e176ef7406a8d5cb1e35fa79e55","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/104f1e176ef7406a8d5cb1e35fa79e55\u003c/code\u003e — image 57"},"localOnly":false,"embeddedImages":[]},{"id":"1773-baptism-twins-francisco-maria","year":"1773","kind":"Baptism","kindDetail":"Twins, March","title":"Francisco and Maria — twins of Francisco Viegas Leiria","whenWhere":"Born 1 March 1773 · Igreja Matriz de Santiago, Tavira · sítio de Bernardinheiro · \u003cstrong\u003ethe only document that says where our Francisco was born\u003c/strong\u003e","principals":[],"mentions":["antonio-viegas-leiria","maria-gonsalves","francisco-viegas-leiria","francisca-de-jesus"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria\u003c/em\u003e, \u003cstrong\u003egémeos\u003c/strong\u003e, filhos de \u003cstrong\u003e\u003cem class=\"name\"\u003eFrancisco Viegas Leiria\u003c/em\u003e, natural desta freguezia de \u003cem class=\"name\"\u003eSanta Catharina\u003c/em\u003e\u003c/strong\u003e, e de sua legítima mulher \u003cem class=\"name\"\u003eFrancisca de Jesus\u003c/em\u003e, ambos moradores em \u003cstrong\u003eBernardinheiro\u003c/strong\u003e: netos paternos de \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e e de \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e, da dita freguezia de Santa Catharina\u003c/strong\u003e: netos maternos de \u003cem class=\"name\"\u003eAntónio [Vieira]\u003c/em\u003e e de \u003cem class=\"name\"\u003eHelena Maria\u003c/em\u003e, desta Cidade: nasceram em o \u003cstrong\u003eprimeiro dia do mês de Março de mil e sete centos e setenta e três\u003c/strong\u003e.\u003c/p\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria\u003c/em\u003e, \u003cstrong\u003etwins\u003c/strong\u003e, children of \u003cstrong\u003e\u003cem class=\"name\"\u003eFrancisco Viegas Leiria\u003c/em\u003e, native of this parish of \u003cem class=\"name\"\u003eSanta Catarina\u003c/em\u003e\u003c/strong\u003e, and of his lawful wife \u003cem class=\"name\"\u003eFrancisca de Jesus\u003c/em\u003e, both dwelling at \u003cstrong\u003eBernardinheiro\u003c/strong\u003e: grandchildren on the father's side of \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas Leiria\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e, of the said parish of Santa Catarina\u003c/strong\u003e; on the mother's of \u003cem class=\"name\"\u003eAntónio [Vieira]\u003c/em\u003e and \u003cem class=\"name\"\u003eHelena Maria\u003c/em\u003e, of this City. Born on the \u003cstrong\u003efirst day of March 1773\u003c/strong\u003e.\u003c/p\u003e","details":[{"label":"Why this record matters most","body":"It is the \u003cstrong\u003eonly surviving document that states where Francisco Viegas Leiria was born\u003c/strong\u003e: \u003cem\u003enatural desta freguezia de Santa Catharina\u003c/em\u003e. Everything about where to search for his baptism rests on this one clause.","scope":"family"},{"label":"It contradicts the 1807 marriage","body":"The 1807 marriage of his son Domingos says Francisco and his wife were \u003cstrong\u003e\u003cem\u003etodos naturais desta Cidade\u003c/em\u003e\u003c/strong\u003e — born in Tavira city. These two records cannot both be right. This one is \u003cstrong\u003econtemporary and first-hand\u003c/strong\u003e (Francisco himself presenting his twins); the 1807 entry is thirty-four years later, about a man long dead. That is the reason for preferring it — a judgement, not a proof.","scope":"caution"},{"label":"The scribes did distinguish city from termo","body":"In these registers the outlying parishes are marked \u003cem\u003e“termo desta Cidade”\u003c/em\u003e and only Santiago and Santa Maria are \u003cem\u003e“desta Cidade”\u003c/em\u003e. The 1807 priest likewise contrasts \u003cem\u003edesta Cidade\u003c/em\u003e with \u003cem\u003eSanta Catharina\u003c/em\u003e in the same sentence. So the conflict is real, not loose wording.","scope":"caution"},{"label":"An elder brother named Francisco","body":"This twin \u003cstrong\u003eFrancisco\u003c/strong\u003e is Domingos's elder brother — one more Francisco Viegas to keep separate from his father and from the many unrelated ones in the city.","scope":"caution"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B12 — Santiago, Tavira, baptisms 1768–1779 — image 92, right page."},"online":{"docId":"104f1e176ef7406a8d5cb1e35fa79e55","image":"92","url":"https://digitarq.arquivos.pt/fileViewer/104f1e176ef7406a8d5cb1e35fa79e55","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/104f1e176ef7406a8d5cb1e35fa79e55\u003c/code\u003e — image 92"},"localOnly":false,"embeddedImages":[]},{"id":"1786-baptism-jose-viegas-child","year":"1786","kind":"Baptism","kindDetail":"June","title":"A child of José Viegas and Maria do Nascimento","whenWhere":"26 June 1786 · Igreja Matriz de Santiago, Tavira · \u003cstrong\u003enames Santa Catarina as a filial of this Matriz\u003c/strong\u003e","principals":[],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003e… filho de \u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e e de \u003cem class=\"name\"\u003eMaria do Nascimento\u003c/em\u003e, \u003cstrong\u003enaturais desta Cidade e freguezia\u003c/strong\u003e; netto paterno de \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e e \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, naturais de \u003cem class=\"name\"\u003eSanta Catharina da Fonte do Bispo, filial desta Matris\u003c/em\u003e\u003c/strong\u003e…\u003c/p\u003e","transcriptEn":"\u003cp\u003e… son of \u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria do Nascimento\u003c/em\u003e, \u003cstrong\u003enatives of this City and parish\u003c/strong\u003e; grandson on the father's side of \u003cstrong\u003e\u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e and \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e, natives of \u003cem class=\"name\"\u003eSanta Catarina da Fonte do Bispo, a filial of this Matriz\u003c/em\u003e\u003c/strong\u003e…\u003c/p\u003e","details":[{"label":"The parish relationship, stated","body":"Santa Catarina da Fonte do Bispo is described as a \u003cstrong\u003e\u003cem\u003efilial desta Matris\u003c/em\u003e\u003c/strong\u003e — a daughter church of Santiago. That is the administrative tie between the serra parish the family came from and the city parish it moved into.","scope":"family"},{"label":"Twenty-two years on, the same couple","body":"José Viegas and Maria do Nascimento appear here in 1786 and again in his 1808 burial. Same husband and wife, same parish — which is how that burial was identified.","scope":"family"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/001/B14 — Santiago, Tavira, baptisms 1785–1791 — spread 15, right page."},"online":{"docId":"aa46050d1a7247b19b297085b5d4377b","image":"15","url":"https://digitarq.arquivos.pt/fileViewer/aa46050d1a7247b19b297085b5d4377b","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/aa46050d1a7247b19b297085b5d4377b\u003c/code\u003e — image 15"},"localOnly":false,"embeddedImages":[]},{"id":"1808-burial-jose-viegas","year":"1808","kind":"Burial","kindDetail":"February","title":"José Viegas of the sítio da Foz","whenWhere":"Died 28 February 1808 · sítio da Foz, Santiago, Tavira · buried in the Capella dos Terceiros de São Francisco","principals":[],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003evinte e oito dias do mez de [Feve]reiro de mil oito centos e oito\u003c/strong\u003e annos faleceo \u003cstrong\u003e\u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e, cazado com \u003cem class=\"name\"\u003eMaria do Nascimento\u003c/em\u003e\u003c/strong\u003e, moradores no \u003cstrong\u003esítio da Foz\u003c/strong\u003e desta freguezia de Santiago de Tavira, recebeo os Sacramentos, não fez testamento, e foi sepultado de minha licença na \u003cstrong\u003eCapella dos Terceiros de São Francisco\u003c/strong\u003e desta Cidade.\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003etwenty-eighth day of February 1808\u003c/strong\u003e died \u003cstrong\u003e\u003cem class=\"name\"\u003eJosé Viegas\u003c/em\u003e, married to \u003cem class=\"name\"\u003eMaria do Nascimento\u003c/em\u003e\u003c/strong\u003e, dwelling at the \u003cstrong\u003esítio da Foz\u003c/strong\u003e in this parish of Santiago de Tavira. He received the Sacraments, made no will, and was buried by my licence in the \u003cstrong\u003eChapel of the Third Order of St Francis\u003c/strong\u003e of this City.\u003c/p\u003e","details":[{"label":"How he was identified","body":"The 1786 baptism gives a \u003cstrong\u003eJosé Viegas married to Maria do Nascimento\u003c/strong\u003e whose parents are António Viegas and Maria Gonsalves. Same husband and wife, same parish, twenty-two years later.","scope":"family"},{"label":"The burial chapel means nothing on its own","body":"The Capella dos Terceiros de São Francisco looked like a kinship signal until it was tested: on one sampled spread, \u003cstrong\u003ethree of the four adult burials\u003c/strong\u003e used that chapel. It was the ordinary adult burial place in Santiago.","scope":"caution"}],"notes":"","archive":{"text":"PT/TT/PRQ/PTVR06/003/O9 — Santiago, Tavira, burials 1802–1826 — image 57, right page, top entry. Margin \u003cem\u003eJosé Viegas / Sem testamento / Jaz. 480\u003c/em\u003e."},"online":{"docId":"5e2ff8b2a9dd450e96809568b3f59fdd","image":"57","url":"https://digitarq.arquivos.pt/fileViewer/5e2ff8b2a9dd450e96809568b3f59fdd","note":"\u003ccode\u003edigitarq.arquivos.pt/fileViewer/5e2ff8b2a9dd450e96809568b3f59fdd\u003c/code\u003e — image 57"},"localOnly":false,"embeddedImages":[]},{"id":"1729-baptism-maria-antonio-viegas","year":"1729","kind":"Baptism","kindDetail":"August","title":"Maria, daughter of António Viegas and Maria Gonçalves","whenWhere":"Born 15 August 1729, baptised the 26th · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003ethe entry that finally names where the family lived\u003c/strong\u003e","principals":["maria-viegas-1729"],"mentions":["antonio-viegas-leiria","maria-gonsalves"],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003equinze de Agosto\u003c/strong\u003e de mil setecentos e \u003cstrong\u003evinte e nove\u003c/strong\u003e nasceo \u003cem class=\"name\"\u003eMaria\u003c/em\u003e, \u003cstrong\u003efilha de \u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e e de sua molher \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e\u003c/strong\u003e, do \u003cstrong\u003esítio do Lagar\u003c/strong\u003e desta freguezia; a qual eu \u003cem class=\"name\"\u003eJozeph Rois Valente\u003c/em\u003e, Coadjutor nesta freguezia de Santa Catharina da Fonte do Bispo, baptizey e pus os santos oleos em os \u003cstrong\u003evinte e seis\u003c/strong\u003e dias do dito mes do dito anno. Foraõ padrinhos \u003cem class=\"name\"\u003eAmaro Pereyra\u003c/em\u003e de \u003cstrong\u003eBernardinheiro\u003c/strong\u003e, termo da cidade de Tavira, e \u003cem class=\"name\"\u003eCatharina Correa\u003c/em\u003e, solteira, filha de \u003cem class=\"name\"\u003eBertholomeu Correa\u003c/em\u003e e de sua molher \u003cem class=\"name\"\u003eMaria Correa\u003c/em\u003e, do sítio do Lagar desta mesma freguezia.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJozeph Rois Valente, Coadjutor\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003efifteenth of August 1729\u003c/strong\u003e was born \u003cem class=\"name\"\u003eMaria\u003c/em\u003e, \u003cstrong\u003edaughter of \u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e and of his wife \u003cem class=\"name\"\u003eMaria Gonçalves\u003c/em\u003e\u003c/strong\u003e, of the \u003cstrong\u003esítio do Lagar\u003c/strong\u003e in this parish. Whom I, \u003cem class=\"name\"\u003eJozeph Rois Valente\u003c/em\u003e, curate in this parish of Santa Catarina da Fonte do Bispo, baptised and administered the holy oils on the \u003cstrong\u003etwenty-sixth\u003c/strong\u003e day of the said month and year. The godparents were \u003cem class=\"name\"\u003eAmaro Pereyra\u003c/em\u003e of \u003cstrong\u003eBernardinheiro\u003c/strong\u003e, in the district of the city of Tavira, and \u003cem class=\"name\"\u003eCatharina Correa\u003c/em\u003e, spinster, daughter of \u003cem class=\"name\"\u003eBertholomeu Correa\u003c/em\u003e and his wife \u003cem class=\"name\"\u003eMaria Correa\u003c/em\u003e, of the sítio do Lagar in this same parish.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJozeph Rois Valente, curate\u003c/span\u003e","details":[{"label":"A daughter nobody knew about","body":"Until this entry was read, António and Maria Gonçalves were known to have had \u003cstrong\u003etwo\u003c/strong\u003e children. \u003cstrong\u003eMaria is a third\u003c/strong\u003e, and she sits exactly where a middle child should: \u003cstrong\u003eManoel August 1726, Maria August 1729, Francisco December 1731\u003c/strong\u003e — roughly thirty months apart each time. Nothing further is known of her.","scope":"family"},{"label":"It names the family's sítio","body":"The 1726 baptism gives a place-name that is illegible under the ink of the line above. This entry states it plainly: the \u003cstrong\u003esítio do Lagar\u003c/strong\u003e — \u003cem\u003elagar\u003c/em\u003e being an olive or wine press. It is the first firm address we have for the household.","scope":"family"},{"label":"The Bernardinheiro thread","body":"The godfather, \u003cem class=\"name\"\u003eAmaro Pereyra\u003c/em\u003e, is \u003cstrong\u003efrom Bernardinheiro\u003c/strong\u003e — the sítio in the Santiago district where \u003cstrong\u003eFrancisco Viegas and Francisca de Jesus were living forty years later\u003c/strong\u003e, in 1768. A christening sponsor is a deliberate choice, so the household already had a tie to that place a generation before the family moved there. \u003cstrong\u003eIt is a thread, not a proof.\u003c/strong\u003e","scope":"caution"},{"label":"Both spellings, one family","body":"The 1726 entry writes the father \u003cem\u003eDiegas\u003c/em\u003e; this one writes him \u003cem\u003eViegas\u003c/em\u003e, three years later, in the same parish. \u003cem\u003eDiegas\u003c/em\u003e is the older form — a patronymic of \u003cem\u003eDiogo\u003c/em\u003e — and the two spellings alternate freely in these books, sometimes in the same clergyman's hand.","scope":"family"}],"notes":"","archive":"Arquivo Nacional da Torre do Tombo — PT/TT/PRQ/PTVR04/001/B6, Santa Catarina da Fonte do Bispo baptisms 1726–1741","online":"","localOnly":true,"embeddedImages":[]},{"id":"1731-baptism-francisco-viegas","year":"1731","kind":"Baptism","kindDetail":"December","title":"Francisco, son of Maria Gonçalves — probably our Francisco","whenWhere":"Born 10 December 1731 · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003eprobably the baptism of Francisco Viegas Leiria\u003c/strong\u003e","principals":["francisco-viegas-leiria"],"mentions":["maria-gonsalves","antonio-viegas-leiria"],"transcriptPt":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e, \u003cstrong\u003efilho de \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e, e de sua mulher \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e\u003c/strong\u003e, do \u003cstrong\u003esítio do Curral da Pedra\u003c/strong\u003e desta freguezia; nasceo aos \u003cstrong\u003edes dias do mez de Dezembro\u003c/strong\u003e da era de \u003cstrong\u003emil sete Centos, e trinta e hum annos\u003c/strong\u003e; e eu o Padre \u003cem class=\"name\"\u003eCustodio Martins Leyria\u003c/em\u003e, Cura desta Igreja de Sancta Catharina da Fonte do Bispo, o baptizei aos […] dias do mesmo mez […] era assima. E foraõ os padrinhos \u003cem class=\"name\"\u003eFrancisco Martins\u003c/em\u003e, solteiro, e \u003cem class=\"name\"\u003eCatharina Martins\u003c/em\u003e, do dito sítio.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eCustodio Martins Leyria, Cura\u003c/span\u003e","transcriptEn":"\u003cp\u003e\u003cem class=\"name\"\u003eFrancisco\u003c/em\u003e, \u003cstrong\u003eson of \u003cem class=\"name\"\u003eDomingos Viegas\u003c/em\u003e and of his wife \u003cem class=\"name\"\u003eMaria Gonsalves\u003c/em\u003e\u003c/strong\u003e, of the \u003cstrong\u003esítio do Curral da Pedra\u003c/strong\u003e in this parish. He was born on the \u003cstrong\u003etenth day of December, 1731\u003c/strong\u003e. And I, Padre \u003cem class=\"name\"\u003eCustódio Martins Leyria\u003c/em\u003e, priest-in-charge of this church of Santa Catarina da Fonte do Bispo, baptised him on the […] day of the same month […] of the year above. The godparents were \u003cem class=\"name\"\u003eFrancisco Martins\u003c/em\u003e, bachelor, and \u003cem class=\"name\"\u003eCatharina Martins\u003c/em\u003e, of the said sítio.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eCustódio Martins Leyria, priest-in-charge\u003c/span\u003e","details":[{"label":"Why this is read as our Francisco","body":"Four things line up. \u003cstrong\u003eThe mother is Maria Gonçalves\u003c/strong\u003e — the name given for António's wife in the 1724 marriage, the 1734 burial, and in both grandchildren's baptisms of 1768 and 1780. \u003cstrong\u003eThe date sits inside the only possible window\u003c/strong\u003e: António married in December 1724 and was buried in May 1734, so his children by her must fall between late 1725 and early 1735. \u003cstrong\u003eThe spacing is right\u003c/strong\u003e — Manoel 1726, Maria 1729, Francisco 1731. And \u003cstrong\u003ea complete sweep of the parish register across that whole window turned up twenty-one boys named Francisco, of whom this is the only one with both a Viegas father and a Maria Gonçalves mother.\u003c/strong\u003e","scope":"family"},{"label":"The problem: the page says Domingos","body":"Every other record calls Francisco's father \u003cstrong\u003eAntónio\u003c/strong\u003e. This one says \u003cstrong\u003eDomingos\u003c/strong\u003e, and the word was enlarged twenty-two times over specifically to test it — it is not misread. \u003cstrong\u003eAntónio and Domingos are not variants of one another\u003c/strong\u003e; this parish alternates the \u003cem\u003esecond\u003c/em\u003e element of a name, not the baptismal first name. So this reading requires a slip of the clergyman's pen. There is a plausible source for one: a different \u003cstrong\u003eDomingos Viegas of this same parish was buried on 25 May 1734, nine days after our António\u003c/strong\u003e — both men were in the same priest's book in the same years.","scope":"caution"},{"label":"What decides it","body":"\u003cstrong\u003eNo such couple exists anywhere else.\u003c/strong\u003e Six other men named Domingos Viegas appear in and around this parish and every one has a different wife — Maria Nobre, Barbora Viegas, Catherina de Souza, Catherina da Conceição, Britis Gonsalves, Catherina Fernandes. The pairing in this entry occurs \u003cstrong\u003eonce and never again\u003c/strong\u003e: no second child, no marriage, no burial. A working household in a parish this small does not leave a single trace. António and Maria Gonçalves, by contrast, are attested seven times across sixty years.","scope":"family"},{"label":"A second small discrepancy","body":"The family is at the \u003cstrong\u003esítio do Lagar\u003c/strong\u003e in 1729 and this entry says \u003cstrong\u003eCurral da Pedra\u003c/strong\u003e. Both are within Santa Catarina and the Curral da Pedra is independently a Viegas neighbourhood, so a move is unremarkable — but it is recorded here rather than smoothed over.","scope":"caution"},{"label":"What would overturn it","body":"Any later record naming Francisco Viegas Leiria's father as \u003cem\u003eDomingos\u003c/em\u003e; a second child of a Domingos Viegas and a Maria Gonçalves; or a Santa Catarina entry for a Francisco born to António Viegas and Maria Gonçalves that the sweep missed.","scope":"caution"}],"notes":"","archive":"Arquivo Nacional da Torre do Tombo — PT/TT/PRQ/PTVR04/001/B6, Santa Catarina da Fonte do Bispo baptisms 1726–1741","online":"","localOnly":true,"embeddedImages":[]},{"id":"1724-burial-catharina-viegas","year":"1724","kind":"Burial","kindDetail":"May","title":"Catharina Viegas — daughter of António's first marriage","whenWhere":"9 May 1724 · Igreja de Nossa Senhora da Luz · \u003cstrong\u003ethe only record that names António's first wife alongside a child\u003c/strong\u003e","principals":["catharina-viegas-1724"],"mentions":["antonio-viegas-leiria","apolonia-gonsalves"],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003enove dias do mes de Mayo de mil settecentos e vinte e quatro\u003c/strong\u003e annos faleceo \u003cem class=\"name\"\u003eCatharina Viegas\u003c/em\u003e, \u003cstrong\u003ede maior idade\u003c/strong\u003e, \u003cstrong\u003efilha de \u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e e de \u003cem class=\"name\"\u003eApolonia Gonsalves\u003c/em\u003e\u003c/strong\u003e, do \u003cstrong\u003esítio da Luz\u003c/strong\u003e; foi sepultada nesta Igreja de Nossa Senhora da Luz, \u003cstrong\u003ejazigo 350\u003c/strong\u003e.\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003eninth day of May 1724\u003c/strong\u003e died \u003cem class=\"name\"\u003eCatharina Viegas\u003c/em\u003e, \u003cstrong\u003eof full age\u003c/strong\u003e, \u003cstrong\u003edaughter of \u003cem class=\"name\"\u003eAntónio Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eApolónia Gonsalves\u003c/em\u003e\u003c/strong\u003e, of the \u003cstrong\u003esítio da Luz\u003c/strong\u003e. She was buried in this church of Nossa Senhora da Luz, \u003cstrong\u003egrave 350\u003c/strong\u003e.\u003c/p\u003e","details":[{"label":"It proves the first family existed","body":"Before this entry was found, \u003cstrong\u003eApolónia Gonsalves was known from a single line\u003c/strong\u003e — the 1724 remarriage calling António her widower. This burial is her second and only other appearance, and it does two things the marriage cannot: it fixes where the family lived, at the \u003cstrong\u003esítio da Luz\u003c/strong\u003e, and it calls her \u003cem\u003ejá defunta\u003c/em\u003e — \u003cstrong\u003ealready dead by May 1724\u003c/strong\u003e. A full scan of the surviving Luz burial register from 1718 onward does not contain her, so she died before 1718 and her own burial record is lost.","scope":"family"},{"label":"Francisco's half-sister","body":"Catharina is the only known child of António's first marriage, and therefore \u003cstrong\u003ea half-sister of Francisco Viegas Leiria\u003c/strong\u003e, who was not yet born. She died \u003cstrong\u003eseven months before her father remarried\u003c/strong\u003e.","scope":"family"},{"label":"What “de maior idade” does and doesn’t tell us","body":"The book charges two burial fees, and the tiers sit side by side a page later: children described as \u003cem\u003ede menor idade\u003c/em\u003e and named by their parents pay \u003cstrong\u003ejazigo 275\u003c/strong\u003e, while adults named by a spouse pay \u003cstrong\u003e350\u003c/strong\u003e. Catharina pays \u003cstrong\u003e350\u003c/strong\u003e, so she was genuinely in the adult tier — and she is named by her parents rather than a husband because \u003cstrong\u003eshe never married\u003c/strong\u003e. \u003cstrong\u003eWhat this does not fix is her age.\u003c/strong\u003e In registers of this period the \u003cem\u003emaior/menor\u003c/em\u003e divide is frequently the age of reason, about seven, rather than legal majority. So her birth is best left undated, somewhere between about 1705 and 1717 — and the lower end of that range is what makes the rest of the family's chronology work without a sixteen-year-old father or a twenty-two-year gap in childbearing.","scope":"caution"},{"label":"Their marriage record is lost","body":"No marriage entry for António and Apolónia has ever been found, and it probably no longer exists. The \u003cstrong\u003eLuz marriage books run 1684–1699 and then 1711–1784\u003c/strong\u003e — the volume covering the years between is missing, and a wedding in about 1706–1712 falls squarely inside that gap. Santa Catarina's own books have been swept across the same window without result.","scope":"caution"},{"label":"It says the church was “parrochial de seus pais”","body":"Catharina is buried in Nossa Senhora da Luz described as \u003cem\u003ethe parish church of her parents\u003c/em\u003e — which settles that António and Apolónia were Luz parishioners while that marriage lasted, whatever parish he was born in.","scope":"family"}],"notes":"","archive":"Arquivo Distrital de Faro — PT/ADFAR/PRQ/TVR03/003/0002, Nossa Senhora da Luz óbitos 1718–1761","online":"","localOnly":true,"embeddedImages":[]},{"id":"1688-baptism-antonio-viegas","year":"1688","kind":"Baptism","kindDetail":"April","title":"António, son of Manoel Viegas and Maria das Neves — a Bengado household, not ours","whenWhere":"Born 19 April 1688, baptised the 25th · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003ea candidate that the records have since ruled out\u003c/strong\u003e","principals":["manoel-viegas-bengado","maria-das-neves"],"mentions":["antonio-viegas-leiria"],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003edezanove dias do mes de Abril\u003c/strong\u003e da era de \u003cstrong\u003emil e seis Centos e oitenta e oito\u003c/strong\u003e annos nasceo \u003cem class=\"name\"\u003eAnt.º\u003c/em\u003e, \u003cstrong\u003ef.º de \u003cem class=\"name\"\u003eM.el Vi-\u003cbr\u003eegas\u003c/em\u003e e de \u003cem class=\"name\"\u003eM.ª das Neves\u003c/em\u003e\u003c/strong\u003e, moradores no \u003cstrong\u003esitio do Bengado\u003c/strong\u003e desta freg.ª. E eu o P.e Cura \u003cem class=\"name\"\u003eJoão Martins Simões\u003c/em\u003e desta Igreja de Sancta Catherina da Fonte do Bispo o baptizei aos \u003cstrong\u003evinte e sinco\u003c/strong\u003e dias do d.º mes de Abril em esta Santa Igreja Parochial de seus pais, e lhe pus os Santos oleos. Foraõ padrinhos \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e moradores no sitio das \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e, parte desta freguezia. E por assim constar \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e fis este termo em que assignei.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eO Cura João M.z Simões\u003c/span\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003enineteenth day of April 1688\u003c/strong\u003e was born \u003cem class=\"name\"\u003eAntónio\u003c/em\u003e, \u003cstrong\u003eson of \u003cem class=\"name\"\u003eManoel Viegas\u003c/em\u003e and of \u003cem class=\"name\"\u003eMaria das Neves\u003c/em\u003e\u003c/strong\u003e, dwelling at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e in this parish. And I, Padre \u003cem class=\"name\"\u003eJoão Martins Simões\u003c/em\u003e, priest-in-charge of this church of Santa Catarina da Fonte do Bispo, baptised him on the \u003cstrong\u003etwenty-fifth\u003c/strong\u003e day of the said month of April, in this holy parish church of his parents, and administered the holy oils. The godparents were \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e, dwelling at the sítio das \u003cspan class=\"gap\"\u003e[…]\u003c/span\u003e, within this parish. And so that it may be recorded I made this entry, which I signed.\u003c/p\u003e\n        \u003cspan class=\"sig\"\u003eJoão Martins Simões, priest-in-charge\u003c/span\u003e","details":[{"label":"Why this is no longer thought to be him","body":"This was the only “António, son of a Viegas” in either surviving Santa Catarina baptism book, and for a time it was taken as our António's own baptism. \u003cstrong\u003eA burial of September 1694 rules it out:\u003c/strong\u003e António Viegas and his wife Apolónia Gonsalves bury a son, Manoel, at the sítio das Casas Altas. A man burying a child in 1694 was not baptised in April 1688. \u003cstrong\u003eOur António was born around 1660–75, and this infant is somebody else.\u003c/strong\u003e","scope":"caution"},{"label":"What it still shows","body":"It remains a genuine record of a Viegas household — \u003cstrong\u003eManoel Viegas and Maria das Neves at the sítio do Bengado\u003c/strong\u003e — and the surname is beyond dispute, the scribe having split it across the line break as “M.el Vi-/egas”. The Bengado turns out to have held at least five separate Viegas parties in 1688–90, which is why the name and the place together prove nothing about descent.","scope":"family"},{"label":"The lesson worth keeping","body":"The argument for this entry was that it was the \u003cem\u003eonly\u003c/em\u003e candidate in the surviving books. That is an argument from absence, and the absence had a different explanation: our António was born before these registers begin.","scope":"caution"}],"notes":"The only “António, son of a Viegas” in either surviving Santa Catarina baptism book, after both were swept end to end. The surname wraps across the line break as “M.el Vi-/egas”, which rules out the usual confusions with Vieyra and Vargas, and the year is written out in full: “mil e seis Centos e OITENTA E OITO annos”.","archive":"Arquivo Nacional da Torre do Tombo — PT/TT/PRQ/PTVR04/001/B2, Santa Catarina da Fonte do Bispo baptisms 1688–1696","online":"","localOnly":true,"embeddedImages":[]},{"id":"1688-baptism-magdalena-viegas-leria","year":"1688","kind":"Baptism","kindDetail":"November","title":"Magdalena, daughter of Joze Viegas Leria — the byname, 119 years early","whenWhere":"Born 28 November 1688 · Igreja de Santa Catarina da Fonte do Bispo · \u003cstrong\u003ethe earliest surviving use of the name “Viegas Leiria”\u003c/strong\u003e","principals":["joze-viegas-leria-1688"],"mentions":[],"transcriptPt":"\u003cp\u003eAos \u003cstrong\u003evinte e oito dias do mes de 9\u003csup\u003ebro\u003c/sup\u003e\u003c/strong\u003e da era de \u003cstrong\u003emil seis Centos oitenta e oito\u003c/strong\u003e annos nasceo \u003cem class=\"name\"\u003eMagda-\u003cbr\u003elena\u003c/em\u003e, \u003cstrong\u003ef.ª de \u003cem class=\"name\"\u003eJoz.e Viegas Leria\u003c/em\u003e, e de \u003cem class=\"name\"\u003eM.ª [Di/Jo]anna G.z\u003c/em\u003e\u003c/strong\u003e, moradores no \u003cstrong\u003esitio da Fonte do Bispo\u003c/strong\u003e. E eu o P.e Cura \u003cem class=\"name\"\u003eJ[…] M.z Simões\u003c/em\u003e desta Igr.ª de Sancta Catherina […]\u003c/p\u003e","transcriptEn":"\u003cp\u003eOn the \u003cstrong\u003etwenty-eighth day of November 1688\u003c/strong\u003e was born \u003cem class=\"name\"\u003eMagdalena\u003c/em\u003e, \u003cstrong\u003edaughter of \u003cem class=\"name\"\u003eJoze Viegas Leria\u003c/em\u003e and of \u003cem class=\"name\"\u003eMaria [Di/Jo]anna Gonçalves\u003c/em\u003e\u003c/strong\u003e, dwelling at the \u003cstrong\u003esítio da Fonte do Bispo\u003c/strong\u003e. And I, Padre \u003cem class=\"name\"\u003eJ[…] Martins Simões\u003c/em\u003e, priest-in-charge of this church of Santa Catarina […]\u003c/p\u003e","details":[{"label":"Why this record matters at all","body":"Until it was read, the earliest hard attestation of the byname \u003cstrong\u003eViegas Leiria\u003c/strong\u003e in this whole collection was \u003cstrong\u003e1807\u003c/strong\u003e — in Domingos's marriage. This entry carries it in \u003cstrong\u003e1688\u003c/strong\u003e. That i
