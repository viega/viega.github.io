tree above, and the record in full on the companion \u003cem\u003eRecords\u003c/em\u003e page. The parents’ names are washed off the leaf, so the identification rests on the two grandparent pairs, which match his 1807 marriage exactly.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eWhat it took to close it, and what that rules out.\u003c/b\u003e Two full baptism registers and one burial register were read page by page: \u003cb\u003eSantiago B13 (1779–85, 199 images)\u003c/b\u003e, \u003cb\u003eB14 (1785–91, 196 images)\u003c/b\u003e — the latter re-checked end to end for the abbreviated margin form \u003cem\u003eD.\u003csup\u003eos\u003c/sup\u003e\u003c/em\u003e after it turned out to be in live use — and \u003cb\u003eSantiago óbitos O7\u003c/b\u003e from October 1779 to the book’s close in 1789. Ten children named Domingos were baptised in those two books and five were buried in that span; \u003cb\u003eevery single one was excluded on parentage, never on surname\u003c/b\u003e. That was deliberate: the byname is unstable and \u003cem\u003eViegas\u003c/em\u003e can descend through the mother, so the match key was the four grandparents, and the sharpest name in it turned out to be \u003cb\u003eElena Maria\u003c/b\u003e — rare, where Maria and Francisca identify nobody.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eHis parents’ marriage is still missing\u003c/b\u003e, and remains a live target. Eleven marriage volumes have been read end to end — about 1,650 openings, six parishes, two concelhos, 1741–1802. Nineteen men called Francisco Viegas married in that span; every bride was recorded; none was a Francisca. Conceição-Tavira has no marriage series indexed at all. \u003cb\u003eLuz was wrongly written off:\u003c/b\u003e it was recorded here as having no register before 1829, but that was a search of the wrong archive — Luz’s registers are at the \u003cb\u003eArquivo Distrital de Faro\u003c/b\u003e (\u003ccode\u003ePT/ADFAR/PRQ/TVR03\u003c/code\u003e), where its \u003cb\u003emarriages run from 1591\u003c/b\u003e and baptisms from 1599. \u003cb\u003eThe search should now move to LUZ.\u003c/b\u003e Antonio’s own 1724 marriage calls him \u003cem\u003eda freguezia de Nossa Senhora da Luz\u003c/em\u003e, and Luz turns out to hold a whole Viegas clan — in 1712 alone the parish had \u003cb\u003etwo Viegas priests\u003c/b\u003e (Manoel Viegas, its Cura; João Leal Viegas, beneficed at Santa Maria de Tavira), an \u003cb\u003eAlferes Antonio Viegas Leal\u003c/b\u003e, and several illiterate Viegas signing with crosses, under the bynames \u003cem\u003eLeal, Souza, Gois, Correa\u003c/em\u003e and \u003cem\u003eGama\u003c/em\u003e. \u003cb\u003eA candidate for Antonio’s baptism is in hand:\u003c/b\u003e an \u003cem\u003eAntonio, son of Manoel Viegas and Maria de Oliveira, born 8 October 1696 in Luz\u003c/em\u003e — Viegas father, and an age that fits every later date. \u003cb\u003eBut it is not proven, and Santa Catarina cannot be dropped:\u003c/b\u003e if \u003cem\u003enatural de Santa Catarina\u003c/em\u003e is right, his baptism is there and this Luz child is somebody else.\u003c/p\u003e","where":["\u003cb\u003eThree cautions earned along the way.\u003c/b\u003e \u003cem\u003eSantiago baptism margins carry only the child’s given name\u003c/em\u003e, which makes them ideal for hunting a \u003cem\u003eDomingos\u003c/em\u003e but structurally blind to fathers. \u003cem\u003eSanta Maria margins name the parents but not the grandparents\u003c/em\u003e — so a Viegas appearing as a grandparent or godparent is invisible to that sweep, and several were found only by opening pages. And the strip-scale false-positive rate is roughly one in two: \u003cb\u003eChagas, Vargas, Vieira, Nunes, Soares, Dias, Palma\u003c/b\u003e and even the words \u003cem\u003e“do mes”\u003c/em\u003e all read as \u003cem\u003eViegas\u003c/em\u003e until the page is opened."],"done":false},{"id":"t-3-maria-das-dores-s-own-baptism","rank":"3","title":"Maria das Dores's own baptism","status":"open","source":"tavira","body":"\u003cp\u003eNewly worth doing. Until now we only knew her family was \"of this City\", which meant either urban parish. The 1811 marriage says her parents were \u003cb\u003e\"naturais desta Freguezia\"\u003c/b\u003e — Santiago. That halves the search, and the same pass would find her brother Francisco José and settle whether he really is her brother.\u003c/p\u003e","where":["Santiago baptisms B14 (1785–91), B15 (1791–95), B16 (1795–1802). None downloaded."],"done":false},{"id":"t-4-rodrigo-jose-pereira-and-ignes-de-jesus-foun","rank":"4","title":"Rodrigo José Pereira and Ignes de Jesus — FOUND","status":"found","source":"tavira","body":"\u003cp\u003e\u003cb\u003eMarried 30 November 1782 at Santiago\u003c/b\u003e, both of them \u003cem\u003esolteiros\u003c/em\u003e. The entry names all four of their parents and says twice that both families were \u003cb\u003eof this parish\u003c/b\u003e — which is what finally closed the Santiago-or-Santa-Maria question. It also corroborates the 1811 record from the other end.\u003c/p\u003e","where":["Santiago marriages C6, spread 103. Read, transcribed and on the Records page. What it opens next: Maria das Dores was born \u003cb\u003e1783 or later\u003c/b\u003e, so her baptism is in Santiago B13–B16 — all four already downloaded."],"done":false},{"id":"t-5-their-marriage-found","rank":"5","title":"Their marriage — FOUND","status":"found","source":"tavira","body":"\u003cp\u003e\u003cb\u003e20 March 1807\u003c/b\u003e, in the \u003cem\u003eErmida de Nossa Senhora da Consolação\u003c/em\u003e, then serving as the matriz of Santiago. Santiago marriages \u003cb\u003eC8, folio 78\u003c/b\u003e. It names \u003cb\u003eboth sets of grandparents on both sides\u003c/b\u003e — which is how the line gained a generation. See the section at the top of this page.\u003c/p\u003e","where":["Reached only because João's 1808 baptism forced the window back before April 1808. The previous theory put the marriage in 1811–12 and rested on a blotted Santa Maria entry; that was wrong by four years, and the entry is not theirs."],"done":false},{"id":"t-6-catarina-s-parents","rank":"6","title":"Catarina's parents","status":"open","source":"tavira","body":"\u003cp\u003eManoel de Santa Ana and Anna Maria married at some point before 1832 and both were Tavira natives. Their marriage would name all four of the grandparents above and confirm whether she was Anna Maria or Maria Catarina.\u003c/p\u003e","where":["Santa Maria marriages, roughly 1815–1832."],"done":false},{"id":"t-7-jose-and-catarina-s-other-children-done-for-","rank":"7","title":"José and Catarina's other children — done for 1846–1859","status":"open","source":"tavira","body":"\u003cp\u003e\u003cb\u003eFive found.\u003c/b\u003e The eleven-year gap between their 1850 marriage and João's birth is filled: \u003cb\u003eManoel\u003c/b\u003e (b. 3 Nov 1851), \u003cb\u003eJosé\u003c/b\u003e (b. 29 Jul 1853), \u003cb\u003eRita\u003c/b\u003e (b. 9 Mar 1855) and \u003cb\u003eFrancisco\u003c/b\u003e (b. 19 Oct 1858) — plus a \u003cb\u003esecond Francisco\u003c/b\u003e, born about June 1863, who died at five months that November. The 1858 boy is called \"first of this name\", so he must have died before mid-1863; that death has not been found.\u003c/p\u003e","where":["Santiago baptisms 1846–1859 (ADFAR vol. 31) swept in full, 300 images. \u003cb\u003eStill open:\u003c/b\u003e 1860 and 1862–1863 for the second Francisco's baptism, and the 1858 Francisco's death. And what became of Manoel, José and Rita — three whole lives untouched."],"done":false},{"id":"t-8-rodrigo-and-maria","rank":"8","title":"Rodrigo and Maria","status":"open","source":"tavira","body":"\u003cp\u003eJosé's brother (b. 1816) and sister (b. 1818) are known only from their baptisms. Marriages, children, deaths — all untouched. Two whole branches nobody has followed.\u003c/p\u003e","where":["Santiago marriages from about 1836 onward."],"done":false},{"id":"t-9-the-dias-pires-family","rank":"9","title":"The Dias Pires family","status":"open","source":"tavira","body":"\u003cp\u003eJosé's first wife Maria José was the daughter of \u003cb\u003eAntonio Dias Pires and Margarida da Conceição\u003c/b\u003e of the Rua de São Sebastião, with grandparents José Dias Pires + Maria Gertrudes and [João] Dias Pires + Maria da Conceição. An entirely fresh family, discovered in the 1845 marriage.\u003c/p\u003e","where":["She was baptized at Santa Maria — her baptism should be findable."],"done":false},{"id":"t-10-giraldo-s-descendants","rank":"10","title":"Giraldo's descendants","status":"open","source":"tavira","body":"\u003cp\u003e\u003cb\u003eHis death is now found\u003c/b\u003e — 4 December 1878, aged sixty-six, at the Largo d'Atalaia, still a labourer, still married to Maria do Carmo, and the entry says he \u003cem\u003eleft children\u003c/em\u003e. Of the five children reported between 1844 and 1862, \u003cb\u003ethree more have surfaced\u003c/b\u003e in the Santiago baptisms — a Maria, a José and a Francisco — alongside the christening of 29 January 1844 already known.\u003c/p\u003e","where":["Those three entries are located but not yet transcribed in full (ADFAR Santiago baptisms vol. 31, images 147, 182 and 277). His widow Maria do Carmo's death, and his children's marriages, are untouched."],"done":false},{"id":"t-11-the-early-viegas-probate-inventories-was-any","rank":"11","title":"The early Viegas probate inventories — was anyone above Francisco a landholder?","status":"open","source":"tavira","body":"\u003cp\u003eThe Tavira court's \u003cem\u003eAutos de Inventário Obrigatório\u003c/em\u003e are \u003cb\u003eindexed by the name of the deceased\u003c/b\u003e, and a probate inventory lists property with its \u003cem\u003econfrontações\u003c/em\u003e — the named neighbours on every side. Of 5,099 items enumerated there is \u003cb\u003eno inventory for any Viegas Leiria\u003c/b\u003e, which fits a family with nothing to divide. But there are \u003cb\u003enine Viegas inventories before 1870\u003c/b\u003e, and three fall in Francisco Viegas's own generation: \u003cb\u003eJoaquim Viegas (opened 1806)\u003c/b\u003e, \u003cb\u003eMaria Viegas (1809)\u003c/b\u003e and \u003cb\u003eJoão Viegas (1832)\u003c/b\u003e. Each names heirs.\u003c/p\u003e\n      \u003cp\u003eStart with \u003cb\u003eFrancisca Viegas Morgado, 1850\u003c/b\u003e — \u003ccode\u003ePT/ADFAR/JUD/TJCTVR/001/04881\u003c/code\u003e. \u003cb\u003e\u003cem\u003eMorgado\u003c/em\u003e is the word for an entailed estate\u003c/b\u003e, so the byname alone is worth the trip; it may descend from a property or be nothing more than a family nickname, and only the document will say. The others: \u003ccode\u003e001/05841\u003c/code\u003e (1806), \u003ccode\u003e001/05966\u003c/code\u003e (1809), \u003ccode\u003e001/05744\u003c/code\u003e (1832).\u003c/p\u003e","where":["Arquivo Distrital de Faro, Tribunal Judicial da Comarca de Tavira — not digitised, so these must be ordered or read on site. \u003cb\u003eA bonus:\u003c/b\u003e the \u003cem\u003econfrontações\u003c/em\u003e in any Tavira inventory are how the lost \u003cem\u003ehorta do Dezembargador\u003c/em\u003e and \u003cem\u003esítio do Vão\u003c/em\u003e will eventually be placed on the map."],"done":false},{"id":"t-12-the-third-order-s-own-books-the-one-archive-","rank":"12","title":"The Third Order’s own books — the one archive that would name an ancestor as a member","status":"open","source":"tavira","body":"\u003cp\u003eFive of this family are buried in the ground of the \u003cb\u003eVenéravel Ordem Terceira de São Francisco\u003c/b\u003e (see the sidebar above), but no document we hold names any of them as an \u003cem\u003eirmão\u003c/em\u003e. A Third Order kept its own registers: \u003cb\u003e\u003cem\u003elivros de entrada / assento de irmãos\u003c/em\u003e\u003c/b\u003e (admissions — name, spouse, trade, parish, sponsor, date), \u003cb\u003e\u003cem\u003elivros de actas da mesa e do definitório\u003c/em\u003e\u003c/b\u003e (elections and minutes), and \u003cb\u003e\u003cem\u003elivros de óbitos e sepulturas\u003c/em\u003e\u003c/b\u003e (burials and grave numbers). An admission entry would give a trade and a parish for a man we currently have neither for.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eThe catalogues have been searched. Here is exactly where things stand.\u003c/b\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eNot at the district archive as a fonds.\u003c/b\u003e \u003ccode\u003ePT/ADFAR/CON\u003c/code\u003e — Faro’s confraternity holdings — contains only the maritime \u003cem\u003ecompromissos\u003c/em\u003e and \u003cem\u003emontepios\u003c/em\u003e of Faro, Olhão, Lagos, Portimão and Tavira. No Third Order.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eWhat Faro does hold\u003c/b\u003e is the state’s supervision paper, produced after 1834 when confraternities answered to the civil governor. One item names this exact body: \u003cb\u003e\u003ccode\u003ePT/ADFAR/ACD/GCFAR/I-FF/004/0040\u003c/code\u003e — \u003cem\u003e“Contas da Venéravel Ordem Terceira de São Francisco da freguesia de Santiago do concelho de Tavira”\u003c/em\u003e, 1898–1899.\u003c/b\u003e It sits in series \u003ccode\u003eI-FF/004\u003c/code\u003e, \u003cem\u003eContas de confrarias e irmandades\u003c/em\u003e, 1851–1911; see also \u003ccode\u003eI-FF/004/0027\u003c/code\u003e, \u003cem\u003eOrçamentos das confrarias do concelho de Tavira\u003c/em\u003e, 1901–02. Accounts, not membership — but accounts name the officers, and arrears name the brothers.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eWhat Tavira holds.\u003c/b\u003e The Arquivo Municipal’s \u003cem\u003eAdministração do Concelho de Tavira\u003c/em\u003e fonds (\u003ccode\u003ePT MTVR ACT\u003c/code\u003e, 1834–1954) is catalogued online and has three relevant series: \u003ccode\u003eACT/D/003\u003c/code\u003e, \u003cem\u003eInventários de instituições de piedade, assistência e beneficência\u003c/em\u003e, 1867–1930, eleven \u003cem\u003emaços\u003c/em\u003e — these include the property inventories mandated by the \u003cb\u003eSeparation Law of 20 April 1911\u003c/b\u003e, and they explicitly cover the Venéravel Ordem Terceira de São Francisco; \u003ccode\u003eACT/E/002\u003c/code\u003e, budgets and accounts, 1876–1924; and \u003ccode\u003eACT/K/C/003\u003c/code\u003e, statutes, 1911–1920. A 1911 inventory of an institution’s property \u003cb\u003ecan enumerate its archive\u003c/b\u003e, which would tell us what survived and where it went. Also there: Cx. \u003ccode\u003eAC.57\u003c/code\u003e, the 1818 statutes of the Confraria de Nossa Senhora das Dores \u003cem\u003eem S. Francisco\u003c/em\u003e.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eThe internal books are in no public catalogue — which does not mean they are lost.\u003c/b\u003e The comparators are encouraging: the Venéravel Ordem Terceira of \u003cb\u003eCoimbra\u003c/b\u003e has a described archive running \u003cb\u003e1659–2008\u003c/b\u003e, and \u003cb\u003ePorto\u003c/b\u003e’s is online. Both are held \u003cem\u003eby the Order itself\u003c/em\u003e, not by a state archive. That is the normal custody pattern, and it is where Tavira’s should be looked for.\u003c/p\u003e\n      \u003cp\u003e\u003cb\u003eOne thing this page briefly got wrong, corrected.\u003c/b\u003e The 1808 margin \u003cem\u003e“Jaz. 480”\u003c/em\u003e was described here as a numbered grave that might index a plot register. \u003cb\u003eIt is a price, not a plot number.\u003c/b\u003e The third slot of an O9 margin is the burial charge, and across the book it takes essentially two figures and one word: \u003cb\u003e480 \u003cem\u003eréis\u003c/em\u003e for an adult, 250 for an infant, and \u003cem\u003e“Pobre”\u003c/em\u003e written in place of the number\u003c/b\u003e where the fee was waived. Checked on three separate leaves — four adults at 480, three infants at 250, and \u003cem\u003ePobre\u003c/em\u003e standing in the identical slot, which no grave number could. So it indexes nothing.\u003c/p\u003e\n      \u003cp\u003eWhat it does give is \u003cb\u003ea price on the family’s standing\u003c/b\u003e. \u003cem\u003eJaz.\u003c/em\u003e is \u003cem\u003ejazigo\u003c/em\u003e, a built grave rather than open ground, and 480 is the full adult rate — paid in a book where the priest was writing \u003cem\u003ePobre\u003c/em\u003e a few entries away, and where deaths in the Hospital Real carry no charge at all. It is the same argument the sidebar makes, now with a number attached.\u003c/p\u003e\n      \n    \u003c/div\u003e","where":["\u003cb\u003eHow to request it from Portugal.\u003c/b\u003e Three letters, in Portuguese, each naming references rather than asking a general question. \u003cb\u003e(1) Arquivo Municipal de Tavira\u003c/b\u003e — catalogue at \u003ccode\u003earquivo.cm-tavira.pt\u003c/code\u003e, via the Câmara Municipal de Tavira, Praça da República, 8800-951 Tavira — ask to consult \u003ccode\u003eACT/D/003\u003c/code\u003e and \u003ccode\u003eACT/E/002\u003c/code\u003e, and ask directly \u003cem\u003e“os livros próprios da Venéravel Ordem Terceira de São Francisco alguma vez deram entrada neste arquivo?”\u003c/em\u003e \u003cb\u003e(2) Arquivo Distrital de Faro\u003c/b\u003e — request a digital reproduction of \u003ccode\u003ePT/ADFAR/ACD/GCFAR/I-FF/004/0040\u003c/code\u003e; ADFAR does paid reproductions and the reference is exact. \u003cb\u003e(3) The Order and the Church\u003c/b\u003e — the Paróquia de Santiago, Tavira, and the Arquivo Histórico Diocesano do Algarve (\u003ccode\u003earquivo.diocese-algarve.pt\u003c/code\u003e, Diocese do Algarve, Faro). Ask specifically for \u003cem\u003elivros de entrada de irmãos\u003c/em\u003e, \u003cem\u003elivros de actas\u003c/em\u003e and \u003cem\u003eregistos de sepulturas\u003c/em\u003e of the Ordem Terceira de São Francisco de Tavira, state the window as \u003cb\u003ec.1780–1880\u003c/b\u003e, and name the people: \u003cb\u003eDomingos Viegas (Leiria), Francisco Viegas, Giraldo Viegas Leiria, José Viegas Leiria, Maria das Dores\u003c/b\u003e. Ask also whether any \u003cem\u003eregisto de sepulturas\u003c/em\u003e or \u003cem\u003elivro de jazigos\u003c/em\u003e survives — the parish register records only that a fee was paid, so the identity of the grave itself, if it was ever written down, was written down by the Order."],"done":false},{"id":"t-es-nerva-marriage-of-juan-and-agustina","rank":"","title":"Nerva marriage of Juan and Agustina","status":"open","source":"spain-argentina","body":"Pre-1890, and not yet located. Likely Nerva itself or Fuente del Maestre. Worth requesting the \u003cem\u003eexpediente matrimonial\u003c/em\u003e — the file, not just the register entry — because a Portuguese groom’s file can contain a baptismal certificate obtained from his home parish.","where":[],"done":false},{"id":"t-es-nerva-births-of-the-other-children","rank":"","title":"Nerva births of the other children","status":"open","source":"spain-argentina","body":"Manuela and her siblings. Their birth years bracket when the family actually left Spain, which turns a vague post-1890 window into a real arrival window for the Buenos Aires passenger lists.","where":[],"done":false},{"id":"t-es-titulo-de-nacionalidad","rank":"","status":"open","source":"spain-argentina","done":false,"title":"The Título de Nacionalidad Juan produced at Nerva","body":"The 1890 acta records his occupation and then, in the same breath, that he appeared \u003cem\u003e“con Título de Nacionalidad”\u003c/em\u003e — capitalised on the page, as a named instrument rather than a description. \u003cb\u003eWe do not have that document.\u003c/b\u003e All we have is the clerk noting that Juan put it on the table.\u003cbr\u003e\u003cbr\u003eHis own certificate is almost certainly gone; these were personal papers carried by the holder. \u003cb\u003eWhat survives is the register that issued it.\u003c/b\u003e Consulates of this period kept nationality registers — Spain's own system was formalised by the Royal Decree of 5 September 1871 approving a \u003cem\u003eReglamento para el Registro de Nacionalidad\u003c/em\u003e, and a holder already registered could even vouch for a newcomer. Portugal's consulates kept the equivalent: their Huelva books are precisely the source historians use to count the Portuguese in the mining basin.\u003cbr\u003e\u003cbr\u003eSo the thing to hunt is \u003cb\u003ethe consular register entry, not the certificate\u003c/b\u003e. It would give the date he registered, where he was living, and possibly his trade and household — and it would confirm whether he was still a Portuguese national in 1890 or had taken Spanish nationality, which \u003cem\u003enatural de Tavira\u003c/em\u003e does not settle either way.","where":["\u003cb\u003eArquivo Histórico-Diplomático\u003c/b\u003e, Portuguese Ministry of Foreign Affairs, Lisbon — ask for the Huelva consulate's \u003cem\u003eregisto de matrícula\u003c/em\u003e / nationality register for the 1880s–90s.","Failing that, the Spanish side: a \u003cem\u003eregistro de extranjeros\u003c/em\u003e for the province, at the \u003cb\u003eArchivo Histórico Provincial de Huelva\u003c/b\u003e, and the \u003cb\u003eNerva padrón\u003c/b\u003e, which flags residents' nationality."]},{"id":"t-es-death-of-juan-viegas-in-cordoba-argentina","rank":"","title":"Death of Juan Viegas in Córdoba, Argentina","status":"open","source":"spain-argentina","body":"After 1920. The lime-factory suburb points at \u003cstrong\u003eLa Calera\u003c/strong\u003e (including Dumesnil) or \u003cstrong\u003eMalagueño\u003c/strong\u003e — provincial registry jurisdiction, not the Córdoba capital municipal registry. Search variants: Viega, Viegas, Viegas Leiria, Leiria alone, Biega, Biegas. Born c.1861–62, so expect an age in the 60s–80s.","where":[],"done":false},{"id":"t-es-death-of-agustina-ramirez-rivera","rank":"","title":"Death of Agustina Ramírez Rivera","status":"open","source":"spain-argentina","body":"Also unlocated. Same jurisdictions and the same age cross-check.","where":[],"done":false},{"id":"t-es-argentine-cemetery-records","rank":"","title":"Argentine cemetery records","status":"open","source":"spain-argentina","body":"FamilySearch’s indexed \u003cem\u003eArgentina, Cemetery Records, 1882–2019\u003c/em\u003e covers Córdoba, including San Jerónimo and San Vicente in the capital. Its burial-authorisation papers carry death date, age and cause — a functional death record. La Calera’s own cemetery is \u003cstrong\u003enot\u003c/strong\u003e in the collection.","where":[],"done":false},{"id":"t-es-cordoba-probate-and-guardianship-files","rank":"","title":"Córdoba probate and guardianship files","status":"open","source":"spain-argentina","body":"A \u003cem\u003ejuicio sucesorio\u003c/em\u003e states the death date. The judicial Archivo General holds files from 1926 onward (archivomet2@justiciacordoba.gob.ar). The sister’s adoption would have been a pre-1948 \u003cem\u003etutela\u003c/em\u003e proceeding, and those files routinely documented parental deaths.","where":[],"done":false},{"id":"t-es-riotinto-company-worker-registers","rank":"","status":"open","source":"spain-argentina","done":false,"title":"Rio Tinto Company worker registers, Minas de Riotinto","body":"The company's own \u003cb\u003ePersonnel Registry Office\u003c/b\u003e survives as a fonds, and its series start early enough to matter: \u003cb\u003eExpedientes personales RTCL\u003c/b\u003e, legajos 1–1238, \u003cb\u003e1890–1988\u003c/b\u003e — beginning the very year Arturo was born — and a \u003cb\u003eRegistro de obreros españoles\u003c/b\u003e, libros 1034–1099, \u003cb\u003e1873–1900\u003c/b\u003e.\u003cbr\u003e\u003cbr\u003eThe catch is nationality. A separate \u003cb\u003eRegistro de obreros extranjeros\u003c/b\u003e runs only \u003cb\u003e1897–1900\u003c/b\u003e, so a Portuguese labourer in 1890 may fall outside it entirely. Worth asking the archive directly whether the early \u003cem\u003eexpedientes\u003c/em\u003e and the “españoles” books are in practice segregated by nationality, and whether men hired through a \u003cem\u003econtratista\u003c/em\u003e rather than by the company appear at all.","where":["\u003cb\u003eArchivo Histórico Minero de la Fundación Río Tinto\u003c/b\u003e — Plaza del Museo s/n, 21660 Minas de Riotinto, Huelva. Tel +34 959 591 915; \u003cb\u003earchivohistoricoriotinto@telefonica.net\u003c/b\u003e; Mon–Fri 08:00–15:00. Director: Juan Manuel Pérez López. The archive is housed in the company's old Work Agency, later renamed the Personnel Registry Office — the building the records were made in."]},{"id":"t-es-nerva-padron","rank":"","status":"open","source":"spain-argentina","done":false,"title":"Nerva padrón de habitantes, around 1890","body":"This is the record that would actually settle what Juan did for a living. A \u003cem\u003epadrón\u003c/em\u003e lists occupation, often the employer or workplace, the address, and the whole household together — where the birth registration gives only the bare word \u003cem\u003ejornalero\u003c/em\u003e.\u003cbr\u003e\u003cbr\u003eNerva was constituted a municipality in its own right on \u003cb\u003e7 August 1885\u003c/b\u003e, segregated from Zalamea la Real, so it was barely four years old when Arturo was born and its own series should begin in time. The family were on \u003cb\u003eCalle Angosta\u003c/b\u003e (or Augusta) in January 1890.","where":["Archivo Municipal de Nerva. Anything before August 1885 for this ground belongs to \u003cb\u003eZalamea la Real\u003c/b\u003e instead."]}],"parishmap":{"heading":"City Parish Map","lede":"\u003cp\u003e The below text is Claude's. There were so many Viegas' showing up in the city that many had to be distantly related, and wanted to see if there were clear clusters. This might be interesting to com back to.\n\u003c/p\u003e\n\u003cp class=\"lede\"\u003eEvery point is plotted from a real coordinate and coloured by the parish its record actually named. The two mother churches stand \u003cstrong\u003eforty-five metres apart\u003c/strong\u003e, so the question was where Santiago ended and Santa Maria began. Paired samples of both parishes’ death registers for \u003cstrong\u003e1863, 1870 and 1878\u003c/strong\u003e — where every entry stamps its own parish in the same sentence as the address — now answer it: \u003cstrong\u003ethe boundary is the river\u003c/strong\u003e — and a \u003cstrong\u003ecomplete entry-by-entry census of 1870 — all 253 deaths in both parishes\u003c/strong\u003e — has now refined where it runs along the waterfront, replaced the rural rule with a better one, and put four Viegas households on the map.\u003c/p\u003e","maps":[{"id":"core","title":"The town core","caption":"","svg":"\u003csvg viewBox=\"0 0 760 470\" role=\"img\" aria-labelledby=\"core-t\" class=\"map\"\u003e\n\u003cpath class=\"river\" d=\"M 158.9 -391.0 L 187.3 -377.4 L 246.8 -337.9 L 257.7 -311.8 L 257.2 -278.4 L 260.3 -251.7 L 260.1 -220.6 L 254.0 -199.6 L 238.5 -181.2 L 221.4 -164.9 L 189.6 -122.1 L 184.1 -106.8 L 184.0 -89.6 L 188.2 -76.5 L 219.8 -12.1 L 276.6 52.2 L 290.4 71.0 L 314.7 123.8 L 325.9 138.3 L 350.2 147.9 L 391.0 154.3 L 405.7 160.6 L 419.2 165.9 L 526.7 210.9 L 567.1 229.5 L 596.4 239.7 L 610.0 245.7 L 637.4 251.0 L 676.8 252.7 L 716.2 249.7 L 751.7 249.8 L 848.8 233.1 L 901.6 224.1 L 922.3 222.5 L 941.6 228.9 L 982.2 247.0 L 1027.4 276.5 L 1047.2 289.7 L 1060.6 308.1 L 1061.5 309.4 L 1065.7 319.3 L 1064.6 333.4 L 1062.7 346.2 L 1057.4 359.0 L 1044.2 379.6 L 1036.4 400.3 L 1028.6 422.6 L 1026.3 446.8 L 1026.5 466.0 L 1033.6 485.2 L 1046.8 507.2 L 1080.4 538.6 L 1113.9 579.0\" fill=\"none\"/\u003e\n\u003ctext class=\"river-lbl\" x=\"618.0\" y=\"239.7\"\u003eRio Gilão\u003c/text\u003e\n\u003cg class=\"deco\"\u003e\u003cpath d=\"M 734 88 l 0 -22 m -5 7 l 5 -7 l 5 7\" fill=\"none\"/\u003e\u003ctext x=\"734\" y=\"102\" class=\"lbl-n\"\u003eN\u003c/text\u003e\u003c/g\u00 serra\u003c/em\u003e; reading of the name uncertain"},{"place":"Malvas","parish":"Santa Maria","why":"1863"},{"place":"Praça de Lagos","parish":"Santa Maria","why":"1863"},{"place":"Rua das Pedras · Rua de São José · Rua de São Lázaro · Rua da Oliveira · Rua dos Ferreiros · Rua Nova de São Pedro","parish":"Santa Maria","why":"1863 and 1870 — six town streets, none carrying the name today"},{"place":"Vale da Vaca","parish":"Santa Maria","why":"1856 — parish confirmed by the postal register, position not fixed"},{"place":"Rua do Ribeirinho · Rua das Atafonas · Largo e Rua de São Francisco","parish":"Santiago","why":"1863 and 1870"},{"place":"horta do Tiro · horta das Lavas · Rua das Merces","parish":"Santiago","why":"1851–1863"}],"analysis":[{"title":"The 1870 census, and the Viegas clan","body":"\u003cp\u003eSampling gave a tidy answer; a census gave the true one. Reading \u003cstrong\u003eevery entry\u003c/strong\u003e of both\n  parishes for a single year — 150 deaths in Santa Maria, 103 in Santiago — broke two rules that\n  scattered sampling had made look solid, and it put \u003cstrong\u003efour Viegas households\u003c/strong\u003e on the ground\n  in a single twelve-month window.\u003c/p\u003e\n\n  \u003cdiv class=\"tablewrap\"\u003e\u003ctable\u003e\n    \u003cthead\u003e\u003ctr\u003e\u003cth\u003eHousehold\u003c/th\u003e\u003cth\u003eWhere\u003c/th\u003e\u003cth\u003eParish\u003c/th\u003e\u003cth\u003eStanding\u003c/th\u003e\u003cth\u003eEvidence\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n    \u003ctbody\u003e\n      \u003ctr\u003e\u003ctd\u003eJosé Viegas \u003cstrong\u003ede Mendonça\u003c/strong\u003e & Antonia Maria\u003c/td\u003e\u003ctd\u003esítio de Bernardinheiro\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"chip c-santiago\"\u003eSantiago\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cem\u003eproprietários\u003c/em\u003e — landowners\u003c/td\u003e\u003ctd\u003e1870 óbito N.93\u003c/td\u003e\u003c/tr\u003e\n      \u003ctr\u003e\u003ctd\u003eJosé Viegas \u003cstrong\u003eSoares\u003c/strong\u003e & Maria da Conceição\u003c/td\u003e\u003ctd\u003eSantiago town\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"chip c-santiago\"\u003eSantiago\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cem\u003epedreiro\u003c/em\u003e — stonemason\u003c/td\u003e\u003ctd\u003e1870 óbito N.88\u003c/td\u003e\u003c/tr\u003e\n      \u003ctr\u003e\u003ctd\u003eJosé Viegas \u003cstrong\u003eCosta\u003c/strong\u003e & Anna de Jesus\u003c/td\u003e\u003ctd\u003eCorte Fundida, \u003cem\u003eserra\u003c/em\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"chip c-santa\"\u003eSanta Maria\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cem\u003elavradores\u003c/em\u003e — farmers\u003c/td\u003e\u003ctd\u003e1870 óbito N.29\u003c/td\u003e\u003c/tr\u003e\n      \u003ctr\u003e\u003ctd\u003eJoão Viegas \u003cem\u003e(of the ford)\u003c/em\u003e\u003c/td\u003e\u003ctd\u003esítio do Vau\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"chip c-santa\"\u003eSanta Maria\u003c/span\u003e\u003c/td\u003e\u003ctd\u003egodfather to our line, 1858\u003c/td\u003e\u003ctd\u003e1858, 1861; place re-confirmed 1870\u003c/td\u003e\u003c/tr\u003e\n      \u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eOur\u003c/strong\u003e Viegas \u003cstrong\u003eLeiria\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003ethe right-bank \u003cem\u003ehorta\u003c/em\u003e belt\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"chip c-santiago\"\u003eSantiago\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cem\u003etrabalhadores\u003c/em\u003e — labourers\u003c/td\u003e\u003ctd\u003e1851–1863\u003c/td\u003e\u003c/tr\u003e\n    \u003c/tbody\u003e\n  \u003c/table\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"callout\"\u003e\n    \u003ch3\u003eProximity really does sort the lines\u003c/h3\u003e\n    \u003cp\u003eIn one year, four Viegas households in four places, with four trades and \u003cstrong\u003efour different\n    bynames\u003c/strong\u003e — and the three travel together. The Bernardinheiro Viegas are always the\n    landowners and always carry a distinguishing second name (\u003cem\u003ede Palma\u003c/em\u003e, \u003cem\u003ePires\u003c/em\u003e, and now\n    \u003cem\u003ede Mendonça\u003c/em\u003e); the serra Viegas farm; ours labour in the gardens across the river. The byname\n    is not decoration, it is the branch label, and it is anchored to ground. That is the working test for\n    whether two Viegas belong to the same family, and it now rests on observation rather than assumption.\u003c/p\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"callout\"\u003e\n    \u003ch3\u003eWhat else a whole year shows that a sample cannot\u003c/h3\u003e\n    \u003cul\u003e\n      \u003cli\u003e\u003cstrong\u003eThe word \u003cq\u003epobre\u003c/q\u003e exists, and it is used.\u003c/strong\u003e Santiago 1870 calls one widow\n      \u003cq\u003epobre\u003c/q\u003e and another \u003cq\u003epobre indigente\u003c/q\u003e. The register also freely writes \u003cem\u003eDona\u003c/em\u003e and\n      \u003cem\u003eproprietário\u003c/em\u003e. Our family is given \u003cstrong\u003enone\u003c/strong\u003e of these — neither the poverty\n      words nor the gentry words. They sit in the unmarked middle, and that is now an observation about the\n      register’s vocabulary, not an argument from silence.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eBurial ground tracks standing.\u003c/strong\u003e Three grounds are in use: the \u003cem\u003ecemitério\n      público\u003c/em\u003e, and the private grounds of the Third Orders of \u003cstrong\u003eSão Francisco\u003c/strong\u003e and\n      \u003cstrong\u003eCarmo\u003c/strong\u003e. Confraternity membership bought a named place to lie; labourers’ infants\n      go to the public ground.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eAn Ayamonte corridor, generations early.\u003c/strong\u003e Two foundlings \u003cq\u003eexpostos\u003c/q\u003e of\n      \u003cstrong\u003eAyamonte, Reino d’Espanha\u003c/strong\u003e were put out to nurse in Tavira in this one year —\n      one in each parish. The road into Andalusia was already open long before the family took it to the\n      Riotinto mines.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eThe register was audited and found wanting.\u003c/strong\u003e The Santa Maria book closes with an\n      1875 episcopal visitation listing eleven defective entries by number and holding the parish priest\n      responsible. Independent confirmation that these books contain real errors — and it happens to\n      corroborate several of the readings here.\u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/div\u003e"},{"title":"What the map can and cannot tell you","body":"\u003cdiv class=\"callout\"\u003e\n    \u003ch3\u003eThree limits, stated plainly\u003c/h3\u003e\n    \u003cul\u003e\n      \u003cli\u003e\u003cstrong\u003eModern position, historic name.\u003c/strong\u003e A street that carries the name today need not\n      occupy the same ground it did in 1855, and Tavira was rebuilt around its riverfront through the\n      nineteenth century.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eA \u003cem\u003ehorta\u003c/em\u003e is not a street.\u003c/strong\u003e The family’s own address for three\n      baptisms — the \u003cem\u003ehorta do Dezembargador\u003c/em\u003e — is a market garden, and no modern\n      feature carries the name. Rows matched from a garden to a same-named road are marked as weak.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003e“Moradora na rua X” is not a parish claim.\u003c/strong\u003e One street, the \u003cem\u003eRua das Figueiras\u003c/em\u003e, briefly looked like the exception that broke the river model. Re-read cold, its entry turns out to be a \u003cem\u003efoundling put out to nurse\u003c/em\u003e — the street is the wet-nurse’s address, and the entry never says \u003cem\u003edesta freguezia\u003c/em\u003e at all. It sits in Santiago’s book because the child was baptised there. It was \u003cstrong\u003eretracted\u003c/strong\u003e from the gazetteer, and only entries that stamp a parish in the same breath as the address are counted here. \u003cstrong\u003eThe full 1870 sweep has now settled it the other way\u003c/strong\u003e: the Rua das Figueiras appears three times in the \u003cem\u003eSanta Maria\u003c/em\u003e register, each time stamped \u003cq\u003edesta freguezia de Santa Maria do Castello\u003c/q\u003e. It is a Santa Maria street, and the retraction was correct — the same sweep turned up two more Santiago-baptised foundlings nursed on Santa Maria streets, which is exactly how the rule earns its keep.\u003c/li\u003e\n      \u003cli\u003e\u003cstrong\u003eThe attribution is the register, not the ground.\u003c/strong\u003e A place is called Santiago\n      here because the entry sat in Santiago’s book. Where a register states the parish outright\n      — \u003cq\u003edesta freguezia\u003c/q\u003e, \u003cq\u003efreguezia de Santa Maria\u003c/q\u003e — that is far stronger, and\n      those are the rows to trust.\u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/div\u003e"}],"attestations":[{"place":"Rua de Sao Sebastiao","parish":"SANTIAGO","type":"RESIDENCE+DEATH","date":"1855-04-02","context":"Maria das Dores, wife of Domingos Viegas Leiria","ref":"PT/ADFAR/PRQ/TVR06/003/0018","image":"011L","confidence":"high","notes":"moradores na Rua de Sao Sebastiao; her death entry. THE KEY BOUNDARY STREET - see .md"},{"place":"Rua de Sao Sebastiao","parish":"SANTA MARIA?","type":"RESIDENCE","date":"pre-1850","context":"Catarina do Rosario before her marriage","ref":"(earlier session; Santiago C-vol 1850 marriage)","image":"","confidence":"medium","notes":"She was a SANTA MARIA parishioner (bapt. there 1832). Same street as the Santiago household above. NOT re-verified by me."},{"place":"Rua de Sao Sebastiao","parish":"?","type":"RESIDENCE","date":"1845","context":"Dias Pires family, of Maria Jose (Jose's 1st wife)","ref":"(earlier session; 1845 "notes":"37.11839, -7.67446"},{"place":"Campina de Santiago","parish":"SANTIAGO?","type":"MODERN_ONLY","date":"-","context":"hamlet named for the parish itself","ref":"OSM (place=hamlet)","image":"-","confidence":"medium","notes":"A place named for Santiago is prima facie boundary evidence; get its postal-code parish and look for it in the registers."},{"place":"Rua das Olarias","parish":"SANTIAGO","type":"RESIDENCE+PARISH_STATED","date":"1870","context":"obitos N.2, N.5, N.20","ref":"PT/ADFAR/PRQ/TVR06/003/0029","image":"003-007","confidence":"high","notes":"37.12468, -7.65405 (OSM exact)"},{"place":"Rua das Cruzes","parish":"SANTIAGO","type":"RESIDENCE+PARISH_STATED","date":"1870","context":"obitos N.10, N.55","ref":"PT/ADFAR/PRQ/TVR06/003/0029","image":"005,013","confidence":"high","notes":"37.12494, -7.65404 (OSM exact)"},{"place":"Largo das Portas do Postigo","parish":"SANTIAGO","type":"RESIDENCE+PARISH_STATED","date":"1870","context":"obito N.6","ref":"PT/ADFAR/PRQ/TVR06/003/0029","image":"004","confidence":"high","notes":"37.12460, -7.65308 (OSM exact)"},{"place":"Rua das Freiras","parish":"SANTIAGO","type":"RESIDENCE+PARISH_STATED","date":"1870","context":"obito N.17","ref":"PT/ADFAR/PRQ/TVR06/003/0029","image":"005","confidence":"high","notes":"37.12254, -7.64626 (OSM exact). Distinct from the *horta* das Freiras of 1861."},{"place":"Rua das Figueiras","parish":"NOT STAMPED","type":"INCIDENTAL_ADDRESS","date":"1870","context":"obito N.47","ref":"PT/ADFAR/PRQ/TVR06/003/0029","image":"011","confidence":"low","notes":"*** RETRACTED as a parish attestation. *** Santiago 1870 N.47 is a FOUNDLING (exposto) 'dado a criar a Marianna Roza, moradora na rua das Figueiras' - the street is the WET-NURSE's address and carries NO 'desta freguezia'. The entry is in Santiago's book because the child was baptised there. 37.12850,-7.64552, LEFT bank."},{"place":"Fojo","parish":"SANTIAGO","type":"RESIDENCE+PARISH_STATED","date":"1870","context":"obito N.8 'sitio do Fojo'","ref  person found in the parish\nregisters so far, for spatial/temporal clustering.\n\n## Columns\n- `id` — stable key, V###\n- `surname_as_written` — **as the scribe wrote it**, not normalised. Includes fused forms\n  (`Gonsalves Viega`, `Viegas Nobre`, `Rodrigues Viegas`, `Miz Correa Viegas`).\n- `role` — groom / bride / father / mother / grandfather / godfather / decedent / witness.\n  `BRIDE` in caps flags a **Viegas woman marrying a non-Viegas man** (see below).\n- `date_iso` / `year` — `year` is always populated (estimated where the entry is undated\n  within a book; treat as ±5 unless `date_iso` is a full date).\n- `parish_of_record` — the parish whose register holds the entry.\n- `location_named` — the place the *document* names, verbatim. `UNKNOWN` where not read.\n- `location_type` — city / parish / sitio / lugar / aldeia / street / institution / military\n- `verified` — `full-read` (transcribed at ≥3× zoom) | `margin-only` (name read off a\n  contact strip, entry never opened) | `index-only`\n- `confidence` — certain / high / medium / low\n\n## Read this before clustering\n1. **`location_named` is only reliable for `full-read` rows.** Location lives in the body\n   of the entry, never in the margin — so every `margin-only` row is `UNKNOWN` by\n   construction, not because the place was absent. ~30 rows are recoverable by opening\n   the entry; each costs one zoom.\n2. **`margin-only` names are unreliable.** Six confirmed misreadings in one day, including\n   one where witness names from the body were mistaken for the margin. Do not treat a\n   `margin-only` surname as evidence of a Viegas.\n3. **The surname passes through women here.** Three documented cases of a child taking the\n   mother's surname (`Manoel Viegas` \u003c Antonio *Gonsalves* + Leonor *Viegas*; `Jose de\n   Souza` \u003c Manoel *Viegas* + Anna *de Souza*; `Joao Viegas` \u003c Joao *da Costa*). So this\n   register **under-counts** the kin-network: men descended from Viegas women are absent.\n4. **`GONSALVES` behaves as a Viegas alias** in Santa Maria and recurs beside Viegas in\n   four separate branches. Consider clustering the two surnames together.\n5. Santa Catarina da Fonte do Bispo and Santo Estêvão are **filiais of Santiago** — their\n   events can be registered in Santiago's books, so `parish_of_record` ≠ residence.\n\n## Marriages: log ALL of them, including remarriages\nEvery Viegas marriage goes in the register regardless of type. Roles used:\n`groom` / `bride` (first marriage, *solteiro/solteira*) and\n`groom-widower` / `bride-widow` (*viúvo/viúva de X*).\n\nRemarriages are recorded even though they are **genealogically poorer** — a widower's\nentry names his **dead spouse, not his parents**. But they are still worth every bit of\nthe effort because they give:\n- a **place** and a **date** like any other entry;\n- the **name of a deceased spouse**, which dates a death and identifies a prior household\n  that can then be searched for children;\n- evidence of a **second family**, which is how one man generates two sets of children\n  under the same name — a major source of the decoy confusion in this project.\n\nThis also matters for the ancestral question directly: if our Francisco Viegas's marriage\nto Francisca was itself a remarriage, the entry would never have named his parents, which\nwould explain why exhaustive sweeping has not produced them.\n\n## Geographic clusters visible so far\n- **Bernardinheiro** (Santiago) — a four-generation *proprietário* line, 1785→1877. Well\n  documented and firmly NOT the ancestral line (labourers/soldiers).\n- **Rua de São Lázaro** (Santa Maria) — at least two Viegas households (V014 Anastácio,\n  V041 Mathias). Native-born Santa Maria Viegas.\n- **Corte Perdida / Carrasco Serra** (Santa Maria) — earliest generation, b. c.1690–1710.\n- **Santo Estêvão** — where the **Leiria** byname lives (V033–V035).\n- **Santa Catarina da Fonte do Bispo** — saturated with Viegas; feeds into Santiago.\n- **São Brás de Alportel**, **Fuzeta/Moncarapacho**, **Faro** — outlying sources.\n- **Hortas d'Atalaia / Rua de São Sebastião** (Santiago) — the ancestral household.\n","entries":[{"id":"V001","surname":"Viegas","given":"Domingos","role":"father","date":"1813-08-25","year":1813,"parish":"Santiago","place":"Tavira city","placeType":"city","related":"Maria das Dores (wife); child Giraldo","book":"Santiago B18","image":"sp63","verified":"full-read","confidence":"certain","notes":"OUR ANCESTOR. soldado do Regimento numero quatro","ours":true},{"id":"V002","surname":"Viegas","given":"Domingos","role":"father","date":"1816-03-14","year":1816,"parish":"Santiago","place":"Tavira city","placeType":"city","related":"Maria das Dores (wife); child Rodrigo","book":"Santiago B19","image":"sp32","verified":"full-read","confidence":"certain","notes":"OUR ANCESTOR. soldado do Regimento desta Praca","ours":true},{"id":"V003","surname":"Viegas Leiria","given":"Domingos","role":"father","date":"1818-02-20","year":1818,"parish":"Santiago","place":"Tavira city","placeType":"city","related":"Maria das Dores (wife); child Maria","book":"Santiago B19","image":"","verified":"full-read","confidence":"certain","notes":"OUR ANCESTOR. first use of LEIRIA","ours":true},{"id":"V004","surname":"Viegas","given":"Domingos","role":"father","date":"1820-06-02","year":1820,"parish":"Santiago","place":"Tavira city","placeType":"city","related":"Maria das Dores (wife); child Jose","book":"Santiago B19","image":"sp66","verified":"full-read","confidence":"certain","notes":"OUR ANCESTOR. trabalhador","ours":true},{"id":"V005","surname":"Viegas Leiria","given":"Domingos","role":"father","date":"1845-01-13","year":1845,"parish":"Santiago","place":"Hortas d'Atalaia","placeType":"street/quarter","related":"Maria das Dores (wife); son Jose m. Maria Jose","book":"Santiago C-marriage","image":"","verified":"full-read","confidence":"certain","notes":"OUR ANCESTOR. residence given","ours":true},{"id":"V006","surname":"Viegas","giv :false},{"id":"V168","surname":"Viegas","given":"Maria","role":"mother","date":"1682-11-08","year":1682,"parish":"Santa Catharina da Fonte do Bispo","place":"Ruliao","placeType":"sitio","related":"husband MANOEL DOMINGUES; children Maria (1679) and Diogo (1682)","book":"Sta Catarina B1 PT/TT/PRQ/PTVR04/001/B1","image":"img46L, img66L","verified":"yes","confidence":"medium","notes":"Year anchored by the NUMERAL '1682' written in this entry. Same couple as the img46L 1679 entry.","ours":false},{"id":"V169","surname":"Viegas","given":"[unread]","role":"mother","date":"1682-03-26","year":1682,"parish":"Santa Catharina da Fonte do Bispo","place":"Serro","placeType":"sitio","related":"husband ANTONIO GONSALVES [Botelho?]; child Maria","book":"Sta Catarina B1 PT/TT/PRQ/PTVR04/001/B1","image":"img68L","verified":"no","confidence":"low","notes":"Given name not legible; only the surname Viegas is readable in the mother slot. NOT a Viegas father.","ours":false}]},"trades":[{"term":"çapateiro","lang":"Portuguese","sortYear":1780,"gloss":"Shoemaker","note":"The cedilla is how the registers of the 1780s spell it; modern Portuguese writes \u003cem\u003esapateiro\u003c/em\u003e.","holders":[{"id":"antonio-correa","name":"António Correa","when":"1780"}]},{"term":"serrador","lang":"Portuguese","sortYear":1782,"gloss":"Sawyer","note":"Cuts timber to size by hand. A named trade, which put Maria das Dores's father a step above unskilled day labour.","holders":[{"id":"rodrigo-jose-pereira","name":"Rodrigo José Pereira","when":""}]},{"term":"soldado","lang":"Portuguese","sortYear":1813,"gloss":"Soldier","note":"Domingos is a soldier of \u003cb\u003eRegiment nº 4\u003c/b\u003e in 1813 — the Algarve's own line regiment, seated at Faro — and of the garrison of this town in 1816. He is a labourer in between, which militia service would explain.","holders":[{"id":"domingos-viegas-leiria-1780","name":"Domingos Viegas Leiria","when":"1813"},{"id":"domingos-viegas-leiria-1780","name":"Domingos Viegas Leiria","when":"1816"}]},{"term":"trabalhador","lang":"Portuguese","sortYear":1820,"gloss":"Day labourer","note":"Works for wages on ground belonging to somebody else. The commonest word in these registers, and this family's default across four generations.","holders":[{"id":"jose-viegas-leiria-1820","name":"José Viegas Leiria","when":"1895"},{"id":"domingos-viegas-leiria-1780","name":"Domingos Viegas Leiria","when":"1820"},{"id":"giraldo-viegas-1813","name":"Giraldo Viegas Leiria","when":"1878"}]},{"term":"lavrador","lang":"Portuguese","sortYear":1845,"gloss":"Works land, as smallholder or tenant","note":"The distinction from \u003cem\u003etrabalhador\u003c/em\u003e is the whole point: a lavrador farms ground he holds, where a trabalhador sells his labour. Domingos is called one only in 1845, in his fifties — and neither son is ever called one.","holders":[{"id":"domingos-viegas-leiria-1780","name":"Domingos Viegas Leiria","when":"1845"}]},{"term":"hortelão","lang":"Portuguese","sortYear":1861,"gloss":"Market gardener","note":"Grows vegetables and fruit on a \u003cem\u003ehorta\u003c/em\u003e for sale — the irrigated plots around Tavira, one of which is where João was born. José is a hortelão in 1861 and back to \u003cem\u003etrabalhador\u003c/em\u003e by 1895.","holders":[{"id":"jose-viegas-leiria-1820","name":"José Viegas Leiria","when":"1861"}]},{"term":"jornalero","lang":"Spanish","sortYear":1890,"gloss":"Day labourer, paid by the day","note":"From \u003cem\u003ejornal\u003c/em\u003e, a day's wage — the Spanish equivalent of \u003cem\u003etrabalhador\u003c/em\u003e. It is how Juan is described at Nerva in 1890, in the Riotinto mining basin.","holders":[{"id":"joao-viegas-1861","name":"João Viegas Leiria","when":"1890, Nerva"}]}],"introHTML":"\u003cp\u003eFor most of my life, I've been told my great grandfather Arturo Viega didn't like to talk about his past. Until recently, all I knew from my grandfather and family lore was:\u003c/p\u003e\n\u003col\u003e\u003cli\u003eHe had been born in Spain. I believe the family might have said Huelva.\u003c/li\u003e\u003cli\u003eHis mother and sisters emigrated to Argentina, but he and he alone ended up in the New York area.\u003c/li\u003e\u003cli\u003eLater in life I learned a bit about the Viega clan in Argentina: mainly that they exist!\u003c/li\u003e\u003cli\u003eMy grandfather thought his grandfather \u003cem\u003emight\u003c/em\u003e have been from Portugal, but he was not highly confident.\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003eAlong the way in life, friends of mine from Spain and Portugal thought Portugal was a possibility, but more people thought \"Viega\" was a misspelling of \"Veiga\", and that the name came from Galicia, Spain (the region above Portugal), where there are many towns / neighborhoods called \"Veiga\" or \"A Veiga\", including one reasonably sized area in the mountains.\u003c/p\u003e\n\u003cfigure class=\"docimg photo\"\u003e\u003cimg src=\"img/page-pages-a-veiga-sign.jpeg\" alt=\"A weathered corten-steel sign on wooden posts reading A VEIGA, on a grass verge beside a road in the suburbs of A Coruña, Galicia\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eA Veiga — a neighborhood in the suburbs of A Coruña, and one of many Galician places that carry the name\u003c/figcaption\u003e\u003c/figure\u003e\n\u003ch3\u003eMy wife, the hero\u003c/h3\u003e\n\u003cp\u003eA while back my wife found passenger manifests for Arturo, his mother and two sisters boarding for Argentina, as well as proof of their arrival. From that, she learned my great grandfather was born in Nerva, Spain.\u003c/p\u003e\n\u003cp\u003eFor her last birthday, we took a 2 week driving trip in northern Spain. A couple months before we left, she requested the birth certificate for Arturo, hoping we might be able to go in person to hunt for more records.\u003c/p\u003e\n\u003cp\u003eOf course, the record didn't arrive before we left. But it did arrive, and it was a gold mine! It gave the name and birth place for both of his parents, as well as all four of his grandparents.\u003c/p\u003e\n\u003cp\u003eIt will be a while before we can explore his maternal line, because the process for getting records in Spain is quite painful.\u003c/p\u003e\n\u003ch3\u003eJoaō that's cool\u003c/h3\u003e\n\u003cp\u003eArturo's birth certificate was very clear that his father Juan Viegas Leiria was from Tavira, Portugal, and that his parents were José Viegas Leiria and Catarina do Rosario, also from Tavira.\u003c/p\u003e\n\u003cp\u003eMy wife quickly discovered that most of Portugal's parish records are easily accessible online (though very hard to search and read). And before too long, she found the exact matching record, one that confirmed what everyone told us we would find: Juan was born Joaō, and made the switch when he moved to Nerva (it was what happened constantly when Portuguese men of that name moved to Spain).\u003c/p\u003e\n\u003cp\u003eAfter sprinkling in some AI, she's opened the door on a treasure trove we are both still sifting through. But as of right now, that paternal line seems to have been in the Tavira center for over 100 years, and in the rural area around it at least into the 1600s.\u003c/p\u003e\n\u003cp\u003eIt's been amazing how quickly I've gone from not knowing much about my name, but leaning towards, \"probably from Spain\", to having amazing certainty. So much of even the basic stuff was just a surprise.\u003c/p\u003e\n\u003cp\u003eFor instance, my 2nd Great Grandfather was actually born Viegas, and had the 's' in his name until Argentina; his kids never took the 's' with him. I learned my Grandfather was born \u003cem\u003eJuan\u003c/em\u003e, which was particularly surprising since my father was born \u003cem\u003eJohn Jr.\u003c/em\u003e (thankfully I wasn't gifted with \"the third\").\u003c/p\u003e\n\u003cp\u003eBut one of the biggest surprises: For as much of that time as I can determine, our Tavira Viegas clan was actually the Viegas Leiria clan. I still don't know when or how it got attached to us, but it clearly wasn't a maternally passed surname. But, it's clear that there were so many people named Viegas in the area that many clans carried around a second family name to distinguish themselves.\u003c/p\u003e\n\u003cp\u003eSo far, on the paternal line,  we can follow the fraternal line back into the 1600s-- we have with certainty the names of my Viegas Leiria 6th great grandparents, and my 7th great grandfather.\u003c/p\u003e\n\u003cp\u003eAnd we've done it without having to learn Portuguese (Thanks, Claude!)\u003c/p\u003e\n\u003cp\u003eThe \u003cstrong\u003etree\u003c/strong\u003e on this page is our current ancestor chart of the Viega Leiria clan-- it's inverted from a typical family tree, so he is at the top and his ancestors go down.  It's structured more like how we have navigated and discovered things.\u003c/p\u003e\n\u003cp\u003eEach node has a page you can click into, which will take you to the documentation we have found. Everything is backed with actual records where we have high confidence -- when we don't have high certainty, we won't put the people in the tree.\u003c/p\u003e\n\u003cp\u003eAlong the top you'll see links to a few other pages:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003ea list of priorities for future searching we're going to do.\u003c/li\u003e\u003cli\u003eA narrative on family history, focused on interesting historical context we have learned along the way, about what life was like for our ancestors and their peers. This is often driven from us needing context to understand a document.\u003c/li\u003e\u003cli\u003eA reading list of things Claude thought we should judge that were too damaged; it's a parking lot for uncertain records, but mainly will only ever hold unlikely or less important records.\u003c/li\u003e\u003cli\u003eA partial map of Viegas locations around Tavira we had Claude put together to help map out Viega clusters. Not sure I'll get back to this; it's not that interesting now, but I think it will be if we spend a lot more time on it.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eNote that for much of the history of these parish records, grandparents were often named, making it easy to trace people. But before the mid 1700's, people generally only named the parents in baptismal records. And, in those early records, parents tended to ONLY be mentioned at the baptism.\u003c/p\u003e\n\u003cp\u003eSo any missing or illegible record puts an effective cap on what we can know about the family. We might not ever know for certain who my 8th Great Grandparents are, but even if we do get lucky,\u003c/p\u003e\n\u003cp\u003ewe're now at the point where it was seldom the case, and there are some missing books. And, we're going to run out of records soon. Some parishes do have records back to nearly 1500AD, but it didn't become there are pretty much no records at all before the late 1500's.\u003c/p\u003e\n\u003cp\u003eThat's because parishes keeping birth and marriage records wasn't required or even remotely common until the Catholic Church mandated them at the Council of Trent in 1563. Then, the practice still took a while to spread. And death records weren't mandated until Pope Paul V did so in 1614.\u003c/p\u003e\n\u003cp\u003eSo unless someone in rural Portugal in our tree is a historical figure, we're not going to make it much farther back. So we may never know for certain \u003cem\u003eexactly\u003c/em\u003e how this family ended up with \u003cem\u003eViegas\u003c/em\u003e or \u003cem\u003eLeiria\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003eBut still, what a luxury to be able to have a window so far back into the history of a family both normal and extraordinary!\u003c/p\u003e","narrativeHTML":"\u003ch3\u003eHow's life as a Viegas Leiria? It's okay 🤷‍♀️\u003c/h3\u003e\n\u003cp\u003eWhen João Viegas Leiria left Tavira for the Rio Tino mines (and became Juan Viegas), work was most likely an issue. He was probably at the mines before Nerva was even established as a town-- its first year of existence was the year Arturo was born there.\u003c/p\u003e\n\u003cp\u003eBased on the evidence so far, though, The Viegas Leiria clan were members of the \"middle class\" of the day, and had been that way for a very long time.\u003c/p\u003e\n\u003cp\u003eFirst, they definitely were \u003cstrong\u003enot\u003c/strong\u003e wealthy. There was no \u003cem\u003eDom Joaō\u003c/em\u003e (Don Juan), and no indication of land ownership back all the way to 1600. The church records we sourced from were filled with such people, clearly marked.\u003c/p\u003e\n\u003cp\u003eHowever, they were not poor, either.  If they were, their death records would have been marked \u003cstrong\u003epobre\u003c/strong\u003e (pauper) and they would have been buried in the public cemetery, basically in a pit, as far as I can tell.\u003c/p\u003e\n\u003cp\u003eInstead, in almost all of the death records we've found, people were buried at the Church of the Third Order, which required men to join a \u003cem\u003econfraternity\u003c/em\u003e. This basically meant they paid dues, and benefits included a nice burial for the member, spouse and infants (assuming you could pay the fee at death).\u003c/p\u003e\n\u003cfigure class=\"docimg photo\"\u003e\u003cimg src=\"img/page-pages-tavira-third-order-church.jpeg\" alt=\"The whitewashed church of the Third Order in Tavira, with a domed lantern tower, three iron-railed balconies along the upper storey and a green arched door onto the square\" loading=\"lazy\" decoding=\"async\"\u003e\u003cfigcaption\u003eThe Church of the Third Order, Tavira — where most of the family's burials were recorded. Photograph from visitartavira.pt\u003c/figcaption\u003e\u003c/figure\u003e\n\u003cp\u003eThe Church of the Third Order had been a monastery until Portugal outlawed monasteries in the early 1800's, at which point the Third Order bought the church. Apparently, they were somewhat of a service organization-- people who led pious lives of service, and didn't try to be too flashy.\u003c/p\u003e\n\u003cp\u003eNote, I took this picture from the Tavira web page, but looking on Google Maps, they've done some remodeling, not necessarily for the better.\u003c/p\u003e\n\u003ch3\u003eTavira\u003c/h3\u003e\n\u003cp\u003eTavira is a port town on the south coast dating back to the Phoenicians. By about 300BC the town was abandoned, as the Romans built a town nearby on higher ground. The Gilão river runs through the center of town, and there's an old bridge that people call the Roman bridge that crosses the river in the historic center where our family lived for a very long time.\u003c/p\u003e\n\u003cp\u003eIncidentally, the bridge doesn't seem to actually be Roman, though it's thought to be where the Roman river crossing was. By the 8th century the Moors had invaded the Iberian peninsula, and re-established a town over the Phoenician city. Of course, they built fortified walls, towers, and a Castle. They also built a lot of white-washed buildings that would have been uncharacteristic before them.\u003c/p\u003e\n\u003cp\u003eIn 1242, in the Reconquista, native Iberians kicked out the moors, and took over Tavira. Soon after, it was an important port, due to its proximity to Northern Africa; it also remained a military base. In the 1500's, the King of Portugal elevated Tavira's status to a full-on city.\u003c/p\u003e\n\u003cp\u003eIt thrived until the Lisbon earthquake in 1755, which most estimate was an 8.5-9.0. Tavira not only got hit from the shaking, but the whole south coast got slammed by the resulting Tsunami.\u003c/p\u003e\n\u003cp\u003eThat would have had a devastating effect on the population, but by the first public census in 1801, the city proper was back over 10,000 people. 100 years later, it was 25,000 people.\u003c/p\u003e\n\u003ch4\u003eParish the thought / the thought is perishable\u003c/h4\u003e\n\u003cp\u003eThe urban core of Tavira was split by the river, and, at the time, was divided up into two parishes, Santiago, and Santa Maria. Santiago seemed to considered more central when our ancestors were there, and I believe was the \"mother\" Parish for the broader area. But Santa Maria eventually became the bigger parish, since it covered all of the city outskirts-- places on the other side of the historic walled city that weren't considered part of the city proper, but also weren't in the rural parishes that were part of the Church's Tavira administrative area.\u003c/p\u003e\n\u003cp\u003eThere were, in fact, five rural parishes, Cachopo, Conceiçaō, Luz, Santa Catarina da Fonte do Bispo, and Santo Estévaō. There are a shocking number of people named Viegas across all of these parishes.\u003c/p\u003e\n\u003cp\u003eAmusingly, the two urban churches for the two parishes were almost right next to each other. The Moor complex that included the Castle and masques ended up getting repurposed. Both churches sat on land that was part of the Santiago parish.\u003c/p\u003e\n\u003cp\u003eCurrently, we're still trying to map out people from public records in the early 1700's / late 1600's. But it seems likely that, before the earthquake, many of our ancestors were farming in the rural Tavira parishes; they were still in Tavira, just not the city proper. It's most likely that it made a lot of sense after the earthquake for people to move back into the city for economic opportunity. Even once the town was rebuilt, population loss meant the port was going to have jobs that needed to be filled.\u003c/p\u003e\n\u003cp\u003eAnd, this is certainly speculation (based somewhat on potentially dubious context from AI agents), but it seems a lot of the rural parishes in the area were meant for farmers. Those farmers got there after the Reconquista, when people who served well were rewarded with land grants.\u003c/p\u003e\n\u003cp\u003eMen generally carried two last names, and most often one was paternal. But the maternal name often got dropped in favor of an older, more unique family name. And it wasn't uncommon to abandon the paternal name when marrying (sometimes both). Generally, in the area, it was very common to forgo the mother's family name, and use a distinguishing name from your lineage, that would set apart your kin from the tons of other people with your name.\u003c/p\u003e\n\u003cp\u003eApparently, for people who didn't have wills, your distinguisher was often originally used for inheritance.\u003c/p\u003e\n\u003cp\u003eThere were probably tons of land grants in the area made to people named Viegas when the Moors were kicked out; one theory is when people got their grants and took last names, plenty of people who got grants and farmed them, took the name Viegas (similar to Gaelic Veiga, which essentially meant 'meadow of crop-land' in that day).\u003c/p\u003e\n\u003cp\u003eBut with Catholic values, there were too many descendants for everyone to stay rich on land. So lots of people would have worked the family's generational plot without benefiting enough, and such people might do well in the city after the quake.\u003c/p\u003e\n\u003cp\u003eIf you read location names in a lot of these records, for a while you'll notice a lot of them seem to be living in \"gardens\", and many had jobs one might translate as \"gardener\". Apparently, the area between the mountains and the south coast of Portugal is a strip that's amazing soil for growing fruit. Religious institutions and the crown would come to arrangements with people to live on the garden property, and essentially farm the fruit, and manage getting it to market. It wasn't as good as land ownership, but in a city starved for workers, it seems reasonable that farmers would gravitate to such opportunities.\u003c/p\u003e\n\u003ch3\u003eA short stint fighting\u003c/h3\u003e\n\u003cp\u003eThere are plenty of records in our history where you'll see military occupations. Since the port, river and Moor defenses made Tavira a natural garrison town, it might not be too surprising. But it turns out, military service was compulsory from after the Reconquista into the 20th century. Often, you'd just have to join the reserves.\u003c/p\u003e\n\u003cp\u003eBut, in 1807, Napoleon invaded Portugal, beginning the Peninsular wars. And then, Portugal had a civil war from 1828 –1834.\u003c/p\u003e\n\u003cp\u003eOur people weren't wealthy enough to buy their way out of serving.\u003c/p\u003e\n\u003cp\u003eYeah, all in all, living in a beautiful historic beach town with your family was... a mixed bag.\u003c/p\u003e","personSummary":{"arturo-viegas-ramirez-1890":"\u003cp\u003eThe first of the line born outside Portugal. Registered at Nerva two days after his birth, acta nº 35.\u003c/p\u003e","joao-viegas-1861":"\u003cp\u003eBorn in Tavira, he was a day laborer at Nerva in the Rio Tinto mining basin by 1890. He was probably a miner there. And those mines were famously awful, so it's not too surprising that he soon emigrated to Buenos Aires, and eventually to Córdoba, Argentina.\u003c/p\u003e","agustina-ramirez-rivera":"\u003cp\u003eFrom Fuente del Maestre in Badajoz — Extremadura, the region that supplied much of the labour to the Huelva mines.\u003c/p\u003e","diego-ramirez-medina":"\u003cp\u003eNamed as Agustina’s father in her son’s 1890 birth registration.\u003c/p\u003e","isidra-rivera-gutierrez":"\u003cp\u003eNamed as Agustina’s mother in 1890, where the entry calls her \u003cem\u003edifunta\u003c/em\u003e — already dead by then.\u003c/p\u003e","jose-viegas-leiria-1820":"\u003cp\u003eTwice married — his first wife Maria José died in 1850, and he remarried within seven weeks.\u003c/p\u003e","catarina-do-rosario-1832":"\u003cp\u003eMarried at eighteen. She is the grandmother named in the 1890 Nerva record — written there, in Spanish, as \u003cem\u003eCatalina Rosária Chagas\u003c/em\u003e.\u003c/p\u003e","domingos-viegas-leiria-1780":"\u003cp\u003eAged 27 at his marriage, and a soldier at the time. Between 1820 and 1845 he moved from working for wages to working land of his own — the one upward step visible in four generations. He signed a register with a \u003cstrong\u003ecross\u003c/strong\u003e in 1809; he could not write.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWe've found no death record\u003c/strong\u003e He outlived his wife, who died in April 1855 described as married rather than widowed, so he died 1855 or later — and Santiago’s death registers have all been scoured from 1826–1880.\u003c/p\u003e\n\u003cp\u003eThey were very meticulously keeping parish records at this point in history, yet there were some gaps where life was too dire to keep up, like in the 1755.\u003c/p\u003e\n\u003cp\u003eIn this case, I think it's far more likely he died later in 1855, where there was a huge Cholera outbreak. It would be easy for so many people to be dying that there are gaps like this.\u003c/p\u003e","maria-das-dores":"\u003cp\u003eDied suddenly, with no time for the sacraments and no will. Her brother’s 1811 marriage is what places her family in Santiago parish rather than Santa Maria, and what carries her line two generations further back than any other branch.\u003c/p\u003e\n\u003cp\u003eInterestingly, this was a few months BEFORE the 1855 Cholera outbreak that devastated Tavira.\u003c/p\u003e","francisco-viegas-leiria":"\u003cp\u003eNamed in all four of his grandchildren’s baptisms and in three marriages, and given the byname \u003cem\u003eLeiria\u003c/em\u003e outright in his son’s marriage of 1807.  His baptism has now \u003cstrong\u003eprobably\u003c/strong\u003e been found: 10 December 1731 at Santa Catarina, to a Maria Gonçalves — though the entry writes his father’s name as \u003cem\u003eDomingos\u003c/em\u003e rather than \u003cem\u003eAntónio\u003c/em\u003e.  So most likely born around 6 Dec / 7 Dec.\u003c/p\u003e\n\u003cp\u003eThere's good reason to believe that was just a brain fart, that the priest only wrote one of two names, or that the parents changed their minds and started calling him Antonio from an early age (my grandmother didn't know she was born Patricia until she got her birth certificate-- she thought she'd been born Marie).\u003c/p\u003e\n\u003cp\u003eIt the only possible record we can find that comes close to the other data we have, and it is dead on, in every other detail.\u003c/p\u003e","francisca-de-jesus":"\u003cp\u003eOne woman under three devotional names across five records.\u003c/p\u003e","antonio-viegas-leiria":"\u003cp\u003eThe oldest man in the direct line who can be named from a document, and the point at which the line currently stops. He is named as Francisco's father in the \u003cstrong\u003e1780 baptism of Domingos\u003c/strong\u003e and again in the \u003cstrong\u003e1807 marriage\u003c/strong\u003e, both giving him the same wife, \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e, and the same parish, \u003cstrong\u003eSanta Catarina da Fonte do Bispo\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eHe had two marriages: first to \u003cstrong\u003eApolónia Gonsalves\u003c/strong\u003e, a household already keeping a child at the sítio das Casas Altas by 1694; then, after her death, to \u003cstrong\u003eMaria Gonsalves\u003c/strong\u003e on 28 December 1724. Our line descends from the second. Both his marriage and his burial call him a parishioner of \u003cstrong\u003eNossa Senhora da Luz\u003c/strong\u003e. He died in Santa Catarina in May 1734.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHis parents are unknown.\u003c/strong\u003e No record yet found names them.\u003c/p\u003e","maria-gonsalves":"\u003cp\u003eA widow of Simão Rodrigues when she married António Viegas on 28 December 1724, at the sítio da Alcaria.\u003c/p\u003e","antonio-correa":"\u003cp\u003eHis surname is unreadable in the 1807 marriage record PDF, where it sits under a strike-through — but the 1780 baptism names him plainly as António Correa, a shoemaker.\u003c/p\u003e","rodrigo-jose-pereira":"\u003cp\u003eA Sawyer (person who saws trees I believe), and a bachelor at his marriage in 1782. Alive and present in March 1816, standing as godfather to his own grandson Rodrigo.\u003c/p\u003e","ignes-de-jesus":"\u003cp\u003eA spinster at her marriage, and named identically in all four grandchildren’s baptisms and in three marriages.\u003c/p\u003e","jose-dos-santos":"\u003cp\u003eNamed in two independent records twenty-nine years apart — his son’s marriage in 1782 and his grandson’s in 1811 — both times paired with Ana Cabrita. That agreement is what makes this branch solid.\u003c/p\u003e","anna-cabrita":"\u003cp\u003eNamed in both the 1782 and 1811 marriages.\u003c/p\u003e","jose-domingues":"\u003cp\u003eHis surname is genuinely in conflict, not merely spelled two ways: his daughter’s marriage of 1782 calls him \u003cem\u003eDomingues\u003c/em\u003e, his grandson’s of 1811 calls him \u003cem\u003eRodrigues\u003c/em\u003e. His wife is Margarida da Conceição in both, and the rest of the entry matches, so this is one man under two surnames.\u003c/p\u003e","margarida-da-conceicao":"\u003cp\u003eThe fixed point that holds this couple together while her husband’s surname wobbles — named identically in 1782, 1807 and 1811.\u003c/p\u003e","manoel-de-santa-ana":"\u003cp\u003eNamed in Catarina’s baptism, in her marriage, and in João’s baptism.\u003c/p\u003e","anna-maria":"\u003cp\u003eAnna Maria in four records against Maria Catharina in one.\u003c/p\u003e","jose-correia-minhos":"\u003cp\u003eNamed in Catarina’s 1832 baptism and her 1850 marriage.\u003c/p\u003e","joanna-rita":"\u003cp\u003eNamed in 1832 and 1850.\u003c/p\u003e","catarina-das-chagas":"\u003cp\u003eNamed in 1832 and 1850. Her granddaughter Catarina was named after her — and the name reaches as far as the 1890 Spanish record, where her great-granddaughter’s father-in-law reports the family surname as \u003cem\u003eChagas\u003c/em\u003e.\u003c/p\u003e","joao-viegas-1808":"\u003cp\u003eThe eldest known child, and a brother nobody had recorded until his baptism was found. His entry calls the marriage \u003cem\u003e\"do primeiro Matrimonio de ambos\"\u003c/em\u003e — the first marriage of both — which is what forced the search for his parents’ marriage back into 1807.\u003c/p\u003e","giraldo-viegas-1813":"\u003cp\u003eJosé’s brother. In 1850 he witnessed his brother’s wedding and \u003cstrong\u003esigned himself “Geraldo Viegas”\u003c/strong\u003e in his own hand — his father had signed with a cross forty-one years earlier.\u003c/p\u003e","rodrigo-viegas-1816":"\u003cp\u003eNamed for his maternal grandfather, who stood as his godfather in person in March 1816.\u003c/p\u003e","maria-jose":"\u003cp\u003eJosé’s first wife. Not an ancestor of this line — she died in 1850, five weeks before her only recorded child.\u003c/p\u003e","joao-viegas-1850":"\u003cp\u003eA child of José’s first marriage, dead a month after his mother.\u003c/p\u003e","manoel-viegas-1851":"\u003cp\u003eEldest of João’s full siblings.\u003c/p\u003e","francisco-viegas-1858":"\u003cp\u003eJoão’s elder brother, dead at five, two years after João was born.\u003c/p\u003e","francisco-jose-pereira":"\u003cp\u003eMaria das Dores’s brother. His marriage is what places her family in Santiago parish and names her grandparents a second time.\u003c/p\u003e","manoel-viegas-1726":"\u003cp\u003eThe eldest of António and Maria Gonçalves's three known children — Manoel (1726), \u003cstrong\u003eMaria (1729)\u003c/strong\u003e and Francisco (1731) — and Francisco's brother, which makes him a great-uncle of this line. Very probably the Manoel Viegas Leiria living at Bernardinheiro by 1756.\u003c/p\u003e","maria-viegas-1729":"\u003cp\u003eFrancisco's sister, and the middle child of the three — born between Manoel (1726) and Francisco (1731). Her baptism is the entry that finally names where the family actually lived: the \u003cstrong\u003esítio do Lagar\u003c/strong\u003e. Nothing is known of her after the day she was christened.\u003c/p\u003e","apolonia-gonsalves":"\u003cp\u003eAntónio's \u003cstrong\u003efirst wife\u003c/strong\u003e, and the mother of the family he had before the one this line descends from. She is named only twice, and never in her own right: in her daughter Catharina's burial of May 1724, which calls her \u003cem\u003ejá defunta\u003c/em\u003e — already dead — and seven months later in António's remarriage, which calls him her \u003cem\u003ewidower\u003c/em\u003e. Both of the records that would date her, her marriage and her burial, fall in volumes that no longer exist.\u003c/p\u003e","catharina-viegas-1724":"\u003cp\u003e\u003cstrong\u003eFrancisco's half-sister\u003c/strong\u003e, and the only known child of António's first marriage. She died an adult — \u003cem\u003ede maior idade\u003c/em\u003e — on 9 May 1724, seven months before her father remarried. Her burial is the only record that names her mother.\u003c/p\u003e","manoel-viegas-bengado":"\u003cp\u003eHead of a Viegas household at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e, Santa Catarina da Fonte do Bispo, named with his wife Maria das Neves in the baptism of their son António on 19 April 1688, and with her again at Luz in 1665.\u003c/p\u003e","maria-das-neves":"\u003cp\u003eWife of Manoel Viegas of the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e. The couple are \u003cstrong\u003emarried by April 1665\u003c/strong\u003e, when she stands godmother at Luz and the register calls her \u003cem\u003e“Maria das Neves, molher de Manoel Viegas”\u003c/em\u003e, and they appear together again in the baptism of their son António in 1688. That puts her birth around \u003cstrong\u003e1640–45\u003c/strong\u003e.\u003c/p\u003e","joze-viegas-leria-1688":"\u003cp\u003e\u003cstrong\u003eNot yet connected to this family\u003c/strong\u003e — and recorded anyway, because he carries the byname \u003cem\u003eViegas Leria\u003c/em\u003e in \u003cstrong\u003e1688\u003c/strong\u003e, which is 119 years earlier than any other attestation of it. He was living at the sítio da Fonte do Bispo in the same parish, in the same book, in the very year António was baptised.\u003c/p\u003e","sebastianna-luis":"\u003cp\u003eWife of a \u003cstrong\u003eManoel Viegas\u003c/strong\u003e at the sítio do Bengado in 1680, and mother of Domingas. Whether her husband is António's father is \u003cstrong\u003enot known\u003c/strong\u003e: at least two and probably three men of that name were living at that one sítio in these years.\u003c/p\u003e","domingas-viegas-1680":"\u003cp\u003eBorn at the \u003cstrong\u003esítio do Bengado\u003c/strong\u003e in December 1680 to a \u003cstrong\u003eManoel Viegas\u003c/strong\u003e and \u003cstrong\u003eSebastianna Luis\u003c/strong\u003e. She was briefly taken for António's half-sister — but the Bengado turns out to hold \u003cstrong\u003eseveral\u003c/strong\u003e Manoel Viegas households, so \u003cstrong\u003eher relationship to this family is unknown\u003c/strong\u003e.\u003c/p\u003e","manoel-viegas-1694":"\u003cp\u003eA child buried at Santa Catarina on \u003cstrong\u003e15 September 1694\u003c/strong\u003e as a \u003cem\u003emenor\u003c/em\u003e, named in his burial as the son of \u003cstrong\u003eAntónio Viegas and his wife Appollonia Gonsalves\u003c/strong\u003e, of the sítio das Casas Altas.\u003c/p\u003e","lourenco-fernandes-luz":"\u003cp\u003eThe eldest of the family that can be dated. He married Maria Gonsalves at Luz on 7 May 1674, his father already dead.\u003c/p\u003e","bertolameu-fernandes-1656":"\u003cp\u003eBaptised at Luz on 23 October 1656 — the first child of this couple to be found in the register, and the entry that confirmed the family was there to be found.\u003c/p\u003e","catherina-fernandes-1658":"\u003cp\u003eBaptised at Luz on 30 June 1658. She may be the daughter of the house who married there in 1684.\u003c/p\u003e","izabel-das-neves-1660":"\u003cp\u003eTwin sister of Maria, baptised with her at Luz on 19 August 1660. On present evidence she is as good a candidate
